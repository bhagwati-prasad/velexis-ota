# OTA platform structure review: your tree vs. a 2026 reference architecture

<p class="meta">Prepared 7 October 2026 · Scope: server/monorepo structure of a new Online Travel Agency · Region-agnostic (regional rules shown only as pluggable examples)</p>

## How to read this report

This report compares the directory tree you shared with a reference OTA design built from current (2025–2026) industry practice: IATA NDC and Offers & Orders, hotel content mapping, payment and settlement rails, B2B and corporate travel platforms, AI-agent distribution, and current regulation. It covers **four business models, from simplest to most complex**. Each model builds on the one before: each model section lists the directories that model **adds**, plus rows from earlier models that it makes urgent or extends. Those rows keep their original tier tag.

| Tag | Model | Who the customer is |
|---|---|---|
| <span class="tier t-C">C</span> | **B2C consumer OTA** (base) | Travellers who book for themselves on web and mobile |
| <span class="tier t-A">A</span> | **B2B agent portal** | Travel agencies and sub-agents who book for their travellers |
| <span class="tier t-W">W</span> | **White-label / API (B2B2C)** | Partner brands, developers and AI agents who resell your inventory |
| <span class="tier t-T">T</span> | **Corporate travel / TMC** | Employers: travellers, arrangers, approvers and travel managers |

**Status chips** grade your tree against each reference directory:

- <span class="st st-present">present</span> — the same responsibility exists in one clear place.
- <span class="st st-partial">partial</span> — a folder exists but key parts are missing.
- <span class="st st-duplicated">duplicated</span> — the responsibility is defined in two or more places with no single owner.
- <span class="st st-misplaced">misplaced</span> — it exists, but where it sits breaks ownership or cannot work.
- <span class="st st-missing">missing</span> — nothing covers it.

The *Tier* column shows where a capability first appears and whether it is a **must**, **should** or **could**. A row tagged with an earlier tier inside a later model's table is a base capability that the later model makes urgent or extends.

<div class="callout"><strong>Method.</strong> Six research agents surveyed current OTA practice and produced 237 capabilities with sources. Two independent audits reviewed your tree and raised 81 issues. Five comparers graded your tree in 131 capability rows (some directories appear in several rows), and adversarial reviewers re-checked every grade, making 39 corrections. A final review of this report fixed the remaining inconsistencies. The 24 dated industry claims used here were fact-checked: 17 were confirmed and 7 corrected, and the corrected wording is used throughout.</div>

| GDS | Global distribution system (Amadeus, Sabre, Travelport) |
| NDC | IATA New Distribution Capability: XML/JSON standard for airlines to sell offers directly |

| LCC | Low-cost carrier |
| BSP / ARC | IATA Billing and Settlement Plan / Airlines Reporting Corporation (US): how agencies settle airline sales |
| ADM / ACM | Agency debit / credit memo: an airline charge or credit to an agency after the sale |
| VCC | Single-use virtual credit card, often used to pay hotels and bedbanks |
| MoR | Merchant of record: the party that charges the card and carries refunds and chargebacks |
| PSP / 3DS / SCA | Payment service provider / 3-D Secure / strong customer authentication |
| L2B | Look-to-book ratio: searches per booking, a cost driver with GDS and NDC suppliers |
| ARI | Availability, rates and inventory, pushed by hotels or channel managers |
| PCC / TIDS / PLB | GDS office ID (pseudo city code) / IATA ID for non-accredited sellers / productivity-linked bonus |
| SSR / APIS | Special service request / advance passenger information sent to authorities |
| IROP | Irregular operations (disruptions) |
| TMC | Travel management company (corporate travel agency) |
| SSO / SCIM | Single sign-on (SAML/OIDC) / System for Cross-domain Identity Management (user provisioning from HR) |
| UDID | User-defined interface data: a corporate client's custom fields (cost centre, project) carried on bookings |
| KYB | Know your business: checks on agencies and partners before onboarding |
| BFF | Backend for frontend: a thin API per channel (web, mobile, agent, partner) |
| CQRS / CDC / DLQ | Separate read and write models / change data capture / dead-letter queue |

## Executive summary

**Bottom line:** your tree is strong where many first designs are weak: supplier ports and adapters, sagas and idempotency, normalisation and dedup, and planning compliance and SLOs early. It is weakest in the middle of the travel lifecycle (offer → checkout → order servicing → money) and in everything that makes B2B, white-label and corporate models different. It also mixes two ways of organising code, so most concerns end up defined in two to six places.

### The 10 biggest differences

1. **Two organising axes at once.** Pipeline layers (`ingest/`, `booking_engine/`, `mapping/`, `domain/`, `CRM/`) sit next to `services/`. As a result, booking is defined twice, shopping twice, pricing three times, payment and card handling in six places, caching in five and FX in three. The reference uses **one axis: bounded contexts** (`domains/*`), each owning its own model, schema, API and events.
2. **A shared `domain/` model library plus shared `ingest/storage/`.** Every service imports the same models and shares the same databases. That makes a distributed monolith in which no context owns its data.
3. **No Offer concept.** Nothing holds offer IDs, the three NDC clocks (offer expiry, price guarantee, payment time limit), a priced snapshot, or a mandatory **reprice before booking**. Modern air retailing (NDC and Offers & Orders), metasearch deep links and AI-agent channels all depend on it.
4. **No checkout or cart context.** There is nowhere to capture and validate traveller data (APIS/Secure Flight, SSRs), run dynamic packaging, or classify bookings under the applicable package-travel regime (a market rule pack; in the EU that means Directive (EU) 2015/2302 today and Directive (EU) 2026/1024, which abolishes linked travel arrangements, from 29 March 2029).
5. **Servicing covers only customer-initiated changes.** Missing: airline schedule changes, `OrderChangeNotif` and aggregator webhooks, GDS queues, ticketing time limits, order/PNR sync, passenger-rights refund deadlines and the unused-credit ledger. Together these make up most real servicing volume and cost.
6. **No finance or supplier settlement.** There is no double-entry ledger, order margin, revenue recognition, tax engine, invoicing or e-invoicing, BSP/ARC and ADM/ACM handling, virtual-card (VCC) supplier payments, supplier payables or treasury. Only PSP-side folders exist (`services/payment_service/reconciliation/`, `domain/payment/settlement/`), and neither separates customer money from supplier money.
7. **Missing platform spine.** There is no durable workflow engine, event-bus owner, contracts-as-code with codegen, single rules engine, reference-data/FX owner, experimentation platform, market and all-in-price rules, or AI guardrails.
8. **None of the B2B, white-label or corporate layers exist.** There is no tenancy, agency hierarchy, wallet, credit or partner ledger; no partner API product, outbound webhooks, developer portal or affiliate tracking; and no corporate policy, approvals, SSO/SCIM, duty of care or corporate billing.
9. **Repo practicalities will bite early.**
   - GitHub Actions workflows under `infrastructure/ci_cd/github_actions/` will never run; GitHub only reads `.github/workflows/`.
   - There is no build system, CODEOWNERS file, local dev environment or stateful supplier simulators.
   - Terraform has no modules for Kafka, Redis, search, object storage, CDN or KMS.
10. **Channel gaps.** There are no BFFs (backends for frontends), no mobile app, no design system or accessibility home, and no agent or extranet UIs. The only back-office UI is a dashboard inside a backend service (`services/admin_service/dashboard/`).

### The four models at a glance

| | <span class="tier t-C">C</span> B2C | <span class="tier t-A">A</span> B2B agent | <span class="tier t-W">W</span> White-label / API | <span class="tier t-T">T</span> Corporate / TMC |

| **New directories** | The base spine: `domains/*` core (plus the consumer side of `domains/distribution`), `platform/*`, `bff/web`, `bff/mobile`, `apps/web`, `apps/mobile`, `apps/backoffice` | `platform/tenancy` (org scope), `domains/partner`, `bff/agent`, `apps/agent_portal` | `platform/webhooks`, `domains/distribution` (partner side), `bff/partner`, `bff/ai_agent`, `apps/white_label_web`, `apps/developer_portal` | `domains/corporate`, `bff/corporate`, `apps/corporate_booking_tool`, `apps/tmc_agent_desktop`, `platform/tenancy/residency` |

## What your structure gets right

Keep these. The reference design keeps every one of them; it only moves them to a single owner.

- **Hexagonal supplier connectivity**: `integrations/ports/` + `adapters/` + `registry/`, a capability registry with supplier routing, and `pre_acquire_rules/` to filter requests before costly supplier calls.
- **Read/write split** (`ingest/` vs `booking_engine/`). It matches look-to-book ratios of 100:1 to 1000:1 and lets each path scale and cache differently.
- **Sagas, idempotency, compensation and the transactional outbox** as first-class concepts. Supplier bookings are not transactional, and these are the right tools for that.
- **Normalisation to canonical models, multi-supplier dedup and versioned mappings** (`mapping/registry/`). This fits many NDC schema versions being live at once.
- **Separating protocol handling** (`integrations/protocol/`) from supplier semantics.
- **PCI DSS and GDPR named up front**, plus `security/pci_dss/network_segmentation/` and tokenization.
- **PSP webhooks and reconciliation** modelled explicitly, and **ARI push** for direct hotel inventory.
- **Contract, chaos and performance testing**, and mock suppliers.
- **SLOs and alerting as code**, and **IaC with GitOps** (Terraform, Kustomize, Argo CD).
- **Data platform with CDC, medallion zones, dbt and governance** (catalog, lineage, quality, privacy).
- **ADRs and onboarding docs** in the repo.

## Differences that apply to every model

### 1. One organising axis: bounded contexts

The tree organises code in two incompatible ways. Pipeline layers (`ingest/`, `booking_engine/`, `mapping/`, `integrations/`) sit beside a shared model library (`domain/`) and twelve "independently deployable" `services/`, which repeat the same folders. The reference picks **one** axis. Each business capability is a bounded context under `domains/`, owns its model, database schema, API and events, and is checked by CI rules that stop other contexts reaching into its internals.

**Start as a modular monolith** (one deployable, about 9–19 modules) and extract services only when scaling or team needs require it. Shopping and supplier connectivity usually come out first, because their fan-out and look-to-book load differ from the rest. Shopify (Packwerk) and Booking.com's own path both show the pattern: Booking.com runs a federated GraphQL architecture on Apollo Federation (over 100 subgraphs) and described moving multi-product order orchestration to Temporal in 2026 ([Apollo GraphQL Summit 2024 session 'How Booking.com securely decomposed their monolith' (120 federated subgraphs); Temporal Replay 2026, 'Beyond the state machine: Scaling order orchestration at Booking.com' (May 7, 2026)](https://temporal.io/resources/on-demand/scaling-order-orchestration-at-booking-com)).

### 3. Repository, tooling and naming fixes

- **CI location:** move <code>infrastructure/<wbr>ci_cd/<wbr>github_actions/<wbr></code> to <code>.github/<wbr>workflows/<wbr></code> (plus <code>.github/<wbr>actions/<wbr></code> and <code>CODEOWNERS</code>). GitHub does not run workflows from anywhere else.
- **Contracts as code:** move OpenAPI and GraphQL out of <code>docs/<wbr>api/<wbr></code>, and event schemas out of <code>core/<wbr>events/<wbr></code>, into <code>contracts/<wbr></code> (OpenAPI, AsyncAPI, protobuf, GraphQL).
  - Add breaking-change gates and PII field tags.
  - Generate the SDK, clients and mock servers from them.
- **Shared kernel:** keep it tiny (<code>libs/<wbr></code>: money, IDs, time, errors, OpenTelemetry). Domain enums and exceptions in <code>core/<wbr>constants/<wbr></code> and <code>core/<wbr>exceptions/<wbr></code> belong to their owning contexts, and card tokenization must leave <code>core/<wbr>security/<wbr></code>.
- **Build tooling:** add a monorepo build (Bazel, Pants or Nx) with affected-only CI and remote caching, plus a DB migration convention and scaffolding.
- **Local development:** add a one-command devenv and **stateful supplier simulators** (NDC, GDS, LCC, bedbank, PSP, 3DS ACS, BSP files) under <code>tools/<wbr></code>. Today there are only mock fixtures in <code>testing/<wbr>fixtures/<wbr></code>.
- **Tests:** unit and integration tests live next to the code they test. <code>tests/<wbr></code> keeps only cross-context e2e, performance and chaos suites. <code>testing/<wbr>unit/<wbr></code> contradicts its own "co-located" comment.
- **Event bus and workflow engine** need owners (<code>platform/<wbr>eventing/<wbr></code>, <code>platform/<wbr>workflow/<wbr></code>): topics-as-code, schema registry, DLQ and replay, and durable timers for time limits and holds.
- **Infrastructure:**
  - Add Terraform modules for Kafka, Redis, OpenSearch/Elasticsearch, object storage, CDN/DNS/WAF and IAM/KMS.
  - Add environments for perf, DR (second region), partner sandbox and an isolated PCI CDE.
  - Pick one of Kustomize or Helm per workload, and move <code>argocd/<wbr></code> from CI to <code>infra/<wbr>gitops/<wbr></code>.
- **Persistence:** five stateful systems on the read path alone (two Redis tiers, Postgres, Elasticsearch, MongoDB) is a lot for a new team. Start with Postgres (JSONB for content) + Redis + one search engine, and add MongoDB only if a real need appears.
- **Naming:**
  - <code>CRM/<wbr></code> → lowercase.
  - <code>ingest/<wbr></code> reads as ETL; call it what it is: shopping.
  - <code>local_cache/<wbr></code> is shared Redis, not a local cache.
  - "ticketing" means both air tickets and support cases.
  - Drop the redundant <code>&#42;_service</code> suffixes.
  - <code>core/<wbr>tracing/<wbr></code> names Jaeger/Zipkin clients; use OpenTelemetry only.
- **Compliance folders:** <code>security/<wbr>pci_dss/<wbr></code> and <code>security/<wbr>gdpr/<wbr></code> mix documents with code. Keep evidence and policies in <code>compliance/<wbr></code>, and enforce controls in <code>platform/<wbr></code> and <code>infra/<wbr></code>.

## Model 1 — B2C consumer OTA (base)

**What defines it.** B2C is the base: there is no simpler model to build on, so it has to provide the whole spine of a merchant-of-record consumer OTA:

- multi-source air (GDS, NDC, LCC, aggregators) and bedbank connectivity behind one canonical model
- owned reference data and mastered hotel content
- a cost-governed shopping path
- an explicit **offer store with reprice**
- an order-native **order** with a durable booking workflow
- fulfilment documents
- **servicing**, where airline-initiated changes are most of the volume

It also has to handle money correctly: payment orchestration with 3DS, an isolated card vault, fraud and abuse defence, a double-entry ledger, tax and invoicing, and supplier settlement (payables, VCC, BSP/ARC, ADM/ACM). In 2026 even the base model needs all-in price display, accessibility, pluggable privacy regimes, AI guardrails and basic agent-ready distribution (metasearch feeds, consumer AI-assistant apps).

**Distinct directories (the base every later model reuses):**

```text
ota/
├── .github/  contracts/  libs/  tools/  tests/  docs/  ops/  infra/  compliance/  data/
├── platform/   identity/ authz/ eventing/ workflow/ rules/ markets/
│               experimentation/ privacy/ audit/ ai/ edge/
├── domains/    refdata/ content/ supply/ shopping/ offer/ checkout/ order/
│               fulfilment/ servicing/ payment/ risk/ finance/ settlement/
│               customer/ engagement/ support/
│               distribution/   (should: metasearch feeds, consumer AI apps, UCP/ACP adapters)
├── bff/        web/ mobile/
├── apps/       web/ mobile/ backoffice/ landing_pages/ extranet/ (should)
└── packages/   design_system/ sdk/ (generated)
```

### Key takeaways for B2C

- **Of the 55 base capability rows graded, none is fully present.** The missing ones cluster in the middle of the lifecycle: offer store and reprice, checkout and traveller capture, time limits and order sync, involuntary servicing, finance and settlement.
- **Add `domains/offer/` first.** Stable offer IDs, the three NDC clocks and a mandatory reprice are what booking, metasearch deep links and AI-agent channels all build on.
- **Merge the duplicates before adding anything.** That means one order owner (instead of `booking_engine/` *and* `booking_service/`), one shopping owner, one pricing engine, one payment context with an isolated vault, and one cache owner per data set.
- **Make hotel content an offline mastering job** (golden property IDs, room mapping, curation queue) rather than query-time dedup in `ingest/merge/deduplication/`. Give reference data and FX an owner.
- **Servicing is where OTAs lose money.** Add `domains/servicing/involuntary/`: queue sweeps, an idempotent inbox for airline change notifications, a schedule-change classifier, refund-deadline rule packs, and an unused-credit ledger.
- **Add `domains/finance/` and `domains/settlement/` before launch.** Otherwise finance runs in spreadsheets, and BSP/ARC exposure and ADMs go unmanaged.
- **Add the platform spine:** a durable workflow engine, event-bus ownership, contracts-as-code, `.github/workflows`, supplier simulators, BFFs, a mobile app, a design system with accessibility, and AI guardrails.

## Model 2 — B2B agent portal

**What's new compared with B2C:**

B2B adds a second kind of customer: a business, organised as an N-level tree (consolidator, agency, branch, sub-agent, staff). It pays from a prepaid wallet or on credit, sells on net plus its own markup, and owns the traveller relationship. Most of the work therefore moves from consumer card checkout to partner money: wallets, credit exposure, a double-entry sub-ledger per partner, statements and collections, tax invoices and e-invoicing, and commission and incentive payouts with withholding tax. Tenancy, partner IAM and a per-tenant audit trail become platform basics, because every price, permission, booking and ledger entry belongs to an agency node. Air brings agency-specific supply concerns: PCC/office IDs, IATA numbers and NDC seller IDs, net and private fares, consolidator ticketing for TIDS-only sub-agents, and ADM recovery. Groups and allotments become core business. The main channel becomes a high-productivity agent portal plus an agent API, backed by agency-branded documents and an assisted desk for offline work.

### Key takeaways for B2B agent

- Of 25 B2B rows, 11 are missing, 12 are partial and 2 are duplicated. None is fully present. The missing rows are the foundations: tenancy, agency hierarchy, KYB, wallet, credit, sub-ledger, statements and invoicing.
- Tenancy is the most expensive gap to retrofit. Add platform/tenancy/ and domains/partner/hierarchy/ first, and carry agency context through tokens, core/events/ headers, ingest/storage/ cache keys, saga state and logs before building any B2B feature.
- There is no partner money at all: no wallet, credit, double-entry sub-ledger, statements, tax invoices or commission payouts. domain/payment/ and services/payment_service/ move only card money. Create a partner context (wallet, credit, sub_ledger, statements, commercials) on top of a finance ledger rather than stretching payment.
- The existing pricing duplication becomes critical in B2B. Markup and commission computed in ingest/merge/pricing/, domain/pricing/ and services/pricing_service/ will show agents one price and bill another. Merge them into one layered commercials engine (platform to distributor to agency to sub-agent to the agent's own markup), evaluated identically at search, reprice, book and invoice.
- The booking saga must gain wallet hold, credit check, capture and release steps plus durable timers (group deadlines, allotment release, overdue blocks). That needs a single booking owner (booking_engine/ vs services/booking_service/) and a workflow engine, and the tree has neither.
- Air B2B is the hardest part to retrofit later. integrations/auth/ and integrations/registry/ are the right seam but need per-agency PCC/IATA/NDC seller-ID entities and ticketing-office routing. Net/private fares need an offer context, and consolidator ticketing and ADM recovery need a BSP/ARC settlement context that does not exist.
- The channel is missing too: no apps/agent_portal/ and no bff/agent/ or agent API. admin_service/booking_management/ sits outside booking_engine/, so an assisted desk built on the order context is needed to stop manual bookings bypassing pricing and the ledger.
- Several existing parts can be extended rather than rebuilt once their duplications are fixed: user_service/rbac/ (partner IAM), notification_service/templates/ (branded comms), inventory_service/ plus domain/supplier/contract/ (allotments), analytics_service/ and data_platform/ (partner reports), domain/payment/fraud/ and api_gateway/rate_limiting/ (partner risk), and the two audit stores, merged into one WORM, tenant-queryable trail.

## Model 3 — White-label / API (B2B2C)

**What's new compared with B2B agent:**

The B2B agent portal sells your own inventory through your own UI to logged-in agency staff, using org scoping, wallets, credit and agent markups. B2B2C makes **the platform itself the product**. Partners resell under their own brand and through programmatic channels, so you need hard multi-tenant isolation, plan entitlements, a merchant of record and privacy roles per tenant, and white-label front ends with custom domains. The API becomes a product too. It needs OAuth/mTLS authentication, per-partner quotas and look-to-book governance, versioning with a deprecation policy, generated SDKs, a developer portal with sandbox certification, and signed outbound webhooks for events partners did not start. New **partner-facing** surfaces appear: content syndication with licence rights, affiliates, partner API products and a gateway for third-party AI agents (MCP). Agentic payment tokens, introduced in B2C as a "should", become a must here. Revenue moves to revenue share, API and platform fees and payouts on consumed travel, and partners expect SOC 2 / ISO 27001 evidence before signing.

### Key takeaways for white-label / API

- Across 22 rows: 0 present, 12 partial, 0 duplicated, 10 missing. Every partial is a generic single-tenant seed (core/config/, api_gateway/, integrations/auth/, payment_service/, security/gdpr/, sdk, frontend/app) that lacks the tenant/partner dimension, and the payment and privacy seeds are themselves duplicated.
- The tree has no tenant, brand, channel or POS concept, and the [A] agency scoping is also missing. platform/tenancy/ (isolation, entitlements, tenant context in events, caches and indexes) has to come before any partner-facing surface.
- The partner side of domains/distribution/ is almost entirely absent. Content syndication with rights and third-party AI-agent channels are missing. Partner API products amount to a generic public read API (ingest/disseminate/api/) plus booking_engine/api/, and with no Offer concept they cannot sell offer TTL or price-guarantee semantics.
- The partner API edge is split across api_gateway/, ingest/disseminate/api/, booking_engine/api/ and CRM/api/. It should become one bff/partner/ fed by a contracts/ source (today API schemas sit in docs/api/ and event schemas in core/events/). That source then drives versioning, Sunset headers, breaking-change gates and generated partner SDKs; today's sdk is a frontend SDK with no codegen.
- Outbound partner webhooks do not exist (payment_service/webhook/ is inbound only), and booking_engine/ publishes no events. Partners therefore cannot learn about schedule changes or supplier cancellations they did not start.
- B2B2C revenue has no home: no partner payouts or rev share with clawbacks, no affiliate tracking, no API/platform billing, and no finance ledger to post them to.
- Payment and privacy assume one merchant and one controller, and both are already duplicated. Before onboarding a white-label partner, you need per-tenant merchant of record, PCI 6.4.3/11.6.1 script control on themed payment pages, and per-tenant controller/processor roles.
- There is nothing for third-party AI agents: no MCP server or OAuth 2.1 resource server, and no Web Bot Auth/TAP verification at the edge (today the edge is only security/waf/ and api_gateway/rate_limiting/, and neither can verify agent signatures). Agentic payment tokens and AP2 mandates, introduced in B2C as a 'should', become a must once third-party agents sell your inventory.

## Model 4 — Corporate travel / TMC

**What's new compared with white-label / API:**

Corporate/TMC changes who the customer is. The payer is an employer that wants control and data, not a consumer and not a partner reselling inventory. The platform must enforce the employer's rules at every step: policy at search, selection and checkout, approvals before ticketing, budgets, and client data fields. It does this with identities federated from the client's IdP/HRIS, and arrangers can book on behalf of travellers. Money flows change from per-booking card capture and partner markup to lodged or virtual cards with enriched data, and to consolidated post-paid invoices in the buyer entity's name with e-invoicing and VAT reclaim. Revenue comes from service and management fees. Supply adds client-specific negotiated content, with corporate IDs and rate codes carried end to end through GDS and NDC. Servicing becomes the product itself: involuntary changes, unused credits, mid-office QC and 24x7 SLAs. New obligations also sit outside the booking: duty of care, emissions reporting, leakage capture, client reporting and per-client data residency. In the tree, that means a new domains/corporate/ context, enterprise extensions to identity, authz and tenancy, a bff/corporate/, and two new apps (corporate booking tool and TMC agent desktop).

### Key takeaways for corporate / TMC

- Your tree covers almost nothing at the corporate tier. Of 29 rows, 18 are missing, 8 are partial and 3 are duplicated, and none is present. The partials are thin consumer-grade footholds: auth, RBAC, voluntary servicing, ticketing, notifications, support chatbots and case handling, and card payments. There is no corporate context, policy, approvals, org hierarchy, UDIDs, duty of care, emissions or TMC billing.
- Foundations from earlier tiers are also missing: tenancy, the partner hierarchy with its wallet/credit ledger, and distribution. Corporate cannot extend B2B primitives, so the org tree, credit ledger and multi-client config must be built from scratch.
- Four platform prerequisites block corporate work and should come first. A durable workflow engine is needed so approvals respect ticketing deadlines. A single versioned rules engine is needed for policy-as-code. An Offer aggregate is needed for corporate ID injection and negotiated-fare labels. A finance context is needed for invoicing, VCC and tax/e-invoicing.
- Existing duplication gets worse at this tier. Profile has two owners (CRM/customer/ and user_service/profile/) and pricing has three, so a TMC fee engine would be a fourth. Analytics, privacy, audit, payment and support case handling each have at least two. Assign single owners before adding corporate fields.
- Identity is the most reusable foothold. Extend services/user_service/{auth,rbac,session} with per-tenant SAML/OIDC, SCIM 2.0 and entity-scoped ABAC for arrangers and guests, and consolidate api_gateway/auth/ and core/security/ under it.
- Servicing covers voluntary changes only. A TMC competes on involuntary/IROP handling, the NDC document chain and refund taxes, an unused-credit ledger, mid-office QC with auto-ticketing, and 24x7 SLA reporting, and none of these exists.
- integrations/ is supplier-only. Expense, ERP, HRIS and risk-feed connectors need a corporate-owned home (domains/corporate/integrations/) rather than new ports beside flight and hotel.
- Suggested shape: add domains/corporate/ (org, policy, approvals, custom fields, deals, billing, fees, duty of care, emissions, reporting, client config), bff/corporate/, apps/corporate_booking_tool/ and apps/tmc_agent_desktop/, plus platform/tenancy/ residency cells.

## 2026 developments that shape the design

Only fact-checked items are listed; the source is linked in brackets. Each group ends with what it means for your structure.

### Air retailing: offers, orders and settlement

- EGYPTAIR became the first airline in the Middle East and Africa to deploy IATA NDC schema 24.4 in a live production environment (July 2026). ([TPConnects powers EGYPTAIR to become first airline in Middle East and Africa to deploy IATA NDC 24.4 (TPConnects press release via Zawya; also Travolution, TradeArabia, ATTA 7 Jul 2026)](https://www.zawya.com/en/press-release/companies-news/tpconnects-powers-egyptair-to-become-first-airline-in-middle-east-and-africa-to-deploy-iata-ndc-244-b9jr9hyy)). Many NDC schema versions run live at once across carriers, so adapters need version profiles per airline.
- Finnair created the first native (ONE Order) airline order in May 2025 and launched a fully order-based NDC channel on Amadeus Nevio in August 2026. ([Amadeus blog: Finnair becomes first airline to go live with Amadeus Nevio NDC (13 Aug 2026); Amadeus press release: Finnair first airline globally to create a native order (14 May 2025)](https://amadeus.com/en/blog/articles/finnair-first-airline-amadeus-nevio-ndc))
- IATA's June 2026 ONE Order fact sheet says major carriers across all regions are either signing contracts with their IT partners or launching programs to implement Order Management at scale, following the IATA RP1786a business reference architecture. Lufthansa became the first airline to earn IATA ONE Order certification in May 2019. ([IATA Fact Sheet 'Fulfilling with Orders: ONE Order' (June 2026); Lufthansa Group newsroom, 'Lufthansa becomes the world's first airline to earn IATA ONE Order certification' (May 13, 2019)](https://www.iata.org/en/iata-repository/pressroom/fact-sheets/fact-sheet-one-order))
- ARC launched orders-based reporting and settlement (cash form of payment) in January 2026. ([ARC Launches Orders-Based Reporting and Settlement System to Advance Airline Retailing (ARC press release, 27 Jan 2026)](https://www2.arccorp.com/about-us/newsroom/2026-news-releases/arc-launches-orders-based-reporting-and-settlement-system-to-advance-airline-retailing/))
- Under IATA Settlement with Orders (SwO), airline and seller order management systems send clearance requests through the IATA Clearance Manager. IATA then aggregates and nets the claims on a schedule and settles them within the existing BSP agency framework. Adoption is still limited and IATA continues to invite participants to its SwO pilots. British Airways and Click Travel have used it in production since April 2020. ([IATA Settlement with Orders (SwO) program page; IATA NDC InFocus: Settlement with Orders Program (SwO)](https://www.iata.org/en/programs/airline-distribution/retailing/settlement-orders-swo/))

**Implication:** make the order the system of record, and treat PNRs, e-tickets and EMDs as fulfilment artifacts. Add an offer store, a per-airline capability and cost registry, and settlement adapters that handle both ticket-based (BSP/ARC) and orders-based settlement.

### AI-agent distribution and agentic payments

- Kiwi.com released a public prototype MCP server for flight search, built with Alpic, on August 7, 2025. ([Kiwi.com media room: 'Kiwi.com releases MCP Server prototype...' (Aug 7, 2025); Alpic, 'Behind the Kiwi.com MCP server'; Lupa.cz (Aug 13, 2025)](https://alpic.ai/blog/behind-the-kiwi-com-mcp-server-deploying-an-agentic-flight-booking-service))
- Expedia Group announced a B2B MCP server for partners at its Explore 2026 event (May 2026); a general-availability launch is not confirmed as of October 2026. ([Skift, 'Expedia to Launch Agentic AI Tools for B2B Partners' (May 21, 2026); Expedia Partner blog 'AI at Explore 2026: what partners need to know'](https://skift.com/2026/05/21/expedia-to-launch-agentic-ai-tools-for-b2b-partners/))
- Google confirmed on August 7, 2026 that it had begun a limited US test of agentic hotel booking inside AI Mode in Search, shown to a small share of US traffic. Booking.com was among the first partners and Amadeus was named as technical partner. The test is tied to Google's Universal Commerce Protocol (UCP) for Lodging, which Google extended to hotels in May 2026. On August 27, 2026 Google began a broader US rollout of hotel booking in AI Mode: English only, checkout via Google Pay, about ten booking partners activating over the following weeks. ([Skift, 'Google Confirms Agentic Hotel Booking Is Now in Testing' (Aug 7, 2026); Skift/TechCrunch (Aug 27, 2026); Google Developers, 'Expanding Universal Commerce Protocol on Google to Lodging'](https://skift.com/2026/08/07/google-confirms-hotel-agentic-booking-is-now-in-testing/))
- OpenAI scaled back ChatGPT Instant Checkout in March 2026. ([Digital Commerce 360, 'OpenAI shifts checkout plans in agentic commerce strategy' (Mar 6, 2026), citing The Information and CNBC](https://www.digitalcommerce360.com/2026/03/06/openai-shifts-checkout-plans-agentic-commerce-strategy/))
- Mastercard launched Agent Pay on April 29, 2025; Visa announced Visa Intelligent Commerce on April 30, 2025 and the Trusted Agent Protocol on October 14, 2025; Google announced the Agent Payments Protocol (AP2) in September 2025. ([Mastercard newsroom, 'Mastercard unveils Agent Pay...' (Apr 29, 2025); Visa press release 'The Future is Here: Visa Announces New Era of Commerce Featuring AI' (Apr 30, 2025); Visa, 'Visa Introduces Trusted Agent Protocol' (Oct 14, 2025); Google Cloud blog 'Announcing Agent Payments Protocol (AP2)' (Sept 16, 2025)](https://newsroom.mastercard.com/news/press/2025/april/mastercard-unveils-agent-pay-pioneering-agentic-payments-technology-to-power-commerce-in-the-age-of-ai))
- Under the MCP authorization specification (revision 2025-06-18), authorization is optional. MCP servers that implement it over an HTTP-based transport MUST implement OAuth 2.0 Protected Resource Metadata (RFC 9728) to advertise their authorization server(s), and MCP clients MUST use it for authorization-server discovery. ([Model Context Protocol Specification 2025-06-18, Basic &gt; Authorization](https://modelcontextprotocol.io/specification/2025-06-18/basic/authorization))

**Implication:**
- Expose deterministic offer IDs and a **protocol-neutral checkout session**, then add MCP, UCP and ACP as thin adapters over it.
- Verify AI agents at the edge (Web Bot Auth / Visa Trusted Agent Protocol).
- Store payment mandates with the order as chargeback evidence.
- Expect look-to-book ratios to rise as agent traffic grows.

### Regulation (pluggable rule packs, not code forks)

- PCI DSS v4.0.1 requirements 6.4.3 (payment page script inventory/authorization) and 11.6.1 (change/tamper detection) became mandatory on March 31, 2025. ([PCI SSC blog: Coffee with the Council podcast - Guidance for PCI DSS e-commerce requirements effective after 31 March 2025; PCI SSC guide 'Payment Page Security and Preventing E-Skimming' (Mar 2025)](https://blog.pcisecuritystandards.org/coffee-with-the-council-podcast-guidance-for-pci-dss-e-commerce-requirements-effective-after-31-march-2025))
- The US FTC Rule on Unfair or Deceptive Fees (live-event tickets and short-term lodging) took effect May 12, 2025 and requires all-in price display, including by intermediaries such as OTAs. ([Federal Register, 16 CFR Part 464 Trade Regulation Rule on Unfair or Deceptive Fees (10 Jan 2025)](https://govinfo.gov/content/pkg/FR-2025-01-10/pdf/2024-30293.pdf))
- The US DOT refund rule (89 FR 32760, published 26 April 2024) was formally effective on 25 June 2024. Its compliance date for the ticket, ancillary-fee and delayed-bag refund provisions was 28 October 2024, and some statutory refund requirements under the FAA Reauthorization Act applied from 16 May 2024. Airlines must refund automatically. Ticket agents that are the merchant of record must refund on request, within 7 business days for credit-card purchases and 20 calendar days for other payment methods. ([Federal Register Vol. 89 No. 82 (26 Apr 2024), Refunds and Other Consumer Protections, final rule 2024-07177; DOT Refund Final Rule Small Business Compliance Guidance (Dec 2024)](https://www.govinfo.gov/content/pkg/FR-2024-04-26/html/2024-07177.htm))
- The revised EU Package Travel Directive, Directive (EU) 2026/1024, entered into force in May 2026, must be transposed by September 2028, applies from 29 March 2029, and abolishes linked travel arrangements (LTAs). ([EUR-Lex: Directive (EU) 2026/1024 of 29 April 2026 amending Directive (EU) 2015/2302; Garrigues and EU Tourism Transition Pathways commentary](https://eur-lex.europa.eu/eli/dir/2026/1024/oj))
- The European Accessibility Act has applied since 28 June 2025 to e-commerce services and to websites/apps used for passenger transport booking. ([Bird &amp; Bird: EU Accessibility Deadline - The European Accessibility Act comes into force / Time to check-out... the EAA and its impact on travel, hospitality and leisure](https://www.twobirds.com/en/insights/2025/eu-accessibility-deadline--the-european-accessibility-act-comes-into-force))
- EU AI Act Article 50 transparency obligations (e.g. disclosing that users interact with an AI system) apply from 2 August 2026. ([European Commission Quick Facts: Transparency rules for AI systems; Regulation (EU) 2026/1744 (Digital Omnibus on AI) commentary (Cuatrecasas, Gibson Dunn)](https://digital-strategy.ec.europa.eu/en/factpages/quick-facts-transparency-rules-ai-systems))
- India's Digital Personal Data Protection Rules 2025 were notified on 13-14 November 2025; consent-manager provisions apply after 12 months and most core obligations after 18 months (around 13 May 2027). ([S.S. Rana / Bar &amp; Bench: MeitY Notifies Final Digital Personal Data Protection Rules 2025; JSA Prism InfoTech Nov 2025](https://ssrana.in/articles/meity-notifies-final-digital-personal-data-protection-rules-2025/))
- California CPPA's updated CCPA regulations on risk assessments, cybersecurity audits and automated decision-making technology took effect January 1, 2026 (with phased compliance dates). ([White &amp; Case: CPPA finalizes rules on ADMT, risk assessments and cybersecurity audits requirements; FMG Law: CCPA/CPRA amended regulations approved and effective January 1, 2026](https://www.whitecase.com/insight-alert/cppa-finalizes-rules-admt-risk-assessments-and-cybersecurity-audits-requirements))
- The EU Omnibus I simplification package narrowed CSRD scope to companies with more than 1,000 employees and over EUR 450 million turnover. ([Directive (EU) 2026/470 (Omnibus I), as summarised by Herbert Smith Freehills Kramer / Arthur Cox / Linklaters](https://www.hsfkramer.com/notes/esg/2026-posts/omnibus-i-update-csrd-and-csddd-amendment-directive-published-in-the-official-journal))
- To comply with the EU Digital Markets Act (gatekeeper designation 13 May 2024; obligations applying from 14 November 2024), Booking.com removed or waived all parity requirements for EEA accommodation partners. It began removing EEA parity clauses from 1 July 2024, ahead of the deadline, and per its Commission compliance workshop the elimination applied to both new and existing partners from 2 December 2024. Waivers cover some legacy negotiated contracts until renegotiation. ([Kluwer Competition Law Blog, 'Booking.com's DMA Compliance Workshop - The Power of No' (Nov 2024); Booking Holdings 2025 DMA Compliance Report (public summary); European Commission DMA factsheet on Booking.com (Sept 2026)](https://legalblogs.wolterskluwer.com/competition-blog/bookingcoms-dma-compliance-workshop-the-power-of-no-win-lose-lose/))

**Implication:**
- `platform/markets/` holds all-in price-display rules.
- `platform/privacy/` holds pluggable regimes (GDPR, DPDP, CCPA and others).
- `domains/checkout/` holds package classification per market (it must switch from the current EU regime to Directive 2026/1024 by date).
- `domains/servicing/` enforces refund deadlines.
- `compliance/` holds accessibility and AI-transparency evidence.
- `domains/payment/` keeps card data in an isolated vault or a third-party token service to minimise PCI scope, and governs payment-page scripts (requirements 6.4.3/11.6.1, or the SAQ A script-eligibility criterion where card capture is fully outsourced).

### Market signals

- Expedia Group reported Q1 2026 B2B gross bookings up 22% and B2B revenue up 25% year over year. ([Expedia Group, 'Expedia Group Reports First Quarter 2026 Results' (Form 8-K exhibit, May 7, 2026)](https://www.sec.gov/Archives/edgar/data/0001324424/000132442426000031/earningsrelease-q12026.htm)): B2B and API distribution is where the growth is, so design tenancy and partner finance in from the start.
- American Express Global Business Travel completed its acquisition of CWT in September 2025. ([Amex GBT press release 'Amex GBT Completes Acquisition of CWT' (Sept 2, 2025)](https://www.nasdaq.com/press-release/amex-gbt-completes-acquisition-cwt-2025-09-02)): TMCs are consolidating, and platforms sell "TMC stacks" as a service, so build corporate support multi-tenant and multi-client.
- Booking.com runs a federated GraphQL architecture on Apollo Federation (over 100 subgraphs) and described moving multi-product order orchestration to Temporal in 2026. ([Apollo GraphQL Summit 2024 session 'How Booking.com securely decomposed their monolith' (120 federated subgraphs); Temporal Replay 2026, 'Beyond the state machine: Scaling order orchestration at Booking.com' (May 7, 2026)](https://temporal.io/resources/on-demand/scaling-order-orchestration-at-booking-com)): this supports a durable workflow engine for orders and BFFs, with federation added later.

## Suggested build order

1. **Foundations (before features):**
   - monorepo build and `.github/workflows`
   - `contracts/` with codegen and `libs/`
   - `platform/eventing` (outbox, CDC) and `platform/workflow`
   - `platform/identity`, `markets`, `privacy`, `rules`, `audit`
   - supplier simulators and a local devenv
2. **B2C MVP:**
   - refdata and FX
   - one air source (an aggregator) and one bedbank
   - shopping with cache, then the offer store and reprice
   - checkout, order, payment (behind an orchestration seam), fulfilment documents
   - ledger and invoicing
   - servicing, including change notifications
   - back-office, support, web BFF and app
3. **B2C at scale:**
   - GDS and NDC direct connections, with the capability and cost registry and a look-to-book governor
   - hotel mapping
   - risk and bot defence
   - BSP/ARC and ADM handling if you become accredited
   - metasearch feeds, UCP/ACP checkout adapters and agentic-payment acceptance
   - mobile app, experimentation, and an AI planner with guardrails
4. **B2B agent:**
   - tenancy (org scoping) and the agency hierarchy with KYB
   - wallet, credit and partner sub-ledger
   - layered commercials
   - agent portal and agent BFF
   - statements and invoices, branded documents, assisted desk, groups
5. **White-label / API:**
   - hard tenant isolation and entitlements, with merchant of record per tenant
   - the partner API product: contracts, SDKs, developer portal, sandbox, quotas, webhooks
   - content syndication, affiliates and payouts
   - a third-party MCP agent gateway, with agentic payments as a must
   - SOC 2 / ISO 27001 evidence
6. **Corporate / TMC:**
   - SSO and SCIM, the org and cost-centre hierarchy
   - policy-as-code and approvals
   - negotiated deals and corporate forms of payment
   - consolidated billing and TMC fees
   - duty of care, emissions, expense/ERP integrations
   - TMC agent desktop, corporate booking tool, client reporting, residency cells

<script>
(function () {
  var src = document.getElementById('md').textContent;
  var main = document.getElementById('content');
  try {
    if (!window.marked) throw new Error('markdown renderer unavailable');
    main.innerHTML = window.marked.parse(src, { gfm: true });
  } catch (err) {
    main.innerHTML = '<p class="fallback-note">Could not render markdown (' + String(err.message || err) + '). Showing the raw report instead.</p><pre id="raw"></pre>';
    document.getElementById('raw').textContent = src;
    return;
  }
  main.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div');
    w.className = 'table-wrap';
    if (/What is different/.test(t.querySelector('thead') ? t.querySelector('thead').textContent : '')) t.classList.add('wide');
    t.parentNode.insertBefore(w, t);
    w.appendChild(t);
  });
  var used = {};
  var list = document.getElementById('toc-list');
  main.querySelectorAll('h2, h3').forEach(function (h) {
    var base = h.textContent.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'section';
    var id = base, n = 2;
    while (used[id]) id = base + '-' + n++;
    used[id] = true;
    h.id = id;
    if (h.tagName === 'H2') {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.href = '#' + id;
      a.textContent = h.textContent;
      li.appendChild(a);
      list.appendChild(li);
    }
  });
  main.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  var toc = document.getElementById('toc');
  if (window.matchMedia('(min-width: 1100px)').matches) toc.open = true;
})();
</script>
