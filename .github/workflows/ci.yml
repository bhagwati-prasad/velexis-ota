# CI for every pull request and every push to main (ADR-0015, ADR-0020).
# Jobs: plan-lint (no install), deploy-files (shellcheck, the Velexis Caddy build with the web application firewall
# (deploy/caddy/build/build-caddy.sh, checked against its pinned SHA-256; task X-039), Caddyfile validation and its
# end-to-end smoke test, the velexis-deploy test with a fake systemctl, the velexis-healthcheck test with fake
# endpoints, systemd units and their sandbox exposure), systemd-units (the real units run a stand-in app under systemd;
# a failure alert reaches Mailpit, and velexis-egress-refresh.service loads the outbound allow-list in a network
# namespace of its own; lead decision (17a) of 2026-11-11), check-vm (check-vm.test.sh as root with a real sshd and a
# real nft; lead decisions (13l) of 2026-11-10 and (17a) of 2026-11-11, approved by the owner), dev-setup
# (docs/mvp/local-development.md §2 on a clean runner: PostgreSQL 16 and Redis 7.4 from apt, dev-setup.sh and
# dev-keys.mjs twice), build-test (repository guards and
# tools/ci/check-package-json.mjs before the install, then install, the tools/ci and tools/perf tests, format, lint,
# typecheck, unit, contracts up to date, build, the cross-backend tests, release dry run with the Caddy build),
# integration (in parallel with build-test: the integration tests with PostgreSQL 16 + Redis 7.4 + Mailpit and the
# PAN-absence proof that reads their report; lead decision (5o) of 2026-11-05, approved by the owner), alt-hosts (task
# X-032: tools/ci/check-no-hardcoded-hosts.mjs, then the same integration tests with PostgreSQL and Redis on other host
# names and ports, PostgreSQL over TLS only).
# Agents never change this file to get their own change through (AGENTS.md §7). What each guard enforces and how to
# run it locally: tools/ci/README.md.
# Third-party actions are pinned to full commit SHAs with the tag as the last thing in the comment, so Dependabot
# (.github/dependabot.yml) can move both; check-package-json.mjs fails on any other pin (ADR-0023, X-019).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  plan-lint:
    name: Plan lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Plain Node only: this job never runs `pnpm install` (X-019).
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Validate the agent task plans
        run: node tools/plan-lint/plan-lint.mjs

  deploy-files:
    name: Deploy files
    runs-on: ubuntu-24.04
    # 15 minutes since X-039: the Caddy build takes 1 to 3 minutes of them.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The echo upstream of the Caddyfile smoke test, the fake apps of deploy.test.sh and the fake endpoints of
          # healthcheck.test.sh.
          node-version-file: .nvmrc
      - name: shellcheck deploy scripts
        run: |
          shellcheck -S style deploy/scripts/*.sh deploy/scripts/test/*.sh deploy/systemd/test/*.sh deploy/caddy/test/*.sh \
            deploy/caddy/build/*.sh
      - name: Build the Velexis Caddy (Caddy 2.8.4 with Coraza, the pinned versions and SHA-256 of versions.env)
        # X-039: the Go toolchain and the modules come from proxy.golang.org, checked against versions.env and
        # sum.golang.org; the build fails unless its SHA-256 is CADDY_SHA256, which makes every CI run a check that the
        # build is reproducible. See the header of build-caddy.sh.
        run: bash deploy/caddy/build/build-caddy.sh /tmp/caddy-build
      - name: Validate the Caddyfile with the Velexis Caddy
        run: |
          VELEXIS_EDGE_SECRET=ci VELEXIS_WAF_DIR=deploy/caddy/waf /tmp/caddy-build/caddy validate --config deploy/caddy/Caddyfile --adapter caddyfile
          /tmp/caddy-build/caddy fmt deploy/caddy/Caddyfile | diff -u deploy/caddy/Caddyfile -
      - name: Caddyfile smoke test (local CA, test ports, echo upstream, the web application firewall)
        # X-022: the real Caddyfile with a test global options block; X-039: the WAF's blocking and detection. See the
        # header of caddy-smoke.sh.
        run: CADDY=/tmp/caddy-build/caddy bash deploy/caddy/test/caddy-smoke.sh
      - name: velexis-deploy test (temporary VM root, fake systemctl and apps, no root)
        # X-023: deploy.sh against fake releases (happy path, refusals, rollbacks, pruning); see deploy.test.sh's header.
        run: bash deploy/scripts/test/deploy.test.sh
      - name: velexis-healthcheck test (temporary VM root, fake endpoints and stand-ins, no root)
        # X-030: healthcheck.sh against fake units, queues, Redis, disk, backup marker, certificates and payment pages;
        # see healthcheck.test.sh's header. The runner image has curl, jq and openssl; a missing one is installed first.
        # Lead decision (11i) of 2026-11-06, approved by the owner (FIX-W46-SHARED).
        run: |
          missing=()
          for tool in curl jq openssl; do
            command -v "$tool" > /dev/null || missing+=("$tool")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "${missing[@]}"
          fi
          bash deploy/scripts/test/healthcheck.test.sh
      - name: Verify systemd units
        run: |
          # Off the VM only the missing /usr/bin/node and helper paths are reported; anything else fails.
          out="$(systemd-analyze verify --man=no deploy/systemd/*.service deploy/systemd/*.timer 2>&1 || true)"
          echo "$out"
          if echo "$out" | grep -v -E "Command /usr/(bin/node|local/sbin/velexis-[a-z]+) is not executable|velexis-alert@|caddy.service" | grep -q .; then
            exit 1
          fi
      - name: Unit sandboxing (every app unit, velexis-alert@, velexis-healthcheck and velexis-egress-refresh at exposure 2.0 or lower)
        run: |
          # --threshold counts in tenths: 20 is 2.0 ("OK"); systemd-analyze exits non-zero above it.
          # velexis-egress-refresh since lead decision (17a) of 2026-11-11 (approved by the owner).
          for unit in deploy/systemd/velexis-{platform-api,platform-worker,portal,platform-admin,ota-api,ota-worker,ota-admin}.service \
                      deploy/systemd/velexis-alert@.service deploy/systemd/velexis-healthcheck.service \
                      deploy/systemd/velexis-egress-refresh.service; do
            if ! out="$(systemd-analyze security --offline=true --threshold=20 --no-pager "$unit" 2>&1)"; then
              echo "$out"
              echo "::error::$unit is above exposure 2.0"
              exit 1
            fi
            echo "$out" | tail -n 1
          done

  systemd-units:
    name: systemd units smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Install nftables if the runner image lacks it (velexis-egress-refresh.service's nft in the units smoke test)
        # Lead decision (17a) of 2026-11-11, approved by the owner. The package's nftables.service stays disabled: it
        # loads nothing into the runner's own rules.
        run: |
          if [ ! -x /usr/sbin/nft ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nftables
          fi
          dpkg-query -W nftables
      - name: Run the real units with a stand-in app, kill one into failed, check the alert in Mailpit
        # X-021: the production sandboxing against what the apps need; see the header of units-smoke.sh. Since lead
        # decision (17a) of 2026-11-11 also velexis-egress-refresh.service, in a network namespace of its own.
        run: sudo env SMOKE_NODE="$(command -v node)" bash deploy/systemd/test/units-smoke.sh

  # Lead decision (13l) of 2026-11-10, approved by the owner: check-vm.test.sh (check-vm.sh, and the steps users, keys,
  # envfiles, ssh and egress of provision-vm.sh under a temporary VELEXIS_ROOT with fake system tools: X-020, X-037,
  # X-040, X-041 and the SSH lockout guard) as root on a clean Ubuntu 24.04 runner, with the real sshd of
  # openssh-server validating the SSH drop-ins and, since lead decision (17a) of 2026-11-11 (approved by the owner), the
  # real nft of nftables loading the outbound allow-list in a private network namespace: the test fails without it.
  # The runner is never a provisioned VM (the test refuses a host with /etc/velexis).
  check-vm:
    name: VM check test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install openssh-server if the runner image lacks it (the real sshd -t and sshd -T of the test)
        # sshd -t also needs its privilege separation folder, which ssh.service creates only while it runs (socket
        # activation on Ubuntu 24.04); without it the real-sshd checks would not run. provision-vm.sh does the same.
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends openssh-server
          fi
          dpkg-query -W openssh-server
          sudo install -d -m 0755 -o root -g root /run/sshd
      - name: Install nftables if the runner image lacks it (the real nft of the test's outbound allow-list part)
        # Lead decision (17a) of 2026-11-11, approved by the owner: without a working nft check-vm.test.sh fails. The
        # package's nftables.service stays disabled; the test loads its table only in a private network namespace.
        run: |
          if [ ! -x /usr/sbin/nft ]; then
            sudo apt-get update -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends nftables
          fi
          dpkg-query -W nftables
      - name: check-vm.test.sh as root (temporary VELEXIS_ROOT, fake system tools, the real sshd and nft)
        # Every check must pass, the real-sshd and real-nft ones included: the test fails when the real-nft checks did
        # not run, and its last line says when the real-sshd ones did not.
        run: |
          set -o pipefail
          sudo bash deploy/scripts/test/check-vm.test.sh 2>&1 | tee "$RUNNER_TEMP/check-vm.log"
          tail -n 1 "$RUNNER_TEMP/check-vm.log" | grep -qx 'check-vm.test: all checks passed'

  # X-016: the one-time setup of docs/mvp/local-development.md §2, up to `pnpm dev:keys`, on a clean runner with
  # native PostgreSQL and Redis (systemd, sudo), exactly as a developer runs it. No service containers here.
  dev-setup:
    name: Local development setup
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash # -eo pipefail
    env:
      PG_MAJOR: "16"
      REDIS_PIN: "6:7.4*" # packages.redis.io version string of Redis 7.4, as in provision-vm.sh
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc # what `nvm install` reads in local-development.md §2

      - name: "[X-016 AC2] shellcheck -S style dev-setup.sh"
        run: shellcheck -S style deploy/scripts/dev-setup.sh

      - name: "[X-016 AC3] dev-keys.mjs tests"
        run: node --test tools/dev/dev-keys.test.mjs

      - name: Install PostgreSQL 16 and Redis 7.4 from their apt repositories (local-development.md §1)
        run: |
          . /etc/os-release
          # Only our definitions of the two vendor repositories: the runner image may ship its own.
          { sudo grep -rlE 'apt\.postgresql\.org|packages\.redis\.io' /etc/apt/sources.list.d/ || true; } | xargs -r sudo rm -f
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor --yes -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          curl -fsSL https://packages.redis.io/gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/redis.gpg
          echo "deb [signed-by=/etc/apt/keyrings/redis.gpg] https://packages.redis.io/deb ${VERSION_CODENAME} main" \
            | sudo tee /etc/apt/sources.list.d/redis.list
          printf 'Package: redis redis-server redis-tools\nPin: version %s\nPin-Priority: 1001\n' "$REDIS_PIN" \
            | sudo tee /etc/apt/preferences.d/velexis-redis
          sudo apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            "postgresql-${PG_MAJOR}" "postgresql-client-${PG_MAJOR}" redis-server redis-tools
          pg_lsclusters
          test "$(pg_lsclusters -h | awk -v v="$PG_MAJOR" '$1 == v && $2 == "main" { print $3 }')" = 5432
          redis-server --version | grep ' v=7\.4\.'

      - name: "§2: corepack enable, pnpm install, cp .env.example .env.local"
        run: |
          corepack enable
          pnpm --version
          pnpm install --frozen-lockfile
          cp .env.example .env.local

      - name: Stop PostgreSQL and Redis, so that dev-setup.sh has to start them
        run: |
          sudo systemctl stop postgresql redis-server
          if pg_isready -h 127.0.0.1 -p 5432; then exit 1; fi
          if redis-cli -h 127.0.0.1 -p 6379 ping 2>/dev/null; then exit 1; fi

      - name: "[X-016 AC4] dev-setup.sh refuses to run on a host with /etc/velexis"
        run: |
          sudo install -d -m 0750 /etc/velexis
          if bash deploy/scripts/dev-setup.sh > "$RUNNER_TEMP/refused.log" 2>&1; then
            cat "$RUNNER_TEMP/refused.log"
            echo "::error::dev-setup.sh ran on a host with /etc/velexis"
            exit 1
          fi
          cat "$RUNNER_TEMP/refused.log"
          grep -q '/etc/velexis exists' "$RUNNER_TEMP/refused.log"
          if pg_isready -q -h 127.0.0.1 -p 5432; then
            echo "::error::dev-setup.sh started PostgreSQL before refusing"
            exit 1
          fi
          sudo rmdir /etc/velexis

      - name: "§2: bash deploy/scripts/dev-setup.sh (first run)"
        run: bash deploy/scripts/dev-setup.sh

      - name: Record the database and Redis state after the first run
        run: |
          cat > "$RUNNER_TEMP/state.sh" <<'EOF'
          set -euo pipefail
          cd /
          # Roles, memberships, the database, schema privileges and default privileges. Password hashes are left
          # out: bootstrap.sql resets the same development passwords on every run (new salt), by design.
          sudo -u postgres psql -X -q -At -v ON_ERROR_STOP=1 -d postgres <<'SQL'
          SELECT rolname, rolsuper, rolinherit, rolcreaterole, rolcreatedb, rolcanlogin, rolreplication,
                 rolbypassrls, rolconnlimit, rolconfig
          FROM pg_roles WHERE rolname LIKE 'velexis%' ORDER BY 1;
          SELECT r.rolname, m.rolname, am.admin_option, am.inherit_option, am.set_option
          FROM pg_auth_members am JOIN pg_roles r ON r.oid = am.roleid JOIN pg_roles m ON m.oid = am.member
          WHERE m.rolname LIKE 'velexis%' ORDER BY 1, 2;
          SELECT datname, pg_get_userbyid(datdba), pg_encoding_to_char(encoding), datcollate, datctype, datacl
          FROM pg_database WHERE datname LIKE 'velexis%' ORDER BY 1;
          \connect velexis
          SELECT nspname, pg_get_userbyid(nspowner), nspacl FROM pg_namespace
          WHERE nspname IN ('public', 'platform', 'reference') ORDER BY 1;
          SELECT pg_get_userbyid(defaclrole), defaclnamespace::regnamespace, defaclobjtype, defaclacl
          FROM pg_default_acl ORDER BY 1, 2, 3;
          SQL
          sudo sha256sum /etc/redis/redis.conf
          EOF
          bash "$RUNNER_TEMP/state.sh" > "$RUNNER_TEMP/state-1.txt"
          cat "$RUNNER_TEMP/state-1.txt"

      - name: "[X-016 AC2] a second run of dev-setup.sh succeeds and changes nothing"
        run: |
          bash deploy/scripts/dev-setup.sh | tee "$RUNNER_TEMP/run-2.log"
          grep -q 'password already set (unchanged)' "$RUNNER_TEMP/run-2.log"
          bash "$RUNNER_TEMP/state.sh" > "$RUNNER_TEMP/state-2.txt"
          diff -u "$RUNNER_TEMP/state-1.txt" "$RUNNER_TEMP/state-2.txt"

      - name: "[X-016 AC1] the five roles exist and every login of .env.local works"
        run: |
          get() { sed -n "s/^$1=//p" .env.local; }
          roles="$(cd / && sudo -u postgres psql -X -At -c "SELECT string_agg(rolname, ' ' ORDER BY rolname) FROM pg_roles WHERE rolname LIKE 'velexis%'")"
          test "$roles" = "velexis_migrator velexis_ota_app velexis_platform_app velexis_provisioner velexis_test_admin"
          # Each URL must log in as the role it names. The assignment (not an echo argument) makes a failed
          # login fail the step under bash -e.
          login() { # <url> <role>
            local user
            user="$(psql "$1" -X -At -c 'SELECT current_user')"
            echo "$2: $user"
            test "$user" = "$2"
          }
          login "$(get DATABASE_URL)" velexis_platform_app
          login "$(get DATABASE_MIGRATOR_URL)" velexis_migrator
          login "$(get DATABASE_PROVISIONER_URL)" velexis_provisioner
          login "$(get TEST_DATABASE_ADMIN_URL)" velexis_test_admin
          # The OTA backend's DATABASE_URL, from the ota/backend/.env.local example line of .env.example.
          ota_url="$(sed -n 's|^#[[:space:]]*ota/backend/\.env\.local:[[:space:]]*DATABASE_URL=||p' .env.local)"
          test -n "$ota_url"
          login "$ota_url" velexis_ota_app
          test "$(psql "$ota_url" -X -At -c 'SHOW search_path')" = pg_catalog
          # The integration-test harness (ADR-0022) creates databases owned by velexis_migrator.
          psql "$(get TEST_DATABASE_ADMIN_URL)" -X -q \
            -c 'CREATE DATABASE velexis_ci_probe OWNER velexis_migrator' -c 'DROP DATABASE velexis_ci_probe'

      - name: "[X-016 AC1] Redis needs the password of REDIS_URL, also after a restart"
        run: |
          # redis-cli -u sends an empty user name for redis://:password@, so the password is passed on its own.
          password="$(sed -n 's|^REDIS_URL=redis://[^:@]*:\([^@]*\)@.*|\1|p' .env.local)"
          test -n "$password"
          check() {
            local anonymous
            anonymous="$(redis-cli -h 127.0.0.1 -p 6379 ping)"
            echo "without a password: $anonymous"
            case "$anonymous" in NOAUTH*) ;; *) echo "::error::Redis did not refuse a client without a password"; exit 1 ;; esac
            test "$(REDISCLI_AUTH="$password" redis-cli -h 127.0.0.1 -p 6379 ping)" = PONG
          }
          check
          sudo systemctl restart redis-server
          for _ in $(seq 1 20); do redis-cli -h 127.0.0.1 -p 6379 ping >/dev/null 2>&1 && break; sleep 0.5; done
          check

      - name: "§2: pnpm dev:keys, twice ([X-016 AC3])"
        run: |
          pnpm dev:keys
          (cd .local/keys && sha256sum -- *) > "$RUNNER_TEMP/keys-1.txt"
          node tools/dev/dev-keys.mjs | tee "$RUNNER_TEMP/keys-2.log"
          grep -q '0 created, 0 replaced, 5 kept' "$RUNNER_TEMP/keys-2.log"
          (cd .local/keys && sha256sum -- *) | diff -u "$RUNNER_TEMP/keys-1.txt" -
          ls -la .local/keys
          test "$(stat -c %a .local/keys)" = 700
          test "$(find .local/keys -type f | wc -l)" -eq 5
          for f in master-v1.key api-key-pepper document-url.key platform-jwt-ed25519.pem ota-jwt-ed25519.pem; do
            test "$(stat -c %a ".local/keys/$f")" = 600
          done
          openssl pkey -in .local/keys/ota-jwt-ed25519.pem -noout -text | grep 'ED25519 Private-Key'
          # The key and storage paths of .env.local point at what dev-keys created.
          get() { sed -n "s/^$1=//p" .env.local; }
          test -f "$(get MASTER_KEY_DIR)/master-$(get MASTER_KEY_CURRENT | sed 's/^local://').key"
          for var in API_KEY_PEPPER_FILE JWT_PRIVATE_KEY_FILE DOCUMENT_URL_KEY_FILE; do
            test -f "$(get "$var")"
          done
          test -d "$(get STORAGE_DIR)"

  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    # About 21 minutes on a usual runner; runs 116 on 2026-10-31 needed more than 30 on slower runners, every step
    # about 1.5 times slower, so the budget leaves room for that (owner's decision of 2026-11-02). Run 41847581727 of
    # 2026-11-05 took 31.5 minutes, 16.4 of them the integration tests, which have run in the integration job since
    # (owner's decision of 2026-11-05, lead decision (5o)).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_ENV: test
      DATABASE_URL: postgres://velexis_platform_app:dev_platform@127.0.0.1:5432/velexis
      DATABASE_MIGRATOR_URL: postgres://velexis_migrator:dev_migrator@127.0.0.1:5432/velexis
      DATABASE_PROVISIONER_URL: postgres://velexis_provisioner:dev_provisioner@127.0.0.1:5432/velexis
      TEST_DATABASE_ADMIN_URL: postgres://velexis_test_admin:dev_test_admin@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      AMADEUS_BASE_URL_TEST: http://127.0.0.1:4900
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 2 # the PR merge commit and its base parent, for the guards below
          persist-credentials: false

      # Guards first: they need no dependencies, so a broken rule fails in seconds (tools/ci/README.md).
      - name: Repository guards
        run: |
          # Session-level search_path changes are forbidden outside packages/db (ADR-0004): SET [SESSION] search_path
          # and its function form set_config('search_path', ..., false). tenantTx uses set_config(..., true).
          if grep -rnEi --include='*.ts' --include='*.tsx' --include='*.mts' --include='*.cts' \
               --include='*.js' --include='*.mjs' --include='*.cjs' --include='*.sql' \
               --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.next --exclude-dir=.turbo \
               -e 'set[[:space:]]+(session[[:space:]]+)?"?search_path' \
               -e 'set_config[[:space:]]*\([[:space:]]*.search_path.[[:space:]]*,.*,[[:space:]]*false[[:space:]]*\)' \
               platform ota packages tools 2>/dev/null \
               | grep -v '^packages/db/'; then
            echo "::error::Session-level SET search_path outside packages/db"; exit 1
          fi
          # Baselines stay byte-for-byte copies of the reference DDL (ADR-0005).
          for pair in "platform/backend/migrations/platform/0001_baseline.sql docs/velexis-sdk/db/platform.sql" \
                      "platform/backend/migrations/reference/0001_baseline.sql docs/velexis-sdk/db/reference.sql" \
                      "ota/backend/migrations/tenant/0001_baseline.sql docs/velexis-sdk/db/tenant.sql"; do
            read -r baseline reference <<< "$pair"
            if [ -f "$baseline" ]; then cmp "$baseline" "$reference" || { echo "::error::$baseline differs from $reference"; exit 1; }; fi
          done
          # Reference material is never edited in a pull request.
          if [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ]; then
            if git diff --name-only HEAD^1 HEAD | grep -E '^docs/(velexis-sdk|amadeus-api)/'; then
              echo "::error::docs/velexis-sdk and docs/amadeus-api are reference material and must not change"; exit 1
            fi
          fi

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Exact versions, dev-only test packages, no package depending on an app, SHA-pinned actions (X-019).
      - name: Check the package.json files and the action pins
        run: node tools/ci/check-package-json.mjs

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Restore the Turborepo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bootstrap database roles and schemas
        run: |
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -v db_name=velexis \
            -v migrator_password=dev_migrator -v provisioner_password=dev_provisioner \
            -v platform_password=dev_platform -v ota_password=dev_ota \
            -f deploy/postgres/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE velexis_test_admin LOGIN CREATEDB PASSWORD 'dev_test_admin'" \
            -c "GRANT velexis_migrator TO velexis_test_admin"

      - name: Generate local key files
        run: pnpm dev:keys

      # The scripts in tools/ci and tools/perf have no package.json, so Turborepo does not lint or test them. tools/perf
      # (the pure helpers of platform-smoke.mjs) since lead decision (13c) of 2026-11-10, approved by the owner.
      - name: Lint and test the CI checks and tools/perf
        run: |
          pnpm exec eslint tools/ci
          node --test tools/ci/*.test.mjs
          pnpm exec eslint tools/perf
          node --test tools/perf/*.test.mjs

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit, contract and UI tests
        run: pnpm test

      - name: Generated files are up to date
        run: |
          pnpm contracts:generate
          if [ -f packages/db/package.json ]; then pnpm db:migrate && pnpm db:codegen; fi
          git diff --exit-code -- packages/api-types packages/errors packages/db/src/generated \
            || { echo "::error::Generated files are stale. Run pnpm contracts:generate / pnpm db:codegen and commit."; exit 1; }
          # OBE-017: the Amadeus types in ota/backend/src/amadeus/generated are generated from docs/amadeus-api/;
          # a stale, missing or extra file fails here.
          pnpm --filter @velexis/ota-backend amadeus:types
          if [ -n "$(git status --porcelain -- ota/backend/src/amadeus/generated)" ]; then
            git status --porcelain -- ota/backend/src/amadeus/generated
            git diff -- ota/backend/src/amadeus/generated
            echo "::error::The generated Amadeus types are stale. Run pnpm --filter @velexis/ota-backend amadeus:types and commit."
            exit 1
          fi

      - name: SDK route table is up to date
        # SDK-002: ota/sdk/src/internal/operations.js is generated from the OTA OpenAPI document and
        # ota/sdk/scripts/operation-overrides.json (OADR-0016 point 2); a stale or missing file fails here.
        run: |
          pnpm --filter @velexis/ota-sdk generate
          if [ -n "$(git status --porcelain -- ota/sdk/src/internal/operations.js)" ]; then
            git diff -- ota/sdk/src/internal/operations.js
            echo "::error::The SDK route table is stale. Run pnpm --filter @velexis/ota-sdk generate and commit."
            exit 1
          fi

      - name: Build
        run: pnpm build

      # PBE-035, PADR-0017 item 2: test:xb starts the BUILT OTA backend (ota/backend/dist/), which only the Build
      # step above produces: pnpm test:int builds each package's dependencies only, and ota/backend is none of
      # platform/backend's. Without the build the suite fails at once and names the build command.
      - name: Cross-backend tests (platform with the built OTA worker)
        run: pnpm --filter @velexis/platform-backend test:xb

      # OBE-083, PADR-0017 item 2: the OTA backend's test:xb starts the BUILT platform API, worker and dev:seed and the
      # BUILT OTA API and worker, both from the dist/ folders of the Build step above.
      - name: Cross-backend tests (OTA with the built platform and OTA backends)
        run: pnpm --filter @velexis/ota-backend test:xb

      - name: Pack a release folder (dry run of deploy/scripts/pack-release.sh)
        # pack-release.sh builds the Velexis Caddy into the release (X-039): 1.5 to 2.5 minutes of this step without a
        # cache (measured on four CPUs and on two), below the 3 minutes that would call for a switch to skip it here.
        run: |
          RELEASE_SHA="${GITHUB_SHA}" bash deploy/scripts/pack-release.sh /tmp/release
          (cd "/tmp/release/${GITHUB_SHA}" && sha256sum --quiet -c SHA256SUMS)

  # Lead decision (5o) of 2026-11-05, approved by the owner: the integration tests and the PAN-absence proof that reads
  # their report run in a job of their own, in parallel with build-test, on the same runner with the same services,
  # environment and setup steps (checkout, pnpm, Node, install, Turborepo cache, database bootstrap, key files).
  # Turborepo's cache is only restored here: build-test saves it (tools/ci/README.md), as e2e.yml restores it.
  integration:
    name: Integration tests
    runs-on: ubuntu-24.04
    # 16.4 minutes of integration tests on run 41847581727 (2026-11-05), when they still ran in build-test, plus the
    # setup; the same budget as build-test, for runners about 1.5 times slower (owner's decisions of 2026-11-02 and
    # 2026-11-05).
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_ENV: test
      DATABASE_URL: postgres://velexis_platform_app:dev_platform@127.0.0.1:5432/velexis
      DATABASE_MIGRATOR_URL: postgres://velexis_migrator:dev_migrator@127.0.0.1:5432/velexis
      DATABASE_PROVISIONER_URL: postgres://velexis_provisioner:dev_provisioner@127.0.0.1:5432/velexis
      TEST_DATABASE_ADMIN_URL: postgres://velexis_test_admin:dev_test_admin@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      AMADEUS_BASE_URL_TEST: http://127.0.0.1:4900
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Restore only: build-test saves the cache, so a package of this run's dependency builds that did not change
      # replays its build, and two jobs never race to save the same key.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bootstrap database roles and schemas
        run: |
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -v db_name=velexis \
            -v migrator_password=dev_migrator -v provisioner_password=dev_provisioner \
            -v platform_password=dev_platform -v ota_password=dev_ota \
            -f deploy/postgres/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE velexis_test_admin LOGIN CREATEDB PASSWORD 'dev_test_admin'" \
            -c "GRANT velexis_migrator TO velexis_test_admin"

      - name: Generate local key files
        run: pnpm dev:keys

      - name: Integration tests
        run: pnpm test:int

      - name: PAN-absence proof ran in full (OBE-052)
        # ota/backend/test/integration/payments/pan-absence.int.test.ts (ota/docs/flows/checkout-airline-card.md §7,
        # OF-05 AC1) runs in `pnpm test:int` above like every integration file, and writes what it scanned after each
        # path, never a card value, to its report. A missing report (the file skipped, renamed or filtered out by a
        # pattern), a path left out, a place it could not read or anything it found fails the build.
        run: |
          node - ota/backend/node_modules/.cache/pan-absence/report.json <<'EOF'
          const { existsSync, readFileSync } = require("node:fs");
          const file = process.argv[2];
          const paths = ["success", "decline", "timeout", "timeout-lost", "validation-error", "idempotent-replay", "cancel"];
          const fail = (message) => {
            console.log(`::error::${message}`);
            process.exit(1);
          };
          if (!existsSync(file)) {
            fail(`The PAN-absence test did not run: ${file} is missing.`);
          }
          const report = JSON.parse(readFileSync(file, "utf8"));
          for (const scan of report.scans) {
            console.log(`${scan.path} (${scan.moment}): ${scan.findings.length} found, ${scan.errors.length} unreadable, ${JSON.stringify(scan.counts)}`);
            for (const finding of [...scan.findings, ...scan.errors]) {
              console.log(`  ${JSON.stringify(finding)}`);
            }
          }
          const scanned = new Set(report.scans.filter((scan) => scan.moment === "after").map((scan) => scan.path));
          const missing = paths.filter((path) => !scanned.has(path));
          if (missing.length > 0) {
            fail(`The PAN-absence test left out: ${missing.join(", ")}.`);
          }
          const dirty = report.scans.some((scan) => scan.findings.length > 0 || scan.errors.length > 0);
          if (dirty || report.complete !== true) {
            fail("The PAN-absence test found card data or could not read a place (the scans above).");
          }
          EOF

  # X-032: the move to managed PostgreSQL and Redis is configuration only (decisions.md §2, deployment-single-vm.md
  # §15). The integration tests run with PostgreSQL and Redis reached through other host names (/etc/hosts aliases)
  # and ports (6543, 6380), PostgreSQL over TLS only with the CA and the check of the host name in the DSNs, and
  # nothing on 5432 or 6379, so any code that assumed the local services, dropped a DSN's parameters or connected
  # without TLS fails here. The DSNs use sslmode=verify-full: node-postgres treats `prefer` as verify-full (TLS
  # required, never a plain-text fallback) and prints a security warning on stderr for it, which fails the
  # clean-stderr assertion of packages/db's codegen test. check-no-hardcoded-hosts.mjs runs first, in seconds.
  alt-hosts:
    name: Integration tests on other hosts and ports
    runs-on: ubuntu-24.04
    # The integration job's budget: the same tests on the same runner.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["6543:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_ENV: test
      DATABASE_URL: postgres://velexis_platform_app:dev_platform@pg.internal.test:6543/velexis?sslmode=verify-full&sslrootcert=/tmp/pg-tls/ca.crt
      DATABASE_MIGRATOR_URL: postgres://velexis_migrator:dev_migrator@pg.internal.test:6543/velexis?sslmode=verify-full&sslrootcert=/tmp/pg-tls/ca.crt
      DATABASE_PROVISIONER_URL: postgres://velexis_provisioner:dev_provisioner@pg.internal.test:6543/velexis?sslmode=verify-full&sslrootcert=/tmp/pg-tls/ca.crt
      TEST_DATABASE_ADMIN_URL: postgres://velexis_test_admin:dev_test_admin@pg.internal.test:6543/postgres?sslmode=verify-full&sslrootcert=/tmp/pg-tls/ca.crt
      REDIS_URL: redis://redis.internal.test:6380/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      AMADEUS_BASE_URL_TEST: http://127.0.0.1:4900
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Host names pg.internal.test and redis.internal.test, and nothing on 5432 or 6379
        run: |
          echo "127.0.0.1 pg.internal.test redis.internal.test" | sudo tee -a /etc/hosts
          getent hosts pg.internal.test redis.internal.test
          for port in 5432 6379; do
            if (exec 3<> "/dev/tcp/127.0.0.1/$port") 2> /dev/null; then
              echo "::error::Something listens on 127.0.0.1:$port: this job needs the default ports free"
              exit 1
            fi
          done

      - name: PostgreSQL over TLS only (a throwaway CA and a certificate for pg.internal.test)
        # The service container cannot take server options, so its certificate, its pg_hba.conf and ssl = on arrive
        # through docker cp, docker exec and a configuration reload. Every TCP connection without TLS is then refused.
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          install -d -m 0700 /tmp/pg-tls
          cd /tmp/pg-tls
          openssl req -x509 -new -nodes -newkey rsa:2048 -keyout ca.key -out ca.crt -days 2 \
            -subj "/CN=Velexis alt-hosts test CA" -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,keyCertSign,cRLSign"
          openssl req -new -nodes -newkey rsa:2048 -keyout server.key -out server.csr -subj "/CN=pg.internal.test"
          printf '%s\n' "subjectAltName=DNS:pg.internal.test" "basicConstraints=CA:FALSE" \
            "keyUsage=digitalSignature,keyEncipherment" "extendedKeyUsage=serverAuth" > server.ext
          openssl x509 -req -in server.csr -CA ca.crt -CAkey ca.key -CAcreateserial -out server.crt -days 2 \
            -extfile server.ext
          docker cp server.crt "$PG_CONTAINER:/var/lib/postgresql/server.crt"
          docker cp server.key "$PG_CONTAINER:/var/lib/postgresql/server.key"
          # PostgreSQL takes a key only from its own user with mode 0600; the first matching pg_hba.conf line wins.
          docker exec "$PG_CONTAINER" sh -ec '
            chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key
            chmod 0600 /var/lib/postgresql/server.key
            { echo "hostnossl all all all reject"; cat "$PGDATA/pg_hba.conf"; } > /tmp/pg_hba.conf
            cat /tmp/pg_hba.conf > "$PGDATA/pg_hba.conf"'
          psql -h pg.internal.test -p 6543 -U postgres -X -q -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "SELECT pg_reload_conf()"
          verified="host=pg.internal.test port=6543 user=postgres dbname=postgres sslmode=verify-full sslrootcert=/tmp/pg-tls/ca.crt"
          tls=""
          for _ in $(seq 1 20); do
            tls="$(psql "$verified" -X -At -c 'SELECT ssl FROM pg_stat_ssl WHERE pid = pg_backend_pid()' 2> /dev/null || true)"
            if [ "$tls" = t ]; then break; fi
            sleep 0.5
          done
          if [ "$tls" != t ]; then
            docker logs "$PG_CONTAINER" 2>&1 | tail -n 20
            echo "::error::PostgreSQL does not answer over TLS with the certificate for pg.internal.test"
            exit 1
          fi
          if psql "host=pg.internal.test port=6543 user=postgres dbname=postgres sslmode=disable" -X -At -c 'SELECT 1' > /dev/null 2>&1; then
            echo "::error::PostgreSQL accepted a connection without TLS"
            exit 1
          fi
          echo "PostgreSQL on pg.internal.test:6543 answers over TLS only, with a certificate of the CA in /tmp/pg-tls/ca.crt"

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: No host or port written in the code of the apps and packages
        run: node tools/ci/check-no-hardcoded-hosts.mjs

      # Restore only, as the integration job does: build-test saves the cache.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bootstrap database roles and schemas
        run: |
          psql -h pg.internal.test -p 6543 -U postgres -X -q -v ON_ERROR_STOP=1 -v db_name=velexis \
            -v migrator_password=dev_migrator -v provisioner_password=dev_provisioner \
            -v platform_password=dev_platform -v ota_password=dev_ota \
            -f deploy/postgres/bootstrap.sql
          psql -h pg.internal.test -p 6543 -U postgres -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE velexis_test_admin LOGIN CREATEDB PASSWORD 'dev_test_admin'" \
            -c "GRANT velexis_migrator TO velexis_test_admin"

      - name: Generate local key files
        run: pnpm dev:keys

      - name: Integration tests
        run: pnpm test:int
