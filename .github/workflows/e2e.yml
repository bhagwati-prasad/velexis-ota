# End-to-end tests with Playwright (ADR-0015, PADR-0017; tools/e2e/README.md). Task PFE-014 created it.
# When: nightly, on demand (Actions > E2E > Run workflow), and on pull requests labelled `e2e`: adding the label starts
# a run, and every push to the pull request runs again while the label is on.
# What: on a clean runner with PostgreSQL 16, Redis 7.4 and Mailpit as service containers (as ci.yml's build-test job),
# build everything, let tools/e2e/support/stack.ts start the built stack on a fresh database (with E2E_WITH_OTA=1 also
# the Amadeus stub, the OTA worker and API, the storefront previews and the demo OTA), and run the `portal`,
# `platform-admin` and `storefront` (OFE-008) Playwright projects in one run. The nightly run also runs `portal-stripe`
# when the repository has the Stripe test secrets E2E_STRIPE_SECRET_KEY and E2E_STRIPE_BILLING_WEBHOOK_SECRET
# (PADR-0017 item 4). When a step fails, the traces, screenshots, HTML report and the stack's logs
# (tools/e2e/test-results/stack/) are uploaded as the artefact e2e-<run id>-<attempt>.
# Agents never change this file to get their own change through (AGENTS.md §7). Third-party actions are pinned to full
# commit SHAs with the tag as the last thing in the comment (tools/ci/check-package-json.mjs, ADR-0023).
name: E2E

on:
  schedule:
    - cron: "23 2 * * *" # nightly at 02:23 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: End-to-end (portal, platform admin, storefront)
    # Pull requests only while they carry the label. A newer run of the same pull request (a push, another label)
    # cancels the one in progress (concurrency above).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      # The harness settings (tools/e2e/README.md); the apps get theirs from the .env.example files.
      APP_ENV: test
      TEST_DATABASE_ADMIN_URL: postgres://velexis_test_admin:dev_test_admin@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      E2E_WITH_OTA: "1"
      PGPASSWORD: postgres
      # "true" when both Stripe test secrets exist: a step's `if` cannot read the secrets context itself.
      STRIPE_CONFIGURED: ${{ secrets.E2E_STRIPE_SECRET_KEY != '' && secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Restore only: ci.yml's build-test job saves the cache, so unchanged packages replay their build.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bootstrap database roles and schemas
        run: |
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -v db_name=velexis \
            -v migrator_password=dev_migrator -v provisioner_password=dev_provisioner \
            -v platform_password=dev_platform -v ota_password=dev_ota \
            -f deploy/postgres/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE velexis_test_admin LOGIN CREATEDB PASSWORD 'dev_test_admin'" \
            -c "GRANT velexis_migrator TO velexis_test_admin"

      - name: Generate local key files
        run: pnpm dev:keys

      - name: Build
        run: pnpm build

      - name: Install Playwright's Chromium and its system libraries
        run: pnpm --filter @velexis/e2e exec playwright install --with-deps chromium

      - name: "[PFE-014 AC1] [OFE-008 AC1] Playwright projects portal, platform-admin and storefront"
        run: pnpm test:e2e -- --project=portal --project=platform-admin --project=storefront

      - name: Stripe journeys (nightly, project portal-stripe)
        if: github.event_name == 'schedule' && env.STRIPE_CONFIGURED == 'true'
        env:
          E2E_STRIPE: "1"
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_BILLING_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET }}
        # --pass-with-no-tests: the project has no journey until PFE-027 adds the first one tagged @stripe.
        run: pnpm test:e2e -- --project=portal-stripe --pass-with-no-tests

      - name: Upload traces, screenshots, the report and the stack's logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/e2e/test-results/
            tools/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
