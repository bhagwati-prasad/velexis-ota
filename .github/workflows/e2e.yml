# End-to-end tests with Playwright (ADR-0015, PADR-0017; tools/e2e/README.md). Task PFE-014 created it.
# When: nightly, on demand (Actions > E2E > Run workflow), and on pull requests labelled `e2e`: adding the label starts
# a run, and every push to the pull request runs again while the label is on.
# What: on a clean runner with PostgreSQL 16, Redis 7.4 and Mailpit as service containers (as ci.yml's build-test job),
# build everything, let tools/e2e/support/stack.ts start the built stack on a fresh database (with E2E_WITH_OTA=1 also
# the Amadeus stub, the OTA worker, API and admin, the storefront previews and the demo OTA), and run the `portal`,
# `platform-admin`, `storefront` (OFE-008) and `ota-admin` (OAD-016) Playwright projects in one run. The nightly run
# also runs `portal-stripe` when the repository has the Stripe test secrets E2E_STRIPE_SECRET_KEY and
# E2E_STRIPE_BILLING_WEBHOOK_SECRET (PADR-0017 item 4), and `storefront-stripe` (OFE-017) with the pinned Stripe CLI
# when E2E_STRIPE_PUBLISHABLE_KEY exists too. Nightly and on demand, the SDK's smoke tests (SDK-014) run last, against
# the OTA backend started as in local development. When a step fails, the traces, screenshots, HTML report and the
# stack's logs (tools/e2e/test-results/stack/, sdk-smoke/) are uploaded as the artefact e2e-<run id>-<attempt>.
# Agents never change this file to get their own change through (AGENTS.md §7). Third-party actions are pinned to full
# commit SHAs with the tag as the last thing in the comment (tools/ci/check-package-json.mjs, ADR-0023).
name: E2E

on:
  schedule:
    - cron: "23 2 * * *" # nightly at 02:23 UTC
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  e2e:
    name: End-to-end (portal, platform admin, storefront)
    # Pull requests only while they carry the label. A newer run of the same pull request (a push, another label)
    # cancels the one in progress (concurrency above).
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ["1025:1025", "8025:8025"]
    env:
      # The harness settings (tools/e2e/README.md); the apps get theirs from the .env.example files.
      APP_ENV: test
      TEST_DATABASE_ADMIN_URL: postgres://velexis_test_admin:dev_test_admin@127.0.0.1:5432/postgres
      REDIS_URL: redis://127.0.0.1:6379/0
      SMTP_URL: smtp://127.0.0.1:1025
      MAILPIT_API_URL: http://127.0.0.1:8025
      E2E_WITH_OTA: "1"
      PGPASSWORD: postgres
      # "true" when both Stripe test secrets exist: a step's `if` cannot read the secrets context itself.
      STRIPE_CONFIGURED: ${{ secrets.E2E_STRIPE_SECRET_KEY != '' && secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET != '' }}
      # "true" when the storefront's Stripe journeys can run as well (OFE-017): the publishable key of the same test account.
      STOREFRONT_STRIPE_CONFIGURED: ${{ secrets.E2E_STRIPE_SECRET_KEY != '' && secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET != '' && secrets.E2E_STRIPE_PUBLISHABLE_KEY != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Restore only: ci.yml's build-test job saves the cache, so unchanged packages replay their build.
      - name: Restore the Turborepo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Bootstrap database roles and schemas
        run: |
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -v db_name=velexis \
            -v migrator_password=dev_migrator -v provisioner_password=dev_provisioner \
            -v platform_password=dev_platform -v ota_password=dev_ota \
            -f deploy/postgres/bootstrap.sql
          psql -h 127.0.0.1 -U postgres -X -q -v ON_ERROR_STOP=1 -c "CREATE ROLE velexis_test_admin LOGIN CREATEDB PASSWORD 'dev_test_admin'" \
            -c "GRANT velexis_migrator TO velexis_test_admin"

      - name: Generate local key files
        run: pnpm dev:keys

      - name: Build
        run: pnpm build

      - name: Install Playwright's Chromium and its system libraries
        run: pnpm --filter @velexis/e2e exec playwright install --with-deps chromium

      - name: "[PFE-014 AC1] [OFE-008 AC1] [OAD-016 AC1] Playwright projects portal, platform-admin, storefront and ota-admin"
        run: pnpm test:e2e -- --project=portal --project=platform-admin --project=storefront --project=ota-admin

      - name: Stripe journeys (nightly, project portal-stripe)
        if: github.event_name == 'schedule' && env.STRIPE_CONFIGURED == 'true'
        env:
          E2E_STRIPE: "1"
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_BILLING_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET }}
        # --pass-with-no-tests: the project has no journey until PFE-027 adds the first one tagged @stripe.
        run: pnpm test:e2e -- --project=portal-stripe --pass-with-no-tests

      - name: "[OFE-017 AC1] [OFE-017 AC2] [OAD-017] Stripe storefront and OTA admin payment journeys (nightly, project storefront-stripe)"
        if: github.event_name == 'schedule' && env.STOREFRONT_STRIPE_CONFIGURED == 'true'
        env:
          E2E_STRIPE: "1"
          STRIPE_SECRET_KEY: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_BILLING_WEBHOOK_SECRET: ${{ secrets.E2E_STRIPE_BILLING_WEBHOOK_SECRET }}
          # The same test account's keys for the OTA API and worker and the Stripe CLI forwarder (tools/e2e/support/stripe.ts).
          STRIPE_SECRET_KEY_TEST: ${{ secrets.E2E_STRIPE_SECRET_KEY }}
          STRIPE_PUBLISHABLE_KEY_TEST: ${{ secrets.E2E_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_CLI_VERSION: "1.53.1"
          STRIPE_CLI_SHA256: "032fe0b849a9d6a222488bc846445bafeae993af1026b78a8121d02321ca1fd1"
        run: |
          curl -fsSL -o "$RUNNER_TEMP/stripe.tgz" "https://github.com/stripe/stripe-cli/releases/download/v${STRIPE_CLI_VERSION}/stripe_${STRIPE_CLI_VERSION}_linux_x86_64.tar.gz"
          echo "${STRIPE_CLI_SHA256}  $RUNNER_TEMP/stripe.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/stripe-cli"
          tar -xzf "$RUNNER_TEMP/stripe.tgz" -C "$RUNNER_TEMP/stripe-cli" stripe
          E2E_STRIPE_CLI="$RUNNER_TEMP/stripe-cli/stripe" pnpm test:e2e -- --project=storefront-stripe

      # The SDK's smoke tests (ota/sdk/README.md §8.1) once the Playwright stacks above have stopped: the OTA backend
      # as ota/backend/README.md §6 starts it (the development values of the .env.example files, the job's database
      # `velexis`, the Amadeus stub, both dev:seed commands, the API). The three test keys the OTA's dev:seed prints,
      # each on the line of its label (FIX-W37-OTA), go to the tests in their environment, never to the log; the
      # processes' output goes to tools/e2e/test-results/sdk-smoke/.
      - name: "[SDK-014 AC1] SDK smoke tests in token and server mode (nightly and on demand)"
        if: github.event_name != 'pull_request'
        env:
          LOG_LEVEL: info
        run: |
          for dir in . platform/backend ota/backend; do cp "$dir/.env.example" "$dir/.env.local"; done
          logs=tools/e2e/test-results/sdk-smoke
          mkdir -p "$logs"
          trap 'jobs -p | xargs -r kill' EXIT
          pnpm db:migrate > "$logs/db-migrate.log"
          pnpm db:seed:reference > "$logs/db-seed-reference.log"
          node tools/amadeus-stub/dist/cli.js > "$logs/amadeus-stub.log" 2>&1 &
          timeout 60 sh -c 'until curl -s -o /dev/null http://127.0.0.1:4900/; do sleep 1; done'
          node platform/backend/dist/cli.js dev:seed > /dev/null
          seed="$(node ota/backend/dist/cli.js dev:seed)"
          node ota/backend/dist/main.js > "$logs/ota-api.log" 2>&1 &
          timeout 60 sh -c 'until curl -fs -o /dev/null http://127.0.0.1:4000/health/ready; do sleep 1; done'
          SDK_SMOKE_PUBLISHABLE_KEY="$(printf '%s\n' "$seed" | grep -E '^  Publishable test key ' | grep -Eo 'pk_test_[A-Za-z0-9]{40}')" \
            SDK_SMOKE_SECRET_KEY="$(printf '%s\n' "$seed" | grep -E '^  Secret test key ' | grep -Eo 'sk_test_[A-Za-z0-9]{40}')" \
            SDK_SMOKE_CONSOLE_KEY="$(printf '%s\n' "$seed" | grep -E '^  Console automation test key ' | grep -Eo 'sk_test_[A-Za-z0-9]{40}')" \
            pnpm --filter @velexis/ota-sdk test:smoke

      - name: Upload traces, screenshots, the report and the stack's logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tools/e2e/test-results/
            tools/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 14
