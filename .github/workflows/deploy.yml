# Manual deploy to the single VM (ADR-0007, ADR-0023, deployment-single-vm.md §8). Only the developer runs it.
# Two jobs, so that no build or dependency code ever runs next to the root-equivalent deploy key:
#   build  (no secrets, no environment): refuse any ref but main and v* tags, install, lint, typecheck, unit tests,
#          build, pack-release.sh, then upload release-<sha>.tar as an artefact and publish its SHA-256 as a job output;
#   deploy (environment "production": the developer's approval, the SSH secrets, branch policy main + v* tags):
#          download the tarball, re-check its SHA-256 and SHA256SUMS, rsync it to /srv/velexis/incoming/<sha>/ as the
#          deploy user, then `sudo /usr/local/sbin/velexis-deploy <sha>` (migrations, switch, restarts, rollback) and
#          `--status` as the smoke check. It checks out no code and installs nothing.
# Run it from `main` or from a release tag (Actions > Deploy > "Use workflow from"); other refs fail in the build
# job's first step and never reach the deploy job. Tests always run. Third-party actions are pinned to full commit
# SHAs. Re-running it for a sha that is already on the VM re-installs that release's units and Caddyfile from its
# snapshot; for the active release no file of the release, its snapshot, the units, Caddyfile or scripts changes.
# Agents never run or change this workflow.
name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  CI: "true"
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build and pack (no secrets)
    runs-on: ubuntu-24.04 # same OS and glibc as the VM, so native modules (argon2) match
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.rel.outputs.sha }}
      tarball_sha256: ${{ steps.pack.outputs.tarball_sha256 }}
    steps:
      - name: Refuse refs other than main and v* tags
        env:
          REF: ${{ github.ref }}
        run: |
          case "$REF" in
            refs/heads/main | refs/tags/v*) echo "Deploying $REF" ;;
            *) echo "::error::Deploy runs only from main or a v* tag, not from $REF"; exit 1 ;;
          esac

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve the release id
        id: rel
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          # No dependency cache here: a release is built only from the registry and the lockfile.

      - name: Install (dependency install scripts only for the package.json "pnpm.onlyBuiltDependencies" allow-list)
        run: pnpm install --frozen-lockfile

      - name: Lint and typecheck
        run: pnpm lint && pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Pack the release
        id: pack
        env:
          RELEASE_SHA: ${{ steps.rel.outputs.sha }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          bash deploy/scripts/pack-release.sh release
          (cd "release/${RELEASE_SHA}" && sha256sum --quiet --strict -c SHA256SUMS)
          # tar keeps symlinks and modes, which an artefact upload would not.
          tar -C release -cf "release-${RELEASE_SHA}.tar" "${RELEASE_SHA}"
          echo "tarball_sha256=$(sha256sum "release-${RELEASE_SHA}.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ steps.rel.outputs.sha }}
          path: release-${{ steps.rel.outputs.sha }}.tar
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Upload and activate
    needs: build
    # The build job already refuses other refs; the environment's branch policy refuses them a third time.
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://platform.example.com
    env:
      SHA: ${{ needs.build.outputs.sha }}
    steps:
      - name: Check the release id
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::the build job published no release sha"; exit 1; }

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ needs.build.outputs.sha }}

      - name: Verify the artefact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.tarball_sha256 }}
        run: |
          echo "${EXPECTED_SHA256}  release-${SHA}.tar" | sha256sum --strict -c -
          mkdir -p release
          tar -C release -xf "release-${SHA}.tar"
          (cd "release/${SHA}" && sha256sum --quiet --strict -c SHA256SUMS)

      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            [ -n "${!name}" ] || { echo "::error::the production environment has no secret $name"; exit 1; }
          done
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 0600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
          # One host alias for rsync and ssh: only this key, only the pinned host key, never a prompt.
          {
            echo "Host velexis-vm"
            echo "  HostName ${DEPLOY_HOST}"
            echo "  User ${DEPLOY_USER}"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config
          chmod 0600 ~/.ssh/config

      - name: Upload to /srv/velexis/incoming/${{ needs.build.outputs.sha }}
        run: |
          # Folders u=rwx,g=rx; files lose group write and every right of others (they keep their own x bit).
          rsync -a --delete --links --chmod=D0750,Fu+rw,Fg-w,Fo-rwx \
            "release/${SHA}/" "velexis-vm:/srv/velexis/incoming/${SHA}/"

      - name: Activate on the VM
        run: |
          # shellcheck disable=SC2029 # expanded here on purpose: SHA is 40 hex characters (checked above)
          ssh velexis-vm "sudo /usr/local/sbin/velexis-deploy ${SHA}"

      - name: Smoke check
        run: |
          ssh velexis-vm "sudo /usr/local/sbin/velexis-deploy --status" | tee status.txt
          grep -Eq "^current: .*/releases/${SHA}$" status.txt \
            || { echo "::error::velexis-deploy --status does not show releases/${SHA} as current"; exit 1; }

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/config
