    <script>
      /* Runs before the first paint: applies the saved theme and starts loading the content bundle.
         The bundle is dist/content.js; a test may pick another one with ?bundle=<relative path>.js or by setting
         window.VG_BUNDLE (or window.VG_CONTENT) in an init script. Only relative paths are accepted. */
      (function () {
        var root = document.documentElement;
        var pref = "system";
        try {
          pref = JSON.parse(localStorage.getItem("vg.theme") || '"system"') || "system";
        } catch (e) {
          pref = "system";
        }
        var dark =
          pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        root.setAttribute("data-theme", dark ? "dark" : "light");
        root.setAttribute("data-theme-pref", pref);

        var src = "dist/content.js";
        try {
          var q = new URLSearchParams(location.search).get("bundle");
          if (typeof window.VG_BUNDLE === "string") src = window.VG_BUNDLE;
          else if (q && /^(?![\\/])(?!.*:)[\w.\/-]+\.js$/.test(q)) src = q;
        } catch (e) {
          src = "dist/content.js";
        }
        window.VG_BUNDLE_SRC = src;
        window.VG_CONTENT_READY = new Promise(function (resolve) {
          if (window.VG_CONTENT) return resolve(true);
          var s = document.createElement("script");
          s.src = src;
          s.onload = function () {
            resolve(!!window.VG_CONTENT);
          };
          s.onerror = function () {
            resolve(false);
          };
          document.head.appendChild(s);
        });
      })();
    </script>
