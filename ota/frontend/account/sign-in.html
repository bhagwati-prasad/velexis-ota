<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in</title>
    <meta name="description" content="Sign in to see your bookings and manage your account." />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/account-sign-in.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-body text-ink antialiased">
    <!-- @include partials/noscript.html -->
    <!-- @include partials/test-banner.html -->
    <!-- @include partials/header.html -->
    <main
      id="main"
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 focus:outline-none"
      data-sign-in-page
    >
      <div class="max-w-md">
        <h1 class="font-heading text-3xl font-semibold">Sign in</h1>
        <p class="mt-3 text-muted">See your bookings and book faster with your account.</p>

        <div data-auth-state></div>

        <div data-auth-content>
          <form method="post" class="mt-6 space-y-4" data-auth-form>
            <div data-error-summary hidden class="mb-6 rounded-ui border-2 border-error bg-panel p-4"></div>
            <label class="block">
              <span class="block text-sm font-medium">E-mail address</span>
              <input
                type="email"
                name="email"
                required
                maxlength="254"
                autocomplete="email"
                autocapitalize="none"
                spellcheck="false"
                class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
              />
            </label>
            <label class="block">
              <span class="block text-sm font-medium">Password</span>
              <input
                type="password"
                name="password"
                required
                maxlength="128"
                autocomplete="current-password"
                class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
              />
            </label>
            <label class="flex items-start gap-3">
              <input type="checkbox" name="rememberMe" checked class="mt-1 size-4 accent-primary" />
              <span>
                Keep me signed in on this device
                <span class="block text-sm text-muted"
                  >For <span data-remember-days>30</span> days. Leave it unticked on a shared computer.</span
                >
              </span>
            </label>
            <p>
              <button
                type="submit"
                data-busy-label="Signing in…"
                class="min-h-6 rounded-ui bg-primary px-5 py-2 font-medium text-on-primary hover:opacity-90"
              >
                Sign in
              </button>
            </p>
          </form>
          <p class="mt-6">
            <a
              href="/account/forgot-password.html"
              data-keep-next
              class="min-h-6 font-medium text-primary underline underline-offset-4"
              >Forgot your password?</a
            >
          </p>
          <p class="mt-3 text-muted">
            New here?
            <a
              href="/account/sign-up.html"
              data-keep-next
              class="min-h-6 font-medium text-primary underline underline-offset-4"
              >Create an account</a
            >
          </p>
        </div>
      </div>
    </main>
    <!-- @include partials/footer.html -->
    <!-- @include partials/states.html -->
  </body>
</html>
