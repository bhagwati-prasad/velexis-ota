<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="referrer" content="strict-origin" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Choose a new password</title>
    <meta name="description" content="Choose a new password for your account." />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/account-reset-password.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-body text-ink antialiased">
    <!-- @include partials/noscript.html -->
    <!-- @include partials/test-banner.html -->
    <!-- @include partials/header.html -->
    <main
      id="main"
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 focus:outline-none"
      data-reset-password-page
    >
      <div class="max-w-md">
        <h1 class="font-heading text-3xl font-semibold">Choose a new password</h1>

        <div data-auth-state></div>

        <div data-auth-content>
          <p class="mt-3 text-muted">
            Your new password replaces the old one, and you are signed out on your other devices.
          </p>
          <form method="post" class="mt-6 space-y-4" data-auth-form>
            <div data-error-summary hidden class="mb-6 rounded-ui border-2 border-error bg-panel p-4"></div>
            <label class="block">
              <span class="block text-sm font-medium">New password</span>
              <input
                type="password"
                name="newPassword"
                required
                minlength="10"
                maxlength="128"
                autocomplete="new-password"
                aria-describedby="reset-password-rules"
                class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
              />
            </label>
            <p id="reset-password-rules" class="text-sm text-muted" data-password-rules>
              Use at least 10 characters. Common passwords and passwords found in data breaches are refused.
            </p>
            <p>
              <button
                type="submit"
                data-busy-label="Saving your password…"
                class="min-h-6 rounded-ui bg-primary px-5 py-2 font-medium text-on-primary hover:opacity-90"
              >
                Save the new password
              </button>
            </p>
          </form>
        </div>

        <section aria-labelledby="reset-done-title" class="mt-6" data-reset-done hidden>
          <h2
            id="reset-done-title"
            tabindex="-1"
            class="font-heading text-xl font-semibold focus:outline-none"
          >
            Your new password is saved
          </h2>
          <p class="mt-2">Sign in with your new password.</p>
          <p class="mt-4">
            <a
              href="/account/sign-in.html"
              data-keep-next
              class="min-h-6 font-medium text-primary underline underline-offset-4"
              >Sign in</a
            >
          </p>
        </section>
      </div>
    </main>
    <!-- @include partials/footer.html -->
    <!-- @include partials/states.html -->
  </body>
</html>
