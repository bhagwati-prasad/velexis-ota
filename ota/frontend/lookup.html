<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Find your booking</title>
    <meta
      name="description"
      content="Find your booking with its reference and the last name of a traveller."
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/lookup.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-body text-ink antialiased">
    <!-- @include partials/noscript.html -->
    <!-- @include partials/test-banner.html -->
    <!-- @include partials/header.html -->
    <main
      id="main"
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-10 focus:outline-none"
      data-lookup-page
    >
      <div class="max-w-md">
        <h1 class="font-heading text-3xl font-semibold">Find your booking</h1>
        <p class="mt-3 text-muted">
          Enter your booking reference and the last name of one of the travellers. The reference is in your
          confirmation e-mail.
        </p>

        <div data-lookup-state></div>

        <form method="post" class="mt-6 space-y-4" data-lookup-form>
          <div data-error-summary hidden class="mb-6 rounded-ui border-2 border-error bg-panel p-4"></div>
          <label class="block">
            <span class="block text-sm font-medium">Booking reference</span>
            <span class="block text-sm text-muted" id="lookup-reference-hint"
              >5 to 10 letters and digits, for example VX9M4T. The airline's booking code works too.</span
            >
            <input
              type="text"
              name="bookingReference"
              required
              maxlength="20"
              autocomplete="off"
              autocapitalize="characters"
              spellcheck="false"
              aria-describedby="lookup-reference-hint"
              class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 font-mono uppercase aria-invalid:border-error"
            />
          </label>
          <label class="block">
            <span class="block text-sm font-medium">Last name</span>
            <span class="block text-sm text-muted" id="lookup-last-name-hint"
              >Of any traveller on the booking, as it is on the ticket.</span
            >
            <input
              type="text"
              name="lastName"
              required
              maxlength="60"
              autocomplete="family-name"
              spellcheck="false"
              aria-describedby="lookup-last-name-hint"
              class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
            />
          </label>
          <p>
            <button
              type="submit"
              data-busy-label="Finding your booking…"
              class="min-h-6 rounded-ui bg-primary px-5 py-2 font-medium text-on-primary hover:opacity-90 disabled:cursor-not-allowed disabled:opacity-60"
            >
              Find my booking
            </button>
          </p>
        </form>

        <p class="mt-6 text-muted" data-lookup-sign-in hidden>
          Have an account?
          <a
            href="/account/sign-in.html?next=%2Fbookings.html"
            class="min-h-6 font-medium text-primary underline underline-offset-4"
            >Sign in to see all your bookings</a
          >
        </p>
        <p class="mt-6 text-muted" data-lookup-my-bookings hidden>
          The bookings of your account are in
          <a href="/bookings.html" class="min-h-6 font-medium text-primary underline underline-offset-4"
            >My bookings</a
          >.
        </p>
      </div>
    </main>
    <!-- @include partials/footer.html -->
    <!-- @include partials/states.html -->
  </body>
</html>
