<template id="tpl-traveller">
  <fieldset
    class="rounded-ui border border-muted/30 bg-surface p-4 sm:p-5"
    data-traveller
    data-field-data-traveler-id="travelerId"
  >
    <legend class="px-1 font-heading text-lg font-semibold" data-field="title"></legend>
    <p class="text-sm text-muted" data-field="hint" data-field-hidden="noHint"></p>

    <div class="mt-3 grid gap-4 sm:grid-cols-2">
      <label class="block">
        <span class="block text-sm font-medium">First and middle names</span>
        <input
          type="text"
          required
          maxlength="56"
          spellcheck="false"
          data-input="name.firstName"
          data-autocomplete="given-name"
          data-error-suffix="/name"
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        />
      </label>
      <label class="block">
        <span class="block text-sm font-medium">Last name</span>
        <input
          type="text"
          required
          maxlength="56"
          spellcheck="false"
          data-input="name.lastName"
          data-autocomplete="family-name"
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        />
      </label>
    </div>

    <div class="mt-4 grid gap-4 sm:grid-cols-2" data-section="dateOfBirth">
      <label class="block">
        <span class="block text-sm font-medium">Date of birth</span>
        <input
          type="date"
          required
          data-input="dateOfBirth"
          data-autocomplete="bday"
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        />
      </label>
    </div>

    <div class="mt-4 grid gap-4 sm:grid-cols-2" data-section="gender">
      <label class="block">
        <span class="block text-sm font-medium">Gender, as in the travel document</span>
        <select
          required
          data-input="gender"
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        >
          <option value="">Choose</option>
          <option value="FEMALE">Female</option>
          <option value="MALE">Male</option>
          <option value="UNSPECIFIED">Unspecified (X)</option>
        </select>
      </label>
    </div>

    <fieldset class="mt-4" data-section="documents">
      <legend class="text-base font-semibold">Passport or ID card</legend>
      <div class="mt-2 grid gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="block text-sm font-medium">Document</span>
          <select
            required
            data-input="documents.0.documentType"
            data-document-types
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          ></select>
        </label>
        <label class="block">
          <span class="block text-sm font-medium">Document number</span>
          <input
            type="text"
            required
            maxlength="25"
            pattern="[A-Za-z0-9\-]{1,25}"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            data-input="documents.0.number"
            data-error-suffix="/documents"
            data-document-number
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
        <p class="text-sm text-muted sm:col-span-2" data-document-stored hidden></p>
        <label class="block">
          <span class="block text-sm font-medium">Expiry date</span>
          <input
            type="date"
            required
            data-input="documents.0.expiryDate"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
        <label class="block">
          <span class="block text-sm font-medium">Issuing country</span>
          <select
            required
            data-input="documents.0.issuanceCountry"
            data-countries
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          ></select>
        </label>
        <label class="block">
          <span class="block text-sm font-medium">Nationality</span>
          <select
            required
            data-input="documents.0.nationality"
            data-countries
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          ></select>
        </label>
        <label class="block" data-section="documentIssuanceCity">
          <span class="block text-sm font-medium">Place of issue</span>
          <input
            type="text"
            required
            maxlength="60"
            data-input="documents.0.issuanceLocation"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
      </div>
    </fieldset>

    <div class="mt-4 grid gap-4 sm:grid-cols-2" data-section="residence">
      <label class="block">
        <span class="block text-sm font-medium">Country of residence</span>
        <select
          required
          data-input="contact.address.countryCode"
          data-error-suffix="/contact/address /contact"
          data-countries
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        ></select>
      </label>
    </div>

    <div class="mt-4 grid gap-4 sm:grid-cols-2" data-section="redress">
      <label class="block">
        <span class="block text-sm font-medium">Redress number, if you have one</span>
        <input
          type="text"
          maxlength="25"
          pattern="[A-Za-z0-9\-]{1,25}"
          autocomplete="off"
          spellcheck="false"
          data-input="redress"
          data-error-suffix="/redress"
          class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
        />
      </label>
    </div>

    <fieldset class="mt-4" data-section="airFranceDiscount">
      <legend class="text-base font-semibold">Air France discount card</legend>
      <div class="mt-2 grid gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="block text-sm font-medium">Card</span>
          <select
            required
            data-input="airFrance.subType"
            data-error-suffix="/discountEligibility"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          >
            <option value="">Choose</option>
            <option value="AIR_FRANCE_DOMESTIC">Domestic flights in France</option>
            <option value="AIR_FRANCE_METROPOLITAN">Mainland France</option>
            <option value="AIR_FRANCE_COMBINED">Combined</option>
          </select>
        </label>
        <label class="block">
          <span class="block text-sm font-medium">Card number</span>
          <input
            type="text"
            required
            maxlength="14"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            data-input="airFrance.cardNumber"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
      </div>
    </fieldset>

    <fieldset class="mt-4" data-section="spanishResidentDiscount">
      <legend class="text-base font-semibold">Spanish resident discount</legend>
      <div class="mt-2 grid gap-4 sm:grid-cols-2">
        <label class="block">
          <span class="block text-sm font-medium">Town or city of residence</span>
          <input
            type="text"
            required
            maxlength="35"
            data-input="spanishResident.cityName"
            data-error-suffix="/discountEligibility"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
        <label class="block">
          <span class="block text-sm font-medium">Resident card or certificate number</span>
          <input
            type="text"
            required
            maxlength="14"
            autocomplete="off"
            autocapitalize="characters"
            spellcheck="false"
            data-input="spanishResident.cardNumber"
            class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-3 py-2 aria-invalid:border-error"
          />
        </label>
      </div>
    </fieldset>
  </fieldset>
</template>
