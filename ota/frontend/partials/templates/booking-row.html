<template id="tpl-booking-row">
  <li data-booking-row data-field-data-booking-id="id">
    <a
      class="block rounded-ui border border-muted/30 bg-surface p-4 hover:border-primary focus:outline-2 focus:outline-primary sm:p-5"
      data-field-href="href"
    >
      <span class="flex flex-wrap items-baseline justify-between gap-x-4 gap-y-1">
        <span class="font-heading text-lg font-semibold" data-field="route"></span>
        <span
          class="inline-flex items-center rounded-full border border-muted/40 px-2.5 py-0.5 text-xs font-semibold text-muted data-[status=cancellation\_requested]:border-warning data-[status=cancellation\_requested]:text-warning data-[status=confirmed]:border-success data-[status=confirmed]:text-success data-[status=failed]:border-error data-[status=failed]:text-error data-[status=partially\_ticketed]:border-warning data-[status=partially\_ticketed]:text-warning data-[status=pending]:border-warning data-[status=pending]:text-warning data-[status=ticketed]:border-success data-[status=ticketed]:text-success"
          data-booking-status
          data-field="status"
          data-field-data-status="statusCode"
        ></span>
      </span>
      <span class="mt-1 block" data-field="dates"></span>
      <span class="mt-1 block text-sm text-muted" data-field="travellers"></span>
      <span class="mt-1 block text-sm text-muted"
        >Booking reference <span class="font-mono font-semibold text-ink" data-field="reference"></span
      ></span>
      <span
        class="mt-1 block text-sm font-medium text-warning"
        data-field="notice"
        data-field-hidden="noNotice"
      ></span>
      <span class="mt-2 block font-semibold tabular-nums" data-field="total"></span>
    </a>
  </li>
</template>
