<template id="tpl-document-row">
  <li class="flex flex-wrap items-center justify-between gap-x-4 gap-y-2 py-3" data-document-row>
    <span class="min-w-0">
      <span class="block font-medium" data-field="kind"></span>
      <span class="block text-sm break-all text-muted" data-field="detail"></span>
    </span>
    <span class="flex flex-col items-end gap-1">
      <button
        type="button"
        class="min-h-6 rounded-ui border border-primary px-4 py-1.5 font-medium text-primary hover:bg-panel aria-disabled:opacity-60"
        data-action="download"
        data-field-aria-label="downloadLabel"
        data-field-data-document-id="id"
        data-field-hidden="notReady"
      >
        Download
      </button>
      <span class="text-sm text-muted" data-field="status" data-field-hidden="ready"></span>
    </span>
    <span class="w-full text-sm font-medium text-error" data-document-message hidden></span>
  </li>
</template>
