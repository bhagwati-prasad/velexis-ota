<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Flight results</title>
    <meta name="description" content="Compare flights, filter and sort the results, and choose a fare." />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/pages/search.js"></script>
  </head>
  <body class="flex min-h-screen flex-col bg-surface font-body text-ink antialiased">
    <!-- @include partials/noscript.html -->
    <!-- @include partials/test-banner.html -->
    <!-- @include partials/header.html -->
    <main
      id="main"
      tabindex="-1"
      class="mx-auto w-full max-w-6xl flex-1 px-4 py-8 focus:outline-none"
      data-results-page
    >
      <h1 class="font-heading text-2xl font-semibold sm:text-3xl" data-results-title>Flight results</h1>
      <p class="mt-2 text-muted" data-search-summary></p>

      <details class="mt-4" data-search-panel>
        <summary class="min-h-6 cursor-pointer font-medium text-primary">Change search</summary>
        <!-- @include partials/search-form.html -->
      </details>

      <div data-results-state></div>

      <div class="mt-6 grid items-start gap-6 lg:grid-cols-[17rem_1fr]" data-results-layout hidden>
        <form
          class="rounded-ui border border-muted/30 bg-panel p-4"
          aria-labelledby="filters-title"
          data-filters
          hidden
        >
          <div class="flex items-center justify-between gap-2">
            <h2
              id="filters-title"
              tabindex="-1"
              class="font-heading text-lg font-semibold"
              data-filters-title
            >
              Filters
            </h2>
            <button
              type="button"
              hidden
              data-action="clear-filters"
              class="min-h-6 text-sm font-medium text-primary underline"
            >
              Clear filters
            </button>
          </div>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="stops" hidden>
            <legend class="font-semibold">Stops</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="carriers" hidden>
            <legend class="font-semibold">Airlines</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="price" hidden>
            <legend class="font-semibold">Price</legend>
            <p class="text-sm text-muted">Total for all travellers.</p>
            <label for="filter-price-range" class="mt-2 block text-sm font-medium">Maximum price</label>
            <input
              id="filter-price-range"
              type="range"
              class="mt-1 block w-full accent-primary"
              aria-describedby="filter-price-output"
              data-price-range
            />
            <output
              id="filter-price-output"
              for="filter-price-range"
              class="text-sm"
              data-price-output
            ></output>
            <div class="mt-2 grid grid-cols-2 gap-2">
              <div>
                <label for="filter-min-price" class="block text-sm font-medium">From</label>
                <input
                  id="filter-min-price"
                  name="minPrice"
                  type="number"
                  min="0"
                  step="any"
                  inputmode="decimal"
                  class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-2 py-1 aria-invalid:border-error"
                />
              </div>
              <div>
                <label for="filter-max-price" class="block text-sm font-medium">To</label>
                <input
                  id="filter-max-price"
                  name="maxPrice"
                  type="number"
                  min="0"
                  step="any"
                  inputmode="decimal"
                  class="mt-1 block w-full rounded-ui border border-muted/60 bg-surface px-2 py-1 aria-invalid:border-error"
                />
              </div>
            </div>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="departureWindow" hidden>
            <legend class="font-semibold">Departure time</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="arrivalWindow" hidden>
            <legend class="font-semibold">Arrival time</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="maxDurationMinutes" hidden>
            <legend class="font-semibold">Journey time</legend>
            <label for="filter-duration" class="mt-2 block text-sm font-medium">Longest flight time</label>
            <input
              id="filter-duration"
              type="range"
              class="mt-1 block w-full accent-primary"
              aria-describedby="filter-duration-output"
              data-duration-range
            />
            <output
              id="filter-duration-output"
              for="filter-duration"
              class="text-sm"
              data-duration-output
            ></output>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="cabins" hidden>
            <legend class="font-semibold">Cabin</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset
            class="mt-4 border-t border-muted/30 pt-3"
            data-filter-group="minIncludedCheckedBags"
            hidden
          >
            <legend class="font-semibold">Checked bags</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="conditions" hidden>
            <legend class="font-semibold">Fare conditions</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>

          <fieldset class="mt-4 border-t border-muted/30 pt-3" data-filter-group="brandedFares" hidden>
            <legend class="font-semibold">Fare types</legend>
            <ul class="mt-2 space-y-1" data-filter-options></ul>
          </fieldset>
        </form>

        <section aria-labelledby="results-count" class="min-w-0 lg:col-start-2">
          <div class="flex flex-wrap items-end justify-between gap-3">
            <h2
              id="results-count"
              tabindex="-1"
              class="font-heading text-xl font-semibold"
              data-results-count
            >
              Flights
            </h2>
            <div>
              <label for="results-sort" class="block text-sm font-medium">Sort by</label>
              <select
                id="results-sort"
                class="mt-1 block rounded-ui border border-muted/60 bg-surface px-3 py-2"
                data-sort
              >
                <option value="best">Best</option>
                <option value="price">Cheapest first</option>
                <option value="duration">Shortest first</option>
                <option value="departure">Earliest departure</option>
                <option value="arrival">Earliest arrival</option>
              </select>
            </div>
          </div>
          <div data-results-message></div>
          <ol class="mt-4 space-y-4 aria-busy:opacity-60" aria-busy="false" data-offers></ol>
          <div class="mt-6 flex flex-col items-center gap-2" data-load-more hidden>
            <p class="text-sm text-muted" data-load-more-status></p>
            <button
              type="button"
              data-action="load-more"
              class="min-h-6 rounded-ui border border-primary px-5 py-2 font-medium text-primary hover:bg-panel aria-disabled:opacity-60"
            >
              Show more flights
            </button>
          </div>
        </section>
      </div>
    </main>
    <!-- @include partials/footer.html -->

    <!-- @include partials/templates/offer-card.html -->
    <!-- @include partials/templates/segment.html -->
    <template id="tpl-filter-option">
      <li>
        <label class="flex min-h-6 cursor-pointer items-start gap-2 py-0.5">
          <input class="mt-1 size-4 shrink-0 accent-primary" />
          <span class="flex-1">
            <span data-field="label"></span>
            <span class="text-sm text-muted" data-field="count"></span>
            <span
              class="block text-sm text-muted"
              data-field="minPrice"
              data-field-hidden="noMinPrice"
            ></span>
          </span>
        </label>
      </li>
    </template>
    <template id="tpl-no-offers">
      <section class="my-6 rounded-ui border border-muted/30 bg-panel p-4" data-state="no-offers">
        <h2 class="font-heading text-xl font-semibold" tabindex="-1" data-field="title">No flights found</h2>
        <p class="mt-2 text-muted" data-field="hint"></p>
        <ul class="mt-3 space-y-1" data-suggestions></ul>
      </section>
    </template>
    <template id="tpl-no-match">
      <div class="my-4 rounded-ui border border-muted/30 bg-panel p-4" data-state="no-match">
        <p class="font-heading text-lg font-semibold" tabindex="-1" data-field="title">
          No flights match these filters
        </p>
        <p class="mt-1 text-muted" data-field="hint"></p>
        <p class="mt-3">
          <button
            type="button"
            data-action="clear-filters"
            class="min-h-6 rounded-ui bg-primary px-4 py-2 font-medium text-on-primary hover:opacity-90"
            data-field="clear"
          >
            Clear filters
          </button>
        </p>
      </div>
    </template>
    <template id="tpl-suggestion">
      <li>
        <a
          class="font-medium text-primary underline underline-offset-4"
          data-field="label"
          data-field-href="href"
        ></a>
      </li>
    </template>
    <!-- @include partials/states.html -->
  </body>
</html>
