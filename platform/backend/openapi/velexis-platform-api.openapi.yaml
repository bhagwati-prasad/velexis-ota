      schema:
        type: string
        pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
      example: job_01JB3K9R4T8W2Y6A0C4E8G2J6M
    QueueName:
      name: queue
      in: path
      required: true
      description: >-
        A queue of `PLATFORM_QUEUES` or `OTA_QUEUES` (`@velexis/api-types/jobs`). Another name of the form
        `<owner>-<topic>` answers `404 NOT_FOUND`; a value of any other form fails validation (`400
        VALIDATION_FAILED`).
      schema:
        $ref: '#/components/schemas/QueueName'
      example: platform-emails
    QueueJobId:
      name: jobId
      in: path
      required: true
      description: >-
        The BullMQ job id (`id` of `adminListFailedQueueJobs`): a number BullMQ assigned, or a custom id such as
        `<jobId>-<attempt>` of a tenant job or a Stripe event id.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: ^[A-Za-z0-9_.:-]+$
      example: '1843'
    AdminPlanCode:
      name: planCode
      in: path
      required: true
      description: The plan (`code` of `adminListPlans`); an unknown code answers `404 NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/PlanCode'
      example: growth
    SubscriptionId:
      name: subscriptionId
      in: path
      required: true
      description: The subscription (`id` of `adminListSubscriptions`); an unknown id answers `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
      example: sub_01JA2Z7R5N0S3V7X1Z4B9D2F6H
    AmadeusAccountId:
      name: accountId
      in: path
      required: true
      description: >-
        The Velexis Amadeus account (`id` of `adminListAmadeusAccounts`); an unknown id answers `404 NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/AmadeusAccountId'
      example: ama_01JA2Y8K3M7P1R5T9W3Z7C1F5H
    AmadeusOfficeRowId:
      name: officeRowId
      in: path
      required: true
      description: >-
        The pool entry (`id` of `adminListAmadeusOffices`, `amo_…`), not the 9-character Amadeus office id; an unknown
        id answers `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^amo_[0-9A-HJKMNP-TV-Z]{26}$
      example: amo_01JC8R6T0W4Y8A2C6E0G4J8M2P
    AdminAccountId:
      name: accountId
      in: path
      required: true
      description: The account (`id` of `adminListAccounts`); an unknown id answers `404 NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/AccountId'
      example: acc_01JA2Z9W5K7Q3M8N4P6R2T0V1X
    AuditTenantId:
      name: tenantId
