  /v1/payment-connections/stripe-connect/callback:
    post:
      operationId: completeStripeConnect
      summary: Finish connecting the OTA's own Stripe account
      description: >-
        The portal's callback page (`/connect/stripe/callback`, signed-in user) posts what Stripe sent back (M5,
        PADR-0011), while `FEATURE_OWN_STRIPE` is on (`403 FEATURE_DISABLED`, as for `startStripeConnect`; the state is
        not taken then); the OTA is the one of the state, so the path names none. The API takes the state with
        `GETDEL`, so it works once: an unknown, expired or used state, or one that another account started, answers
        `400 CONNECT_STATE_INVALID`. The account that started must still be an owner or admin of the OTA (`403
        FORBIDDEN`), and the OTA must be `active` (`409 TENANT_NOT_ACTIVE`). A callback never re-enables a payment
        connection a platform admin disabled (`adminSetConnectionStatus`): while one of the OTA's payment connections
        is `disabled` without a Stripe disconnection (`disconnectedAt` empty), it answers `409 CONFLICT` with
        `details.reason = connection_disabled` before Stripe is asked anything (whether a code or an error came back),
        and writes nothing; a connection an admin disables while the code is being exchanged gets the same answer and
        nothing is written either. A connection disabled because the OTA disconnected Velexis in Stripe can be
        connected again.


        - `{state, error}`: Stripe reported an error and nothing changes: `422 UNPROCESSABLE` with `details.reason =
        access_denied` when the person declined, `oauth_error` for any other error.

        - `{state, code}`: the code is exchanged with `stripe.oauth.token` using Velexis's secret key. Only the
        connected account id (`acct_…`) and `livemode` are kept; the access and refresh tokens Stripe returns are
        discarded, because charges use Velexis's key with `Stripe-Account`. A code Stripe refuses (`invalid_grant`:
        unknown, expired or used) answers `422 UNPROCESSABLE` with `details.reason = oauth_error`, never Stripe's
        message. `livemode` must match the deployment (live in production, test elsewhere): otherwise Velexis is
        disconnected from that account again (`stripe.oauth.deauthorize`, best effort: a failure is logged without
        any token, and an account an OTA's connection holds is left connected) and the answer is `422 UNPROCESSABLE`,
        `details.reason = livemode_mismatch`. An account connected to another OTA answers `409
        STRIPE_ACCOUNT_ALREADY_CONNECTED`. The account's `charges_enabled`, `payouts_enabled` and `details_submitted`
        are read from Stripe. Any other Stripe failure answers `502 PROVIDER_ERROR`.


        **Effect**, in one transaction: the test payment connection becomes `connect_standard` with the account id, no
        publishable key and no secrets, the account's capabilities, `connectedAt`, and `active` when charges are
        enabled (`pending` otherwise, until `account.updated` says so); the live connection the same when the OTA is
        live, otherwise go-live creates it in this mode. Writes the audit row `payments.connect_connected` and, after
        commit, publishes `connection` invalidations. Existing payments stay on the account they were taken with.
        `code` and `state` are write-only: never logged and never answered. `503 SERVICE_UNAVAILABLE` while Redis is
        down, because the state lives only there.
      tags:
        - Connections
      security:
        - portalBearer: []
      x-scope: portal
      x-feature: own_stripe
      x-error-codes:
        - VALIDATION_FAILED
        - CONNECT_STATE_INVALID
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - FEATURE_DISABLED
        - STRIPE_ACCOUNT_ALREADY_CONNECTED
        - TENANT_NOT_ACTIVE
        - CONFLICT
        - UNPROCESSABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
      x-platform-tables:
        - tenant_memberships
        - tenants
        - payment_provider_connections
        - credential_submissions
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteStripeConnectRequest'
            examples:
              authorized:
                summary: The owner authorised Velexis on Stripe
                value:
                  state: Xq7Lm2Np9Rt4Vw8Yb3Dc6Fg1Hj5Kk0Zs2Ae7Ui4Ow9Pq
                  code: ac_ExampleAuthorizationCode
              declined:
                summary: The owner declined on Stripe
                value:
                  state: Xq7Lm2Np9Rt4Vw8Yb3Dc6Fg1Hj5Kk0Zs2Ae7Ui4Ow9Pq
                  error: access_denied
                  errorDescription: The user denied your request
      responses:
        '200':
          description: The OTA and its payment connections, now on the connected account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeConnectCompleted'
              example:
                tenantId: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
                connections:
                  - id: ppc_01JA2ZBA4D8F2H6K0N4Q8S2V6X
                    environment: test
                    provider: stripe
                    accountMode: connect_standard
                    status: active
                    accountReference: acct_1QExampleAcme
                    publishableKey: null
                    statementDescriptorSuffix: ACME TRAVEL
                    capabilities:
                      chargesEnabled: true
                      payoutsEnabled: true
                      detailsSubmitted: true
                    connectedAt: '2027-01-11T14:05:31Z'
                    disconnectedAt: null
                    webhookUrl: null
                    pendingSubmission: null
                    version: 3
        '400':
          description: >-
            The body failed validation, or the state is unknown, expired, used or another account's. Possible codes:
            VALIDATION_FAILED, CONNECT_STATE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                CONNECT_STATE_INVALID:
                  $ref: '#/components/examples/CONNECT_STATE_INVALID'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The e-mail address is not verified, the account that started is no longer an owner or admin of the OTA, or
            own Stripe accounts are off. Possible codes: EMAIL_NOT_VERIFIED, FORBIDDEN, FEATURE_DISABLED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
                FEATURE_DISABLED:
                  $ref: '#/components/examples/FeatureDisabledOwnStripe'
        '409':
          description: >-
            The Stripe account is connected to another OTA, the OTA is not active, or a platform admin disabled the
            payment connection (`details.reason = connection_disabled`). Possible codes:
            STRIPE_ACCOUNT_ALREADY_CONNECTED, TENANT_NOT_ACTIVE, CONFLICT.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                STRIPE_ACCOUNT_ALREADY_CONNECTED:
                  $ref: '#/components/examples/STRIPE_ACCOUNT_ALREADY_CONNECTED'
                TENANT_NOT_ACTIVE:
                  $ref: '#/components/examples/TENANT_NOT_ACTIVE'
                CONFLICT:
                  summary: A platform admin disabled the payment connection
                  value:
                    error:
                      code: CONFLICT
                      message: The request conflicts with the current state of the resource.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: connection_disabled
        '422':
          description: >-
            The person declined on Stripe, Stripe reported another error or refused the code (`invalid_grant`), or the
            account's mode does not match the deployment (`details.reason`). Possible codes: UNPROCESSABLE.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNPROCESSABLE:
                  summary: The person declined on Stripe
                  value:
                    error:
                      code: UNPROCESSABLE
                      message: The request breaks a business rule.
                      status: 422
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: access_denied
                UNPROCESSABLE_OAUTH_ERROR:
                  summary: Stripe reported another error, or refused the code (unknown, expired or used)
                  value:
                    error:
                      code: UNPROCESSABLE
                      message: The request breaks a business rule.
                      status: 422
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: oauth_error
                UNPROCESSABLE_LIVEMODE:
                  summary: A test-mode account in a live deployment
                  value:
                    error:
                      code: UNPROCESSABLE
                      message: The request breaks a business rule.
                      status: 422
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: livemode_mismatch
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/tenants/{tenantId}/payment-connections/{environment}/api-keys:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CredentialsEnvironment'
    put:
      operationId: submitStripeApiKeys
      summary: Submit the OTA's own Stripe API keys for verification
      description: >-
        Owners and admins switch the payment connection of an environment to the OTA's own Stripe account by its API
        keys (`api_keys` mode, M5, PADR-0011), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or
        `403 MFA_REQUIRED` without MFA) and `FEATURE_OWN_STRIPE` on (`403 FEATURE_DISABLED`). As for own Amadeus
        credentials (PADR-0010), nothing changes yet: the keys wait in a credential submission, the secret key and the
        webhook secret envelope-encrypted, and a platform worker job verifies them with `GET /v1/account`, which must
        succeed with a `livemode` that matches the environment. Success switches the connection in one transaction
        (`api_keys`, the account id, the publishable key, both secrets re-encrypted for the connection, `active`) and
        e-mails the submitter; a failure (`STRIPE_KEY_INVALID`, `STRIPE_LIVEMODE_MISMATCH`, `PROVIDER_UNAVAILABLE`)
        leaves the connection untouched. Follow it with `getCredentialSubmission`.


        **Rules.** Every key must belong to the environment: `pk_test_` and `sk_test_` or `rk_test_` on `test`,
        `pk_live_` and `sk_live_` or `rk_live_` on `live`; another prefix answers `400 VALIDATION_FAILED` with a field
        error that never holds the key. A restricted key (`rk_`) needs write access to PaymentIntents and Refunds and
        read access to Charges and Disputes. An open submission of the same environment is superseded and its secrets
        erased. The OTA must be `active` (`409 TENANT_NOT_ACTIVE`, PADR-0014 item 5).


        **Answer**: the submission, and the webhook endpoint to create in the OTA's Stripe dashboard: `webhookUrl`
        (`https://api.ota.example.com/webhooks/stripe/c/<ppc_id>`, stable because the connection row is updated in
        place; when the environment has no connection yet, the submission keeps the id that the connection gets) and
        the events to enable. The webhook secret can only be tested when Stripe sends an event to the OTA backend, so
        the portal asks the owner to send a test event.


        **Secrets.** `secretKey` and `webhookSecret` are write-only: never logged (the logger redacts them), never
        answered, never put in a queue message, and erased from the submission when it ends. The operation is not
        idempotent, so no body is stored for a replay. Writes an audit row without them.
      tags:
        - Connections
      security:
        - portalBearer: []
      x-scope: portal
      x-mfa-step-up: true
      x-feature: own_stripe
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - MFA_REQUIRED
        - FEATURE_DISABLED
        - NOT_FOUND
        - TENANT_NOT_ACTIVE
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - tenants
        - payment_provider_connections
        - credential_submissions
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitStripeApiKeysRequest'
            example:
              publishableKey: pk_test_ExampleOnly
              secretKey: rk_test_ExampleOnly
              webhookSecret: whsec_ExampleOnly
      responses:
        '202':
          description: Accepted. The submission waits for its verification; create the webhook endpoint meanwhile.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeApiKeysSubmitted'
              example:
                submission:
                  id: crs_01JD4R7W1Y5A9C3E7G1J5M9Q3S
                  kind: stripe_api_keys
                  environment: test
                  status: pending
                  errorCode: null
                  errorMessage: null
                  createdAt: '2027-01-12T09:40:00Z'
                  finishedAt: null
                webhookUrl: https://api.ota.example.com/webhooks/stripe/c/ppc_01JA2ZBA4D8F2H6K0N4Q8S2V6X
                webhookEvents:
                  - payment_intent.succeeded
                  - payment_intent.payment_failed
                  - payment_intent.canceled
                  - payment_intent.amount_capturable_updated
                  - charge.refunded
                  - charge.dispute.created
                  - charge.dispute.closed
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/StepUpUnauthorized'
        '403':
          description: >-
            The e-mail address is not verified, the caller's role does not allow it, MFA is not enabled, or own Stripe
            accounts are off. Possible codes: EMAIL_NOT_VERIFIED, FORBIDDEN, MFA_REQUIRED, FEATURE_DISABLED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
                MFA_REQUIRED:
                  $ref: '#/components/examples/MFA_REQUIRED'
                FEATURE_DISABLED:
                  $ref: '#/components/examples/FeatureDisabledOwnStripe'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TenantNotActive'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
