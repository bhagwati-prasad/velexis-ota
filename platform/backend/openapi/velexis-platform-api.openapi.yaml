        - tenant_memberships
        - tenants
        - plans
        - api_keys
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              secret:
                summary: A secret key for a storefront deployment
                value:
                  name: Storefront production
                  kind: secret
                  environment: test
                  scopes:
                    - storefront
              publishable:
                summary: A publishable key for a browser frontend
                value:
                  name: Website
                  kind: publishable
                  environment: test
                  allowedOrigins:
                    - https://www.acme-travel.example.com
      responses:
