        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateSettlementsRequest'
            examples:
              month:
                summary: Every OTA's drafts of February 2027
                value:
                  periodStart: '2027-02-01T00:00:00Z'
              oneTenant:
                summary: The drafts of one OTA
                value:
                  periodStart: '2027-02-01T00:00:00Z'
                  tenantId: ten_01JB3K4M8P2R6T0W4Y8A2C6E0G
      responses:
        '202':
          description: Accepted. The generation job is queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          description: >-
            The body failed validation, for example a month that has not ended. Possible codes: VALIDATION_FAILED.
