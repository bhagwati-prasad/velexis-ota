      operationId: adminCancelProvisioningJob
      summary: Cancel a queued tenant job
      description: >-
        Cancels a `queued` job that was never dispatched or waits for its next attempt (for example a `provision` job
        waiting for its Checkout gate), with a written `reason` of 5–500 characters that the audit row keeps. The job
        becomes `canceled` and nothing more is sent to the OTA worker; the tenant status does not change. A `running`
        or finished job answers `409 CONFLICT` (`details.reason = not_queued`).
      tags:
        - Admin provisioning jobs
      security:
