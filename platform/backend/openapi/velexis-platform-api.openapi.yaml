        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PRECONDITION_FAILED:
              $ref: '#/components/examples/PRECONDITION_FAILED'
    PlanLimitReached:
