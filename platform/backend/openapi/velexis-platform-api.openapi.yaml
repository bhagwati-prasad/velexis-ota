          $ref: '#/components/responses/InternalError'
    put:
      operationId: setPayoutAccount
      summary: Set or replace the OTA's payout account
      description: >-
        Owners set or replace the bank account where Velexis pays the OTA's settlements (M5, `velexis` mode, PADR-0003
        item 10), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED` without
        MFA) and `FEATURE_SETTLEMENTS` on (`403 FEATURE_DISABLED`). `scheme: iban` takes an IBAN (spaces and lower case
        allowed; the service removes the spaces, upper-cases it and checks the mod-97 checksum) and an optional BIC;
        `scheme: local` takes an account number and a routing number (sort code, ABA or bank code). A wrong checksum
        answers `400 VALIDATION_FAILED` with a field error on `/iban` that never holds the value.


        The bank identifiers are stored envelope-encrypted as one JSON value; only `last4`, the last 4 characters of the
        IBAN or account number, is kept in clear. Every change sets the status back to `pending_review` until a platform
        admin verifies it, writes the audit row `payout_account.updated` without the numbers and e-mails ops
        (`ops.alert`). The stored account typed again is no change (lead decision (2i) of 2026-10-30): when the holder
        (trimmed), country, currency, scheme and identifiers, normalised as above, are the stored ones, the answer is the
        current account as it is (the same `200`, version and status: a verified account stays verified, a pending one
        keeps waiting), and nothing is written, audited or e-mailed. A `rejected` account typed again is the exception
        (lead decision (2a) of 2026-10-30): the owner asks for a new review, so it is saved as a change is (the next
        version, back in `pending_review` with the review note cleared, the audit row and the `ops.alert` e-mail).
        `iban`, `bic`, `accountNumber` and `routingNumber` are write-only: never logged and never answered, so the
        answer is the masked account.
