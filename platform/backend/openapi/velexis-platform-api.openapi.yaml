  /v1/auth/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Sign out of every session
      description: >-
        Revokes every refresh family of the account, portal and platform admin alike, and writes the Redis cut-off
        `staffdeny:acct:<accountId>` (30 days) that makes the OTA backend revoke the account's OTA admin staff sessions
        too. Publishes an `account` invalidation and writes an audit row.
      tags:
        - Auth
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
        - platform_audit_log
      responses:
        '204':
          description: Every session of the account is revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: E-mail a password reset link
      description: >-
        Always answers `202` with no body. For an active account it creates a reset token (1 hour, single use) and
        e-mails the link; for any other address nothing happens. 3 e-mails per address and 10 calls per end-user IP
        per hour.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_tokens
        - email_outbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: anna.berg@example.com
      responses:
        '202':
          description: Accepted; a reset link is e-mailed when the address belongs to an active account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: >-
        Checks the reset token (unused, unexpired), applies the password rules, stores the new Argon2id hash and uses
        the token up. Every session of the account is revoked, `staffdeny:acct:<accountId>` is written, the account is
        e-mailed, an `account` invalidation is published and an audit row is written.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - PASSWORD_RESET_TOKEN_INVALID
        - PASSWORD_TOO_WEAK
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_tokens
        - accounts
        - account_sessions
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            example:
              token: Pr2xL9qW5mT8vK3cN7bZ4hY1dF6sJ0aG2eU8iO5rQ1k
              newPassword: Silver-Fjord-Morning-7
      responses:
        '204':
          description: The password is changed and every session is revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          description: >-
            The body failed validation, or the reset token is unknown, already used or expired. Possible codes:
            VALIDATION_FAILED, PASSWORD_RESET_TOKEN_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                PASSWORD_RESET_TOKEN_INVALID:
                  $ref: '#/components/examples/PASSWORD_RESET_TOKEN_INVALID'
        '422':
          $ref: '#/components/responses/PasswordTooWeak'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/step-up:
    post:
      operationId: stepUp
      summary: Confirm a sensitive action with a fresh TOTP code
      description: >-
        Sensitive operations (`x-mfa-step-up`) need a TOTP verification within the last 15 minutes. A valid code
        answers a new access token of the same family with `mfa_at` set to now, and updates the family's
        `mfa_verified_at`. The session also carries a new refresh token of the family, which replaces the current one
        as on `refreshSession`. A code already used in the same 30-second step is refused. An account without MFA gets
        `403 MFA_REQUIRED`.
      tags:
        - Auth
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - MFA_CODE_INVALID
        - EMAIL_NOT_VERIFIED
        - MFA_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            example:
              code: '492039'
      responses:
        '200':
          description: A new session of the same family, with `mfa_at` now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  $ref: '#/components/examples/PortalSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            No valid access token, or the code is wrong. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
                TOKEN_EXPIRED:
                  $ref: '#/components/examples/TOKEN_EXPIRED'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '403':
          $ref: '#/components/responses/StepUpForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me:
