    post:
      operationId: adminApproveSettlement
      summary: Approve a draft
      description: >-
        Approves a **draft** (M5, PADR-0003 items 7 and 9) with a TOTP step-up within the last 15 minutes (`401
        REAUTH_REQUIRED`; PADR-0006 item 4) and `If-Match` (a stale version answers `412 PRECONDITION_FAILED`). A
        positive net makes it `approved`, to be paid by bank transfer, and needs a `verified` payout account (`422
        PAYOUT_ACCOUNT_REQUIRED`); a net of zero or less makes it `carried_forward`, and the next month's draft absorbs
        it as a `carry_forward` line. Approving also sets `carriedToId` on the earlier carried-forward statements this
        draft absorbed. From then on the statement is immutable and the portal shows it. Any other status answers
        `409 SETTLEMENT_STATE_INVALID`. A carried-forward balance is absorbed once (PADR-0003 item 7: by the earliest
        later open draft of the same OTA, environment and currency), so the approval checks the draft's `carry_forward`
        line again: when it no longer holds exactly the balances this draft absorbs now (another statement absorbed one
        of them since the draft was generated, or a balance was carried forward after it), the answer is `409
        SETTLEMENT_STATE_INVALID` with `details.reason = carry_forward_changed` and nothing changes; generate the month
        again (`adminGenerateSettlements`) and approve the rebuilt draft. Writes an audit row.
