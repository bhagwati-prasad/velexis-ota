        - plans
        - tenants
        - tenant_memberships
        - subscriptions
        - tenant_domains
        - provisioning_jobs
        - billing_customers
        - platform_audit_log
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
