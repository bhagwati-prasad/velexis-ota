  /v1/tenants/{tenantId}/billing/checkout-session:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createCheckoutSession
      summary: Open a Stripe Checkout to choose or restart a paid plan
      description: >-
        Owners choose or restart a paid plan for an existing OTA (M5, platform/docs/flows/subscription-billing.md §B):
        when the manual trial of an OTA created before M5 ends, after a cancellation, or after an abandoned Checkout. It
        needs `FEATURE_STRIPE_BILLING` (`403 FEATURE_DISABLED`). `planCode` must name a public, active plan with a
        Stripe price for `billingInterval` (`422 PLAN_NOT_AVAILABLE`). An OTA whose Stripe subscription is current
        (`trialing`, `active`, `past_due`, `paused` or `unpaid`) changes its plan or card in the Customer Portal instead
        (`409 CONFLICT`, `details.reason = stripe_subscription_active`). No subscription row is written here: the
        current row keeps its place until the `checkout.session.completed` webhook creates the Stripe one. It works in
        any tenant status, so a suspended or failed OTA can pay.


        The API creates or reuses the OTA's Stripe Customer (`billing_customers`; after a Stripe failure that left its
        creation undecided, the next call looks for the Customer that attempt made and otherwise creates it under a
        new Stripe idempotency key, `billing_customer_attempts`) and creates a Checkout Session in
        `subscription` mode with the plan's price, `client_reference_id` (the OTA id), the Velexis metadata, a trial
        only on the OTA's first Stripe subscription, `payment_method_collection: always`, and success and cancel URLs
        on the portal; Stripe's idempotency key is `checkout:<tenantId>:<Idempotency-Key>`. A Stripe failure answers
        `502 PROVIDER_ERROR`. Writes an audit row.


        **Idempotent** (`Idempotency-Key`, 24 hours): a retry with the same key and body replays the `201` with the
        same URL, another body answers `409 IDEMPOTENCY_KEY_REUSED`, and while the idempotency store (Redis) is down
        the call answers `503 SERVICE_UNAVAILABLE` before writing anything. A request with the same key that arrives
        while the first one still runs waits up to 10 seconds and replays its answer, or answers `503
        SERVICE_UNAVAILABLE` (try again shortly).
