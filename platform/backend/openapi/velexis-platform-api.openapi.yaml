        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            example:
              code: '492039'
      responses:
        '200':
          description: MFA is enabled; the ten recovery codes are shown once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecoveryCodes'
              examples:
                recoveryCodes:
                  $ref: '#/components/examples/RecoveryCodes'
        '400':
          description: >-
            The body failed validation, or the pending set-up expired; start again. Possible codes: VALIDATION_FAILED,
            MFA_SETUP_EXPIRED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                MFA_SETUP_EXPIRED:
                  $ref: '#/components/examples/MFA_SETUP_EXPIRED'
        '401':
          description: >-
            No valid access token, or the code is wrong. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
                TOKEN_EXPIRED:
                  $ref: '#/components/examples/TOKEN_EXPIRED'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
