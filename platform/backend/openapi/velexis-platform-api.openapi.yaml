    post:
      operationId: startStripeConnect
      summary: Start connecting the OTA's own Stripe account with Connect Standard
      description: >-
        Owners and admins start connecting the OTA's own Stripe account through Stripe Connect Standard OAuth (M5,
        PADR-0011), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED` without
        MFA) and `FEATURE_OWN_STRIPE` on (`403 FEATURE_DISABLED`). The OTA must be `active` (`409 TENANT_NOT_ACTIVE`,
        PADR-0014 item 5).


        The API creates a 256-bit random `state`, keeps `{tenantId, accountId, membershipId}` under the Redis key
        `stripe:oauth:<sha256 of the state>` for 10 minutes, and answers Stripe's authorize URL:
        `https://connect.stripe.com/oauth/authorize` with `response_type=code`, `client_id` (`STRIPE_CONNECT_CLIENT_ID`),
        `scope=read_write`, the `state`, `redirect_uri` (`<PUBLIC_PORTAL_URL>/connect/stripe/callback`) and
        `stripe_user[email]` prefilled with the caller's own address (the owner or admin who is sent to Stripe). The
        portal sends the browser there with a `303`; Stripe sends it back to the portal's
        callback page, which calls `completeStripeConnect`. The URL holds the single-use state, so the answer is
        `no-store`. `503 SERVICE_UNAVAILABLE` while Redis is down, because the state lives only there. One connected
        account serves both environments: the test connection is switched at once, the live one too when the OTA is
        live, otherwise at go-live.
