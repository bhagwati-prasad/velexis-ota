        - Auth
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - MFA_CODE_INVALID
        - EMAIL_NOT_VERIFIED
        - MFA_REQUIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            example:
              code: '492039'
      responses:
        '200':
          description: A new session of the same family, with `mfa_at` now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  $ref: '#/components/examples/PortalSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            No valid access token, or the code is wrong. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
                TOKEN_EXPIRED:
                  $ref: '#/components/examples/TOKEN_EXPIRED'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '403':
          $ref: '#/components/responses/StepUpForbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
