  /v1/admin/settlements/generate:
    post:
      operationId: adminGenerateSettlements
      summary: Build or rebuild the drafts of a month
      description: >-
        Queues the job `settlement.generate {periodStart, tenantId?}` on `platform-settlements` (M5, stripe-payments
        flow §F), the job that `settlements.monthly` queues on day 3 at 05:00 UTC for the previous month: it lists the
        month's Stripe balance transactions of the Velexis account once, and rebuilds the **draft** of each OTA and
        balance currency (or of one OTA with `tenantId`). Existing drafts are rebuilt from scratch; `approved`, `paid`
        and `carried_forward` statements are never touched, and a balance transaction already on one of them is
        skipped. Use it after a fix, or to regenerate a voided draft.


        `periodStart` is the first instant of a calendar month (UTC) that has ended: the current or a future month
        answers `400 VALIDATION_FAILED` (field error `period_not_closed` on `/periodStart`). An unknown `tenantId`
        answers `404 NOT_FOUND`. Writes an audit row. The answer comes before the job runs; reload the list to see the
        drafts. `503 SERVICE_UNAVAILABLE` while Redis is unreachable, because the job is the whole effect.
      tags:
        - Admin settlements
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-platform-tables:
        - settlements
        - settlement_lines
        - tenants
        - platform_audit_log
