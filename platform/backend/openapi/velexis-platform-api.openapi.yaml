        `tenant` invalidation, the `tenant.resume` dispatch and an e-mail to the owners. `409 CONFLICT` when the OTA
        is not suspended (`details.reason = not_suspended`), or is suspended for billing without a `trialing` or
        `active` subscription (`details.reason = subscription_not_active`).
