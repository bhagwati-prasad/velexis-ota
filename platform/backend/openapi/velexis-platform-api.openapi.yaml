        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPayoutAccountRequest'
            examples:
              iban:
                summary: A Norwegian IBAN with its BIC
                value:
                  accountHolderName: Acme Travel AS
                  countryCode: 'NO'
                  currency: NOK
                  scheme: iban
                  iban: NO93 8601 1117 947
                  bic: DNBANOKK
              local:
                summary: A US account with its ABA routing number
                value:
                  accountHolderName: Acme Travel Inc.
                  countryCode: US
                  currency: USD
                  scheme: local
                  accountNumber: '000123456789'
                  routingNumber: '110000000'
      responses:
        '200':
          description: The payout account, masked and pending review, with its new version in `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutAccount'
              example:
                accountHolderName: Acme Travel AS
                countryCode: 'NO'
                currency: NOK
                scheme: iban
                last4: '7947'
                status: pending_review
                reviewNote: null
                updatedAt: '2027-01-20T08:12:44Z'
                version: 2
        '400':
          description: >-
            The body failed validation, for example an IBAN with a wrong checksum. Possible codes: VALIDATION_FAILED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  summary: The IBAN's checksum is wrong
                  value:
                    error:
                      code: VALIDATION_FAILED
                      message: The request body, query or headers failed validation; see fieldErrors.
                      status: 400
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      fieldErrors:
                        - path: /iban
                          code: iban_checksum
                          message: Check the IBAN; its check digits do not match.
        '401':
          $ref: '#/components/responses/StepUpUnauthorized'
        '403':
          description: >-
            The e-mail address is not verified, the caller is not an owner, MFA is not enabled, or settlements are off.
            Possible codes: EMAIL_NOT_VERIFIED, FORBIDDEN, MFA_REQUIRED, FEATURE_DISABLED.
          headers:
            X-Request-Id:
