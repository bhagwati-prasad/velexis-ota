          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                MFA_SETUP_EXPIRED:
                  $ref: '#/components/examples/MFA_SETUP_EXPIRED'
        '401':
          description: >-
            No valid access token, or the code is wrong. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                UNAUTHENTICATED:
                  $ref: '#/components/examples/UNAUTHENTICATED'
                TOKEN_EXPIRED:
                  $ref: '#/components/examples/TOKEN_EXPIRED'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
