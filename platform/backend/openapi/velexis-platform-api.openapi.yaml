                value:
                  ticketingDefaults:
                    ticketingAgreement:
                      option: DELAY_TO_CANCEL
                      delay: 2D
                    automatedProcess:
                      - code: IMMEDIATE
                        queue:
                          number: '8'
                          category: '0'
                        officeId: NCE1A0955
                    issue: false
                  monitoredQueues:
                    - officeId: NCE1A0955
                      queueId: 8
                      category: 0
              offices:
                summary: The office defaults of new flight orders
                value:
                  queuingOfficeId: NCE1A0955
                  ownerOfficeId: NCE1A0955
      responses:
