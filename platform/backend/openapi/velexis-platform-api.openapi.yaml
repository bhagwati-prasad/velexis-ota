        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/mfa/setup:
    post:
      operationId: startMfaSetup
      summary: Start the TOTP set-up
      description: >-
        Creates a pending TOTP secret (SHA-1, 6 digits, 30 seconds) that lives envelope-encrypted in Redis for 10
        minutes and replaces any earlier pending one. The portal shows the secret and the `otpauth://` URI as a QR
        code; `enableMfa` confirms it with a code. Answers `409 MFA_ALREADY_ENABLED` while MFA is on.
      tags:
        - Account
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - MFA_ALREADY_ENABLED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables: []
      responses:
        '200':
          description: The pending secret, shown once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUrl: >-
                  otpauth://totp/Velexis:anna.berg%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Velexis&algorithm=SHA1&digits=6&period=30
                expiresIn: 600
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 'MFA is already enabled. Possible codes: MFA_ALREADY_ENABLED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_ALREADY_ENABLED:
                  $ref: '#/components/examples/MFA_ALREADY_ENABLED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/mfa/enable:
    post:
      operationId: enableMfa
      summary: Confirm the TOTP set-up and enable MFA
      description: >-
        A valid code for the pending secret moves it into the account (envelope-encrypted), enables MFA and creates ten
        recovery codes, answered once and stored only as SHA-256 hashes. An expired or missing set-up answers `400
        MFA_SETUP_EXPIRED`. E-mails the account, publishes an `account` invalidation and writes an audit row.
      tags:
