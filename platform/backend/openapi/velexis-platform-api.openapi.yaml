        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAmadeusAccountRequest'
            examples:
              rotate:
                summary: Rotate the client secret (step-up)
                value:
                  clientSecret: example-rotated-secret-not-real
              disable:
                summary: Disable the account
                value:
                  status: disabled
      responses:
        '200':
          description: The updated account, with its new version in `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAmadeusAccount'
              example:
                id: ama_01JA2Y8K3M7P1R5T9W3Z7C1F5H
                name: Velexis test
                environment: test
                baseUrl: https://test.travel.api.amadeus.com
                clientId: Vx7tK2mQ9pL4wR8nZ3cB6hY1dF5sJ0aG
                status: pending_verification
                lastVerifiedAt: '2026-10-20T06:00:04Z'
                lastError: null
                officeCounts:
                  available: 6
                  assigned: 17
                  releasing: 0
                  retired: 1
                createdAt: '2026-10-02T09:15:00Z'
                version: 4
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminStepUpUnauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
