      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - MFA_ALREADY_ENABLED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables: []
      responses:
        '200':
          description: The pending secret, shown once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MfaSetup'
              example:
                secret: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP
                otpauthUrl: >-
                  otpauth://totp/Velexis:anna.berg%40example.com?secret=JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP&issuer=Velexis&algorithm=SHA1&digits=6&period=30
                expiresIn: 600
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          description: 'MFA is already enabled. Possible codes: MFA_ALREADY_ENABLED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_ALREADY_ENABLED:
                  $ref: '#/components/examples/MFA_ALREADY_ENABLED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/me/mfa/enable:
    post:
      operationId: enableMfa
