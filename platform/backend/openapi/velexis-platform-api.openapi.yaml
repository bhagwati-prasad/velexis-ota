            application/json:
              schema:
                $ref: '#/components/schemas/AdminProvisioningJobResult'
              example:
                job:
                  id: job_01JC7Q5S9V3X7Z1B5D9F3H7K1N
                  tenantId: ten_01JC7Q5R8T2W6Y0A4C8E2G6J0M
                  tenantKey: skyways
                  kind: provision
                  status: canceled
                  step: null
                  attempt: 0
