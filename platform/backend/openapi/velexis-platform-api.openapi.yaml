      responses:
        '200':
          description: New tokens of the same admin family.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                session:
                  $ref: '#/components/examples/AdminSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The refresh token cannot be used; sign in again. Possible codes: REFRESH_TOKEN_INVALID,
            REFRESH_TOKEN_REUSED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                REFRESH_TOKEN_INVALID:
                  $ref: '#/components/examples/REFRESH_TOKEN_INVALID'
                REFRESH_TOKEN_REUSED:
                  $ref: '#/components/examples/REFRESH_TOKEN_REUSED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
