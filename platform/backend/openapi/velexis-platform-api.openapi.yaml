                status: active
                officeIds:
                  - NCE1A0955
                defaultOfficeId: NCE1A0955
                queuingOfficeId: NCE1A0955
                ownerOfficeId: NCE1A0955
                clientId: null
                ticketingDefaults:
                  ticketingAgreement:
