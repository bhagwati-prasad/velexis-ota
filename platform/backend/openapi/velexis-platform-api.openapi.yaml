      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            CONFLICT:
              summary: The invitation is not pending
              value:
                error:
                  code: CONFLICT
                  message: The request conflicts with the current state of the resource.
                  status: 409
                  requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                  details:
                    reason: not_pending
    InvitationInvalid:
      description: >-
