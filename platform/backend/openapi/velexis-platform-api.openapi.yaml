  /v1/admin/stripe-events/{eventId}/reprocess:
    parameters:
      - $ref: '#/components/parameters/StripeEventId'
    post:
      operationId: adminReprocessStripeEvent
      summary: Re-run a failed or ignored Stripe event
      description: >-
        Runs a `failed` or `ignored` event of the inbox again (M5), after its cause was fixed (for example a price
        linked to a plan, subscription-billing flow, failure handling): the event goes back to `received` with its
        attempts and last error kept, an audit row is written and, after commit, `stripe.event` is queued again on
        `platform-stripe-events` (BullMQ job id = the event id). BullMQ keeps the event's earlier job once it failed
        or completed (30 days and 1 day, ADR-0009 item 7) and ignores a new job with an id it still holds, so that job
        is removed before the event is queued again. If the removal or the enqueue is lost, the `stripe_events.sweep`
        scheduler queues the event within minutes, as it does for the webhook receivers: for a `received` event, a job
        that BullMQ holds as failed or completed counts as missing. Any other status answers `409 CONFLICT` with the
        status in `details.reason`: `processing` (the worker holds it), `received` (it is queued already) or
        `processed` (it is done).
      tags:
        - Admin billing
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - stripe_events
        - platform_audit_log
      responses:
        '202':
          description: Accepted. The event is queued for processing again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The event is not `failed` or `ignored` (`details.reason` is its status: `processing`, `received` or
            `processed`). Possible codes: CONFLICT.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  summary: The worker is processing the event
                  value:
                    error:
                      code: CONFLICT
                      message: The request conflicts with the current state of the resource.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: processing
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
