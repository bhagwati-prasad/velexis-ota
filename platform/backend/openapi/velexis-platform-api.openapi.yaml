  /v1/tenants/{tenantId}/settlements/{settlementId}/lines.csv:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SettlementId'
    get:
      operationId: downloadSettlementLines
      summary: Download the lines of a settlement statement as CSV
      description: >-
        The lines of one statement as a CSV file (M5), to reconcile it with the OTA's own bookings: UTF-8,
        comma-separated, quoted as RFC 4180 says, with one header row and these columns: `type` (`charge`, `refund`,
        `dispute`, `dispute_reversal`, `adjustment` or `carry_forward`), `occurredAt`, `amount` (signed, in the
        statement's currency: refunds and disputes are negative), `stripeFee` (Stripe's fee of the transaction, a
        positive number is a cost), `paymentIntentId`, `velexisPaymentId` and `checkoutId` (the Stripe PaymentIntent and
        the OTA's payment and checkout ids, which the OTA admin shows), and `description`; an empty cell is a `null`.
        The lines are in `occurredAt` order. Amounts are decimal strings without a thousands separator, written by the
        API and kept as they are; a text cell that starts with `=`, `+`, `-`, `@`, a tab or a carriage return gets a
        leading `'` (the OWASP rule against CSV injection), so a spreadsheet never runs it as a formula. Drafts, voided
        drafts and statements of other OTAs answer `404 NOT_FOUND`. The file holds the OTA's payment records, so it is
        never cached.
      tags:
        - Settlements
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - settlements
        - settlement_lines
      responses:
        '200':
          description: The CSV file.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreStatement'
            Content-Disposition:
              description: >-
                Always an attachment named after the statement's month and currency,
                `velexis-statement-<yyyy-mm>-<currency>.csv`.
              required: true
              schema:
                type: string
                pattern: ^attachment; filename="velexis-statement-[0-9]{4}-[0-9]{2}-[A-Z]{3}\.csv"$
                examples:
                  - attachment; filename="velexis-statement-2027-01-EUR.csv"
          content:
            text/csv:
              schema:
                type: string
                description: The CSV text, header row first.
              example: |
                type,occurredAt,amount,stripeFee,paymentIntentId,velexisPaymentId,checkoutId,description
                charge,2027-01-04T09:14:22Z,1249.00,18.36,pi_3QExampleCharge01,pay_01JC2H6K0N4Q8S2V6X0Z4B8D2F,chk_01JC2H5J9M3P7R1T5W9Y3A7C1E,Booking 7Q4M2X OSL-BCN
                refund,2027-01-11T15:02:10Z,-249.00,0.00,pi_3QExampleCharge01,pay_01JC2H6K0N4Q8S2V6X0Z4B8D2F,chk_01JC2H5J9M3P7R1T5W9Y3A7C1E,Partial refund of booking 7Q4M2X
                carry_forward,2027-01-31T23:59:59Z,-79.48,0.00,,,,Balance carried from the December 2026 statement
                adjustment,2027-01-31T23:59:59Z,-10.00,0.00,,,,"'-10.00 fee correction, see the note"
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantRoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/sign-in:
    post:
      operationId: adminSignIn
      summary: Sign in to the platform admin with e-mail and password
      description: >-
        The password step of the admin sign-in (PADR-0006 item 2). Checks the lock-out, then the password, then that
        the account is an active, verified platform admin. A wrong e-mail address, a wrong password and an account
        that is not an active platform admin all give the same `401 INVALID_CREDENTIALS` in the same time. A platform
        admin without MFA gets `403 MFA_REQUIRED`, only after a correct password, and turns MFA on in the portal first.
        Five consecutive failures lock the account for 15 minutes (`423 ACCOUNT_LOCKED` with `Retry-After`), as on
        the portal. 10 sign-ins per end-user IP per minute.


        The answer is always an MFA challenge: a TOTP or recovery code is required on **every** admin sign-in, and
        `adminVerifyMfa` completes it within 5 minutes. A challenge of the portal's `signIn` is never accepted by
        `adminVerifyMfa`, nor this one by the portal's `verifyMfa`.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: lena.holm@velexis.example.com
              password: Harbour-Lantern-2026
      responses:
        '200':
          description: The password is right; complete the sign-in with adminVerifyMfa.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMfaChallenge'
              example:
                mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                expiresIn: 300
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            Wrong e-mail address or password, or the account is not an active platform admin (the same answer for
            all). Possible codes: INVALID_CREDENTIALS.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  $ref: '#/components/examples/INVALID_CREDENTIALS'
        '403':
          description: >-
            The password is right, but the platform admin has no MFA; turn it on in the portal first. Possible codes:
            MFA_REQUIRED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_REQUIRED:
                  $ref: '#/components/examples/MFA_REQUIRED'
        '423':
          description: 'Too many failed sign-ins; wait for `Retry-After` seconds. Possible codes: ACCOUNT_LOCKED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_LOCKED:
                  $ref: '#/components/examples/ACCOUNT_LOCKED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/mfa/verify:
    post:
      operationId: adminVerifyMfa
      summary: Complete an admin sign-in with a TOTP or recovery code
      description: >-
        Completes the challenge of `adminSignIn` with a TOTP code (6 digits, ±1 time step, each code accepted once) or
        with one unused recovery code, which is then used up. A challenge allows 5 attempts and lives 5 minutes; after
        that, for an unknown token, or for a challenge of the portal's `signIn`, the answer is `401
        MFA_CHALLENGE_INVALID` and the admin signs in again. 10 attempts per account per 10 minutes.


        Success creates a refresh family with `audience = 'platform_admin'`, a 12-hour absolute lifetime and
        `mfa_verified_at` set, so the access token carries `mfa_at`; each refresh token expires after 2 idle hours.
        Writes an audit row. The admin server moves the tokens into its own httpOnly cookies at once.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_sessions
        - account_recovery_codes
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
            examples:
              totp:
                summary: With a code of the authenticator app
                value:
                  mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                  code: '583104'
              recoveryCode:
                summary: With a recovery code
                value:
                  mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                  recoveryCode: W4KD-9PMX-2TQR-H7ZB
      responses:
        '200':
          description: Signed in to the platform admin.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                session:
                  $ref: '#/components/examples/AdminSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The challenge is unknown, expired, used up or not an admin challenge, or the code is wrong. Possible codes:
            MFA_CHALLENGE_INVALID, MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_CHALLENGE_INVALID:
                  $ref: '#/components/examples/MFA_CHALLENGE_INVALID'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/refresh:
    post:
      operationId: adminRefresh
      summary: Rotate the admin refresh token
      description: >-
        Exchanges an admin refresh token for a new access token and a new refresh token of the same family; the
        presented token is used up. Presenting a token that was already rotated revokes the whole family (`401
        REFRESH_TOKEN_REUSED`). An unknown, revoked or idle-expired token, a family past its 12-hour absolute lifetime,
        and any portal refresh token answer `401 REFRESH_TOKEN_INVALID`: only `platform_admin` families refresh here,
        and admin families never refresh through the portal's `refreshSession`. The new access token copies `mfa_at`
        from the family.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
        - accounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              refreshToken: Ar7pK2xW9mQ4vT8cN1bZ6hY3dF0sJ5aG2eU7iO4rL9q
      responses:
        '200':
          description: New tokens of the same admin family.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                session:
                  $ref: '#/components/examples/AdminSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The refresh token cannot be used; sign in again. Possible codes: REFRESH_TOKEN_INVALID,
            REFRESH_TOKEN_REUSED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                REFRESH_TOKEN_INVALID:
                  $ref: '#/components/examples/REFRESH_TOKEN_INVALID'
                REFRESH_TOKEN_REUSED:
                  $ref: '#/components/examples/REFRESH_TOKEN_REUSED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/step-up:
    post:
      operationId: adminStepUp
      summary: Confirm a sensitive admin action with a fresh TOTP code
      description: >-
        Admin operations marked `x-mfa-step-up` need a TOTP verification within the last 15 minutes (`401
        REAUTH_REQUIRED` otherwise). A valid code answers a new access token of the same family with `mfa_at` set to
        now and updates the family's `mfa_verified_at`. The session also carries a new refresh token of the family,
        which replaces the current one as on `adminRefresh`. A code already used in the same 30-second step is refused
        (`401 MFA_CODE_INVALID`). 10 attempts per account per 10 minutes.
