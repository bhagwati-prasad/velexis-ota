  /v1/tenants/{tenantId}/settlements/{settlementId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/SettlementId'
    get:
      operationId: getSettlement
      summary: Get one settlement statement with its totals
      description: >-
        Owners and finance members see one statement (M5) with its totals (PADR-0003 item 5): `netAmount = grossAmount
        − refundsAmount − disputesAmount − stripeFeesAmount − velexisFeesAmount + adjustmentsAmount`, where
        `velexisFeesAmount` is `feeBps` basis points of the captured amount net of refunds, and `adjustmentsAmount`
        holds the manual lines and the balance carried from earlier statements. `payoutReference` is the bank
        transfer's reference once paid; `notes` are Velexis's remarks. Drafts, voided drafts and statements of other
        OTAs answer `404 NOT_FOUND`. The lines are in `downloadSettlementLines`.
      tags:
