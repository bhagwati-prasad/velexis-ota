          description: The statement.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
              example:
                id: stl_01JC7T1V5X9Z3B7D1F5H9K3N7Q
                periodStart: '2027-01-01T00:00:00Z'
                periodEnd: '2027-02-01T00:00:00Z'
                currency: EUR
                status: paid
                netAmount:
                  amount: '8935.10'
                  currency: EUR
                paidAt: '2027-02-07T00:00:00Z'
                grossAmount:
                  amount: '9600.00'
                  currency: EUR
                refundsAmount:
                  amount: '249.00'
                  currency: EUR
                disputesAmount:
                  amount: '0.00'
                  currency: EUR
                stripeFeesAmount:
                  amount: '139.40'
                  currency: EUR
                velexisFeesAmount:
                  amount: '187.02'
                  currency: EUR
                adjustmentsAmount:
                  amount: '-89.48'
                  currency: EUR
                feeBps: 200
                lineCount: 41
                payoutReference: VX-SETTLE-2027-01-ACME
