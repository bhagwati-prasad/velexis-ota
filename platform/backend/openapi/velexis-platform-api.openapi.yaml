        VALIDATION_FAILED, INVITATION_INVALID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_FAILED:
              $ref: '#/components/examples/VALIDATION_FAILED'
            INVITATION_INVALID:
              $ref: '#/components/examples/INVITATION_INVALID'
    PreconditionFailed:
