        - Billing
      security:
        - portalBearer: []
      x-scope: portal
      x-idempotent: true
      x-feature: stripe_billing
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - FEATURE_DISABLED
        - NOT_FOUND
        - CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - PLAN_NOT_AVAILABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
        - SERVICE_UNAVAILABLE
      x-platform-tables:
        - tenant_memberships
        - tenants
        - accounts
        - plans
        - subscriptions
        - billing_customers
        - billing_customer_attempts
        - platform_audit_log
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCheckoutSessionRequest'
            example:
              planCode: growth
              billingInterval: year
      responses:
        '201':
          description: The Stripe Checkout page to send the browser to.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutSession'
              example:
                url: https://checkout.stripe.com/c/pay/cs_test_b1C2d3E4f5G6h7I8j9K0l1M2n3O4
                expiresAt: '2027-01-12T10:00:00Z'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
