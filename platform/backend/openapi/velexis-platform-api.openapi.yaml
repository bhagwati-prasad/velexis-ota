      description: >-
        Changes the name, locale or time zone. `If-Match` carries the `ETag` of `getMe`; a stale version answers `412
        PRECONDITION_FAILED`. The e-mail address cannot be changed here (PADR-0008 item 5). Writes an audit row.
      tags:
        - Account
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - VALIDATION_FAILED
