        a `migrate` job and dispatches `tenant.migrate` to the OTA worker, with `targetVersion` when given (else every
        pending migration). The answer arrives as `tenant.migrated` or `tenant.migration_failed` and shows on the job;
        a failure never changes the tenant status (PADR-0001 item 7). `409 CONFLICT` when a `migrate` job of the OTA
        is queued or running (`details.reason = migrate_job_active`) or the OTA has no schema yet, its
        `schemaVersion` being `null` (`details.reason = schema_missing`). Writes an audit row.
