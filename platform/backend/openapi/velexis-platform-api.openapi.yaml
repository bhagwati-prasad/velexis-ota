      description: >-
        One error. The OTA booking API's `Error` without its console-only `supplier` field, which the platform API
        never sends (PADR-0009 item 6).
      additionalProperties: false
      required:
        - code
        - message
        - status
        - requestId
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
          description: Public error code (see x-error-catalogue).
        message:
          type: string
          description: Human-readable message, safe to show; never echoes a submitted value.
        status:
          type: integer
          description: HTTP status.
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
          description: >-
            Code-specific structured details, for example `reason` for FORBIDDEN, CONFLICT and UNPROCESSABLE, `status`
            for TENANT_NOT_ACTIVE and SETTLEMENT_STATE_INVALID, `limit` and `used` for PLAN_LIMIT_REACHED, `missing`
            for LIVE_PRECONDITIONS_UNMET, `feature` for FEATURE_DISABLED and `provider` for PROVIDER_ERROR.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: One failed field of a request.
      additionalProperties: false
      required:
        - path
        - code
      properties:
        path:
          type: string
          description: JSON pointer into the request.
        code:
          type: string
        message:
          type: string
    Money:
      type: object
      description: An amount of money; `amount` is a decimal string, never a number (conventions §1).
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^-?[0-9]+(\.[0-9]{1,4})?$
          examples:
            - '49.00'
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          examples:
            - EUR
    Page:
      type: object
      description: The page of a cursor-paginated list, next to its `data`.
      additionalProperties: false
      required:
        - nextCursor
        - limit
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Cursor of the next page for the `cursor` parameter; null on the last page.
        limit:
          type: integer
          minimum: 1
          maximum: 200
          description: The page size used.
    EmailAddress:
      type: string
      format: email
      maxLength: 254
      examples:
        - anna.berg@example.com
    Password:
      type: string
      description: >-
        A password. The schema only bounds its length; the rules (at least 10 characters, not breached) are checked by
        the service and answer `422 PASSWORD_TOO_WEAK`. Never logged, never echoed in an error.
      minLength: 1
      maxLength: 256
      writeOnly: true
    OpaqueToken:
      type: string
      description: An opaque single-use or refresh token as Velexis issued it; never logged.
      minLength: 1
      maxLength: 512
    TotpCode:
      type: string
      description: The 6-digit code of the authenticator app.
      pattern: ^[0-9]{6}$
      examples:
        - '492039'
    Locale:
      type: string
      description: BCP 47 language tag of the portal UI.
      maxLength: 35
      pattern: ^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$
      examples:
        - en
        - en-GB
    TimeZone:
      type: string
      description: IANA time zone name.
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z][A-Za-z0-9_+-]*(/[A-Za-z0-9_+-]+)*$
      examples:
        - Europe/Oslo
        - UTC
    AccountId:
      type: string
      description: Account id (`acc_` + ULID).
      pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - acc_01JA2Z9W5K7Q3M8N4P6R2T0V1X
    SessionFamilyId:
      type: string
      description: Opaque id of a refresh family (one sign-in and its rotations).
      minLength: 1
      maxLength: 64
      pattern: ^[A-Za-z0-9_-]+$
      examples:
        - asn_01JA2ZB4N8Q6R1T5V9X3Z7C2E6
    TenantStatus:
      type: string
      description: >-
        Lifecycle of an OTA: `provisioning` (created, schema not ready), `active`, `suspended`, `failed` (setup failed
        or Checkout abandoned).
      enum:
        - provisioning
        - active
        - suspended
        - failed
    TenantRole:
      type: string
      description: Role of a member in an OTA (the role matrix of platform/docs/scope.md §1.2).
      enum:
        - owner
        - admin
        - agent
        - finance
        - viewer
    SignUpRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
        - fullName
        - acceptTerms
        - termsVersion
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
        password:
          $ref: '#/components/schemas/Password'
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        acceptTerms:
          type: boolean
          const: true
          description: The person accepts the terms of service and the privacy notice.
        termsVersion:
          type: string
          minLength: 1
          maxLength: 32
          description: The version of the terms shown on the sign-up page.
          examples:
            - '2026-10-01'
    SignUpAccepted:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: verification_sent
          description: Always `verification_sent`, whether or not the address was registered.
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          $ref: '#/components/schemas/OpaqueToken'
    EmailVerified:
      type: object
      additionalProperties: false
      required:
        - accountId
        - email
        - emailVerified
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        emailVerified:
          type: boolean
          const: true
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
    SignInRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - password
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
        password:
          $ref: '#/components/schemas/Password'
    SignInResult:
      description: A session when the account has no MFA, otherwise an MFA challenge for verifyMfa.
      oneOf:
        - $ref: '#/components/schemas/PortalSession'
        - $ref: '#/components/schemas/MfaChallenge'
    PortalSession:
      type: object
      description: >-
        The tokens of a portal session and the account. Tokens appear only in these responses; the portal server keeps
        them in httpOnly cookies and never hands them to browser JavaScript.
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - account
      properties:
        accessToken:
          type: string
          description: The portal access token (EdDSA JWT, 15 minutes).
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: The opaque refresh token; single use, rotated by refreshSession.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: When this refresh token stops working (idle expiry, never after the family's absolute end).
        account:
          $ref: '#/components/schemas/Account'
    MfaChallenge:
      type: object
      description: The password was right and the account has MFA; send a code to verifyMfa.
      additionalProperties: false
      required:
        - mfaRequired
        - mfaChallengeToken
        - expiresIn
      properties:
        mfaRequired:
          type: boolean
          const: true
        mfaChallengeToken:
          type: string
          description: The challenge (5 minutes, 5 attempts).
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the challenge expires (300).
    VerifyMfaRequest:
      description: The challenge token with either a TOTP code or one recovery code.
      oneOf:
        - $ref: '#/components/schemas/VerifyMfaWithCode'
        - $ref: '#/components/schemas/VerifyMfaWithRecoveryCode'
    VerifyMfaWithCode:
      type: object
      additionalProperties: false
      required:
        - mfaChallengeToken
        - code
      properties:
        mfaChallengeToken:
          $ref: '#/components/schemas/OpaqueToken'
        code:
          $ref: '#/components/schemas/TotpCode'
    VerifyMfaWithRecoveryCode:
      type: object
      additionalProperties: false
      required:
        - mfaChallengeToken
        - recoveryCode
      properties:
        mfaChallengeToken:
          $ref: '#/components/schemas/OpaqueToken'
        recoveryCode:
          type: string
          description: >-
            One recovery code as shown (four groups of four Crockford base32 characters); upper or lower case, with or
            without the dashes and spaces.
          minLength: 16
          maxLength: 24
          pattern: ^[0-9A-Za-z -]+$
    RefreshSessionRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          $ref: '#/components/schemas/OpaqueToken'
    SignOutRequest:
      type: object
      additionalProperties: false
      required:
        - refreshToken
      properties:
        refreshToken:
          $ref: '#/components/schemas/OpaqueToken'
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - token
        - newPassword
      properties:
        token:
          $ref: '#/components/schemas/OpaqueToken'
        newPassword:
          $ref: '#/components/schemas/Password'
    TotpCodeRequest:
      type: object
      additionalProperties: false
      required:
        - code
      properties:
        code:
          $ref: '#/components/schemas/TotpCode'
    Account:
      type: object
      description: The signed-in account with its memberships and the milestone switches.
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - fullName
        - locale
        - timeZone
        - mfaEnabled
        - mfaEnabledAt
        - isPlatformAdmin
        - createdAt
        - version
        - memberships
        - features
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        emailVerified:
          type: boolean
        fullName:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        mfaEnabled:
          type: boolean
        mfaEnabledAt:
          type:
            - string
            - 'null'
          format: date-time
        isPlatformAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; the `ETag` of the response carries it.
        memberships:
          type: array
          description: The active memberships, one per OTA.
          items:
            $ref: '#/components/schemas/AccountMembership'
        features:
          $ref: '#/components/schemas/MilestoneFeatures'
    AccountMembership:
      type: object
      additionalProperties: false
      required:
        - membershipId
        - tenantId
        - tenantKey
        - tenantName
        - tenantStatus
        - role
      properties:
        membershipId:
          type: string
          pattern: ^stf_[0-9A-HJKMNP-TV-Z]{26}$
        tenantId:
          type: string
          pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
        tenantKey:
          type: string
          pattern: ^[a-z][a-z0-9]{2,29}$
          description: The OTA's key; its storefront host is `<key>.<STOREFRONT_BASE_DOMAIN>`.
        tenantName:
          type: string
        tenantStatus:
          $ref: '#/components/schemas/TenantStatus'
        role:
          $ref: '#/components/schemas/TenantRole'
    MilestoneFeatures:
      type: object
      description: >-
        The milestone switches of PADR-0015 (`FEATURE_*` of the platform backend). The portal and the admin hide what a
        switch turns off; the backend refuses it with `403 FEATURE_DISABLED`.
      additionalProperties: false
      required:
        - stripeBilling
        - ownStripe
        - settlements
        - ownAmadeus
        - customDomains
        - liveSwitch
      properties:
        stripeBilling:
          type: boolean
        ownStripe:
          type: boolean
        settlements:
          type: boolean
        ownAmadeus:
          type: boolean
        customDomains:
          type: boolean
        liveSwitch:
          type: boolean
    UpdateMeRequest:
      type: object
      description: The fields to change; at least one.
      additionalProperties: false
      minProperties: 1
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 200
        locale:
          $ref: '#/components/schemas/Locale'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          $ref: '#/components/schemas/Password'
        newPassword:
          $ref: '#/components/schemas/Password'
    MfaSetup:
      type: object
      description: A pending TOTP secret, shown once; confirm it with enableMfa within `expiresIn` seconds.
      additionalProperties: false
      required:
        - secret
        - otpauthUrl
        - expiresIn
      properties:
        secret:
          type: string
          description: The TOTP secret in base32, for manual entry.
          pattern: ^[A-Z2-7]+=*$
        otpauthUrl:
          type: string
          format: uri
          pattern: ^otpauth://totp/
          description: The `otpauth://` URI for the QR code.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the pending secret expires (600).
    RecoveryCodes:
      type: object
      description: Ten single-use recovery codes, shown once; only their SHA-256 hashes are stored.
      additionalProperties: false
      required:
        - recoveryCodes
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            description: Four groups of four Crockford base32 characters (80 bits).
            pattern: ^[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}-[0-9A-HJKMNP-TV-Z]{4}$
    AccountSession:
      type: object
      description: One active refresh family of the account.
      additionalProperties: false
      required:
        - familyId
        - audience
        - userAgent
        - ipAddress
        - createdAt
        - lastUsedAt
        - current
      properties:
        familyId:
          $ref: '#/components/schemas/SessionFamilyId'
        audience:
          type: string
          enum:
            - portal
            - platform_admin
          description: The surface the session signs in to.
        userAgent:
          type:
            - string
            - 'null'
          maxLength: 512
          description: The end user's browser at sign-in.
        ipAddress:
          type:
            - string
            - 'null'
          maxLength: 45
          description: The end user's IP address at sign-in (IPv4 or IPv6).
        createdAt:
          type: string
          format: date-time
          description: Sign-in time.
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Last refresh; null before the first one.
        current:
          type: boolean
          description: True for the family of the calling access token.
    AccountSessionList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AccountSession'
    Plan:
      type: object
      description: A public, active plan.
      additionalProperties: false
      required:
        - code
        - name
        - description
        - monthlyPrice
        - annualPrice
        - trialDays
        - limits
        - features
        - checkoutAvailable
      properties:
        code:
          type: string
          pattern: ^[a-z][a-z0-9_]{1,39}$
          examples:
            - early_access
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        monthlyPrice:
          $ref: '#/components/schemas/Money'
        annualPrice:
          description: The yearly price, or null when the plan has no annual option.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        trialDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Free trial days on the first subscription of an OTA.
        limits:
          $ref: '#/components/schemas/PlanLimits'
        features:
          type: object
          description: Feature flags the plan unlocks, by name.
          additionalProperties:
            type: boolean
        checkoutAvailable:
          type: object
          description: Whether Stripe Checkout can start for each billing interval (the plan has a Stripe price for it).
          additionalProperties: false
          required:
            - month
            - year
          properties:
            month:
              type: boolean
            year:
              type: boolean
    PlanLimits:
      type: object
      description: The quotas of a plan.
      additionalProperties: false
      required:
        - staffSeats
        - apiKeys
        - customDomains
        - liveMode
      properties:
        staffSeats:
          type: integer
          minimum: 0
          description: Active members plus pending invitations.
        apiKeys:
          type: integer
          minimum: 0
          description: API keys that are neither revoked nor expired.
        customDomains:
          type: integer
          minimum: 0
          description: Custom storefront domains; 0 means none.
        liveMode:
          type: boolean
          description: Whether the OTA may go live.
    PlanList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Plan'
    HealthLive:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    HealthReady:
      type: object
      description: >-
        The readiness report. The age of the oldest waiting job per platform queue (ADR-0016, api-inventory-admin §9)
        joins it as the optional `queues` once the platform queues exist; until then the report has no `queues`.
      additionalProperties: false
      required:
        - status
        - checks
      properties:
        status:
          type: string
          enum:
            - ok
            - unavailable
        checks:
          type: object
          additionalProperties: false
          required:
            - postgres
            - redis
          properties:
            postgres:
              $ref: '#/components/schemas/DependencyStatus'
            redis:
              $ref: '#/components/schemas/DependencyStatus'
        queues:
          type: object
          description: Seconds since the oldest waiting job of each platform queue was added; null when none waits.
          additionalProperties:
            type:
              - integer
              - 'null'
            minimum: 0
    DependencyStatus:
      type: string
      enum:
        - ok
        - down
    TenantId:
      type: string
      description: OTA id (`ten_` + ULID).
      pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
    TenantKey:
      type: string
      description: >-
        The OTA's key: lower-case letters and digits, starting with a letter, 3–30 characters. It is also a DNS label:
        the storefront host is `<key>.<STOREFRONT_BASE_DOMAIN>` and the tenant schema `tenant_<key>`. Never changes.
      pattern: ^[a-z][a-z0-9]{2,29}$
      examples:
        - acme
    TenantName:
      type: string
      description: Display name of the OTA.
      minLength: 1
      maxLength: 100
      examples:
        - Acme Travel
    LegalName:
      type: string
      description: Legal entity name of the OTA, used on invoices.
      minLength: 1
      maxLength: 200
      examples:
        - Acme Travel AS
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country code (checked against the reference countries).
      pattern: ^[A-Z]{2}$
      examples:
        - 'NO'
    CurrencyCode:
      type: string
      description: ISO 4217 currency code (checked against the reference currencies).
      pattern: ^[A-Z]{3}$
      examples:
        - EUR
    PlanCode:
      type: string
      description: Code of a plan, as `listPlans` answers it.
      pattern: ^[a-z][a-z0-9_]{1,39}$
      examples:
        - early_access
    BillingInterval:
      type: string
      description: Billing period of a subscription.
      enum:
        - month
        - year
    Environment:
      type: string
      description: >-
        `test` (Amadeus test system, Stripe test mode, test keys) or `live` (production, from go-live in M5).
      enum:
        - test
        - live
    SuspensionReason:
      type:
        - string
        - 'null'
      description: >-
        Why the OTA is suspended (PADR-0014): `billing` (set by billing sync, resumed on payment), `abuse`, `request`
        or `admin` (set by a platform admin); `null` unless suspended.
      enum:
        - billing
        - abuse
        - request
        - admin
        - null
    BillingNotice:
      type:
        - string
        - 'null'
      description: >-
        The billing banner state that billing sync keeps on the tenant row for the portal and the OTA admin
        (ADR-0013): `past_due` while a payment failed, `trial_ending` before the trial ends; `null` otherwise.
      enum:
        - past_due
        - trial_ending
        - null
    Tenant:
      type: object
      description: >-
        An OTA as its members see it. Never holds a secret: keys, connections and the subscription have their own
        operations.
      additionalProperties: false
      required:
        - id
        - key
        - name
        - legalName
        - status
        - suspensionReason
        - billingNotice
        - planCode
        - defaultCurrency
        - countryCode
        - timeZone
        - supportEmail
        - storefrontEnvironment
        - liveEnabledAt
        - primaryHost
        - schemaVersion
        - createdAt
        - activatedAt
        - version
        - myRole
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        key:
          $ref: '#/components/schemas/TenantKey'
        name:
          type: string
          description: Display name of the OTA.
        legalName:
          type:
            - string
            - 'null'
          description: Legal entity name; `null` until set.
        status:
          $ref: '#/components/schemas/TenantStatus'
        suspensionReason:
          $ref: '#/components/schemas/SuspensionReason'
        billingNotice:
          $ref: '#/components/schemas/BillingNotice'
        planCode:
          $ref: '#/components/schemas/PlanCode'
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        countryCode:
          type:
            - string
            - 'null'
          pattern: ^[A-Z]{2}$
          description: Country where the OTA is registered (ISO 3166-1 alpha-2).
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        supportEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
          description: Business support address of the OTA; `null` until set.
        storefrontEnvironment:
          $ref: '#/components/schemas/Environment'
        liveEnabledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the storefront went live (M5); `null` before.
        primaryHost:
          type: string
          format: hostname
          description: >-
            The primary storefront host, used in links and e-mails (the sub-domain until a custom domain is made
            primary).
        schemaVersion:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{4,14}(_[a-z0-9_]+)?$
          description: The latest tenant migration applied to the OTA's schema; `null` until the setup records it.
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the setup finished; `null` before.
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; the `ETag` of the response carries it.
        myRole:
          $ref: '#/components/schemas/TenantRole'
    TenantSummary:
      type: object
      description: One OTA of the caller in a list.
      additionalProperties: false
      required:
        - id
        - key
        - name
        - status
        - role
        - planCode
        - storefrontUrl
        - storefrontEnvironment
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        key:
          $ref: '#/components/schemas/TenantKey'
        name:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        role:
          $ref: '#/components/schemas/TenantRole'
        planCode:
          $ref: '#/components/schemas/PlanCode'
        storefrontUrl:
          type: string
          format: uri
          description: '`https://<primary host>/`.'
        storefrontEnvironment:
          $ref: '#/components/schemas/Environment'
    TenantList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TenantSummary'
    KeyAvailability:
      type: object
      description: Whether a key can be used for a new OTA.
      additionalProperties: false
      required:
        - key
        - available
        - storefrontHost
      properties:
        key:
          type: string
          description: The key as checked.
        available:
          type: boolean
        reason:
          type: string
          description: >-
            Why the key is not available (only when `available` is false): `invalid` (breaks the key rules),
            `reserved` (on the reserved list) or `taken` (used by an OTA in any status).
          enum:
            - invalid
            - reserved
            - taken
        storefrontHost:
          type: string
          description: The storefront host the key gets, `<key>.<STOREFRONT_BASE_DOMAIN>`.
    CreateTenantRequest:
      type: object
      description: >-
        The new OTA. `planCode` and `billingInterval` matter from M5; before it the plan is always `early_access`.
      additionalProperties: false
      required:
        - key
        - name
        - countryCode
        - defaultCurrency
        - timeZone
      properties:
        key:
          $ref: '#/components/schemas/TenantKey'
        name:
          $ref: '#/components/schemas/TenantName'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        planCode:
          $ref: '#/components/schemas/PlanCode'
        billingInterval:
          $ref: '#/components/schemas/BillingInterval'
    TenantCreated:
      type: object
      description: >-
        The new OTA, its setup job and, from M5, the Stripe Checkout URL. `checkoutError` is present only when Stripe
        failed after the OTA was created.
      additionalProperties: false
      required:
        - tenant
        - provisioningJob
        - checkoutUrl
      properties:
        tenant:
          $ref: '#/components/schemas/Tenant'
        provisioningJob:
          type: object
          description: The setup job; follow it with `getProvisioning`.
          additionalProperties: false
          required:
            - id
            - status
          properties:
            id:
              $ref: '#/components/schemas/ProvisioningJobId'
            status:
              $ref: '#/components/schemas/ProvisioningJobStatus'
        checkoutUrl:
          type:
            - string
            - 'null'
          format: uri
          description: >-
            The Stripe Checkout page to send the browser to (M5); `null` before M5 and when Checkout could not be
            created.
        checkoutError:
          $ref: '#/components/schemas/CheckoutError'
    CheckoutError:
      type: object
      description: Why no Checkout Session was created (M5); the OTA and its job exist, and payment can start later.
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]+$
          description: An error code of the catalogue, for example `PROVIDER_ERROR`.
        message:
          type: string
          description: A message safe to show.
    UpdateTenantRequest:
      type: object
      description: The fields to change; at least one. `null` clears the legal name or the support e-mail.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          $ref: '#/components/schemas/TenantName'
        legalName:
          oneOf:
            - $ref: '#/components/schemas/LegalName'
            - type: 'null'
        supportEmail:
          oneOf:
            - $ref: '#/components/schemas/EmailAddress'
            - type: 'null'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
    GoLiveRequest:
      type: object
      description: Confirms the switch to live (M5); nothing else is sent.
      additionalProperties: false
      required:
        - confirm
      properties:
        confirm:
          type: boolean
          const: true
          description: Always `true`.
    ProvisioningJobId:
      type: string
      description: Tenant job id (`job_` + ULID).
      pattern: ^job_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - job_01JA2ZC3D7F1H5K9M3P7R1T5V9
    ProvisioningJobStatus:
      type: string
      description: >-
        `queued` (waiting for dispatch or its gate, such as Checkout in M5), `running` (dispatched), `succeeded`,
        `failed`, `canceled`.
      enum:
        - queued
        - running
        - succeeded
        - failed
        - canceled
    ProvisioningJob:
      type: object
      description: A tenant lifecycle job (PADR-0001); the portal shows the latest `provision` job.
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - step
        - steps
        - attempt
        - maxAttempts
        - error
      properties:
        id:
          $ref: '#/components/schemas/ProvisioningJobId'
        kind:
          type: string
          description: The job kind; the setup is `provision`.
          enum:
            - provision
            - migrate
            - suspend
            - resume
        status:
          $ref: '#/components/schemas/ProvisioningJobStatus'
        step:
          type:
            - string
            - 'null'
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: >-
            The current or last step, for example `dispatch` or `assign_amadeus_office`; `null` before dispatch.
        steps:
          type: array
          description: The finished steps of the OTA worker and of the platform post-steps, in order.
          items:
            $ref: '#/components/schemas/ProvisioningStep'
        attempt:
          type: integer
          minimum: 0
          description: Attempts dispatched so far.
        maxAttempts:
          type: integer
          minimum: 1
          description: The attempt budget (5).
        error:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: The last error, a short message without secrets; `null` when there is none.
    ProvisioningStep:
      type: object
      description: One finished step of a job.
      additionalProperties: false
      required:
        - step
        - status
        - startedAt
        - finishedAt
      properties:
        step:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: >-
            The step name: `create_schema`, `run_migrations`, `seed_defaults` (OTA worker), then `record_migrations`,
            `assign_amadeus_office`, `create_payment_connection`, `issue_api_keys`, `activate`, `notify` (platform).
        status:
          type: string
          enum:
            - succeeded
            - failed
            - skipped
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          $ref: '#/components/schemas/ProvisioningStepError'
    ProvisioningStepError:
      type: object
      description: Why a step failed; a stable code and a short message without values or secrets.
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 64
          description: For example `LOCK_TIMEOUT`, `CHECKSUM_MISMATCH` or a SQLSTATE.
        message:
          type: string
          maxLength: 1000
    ProvisioningStatus:
      type: object
      description: The setup progress of an OTA.
      additionalProperties: false
      required:
        - tenantStatus
        - job
        - initialKeysAvailable
      properties:
        tenantStatus:
          $ref: '#/components/schemas/TenantStatus'
        job:
          $ref: '#/components/schemas/ProvisioningJob'
        initialKeysAvailable:
          type: boolean
          description: True while the test keys issued at setup can still be revealed once (`revealInitialKeys`).
    ProvisioningRetried:
      type: object
      description: The new setup job and, from M5, the Checkout URL when the earlier Checkout was abandoned.
      additionalProperties: false
      required:
        - job
        - checkoutUrl
      properties:
        job:
          $ref: '#/components/schemas/ProvisioningJob'
        checkoutUrl:
          type:
            - string
            - 'null'
          format: uri
          description: The new Stripe Checkout page (M5), or `null` when the setup runs without payment.
    InitialKeys:
      type: object
      description: The test keys issued at setup, shown once.
      additionalProperties: false
      required:
        - keys
      properties:
        keys:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/InitialKey'
    InitialKey:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - environment
        - prefix
        - key
      properties:
        id:
          $ref: '#/components/schemas/ApiKeyId'
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        environment:
          $ref: '#/components/schemas/Environment'
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
        key:
          $ref: '#/components/schemas/ApiKeySecret'
    OnboardingChecklist:
      type: object
      description: The onboarding checklist of PADR-0018, computed on every call.
      additionalProperties: false
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OnboardingItem'
    OnboardingItem:
      type: object
      description: One checklist item.
      additionalProperties: false
      required:
        - id
        - label
        - done
        - href
        - milestone
      properties:
        id:
          type: string
          description: The item (PADR-0018), in this order.
          enum:
            - email_verified
            - mfa_enabled
            - ota_active
            - api_key
            - storefront_open
            - amadeus_test
            - team_invited
            - plan_chosen
            - custom_domain
            - payments_ready
            - live_requested
        label:
          type: string
          description: The text the portal shows.
        done:
          type: boolean
        href:
          type: string
          format: uri-reference
          description: A portal path, or the storefront URL for `storefront_open`.
        milestone:
          type: string
          description: The milestone that brings the item; `M5` items appear only while their switch is on.
          enum:
            - M1
            - M5
    MembershipId:
      type: string
      description: Membership id, the staff id of the OTA admin (`stf_` + ULID).
      pattern: ^stf_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - stf_01JA2ZA1C5E9G3J7K2M6P0R4T8
    Member:
      type: object
      description: A member of an OTA.
      additionalProperties: false
      required:
        - id
        - accountId
        - fullName
        - email
        - role
        - status
        - mfaEnabled
        - createdAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/MembershipId'
        accountId:
          $ref: '#/components/schemas/AccountId'
        fullName:
          type: string
        email:
          $ref: '#/components/schemas/EmailAddress'
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          type: string
          description: The membership state; `listMembers` answers active members only.
          enum:
            - active
            - suspended
            - removed
        mfaEnabled:
          type: boolean
          description: Whether the member's account has MFA on.
        createdAt:
          type: string
          format: date-time
          description: When the person joined.
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; send it in `If-Match` to `updateMember`.
    MemberList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'
    UpdateMemberRequest:
      type: object
      additionalProperties: false
      required:
        - role
      properties:
        role:
          $ref: '#/components/schemas/TenantRole'
    AccountReference:
      type: object
      description: An account named in a resource, for example who invited a person or created a key.
      additionalProperties: false
      required:
        - accountId
        - fullName
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        fullName:
          type: string
    Invitation:
      type: object
      description: An invitation to join an OTA. The token is never answered; only its hash is stored.
      additionalProperties: false
      required:
        - id
        - email
        - role
        - status
        - invitedBy
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          pattern: ^ivt_[0-9A-HJKMNP-TV-Z]{26}$
        email:
          $ref: '#/components/schemas/EmailAddress'
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
          type: string
          enum:
            - pending
            - accepted
            - revoked
            - expired
        invitedBy:
          description: Who sent the invitation; `null` when that account no longer exists.
          oneOf:
            - $ref: '#/components/schemas/AccountReference'
            - type: 'null'
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    InvitationList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'
    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - role
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
        role:
          $ref: '#/components/schemas/TenantRole'
    InvitationTokenRequest:
      type: object
      additionalProperties: false
      required:
        - token
      properties:
        token:
          $ref: '#/components/schemas/OpaqueToken'
    InvitationPreview:
      type: object
      description: What the accept page shows before the person signs in.
      additionalProperties: false
      required:
        - tenantName
        - role
        - email
        - inviterName
        - expiresAt
      properties:
        tenantName:
          type: string
        role:
          $ref: '#/components/schemas/TenantRole'
        email:
          $ref: '#/components/schemas/EmailAddress'
        inviterName:
          type:
            - string
            - 'null'
          description: The inviter's name; `null` when that account no longer exists.
        expiresAt:
          type: string
          format: date-time
    InvitationAccepted:
      type: object
      additionalProperties: false
      required:
        - membership
        - tenant
      properties:
        membership:
          $ref: '#/components/schemas/Member'
        tenant:
          $ref: '#/components/schemas/TenantSummary'
    PortalToken:
      type: string
      description: >-
        A one-time portal token for the OTA admin's single sign-on (PADR-0007): `ptk_` and 43 base62 characters
        (256 bits), within the OTA contract's `ConsolePortalTokenSignIn.portalToken` pattern. Never logged, never in a
        URL.
      pattern: ^ptk_[0-9A-Za-z]{43}$
    ConsoleToken:
      type: object
      description: >-
        What the portal posts to the OTA admin: the token, when it stops working, and where to post it.
      additionalProperties: false
      required:
        - portalToken
        - expiresAt
        - consoleSsoUrl
      properties:
        portalToken:
          $ref: '#/components/schemas/PortalToken'
        expiresAt:
          type: string
          format: date-time
          description: When the token expires, 60 seconds after it was issued; it also stops working once redeemed.
        consoleSsoUrl:
          type: string
          format: uri
          description: >-
            The OTA admin's sign-on URL, `PUBLIC_OTA_ADMIN_URL` with `/sso` (`https://admin.ota.example.com/sso` in
            production); the portal posts the token there as the form field `portalToken`.
    ApiKeyId:
      type: string
      description: API key id (`key_` + ULID).
      pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - key_01JA2ZD8E2G6J0K4N8Q2S6W0Y4
    ApiKeyKind:
      type: string
      description: '`publishable` (`pk_`, safe in a browser, customer scope only) or `secret` (`sk_`, server only).'
      enum:
        - publishable
        - secret
    ApiKeyPrefix:
      type: string
      description: The first 14 characters of the key, shown in the portal and used as the lookup key.
      pattern: ^(pk|sk)_(test|live)_[A-Za-z0-9]{6}$
      examples:
        - sk_test_Ab12Cd
    ApiKeySecret:
      type: string
      description: >-
        The full key, `<pk|sk>_<environment>_` plus 40 base62 characters (PADR-0005). Answered once, with
        `Cache-Control: no-store`; never stored in clear and never logged.
      pattern: ^(pk|sk)_(test|live)_[A-Za-z0-9]{40}$
    ApiKeyOrigin:
      type: string
      description: >-
        An exact browser origin `scheme://host[:port]`: `https`, or `http://localhost:<port>` and
        `http://127.0.0.1:<port>` on test keys; no wildcard, path or trailing slash (checked by the service).
      maxLength: 300
      pattern: ^https?://[^/?#\s]+$
      examples:
        - https://www.acme-travel.example.com
    ApiKeyScope:
      type: string
      description: >-
        A `ConsoleApiKeyScope` (`storefront`, `console`, `console:automation`) or `StaffPermission` (`bookings:read`,
        …) value of the OTA contract. The service checks the values and their combination against the generated OTA
        types, so a new OTA permission needs no platform change (PADR-0005 item 6).
      minLength: 1
      maxLength: 64
      pattern: ^[a-z][a-z_]*(:[a-z_]+)?$
      examples:
        - storefront
    ApiKey:
      type: object
      description: An API key without the key itself; only its HMAC is stored.
      additionalProperties: false
      required:
        - id
        - name
        - kind
        - environment
        - prefix
        - last4
        - allowedOrigins
        - scopes
        - createdAt
        - createdBy
        - lastUsedAt
        - expiresAt
        - revokedAt
      properties:
        id:
          $ref: '#/components/schemas/ApiKeyId'
        name:
          type: string
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        environment:
          $ref: '#/components/schemas/Environment'
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
        last4:
          type: string
          pattern: ^[A-Za-z0-9]{4}$
          description: The last 4 characters of the key.
        allowedOrigins:
          type: array
          description: Browser origins of a publishable key; always empty for a secret key.
          items:
            $ref: '#/components/schemas/ApiKeyOrigin'
        scopes:
          type: array
          description: Scopes of a secret key; always empty for a publishable key.
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        createdAt:
          type: string
          format: date-time
        createdBy:
          description: Who created the key; `null` for the keys issued at setup.
          oneOf:
            - $ref: '#/components/schemas/AccountReference'
            - type: 'null'
        lastUsedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The last authenticated request, up to 5 minutes stale; `null` before the first.
        expiresAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key stops working (set by its creator or by a roll); `null` for no expiry.
        revokedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the key was revoked; `null` while it is not.
    ApiKeyList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    CreateApiKeyRequest:
      type: object
      description: >-
        A new key. `allowedOrigins` applies to publishable keys and `scopes` to secret keys (default `["storefront"]`);
        the service refuses the other combination with `VALIDATION_FAILED`.
      additionalProperties: false
      required:
        - name
        - kind
        - environment
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        environment:
          $ref: '#/components/schemas/Environment'
        allowedOrigins:
          type: array
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyOrigin'
        scopes:
          type: array
          maxItems: 32
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyScope'
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry, in the future.
    ApiKeyCreated:
      type: object
      description: The new key's settings and the full key, shown once.
      additionalProperties: false
      required:
        - apiKey
        - key
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          $ref: '#/components/schemas/ApiKeySecret'
    UpdateApiKeyRequest:
      type: object
      description: The fields to change; at least one. Kind, environment and scopes never change.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        allowedOrigins:
          type: array
          description: The new origins of a publishable key (replaces the list).
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ApiKeyOrigin'
    RollApiKeyRequest:
      type: object
      additionalProperties: false
      required:
        - expireOldIn
      properties:
        expireOldIn:
          type: string
          description: When the old key stops working.
          enum:
            - now
            - 1h
            - 24h
            - 7d
    ApiKeyRolled:
      type: object
      description: The new key, shown once, and the old key's new expiry.
      additionalProperties: false
      required:
        - apiKey
        - key
        - previous
      properties:
        apiKey:
          $ref: '#/components/schemas/ApiKey'
        key:
          $ref: '#/components/schemas/ApiKeySecret'
        previous:
          type: object
          additionalProperties: false
          required:
            - id
            - expiresAt
          properties:
            id:
              $ref: '#/components/schemas/ApiKeyId'
            expiresAt:
              type: string
              format: date-time
    Domain:
      type: object
      description: A storefront host of the OTA (PADR-0004).
      additionalProperties: false
      required:
        - id
        - hostname
        - kind
        - purpose
        - isPrimary
        - verificationStatus
        - dnsRecords
        - verificationDeadlineAt
        - lastCheckedAt
        - lastCheckError
        - tlsStatus
        - tlsExpiresAt
        - createdAt
      properties:
        id:
          type: string
          pattern: ^dom_[0-9A-HJKMNP-TV-Z]{26}$
        hostname:
          type: string
          format: hostname
          description: The host name, lower case.
        kind:
          type: string
          description: '`subdomain` (`<key>.<STOREFRONT_BASE_DOMAIN>`, Velexis owns the zone) or `custom` (M5).'
          enum:
            - subdomain
            - custom
        purpose:
          type: string
          description: What the host serves; only `storefront` in the MVP.
          enum:
            - storefront
            - api
            - console
        isPrimary:
          type: boolean
          description: The primary host, used in links and e-mails.
        verificationStatus:
          type: string
          enum:
            - pending
            - verified
            - failed
        dnsRecords:
          type: array
          description: The DNS records to create for a custom domain; empty for the sub-domain.
          items:
            $ref: '#/components/schemas/DnsRecord'
        verificationDeadlineAt:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the 72-hour verification window of a custom domain; `null` for the sub-domain.
        lastCheckedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastCheckError:
          type:
            - string
            - 'null'
          maxLength: 500
          description: What the last DNS check found missing, safe to show.
        tlsStatus:
          type: string
          enum:
            - pending
            - issued
            - failed
            - expired
        tlsExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    DnsRecord:
      type: object
      description: >-
        One DNS record for a custom domain: the `TXT` ownership record, and either the `CNAME` or the `A`/`AAAA`
        routing records.
      additionalProperties: false
      required:
        - type
        - name
        - value
      properties:
        type:
          type: string
          enum:
            - TXT
            - CNAME
            - A
            - AAAA
        name:
          type: string
          description: The record name (fully qualified).
        value:
          type: string
          description: The record value.
    DomainList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
    AddDomainRequest:
      type: object
      description: The custom storefront domain to add (M5).
      additionalProperties: false
      required:
        - hostname
      properties:
        hostname:
          type: string
          minLength: 1
          maxLength: 254
          description: >-
            The host name as the owner typed it. The service normalises it (lower case, punycode, no trailing dot) and
            checks the host name rules, so a malformed host answers `422 DOMAIN_INVALID`, not `400`.
          examples:
            - travel.acme-travel.example.com
    AmadeusOfficeId:
      type: string
      description: An Amadeus office id (9 characters).
      pattern: ^[A-Z0-9]{9}$
      examples:
        - NCE1A0955
    PendingCredentialSubmission:
      type: object
      description: >-
        The latest submission of the OTA's own credentials (M5, PADR-0010), while it is open or after it failed. Never
        holds the submitted secret.
      additionalProperties: false
      required:
        - id
        - status
        - errorCode
      properties:
        id:
          type: string
          pattern: ^crs_[0-9A-HJKMNP-TV-Z]{26}$
        status:
          type: string
          enum:
            - pending
            - verifying
            - failed
        errorCode:
          type:
            - string
            - 'null'
          description: Why the verification failed, for example `AMADEUS_CREDENTIALS_INVALID`; `null` unless `failed`.
    AmadeusTicketingDefaults:
      type: object
      description: >-
        Defaults the OTA backend applies when it creates a flight order (`supplier_connections.ticketing_defaults`);
        empty until set. The update arrives in M4 (`updateAmadeusConnection`).
      additionalProperties: false
      properties:
        ticketingAgreement:
          type: object
          description: The Amadeus `ticketingAgreement` of new orders.
          additionalProperties: false
          required:
            - option
          properties:
            option:
              type: string
              enum:
                - CONFIRM
                - DELAY_TO_QUEUE
                - DELAY_TO_CANCEL
            delay:
              type: string
              pattern: ^[0-9]{1,3}D$
              description: Days before the automatic process, for example `2D`.
        automatedProcess:
          type: array
          description: The Amadeus `automatedProcess` entries of new orders.
          items:
            $ref: '#/components/schemas/AmadeusAutomatedProcessDefault'
        issue:
          type: boolean
          description: Whether new orders are issued at once.
    AmadeusAutomatedProcessDefault:
      type: object
      description: One Amadeus `automatedProcess` entry (the OTA contract's `AmadeusAutomatedProcess`).
      additionalProperties: false
      required:
        - code
      properties:
        code:
          type: string
          enum:
            - IMMEDIATE
            - DELAYED
            - ERROR
        queue:
          type: object
          additionalProperties: false
          properties:
            number:
              type: string
              pattern: ^[0-9]{1,3}$
            category:
              type: string
              pattern: ^[0-9]{1,3}$
        officeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        delay:
          type: string
          pattern: ^[0-9]{1,3}D$
        text:
          type: string
          maxLength: 200
    AmadeusMonitoredQueue:
      type: object
      description: An Amadeus queue that the OTA backend polls into its queue snapshots.
      additionalProperties: false
      required:
        - officeId
        - queueId
        - category
      properties:
        officeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        queueId:
          type: integer
          minimum: 0
          maximum: 99
          description: >-
            Queue number, 0–99 (Queue List `queue-id`, as the OTA document's console queue reads bound it; the OTA
            backend's poller skips any other value).
        category:
          type: integer
          minimum: 0
          maximum: 254
          description: Queue category.
    AmadeusConnection:
      type: object
      description: >-
        The Amadeus connection of one environment. Never holds a client secret or any ciphertext.
      additionalProperties: false
      required:
        - id
        - environment
        - credentialSource
        - status
        - officeIds
        - defaultOfficeId
        - queuingOfficeId
        - ownerOfficeId
        - clientId
        - ticketingDefaults
        - monitoredQueues
        - lastVerifiedAt
        - lastError
        - pendingSubmission
        - version
      properties:
        id:
          type: string
          pattern: ^sc_[0-9A-HJKMNP-TV-Z]{26}$
        environment:
          $ref: '#/components/schemas/Environment'
        credentialSource:
          type: string
          description: >-
            `velexis`: the Velexis Amadeus account through offices assigned from the pool; `tenant`: the OTA's own
            credentials (M5).
          enum:
            - velexis
            - tenant
        status:
          type: string
          description: >-
            `pending_verification` (no office yet, or credentials not verified), `active`, `invalid_credentials`,
            `disabled`.
          enum:
            - pending_verification
            - active
            - invalid_credentials
            - disabled
        officeIds:
          type: array
          description: The office ids the connection may act for.
          items:
            $ref: '#/components/schemas/AmadeusOfficeId'
        defaultOfficeId:
          description: The office used when the caller names none.
          oneOf:
            - $ref: '#/components/schemas/AmadeusOfficeId'
            - type: 'null'
        queuingOfficeId:
          description: The default `queuingOfficeId` of new flight orders.
          oneOf:
            - $ref: '#/components/schemas/AmadeusOfficeId'
            - type: 'null'
        ownerOfficeId:
          description: The default `ownerOfficeId` of new flight orders.
          oneOf:
            - $ref: '#/components/schemas/AmadeusOfficeId'
            - type: 'null'
        clientId:
          type:
            - string
            - 'null'
          description: The client id of the OTA's own credentials (not a secret); `null` for `velexis`.
        ticketingDefaults:
          $ref: '#/components/schemas/AmadeusTicketingDefaults'
        monitoredQueues:
          type: array
          items:
            $ref: '#/components/schemas/AmadeusMonitoredQueue'
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastError:
          type:
            - string
            - 'null'
          maxLength: 500
          description: The last verification error (HTTP status and Amadeus code), never a secret or a provider body.
        pendingSubmission:
          oneOf:
            - $ref: '#/components/schemas/PendingCredentialSubmission'
            - type: 'null'
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version for the M4 update.
    AmadeusConnectionList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AmadeusConnection'
    UpdateAmadeusConnectionRequest:
      type: object
      description: >-
        The settings to change; at least one. A field that is sent replaces the stored value. Every office id must be
        one of the connection's `officeIds` (checked by the service, `400 VALIDATION_FAILED` otherwise).
      additionalProperties: false
      minProperties: 1
      properties:
        defaultOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        queuingOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        ownerOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        ticketingDefaults:
          $ref: '#/components/schemas/AmadeusTicketingDefaults'
        monitoredQueues:
          type: array
          description: The queues to poll, replacing the list; `[]` stops polling. Each queue at most once.
          maxItems: 20
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AmadeusMonitoredQueue'
    RequestLiveAmadeusRequest:
      type: object
      description: An optional note for Velexis's operations team about the live access (M5).
      additionalProperties: false
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 1000
          description: Shown to ops in the alert e-mail and kept in the audit row; no secrets.
    OwnAmadeusClientSecret:
      type: string
      description: >-
        The OAuth2 client secret Amadeus issued to the OTA. Write-only: envelope-encrypted at once, never logged, never
        answered, never put in a queue message, and erased from the submission when its verification ends.
      minLength: 1
      maxLength: 512
      writeOnly: true
    SubmitAmadeusCredentialsRequest:
      type: object
      description: >-
        The OTA's own Amadeus credentials for one environment (M5). `defaultOfficeId` and, when sent, `queuingOfficeId`
        and `ownerOfficeId` must be among `officeIds` (checked by the service, `400 VALIDATION_FAILED` otherwise); the
        two optional offices default to `defaultOfficeId`.
      additionalProperties: false
      required:
        - clientId
        - clientSecret
        - officeIds
        - defaultOfficeId
      properties:
        clientId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^\S+$
          description: The OAuth2 client id Amadeus issued to the OTA (not a secret; `listAmadeusConnections` shows it).
        clientSecret:
          $ref: '#/components/schemas/OwnAmadeusClientSecret'
        officeIds:
          type: array
          description: The office ids the credentials may act for, each at most once.
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            $ref: '#/components/schemas/AmadeusOfficeId'
        defaultOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        queuingOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        ownerOfficeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
    CredentialSubmissionId:
      type: string
      description: Credential submission id (`crs_` + ULID).
      pattern: ^crs_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - crs_01JD4Q2S6V0X4Z8B2D6F0H4K8N
    CredentialSubmission:
      type: object
      description: >-
        A submission of the OTA's own credentials and its verification (M5, PADR-0010). Never holds the submitted
        secrets or their ciphertexts, nor the non-secret fields of the submission.
      additionalProperties: false
      required:
        - id
        - kind
        - environment
        - status
        - errorCode
        - errorMessage
        - createdAt
        - finishedAt
      properties:
        id:
          $ref: '#/components/schemas/CredentialSubmissionId'
        kind:
          type: string
          description: '`amadeus` (own Amadeus credentials) or `stripe_api_keys` (own Stripe API keys).'
          enum:
            - amadeus
            - stripe_api_keys
        environment:
          $ref: '#/components/schemas/Environment'
        status:
          type: string
          description: >-
            `pending` (waiting for the worker), `verifying`, `applied` (the connection uses the credentials), `failed`
            or `superseded` (a newer submission of the same environment replaced it). The last three are final.
          enum:
            - pending
            - verifying
            - applied
            - failed
            - superseded
        errorCode:
          type:
            - string
            - 'null'
          pattern: ^[A-Z][A-Z0-9_]+$
          description: >-
            Why the verification failed, a stable code for the portal: `AMADEUS_CREDENTIALS_INVALID`,
            `STRIPE_KEY_INVALID`, `STRIPE_LIVEMODE_MISMATCH` or `PROVIDER_UNAVAILABLE`; `null` unless `failed`. These
            are verification results, not error codes of the API.
        errorMessage:
          type:
            - string
            - 'null'
          maxLength: 500
          description: >-
            The sanitised reason: the provider's HTTP status and error code, never a provider body or a secret; `null`
            unless `failed`.
        createdAt:
          type: string
          format: date-time
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the submission reached a final status; `null` while it is open.
    CredentialSubmissionAccepted:
      type: object
      description: The new submission, `pending` until the worker verifies it.
      additionalProperties: false
      required:
        - submission
      properties:
        submission:
          $ref: '#/components/schemas/CredentialSubmission'
    PaymentCapabilities:
      type: object
      description: >-
        The connected Stripe account's state from `account.updated` (Connect Standard, M5); empty in `velexis` mode.
      additionalProperties: false
      properties:
        chargesEnabled:
          type: boolean
        payoutsEnabled:
          type: boolean
        detailsSubmitted:
          type: boolean
    PaymentConnection:
      type: object
      description: >-
        The Stripe connection of one environment. Never holds a secret key, a webhook secret or any ciphertext.
      additionalProperties: false
      required:
        - id
        - environment
        - provider
        - accountMode
        - status
        - accountReference
        - publishableKey
        - statementDescriptorSuffix
        - capabilities
        - connectedAt
        - disconnectedAt
        - webhookUrl
        - pendingSubmission
        - version
      properties:
        id:
          type: string
          pattern: ^ppc_[0-9A-HJKMNP-TV-Z]{26}$
        environment:
          $ref: '#/components/schemas/Environment'
        provider:
          type: string
          enum:
            - stripe
        accountMode:
          type: string
          description: >-
            `velexis`: the Velexis Stripe account, settled monthly (default); `connect_standard`: the OTA's account
            through Connect; `api_keys`: the OTA's account through its own keys (both M5).
          enum:
            - velexis
            - connect_standard
            - api_keys
        status:
          type: string
          description: '`pending` (the account cannot charge yet), `active`, `disabled`, `error`.'
          enum:
            - pending
            - active
            - disabled
            - error
        accountReference:
          type:
            - string
            - 'null'
          pattern: ^acct_[A-Za-z0-9]+$
          description: The OTA's Stripe account id; `null` in `velexis` mode.
        publishableKey:
          type:
            - string
            - 'null'
          pattern: ^pk_(test|live)_[A-Za-z0-9]+$
          description: The OTA's Stripe publishable key (`api_keys` mode); `null` otherwise.
        statementDescriptorSuffix:
          type:
            - string
            - 'null'
          pattern: ^[A-Za-z0-9][A-Za-z0-9 .&-]{1,21}$
          description: The card statement suffix with the OTA's brand (`velexis` mode).
        capabilities:
          $ref: '#/components/schemas/PaymentCapabilities'
        connectedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the OTA's own account was connected.
        disconnectedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the OTA's own account was disconnected.
        webhookUrl:
          type:
            - string
            - 'null'
          format: uri
          description: The webhook URL to configure in the OTA's Stripe account (`api_keys` mode); `null` otherwise.
        pendingSubmission:
          oneOf:
            - $ref: '#/components/schemas/PendingCredentialSubmission'
            - type: 'null'
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version for the M3 update.
    PaymentConnectionList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PaymentConnection'
    StatementDescriptorSuffix:
      type: string
      description: >-
        A card statement descriptor suffix as an owner enters it: 2 to 22 characters, only ASCII letters, digits and
        spaces, starting with a letter or a digit and holding at least one letter. Stripe's forbidden characters (`<`,
        `>`, `\`, `'`, `"`, `*`) are outside that set. Every value also meets the `CHECK` of
        `payment_provider_connections.statement_descriptor_suffix`.
      minLength: 2
      maxLength: 22
      pattern: ^(?=[0-9 ]*[A-Za-z])[A-Za-z0-9][A-Za-z0-9 ]*$
      examples:
        - ACME TRAVEL
    UpdatePaymentConnectionRequest:
      type: object
      additionalProperties: false
      required:
        - statementDescriptorSuffix
      properties:
        statementDescriptorSuffix:
          $ref: '#/components/schemas/StatementDescriptorSuffix'
    StripeConnectStart:
      type: object
      description: >-
        Where to send the browser to connect a Stripe account (M5). The URL holds the single-use OAuth state, so the
        answer is `no-store`.
      additionalProperties: false
      required:
        - authorizeUrl
        - expiresAt
      properties:
        authorizeUrl:
          type: string
          format: uri
          pattern: ^https://connect\.stripe\.com/oauth/authorize\?
          description: Stripe's Connect OAuth authorize URL with Velexis's client id, `scope=read_write` and the state.
        expiresAt:
          type: string
          format: date-time
          description: When the state expires (10 minutes); start again after it.
    StripeConnectState:
      type: string
      description: >-
        The OAuth `state` that `startStripeConnect` put in the authorize URL and Stripe sent back. Write-only: single
        use, never logged and never answered.
      minLength: 16
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      writeOnly: true
    StripeConnectCode:
      type: string
      description: >-
        The OAuth authorisation code Stripe sent back (`ac_…`). Write-only: exchanged once with Velexis's secret key,
        never logged and never answered.
      minLength: 1
      maxLength: 255
      pattern: ^[A-Za-z0-9_]+$
      writeOnly: true
    CompleteStripeConnectRequest:
      description: >-
        What Stripe sent back to the portal's callback page (M5): the state with the code, or the state with an error.
        Exactly one of the two shapes.
      oneOf:
        - $ref: '#/components/schemas/StripeConnectAuthorized'
        - $ref: '#/components/schemas/StripeConnectRefused'
    StripeConnectAuthorized:
      type: object
      description: The person authorised Velexis on Stripe.
      additionalProperties: false
      required:
        - state
        - code
      properties:
        state:
          $ref: '#/components/schemas/StripeConnectState'
        code:
          $ref: '#/components/schemas/StripeConnectCode'
    StripeConnectRefused:
      type: object
      description: Stripe reported an error, for example the person declined (`access_denied`).
      additionalProperties: false
      required:
        - state
        - error
      properties:
        state:
          $ref: '#/components/schemas/StripeConnectState'
        error:
          type: string
          minLength: 1
          maxLength: 100
          pattern: ^[a-z][a-z_]*$
          description: Stripe's OAuth error code, for example `access_denied`.
        errorDescription:
          type: string
          maxLength: 500
          description: Stripe's human-readable description of the error.
    StripeConnectCompleted:
      type: object
      description: The OTA of the state and its payment connections after the switch (M5).
      additionalProperties: false
      required:
        - tenantId
        - connections
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
        connections:
          type: array
          description: The OTA's payment connections, test first.
          items:
            $ref: '#/components/schemas/PaymentConnection'
    StripeSecretKey:
      type: string
      description: >-
        A secret key (`sk_`) or restricted key (`rk_`) of the OTA's own Stripe account, of the path's environment.
        Write-only: envelope-encrypted at once, never logged, never answered, never put in a queue message, and erased
        from the submission when its verification ends.
      maxLength: 255
      pattern: ^(sk|rk)_(test|live)_[A-Za-z0-9]+$
      writeOnly: true
    StripeWebhookSecret:
      type: string
      description: >-
        The signing secret (`whsec_`) of the webhook endpoint the OTA creates in its Stripe account for `webhookUrl`.
        Write-only, like the secret key.
      maxLength: 255
      pattern: ^whsec_[A-Za-z0-9_-]+$
      writeOnly: true
    SubmitStripeApiKeysRequest:
      type: object
      description: >-
        The OTA's own Stripe keys for one environment (M5). Every key must carry the environment's prefix (`_test_` or
        `_live_`; checked by the service, `400 VALIDATION_FAILED` otherwise).
      additionalProperties: false
      required:
        - publishableKey
        - secretKey
        - webhookSecret
      properties:
        publishableKey:
          type: string
          maxLength: 255
          pattern: ^pk_(test|live)_[A-Za-z0-9]+$
          description: The publishable key of the OTA's Stripe account (not a secret; the connection shows it).
        secretKey:
          $ref: '#/components/schemas/StripeSecretKey'
        webhookSecret:
          $ref: '#/components/schemas/StripeWebhookSecret'
    StripeApiKeysSubmitted:
      type: object
      description: The new submission and the webhook endpoint to create in the OTA's Stripe dashboard (M5).
      additionalProperties: false
      required:
        - submission
        - webhookUrl
        - webhookEvents
      properties:
        submission:
          $ref: '#/components/schemas/CredentialSubmission'
        webhookUrl:
          type: string
          format: uri
          pattern: ^https://[^/]+/webhooks/stripe/c/ppc_[0-9A-HJKMNP-TV-Z]{26}$
          description: >-
            The endpoint URL to enter in Stripe: the OTA backend's webhook receiver for this connection,
            `https://api.ota.example.com/webhooks/stripe/c/<ppc_id>`.
        webhookEvents:
          type: array
          description: The events to enable on the endpoint.
          items:
            type: string
            pattern: ^[a-z_]+(\.[a-z_]+)+$
    Subscription:
      type: object
      description: The OTA's subscription to a Velexis plan.
      additionalProperties: false
      required:
        - id
        - planCode
        - planName
        - status
        - billingProvider
        - billingInterval
        - trialEndsAt
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - banner
        - canManageInStripe
      properties:
        id:
          type: string
          pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
        planCode:
          $ref: '#/components/schemas/PlanCode'
        planName:
          type: string
        status:
          type: string
          description: >-
            Stripe's subscription statuses; manual subscriptions use `trialing`, `past_due` and `canceled` only.
          enum:
            - trialing
            - active
            - past_due
            - paused
            - canceled
            - incomplete
            - incomplete_expired
            - unpaid
        billingProvider:
          type: string
          description: '`manual` (the trial before M5) or `stripe`.'
          enum:
            - stripe
            - manual
        billingInterval:
          $ref: '#/components/schemas/BillingInterval'
        trialEndsAt:
          type:
            - string
            - 'null'
          format: date-time
        currentPeriodEnd:
          type:
            - string
            - 'null'
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        banner:
          type:
            - string
            - 'null'
          description: The billing banner of the portal; `null` when there is none.
          enum:
            - past_due
            - trial_ending
            - canceled
            - null
        canManageInStripe:
          type: boolean
          description: True for a Stripe subscription, managed in the Stripe Customer Portal (M5).
    CreateCheckoutSessionRequest:
      type: object
      description: The paid plan to subscribe to (M5).
      additionalProperties: false
      required:
        - planCode
        - billingInterval
      properties:
        planCode:
          $ref: '#/components/schemas/PlanCode'
        billingInterval:
          $ref: '#/components/schemas/BillingInterval'
    CheckoutSession:
      type: object
      description: A Stripe Checkout Session to send the browser to (M5).
      additionalProperties: false
      required:
        - url
        - expiresAt
      properties:
        url:
          type: string
          format: uri
          description: The Stripe Checkout page.
        expiresAt:
          type: string
          format: date-time
          description: When Stripe expires the session; ask for a new one after it.
    CustomerPortalSession:
      type: object
      description: >-
        A Stripe Customer Portal session (M5). The URL signs its holder in to the portal, so the answer is `no-store`.
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: The Stripe Customer Portal session URL.
    Invoice:
      type: object
      description: >-
        A Velexis invoice to the OTA, synchronised from Stripe (M5): the fields of `AdminInvoice` that the portal shows,
        with the same schemas.
      additionalProperties: false
      required:
        - id
        - number
        - status
        - total
        - amountDue
        - amountPaid
        - periodStart
        - periodEnd
        - issuedAt
        - paidAt
        - hostedInvoiceUrl
        - invoicePdfUrl
      properties:
        id:
          type: string
          pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
        number:
          type: string
          description: The legal invoice number.
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        total:
          $ref: '#/components/schemas/Money'
        amountDue:
          $ref: '#/components/schemas/Money'
        amountPaid:
          $ref: '#/components/schemas/Money'
        periodStart:
          type:
            - string
            - 'null'
          format: date-time
        periodEnd:
          type:
            - string
            - 'null'
          format: date-time
        issuedAt:
          type:
            - string
            - 'null'
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        hostedInvoiceUrl:
          type:
            - string
            - 'null'
          format: uri
        invoicePdfUrl:
          type:
            - string
            - 'null'
          format: uri
    InvoiceList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
    PayoutAccountStatus:
      type: string
      description: '`pending_review` until a platform admin verifies it (every change resets it), `verified` or `rejected`.'
      enum:
        - pending_review
        - verified
        - rejected
    PayoutScheme:
      type: string
      description: '`iban` (IBAN and an optional BIC) or `local` (an account number and a routing number).'
      enum:
        - iban
        - local
    PayoutAccount:
      type: object
      description: >-
        The bank account where Velexis pays the OTA's settlements (M5, PADR-0003 item 10), masked. Never holds the
        IBAN, the BIC, the account or routing number, or their ciphertext.
      additionalProperties: false
      required:
        - accountHolderName
        - countryCode
        - currency
        - scheme
        - last4
        - status
        - reviewNote
        - updatedAt
        - version
      properties:
        accountHolderName:
          type: string
          description: The legal name on the bank account.
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scheme:
          $ref: '#/components/schemas/PayoutScheme'
        last4:
          type: string
          pattern: ^[A-Z0-9]{4}$
          description: The last 4 characters of the IBAN or account number, for display.
        status:
          $ref: '#/components/schemas/PayoutAccountStatus'
        reviewNote:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: The reviewer's note, set with a rejection; `null` otherwise.
        updatedAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; the `ETag` of the response carries it.
    PayoutAccountHolderName:
      type: string
      description: The legal name on the bank account.
      minLength: 1
      maxLength: 200
    Iban:
      type: string
      description: >-
        An IBAN, spaces and lower case allowed; the service removes the spaces, upper-cases it and checks the mod-97
        checksum. Write-only: envelope-encrypted at once, never logged and never answered.
      minLength: 15
      maxLength: 42
      pattern: ^[A-Za-z]{2}[0-9]{2}[A-Za-z0-9 ]{11,38}$
      writeOnly: true
    Bic:
      type: string
      description: The BIC (SWIFT code) of the bank, 8 or 11 characters. Write-only, like the IBAN.
      pattern: ^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$
      writeOnly: true
    BankAccountNumber:
      type: string
      description: >-
        A national bank account number. Write-only: envelope-encrypted at once, never logged and never answered.
      minLength: 4
      maxLength: 34
      pattern: ^[A-Za-z0-9][A-Za-z0-9 -]*$
      writeOnly: true
    BankRoutingNumber:
      type: string
      description: >-
        The national routing number of the bank (for example an ABA routing number or a sort code). Write-only, like the
        account number.
      minLength: 3
      maxLength: 20
      pattern: ^[A-Za-z0-9][A-Za-z0-9 -]*$
      writeOnly: true
    SetPayoutAccountRequest:
      description: 'The bank account (M5): an IBAN account or a local one, told apart by `scheme`.'
      oneOf:
        - $ref: '#/components/schemas/IbanPayoutAccountRequest'
        - $ref: '#/components/schemas/LocalPayoutAccountRequest'
    IbanPayoutAccountRequest:
      type: object
      description: A bank account identified by its IBAN.
      additionalProperties: false
      required:
        - accountHolderName
        - countryCode
        - currency
        - scheme
        - iban
      properties:
        accountHolderName:
          $ref: '#/components/schemas/PayoutAccountHolderName'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scheme:
          type: string
          const: iban
        iban:
          $ref: '#/components/schemas/Iban'
        bic:
          $ref: '#/components/schemas/Bic'
    LocalPayoutAccountRequest:
      type: object
      description: A bank account identified by a national account number and routing number.
      additionalProperties: false
      required:
        - accountHolderName
        - countryCode
        - currency
        - scheme
        - accountNumber
        - routingNumber
      properties:
        accountHolderName:
          $ref: '#/components/schemas/PayoutAccountHolderName'
        countryCode:
          $ref: '#/components/schemas/CountryCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        scheme:
          type: string
          const: local
        accountNumber:
          $ref: '#/components/schemas/BankAccountNumber'
        routingNumber:
          $ref: '#/components/schemas/BankRoutingNumber'
    SettlementId:
      type: string
      description: Settlement statement id (`stl_` + ULID).
      pattern: ^stl_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - stl_01JC7T1V5X9Z3B7D1F5H9K3N7Q
    SettlementSummary:
      type: object
      description: >-
        One monthly statement of payments Velexis collected for the OTA (M5, PADR-0003), as the portal lists it.
        Drafts and voided drafts are never answered to the portal.
      additionalProperties: false
      required:
        - id
        - periodStart
        - periodEnd
        - currency
        - status
        - netAmount
        - paidAt
      properties:
        id:
          $ref: '#/components/schemas/SettlementId'
        periodStart:
          type: string
          format: date-time
          description: The first instant of the calendar month (UTC), inclusive.
        periodEnd:
          type: string
          format: date-time
          description: The first instant of the next month, exclusive.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          type: string
          description: >-
            `approved` (to be paid by bank transfer), `paid`, or `carried_forward` (a net of zero or less, absorbed by
            the next statement).
          enum:
            - approved
            - paid
            - carried_forward
        netAmount:
          $ref: '#/components/schemas/Money'
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The date of the bank transfer; `null` unless `paid`.
    SettlementList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/SettlementSummary'
    Settlement:
      type: object
      description: >-
        One statement with its totals (M5, PADR-0003 item 5): the properties of `SettlementSummary` with the same
        schemas, plus the parts of `netAmount`, the fee rate, the line count, the bank reference and the notes.
      additionalProperties: false
      required:
        - id
        - periodStart
        - periodEnd
        - currency
        - status
        - netAmount
        - paidAt
        - grossAmount
        - refundsAmount
        - disputesAmount
        - stripeFeesAmount
        - velexisFeesAmount
        - adjustmentsAmount
        - feeBps
        - lineCount
        - payoutReference
        - notes
      properties:
        id:
          $ref: '#/components/schemas/SettlementId'
        periodStart:
          type: string
          format: date-time
          description: The first instant of the calendar month (UTC), inclusive.
        periodEnd:
          type: string
          format: date-time
          description: The first instant of the next month, exclusive.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          type: string
          description: >-
            `approved` (to be paid by bank transfer), `paid`, or `carried_forward` (a net of zero or less, absorbed by
            the next statement).
          enum:
            - approved
            - paid
            - carried_forward
        netAmount:
          $ref: '#/components/schemas/Money'
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The date of the bank transfer; `null` unless `paid`.
        grossAmount:
          $ref: '#/components/schemas/Money'
        refundsAmount:
          $ref: '#/components/schemas/Money'
        disputesAmount:
          $ref: '#/components/schemas/Money'
        stripeFeesAmount:
          $ref: '#/components/schemas/Money'
        velexisFeesAmount:
          $ref: '#/components/schemas/Money'
        adjustmentsAmount:
          $ref: '#/components/schemas/Money'
        feeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: The Velexis fee in basis points, copied from the plan when the statement was generated.
        lineCount:
          type: integer
          minimum: 0
          description: The lines of `downloadSettlementLines`.
        payoutReference:
          type:
            - string
            - 'null'
          maxLength: 200
          description: The bank transfer's reference; `null` unless `paid`.
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: Velexis's remarks on the statement.
    AdminMfaChallenge:
      type: object
      description: >-
        The password step of an admin sign-in succeeded; send a TOTP or recovery code to adminVerifyMfa. Every admin
        sign-in needs this second step.
      additionalProperties: false
      required:
        - mfaChallengeToken
        - expiresIn
      properties:
        mfaChallengeToken:
          type: string
          description: The admin challenge (5 minutes, 5 attempts); never accepted by the portal's verifyMfa.
        expiresIn:
          type: integer
          minimum: 1
          description: Seconds until the challenge expires (300).
    AdminSession:
      type: object
      description: >-
        The tokens of a platform admin session and the signed-in admin. Tokens appear only in these responses; the
        admin server keeps them in its own httpOnly cookies and never hands them to browser JavaScript.
      additionalProperties: false
      required:
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
        - admin
      properties:
        accessToken:
          type: string
          description: The admin access token (EdDSA JWT, audience `platform_admin`, 15 minutes).
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: The opaque admin refresh token; single use, rotated by adminRefresh.
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: >-
            When this refresh token stops working: 2 idle hours, and never after the family's 12-hour absolute end.
        admin:
          $ref: '#/components/schemas/AdminMe'
    AdminMe:
      type: object
      description: >-
        The signed-in platform admin and the milestone switches of PADR-0015 (the `features` of the portal's getMe),
        which the admin reads to hide the M5 areas.
      additionalProperties: false
      required:
        - id
        - email
        - fullName
        - features
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        fullName:
          type: string
        features:
          $ref: '#/components/schemas/MilestoneFeatures'
    AdminDashboard:
      type: object
      description: >-
        The counters of the admin home page. The M5 counters are always present and `null` while their milestone
        switch is off (PADR-0015).
      additionalProperties: false
      required:
        - tenantsByStatus
        - provisioningFailed24h
        - jobsFailedByQueue
        - officePool
        - domainsPending
        - settlementsToReview
        - stripeEventsFailed
        - subscriptionsPastDue
      properties:
        tenantsByStatus:
          type: object
          description: The number of OTAs in each status, zero included.
          additionalProperties: false
          required:
            - provisioning
            - active
            - suspended
            - failed
          properties:
            provisioning:
              type: integer
              minimum: 0
            active:
              type: integer
              minimum: 0
            suspended:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
        provisioningFailed24h:
          type: integer
          minimum: 0
          description: Tenant jobs of any kind that ended `failed` in the last 24 hours.
        jobsFailedByQueue:
          type: object
          description: >-
            Failed BullMQ jobs per platform queue (`PLATFORM_QUEUES` of `@velexis/api-types/jobs`), keyed by queue
            name, zero included.
          propertyNames:
            $ref: '#/components/schemas/QueueName'
          additionalProperties:
            type: integer
            minimum: 0
        officePool:
          type: array
          description: >-
            The Velexis Amadeus office pool of each environment that has a Velexis Amadeus account (PADR-0012); the
            admin warns below 3 available offices.
          items:
            $ref: '#/components/schemas/OfficePoolLevel'
        domainsPending:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Custom domains waiting for DNS verification (M5); `null` while `custom_domains` is off.
        settlementsToReview:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Draft settlements to review (M5); `null` while `settlements` is off.
        stripeEventsFailed:
          type:
            - integer
            - 'null'
          minimum: 0
          description: >-
            Stripe events whose processing failed (M5); `null` while `stripe_billing` and `own_stripe` are both off.
        subscriptionsPastDue:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Subscriptions in `past_due` (M5); `null` while `stripe_billing` is off.
    OfficePoolLevel:
      type: object
      description: The offices of the Velexis Amadeus account of one environment, by status.
      additionalProperties: false
      required:
        - environment
        - available
        - assigned
      properties:
        environment:
          $ref: '#/components/schemas/Environment'
        available:
          type: integer
          minimum: 0
          description: Offices free to assign.
        assigned:
          type: integer
          minimum: 0
          description: Offices assigned to an OTA.
    AdminTenantSummary:
      type: object
      description: One OTA in the admin search.
      additionalProperties: false
      required:
        - id
        - key
        - name
        - status
        - planCode
        - ownerEmail
        - createdAt
        - activatedAt
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        key:
          $ref: '#/components/schemas/TenantKey'
        name:
          type: string
        status:
          $ref: '#/components/schemas/TenantStatus'
        planCode:
          $ref: '#/components/schemas/PlanCode'
        ownerEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
          description: The e-mail address of the oldest active owner; `null` only when no active owner is left.
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the setup finished; `null` before.
    AdminTenantList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminTenantSummary'
        page:
          $ref: '#/components/schemas/Page'
    AdminTenant:
      type: object
      description: >-
        An OTA as Velexis staff see it: the portal's `Tenant` without the caller's role, plus the suspension time and
        the internal notes. Never holds a secret.
      additionalProperties: false
      required:
        - id
        - key
        - name
        - legalName
        - status
        - suspensionReason
        - suspendedAt
        - billingNotice
        - planCode
        - defaultCurrency
        - countryCode
        - timeZone
        - supportEmail
        - storefrontEnvironment
        - liveEnabledAt
        - primaryHost
        - schemaVersion
        - notes
        - createdAt
        - activatedAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        key:
          $ref: '#/components/schemas/TenantKey'
        name:
          type: string
          description: Display name of the OTA.
        legalName:
          type:
            - string
            - 'null'
          description: Legal entity name; `null` until set.
        status:
          $ref: '#/components/schemas/TenantStatus'
        suspensionReason:
          $ref: '#/components/schemas/SuspensionReason'
        suspendedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the OTA was suspended; `null` unless suspended.
        billingNotice:
          $ref: '#/components/schemas/BillingNotice'
        planCode:
          $ref: '#/components/schemas/PlanCode'
        defaultCurrency:
          $ref: '#/components/schemas/CurrencyCode'
        countryCode:
          type:
            - string
            - 'null'
          pattern: ^[A-Z]{2}$
          description: Country where the OTA is registered (ISO 3166-1 alpha-2).
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        supportEmail:
          type:
            - string
            - 'null'
          format: email
          maxLength: 254
          description: Business support address of the OTA; `null` until set.
        storefrontEnvironment:
          $ref: '#/components/schemas/Environment'
        liveEnabledAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the storefront went live (M5); `null` before.
        primaryHost:
          type: string
          format: hostname
          description: The primary storefront host.
        schemaVersion:
          type:
            - string
            - 'null'
          pattern: ^[0-9]{4,14}(_[a-z0-9_]+)?$
          description: The latest tenant migration applied to the OTA's schema; `null` until the setup records it.
        notes:
          type:
            - string
            - 'null'
          maxLength: 4000
          description: Internal notes of Velexis staff (`tenants.metadata.notes`); never shown to the OTA.
        createdAt:
          type: string
          format: date-time
        activatedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the setup finished; `null` before.
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; the `ETag` of adminGetTenant carries it.
    AdminTenantDetail:
      type: object
      description: >-
        The control-plane view of one OTA. Connections are the masked shapes of the portal; nothing holds a secret, a
        ciphertext, a hash or a token.
      additionalProperties: false
      required:
        - tenant
        - members
        - invitations
        - subscription
        - amadeusConnections
        - paymentConnections
        - domains
        - recentJobs
        - recentAudit
      properties:
        tenant:
          $ref: '#/components/schemas/AdminTenant'
        members:
          type: array
          description: The active members, oldest first.
          items:
            $ref: '#/components/schemas/Member'
        invitations:
          type: array
          description: The pending invitations, newest first.
          items:
            $ref: '#/components/schemas/Invitation'
        subscription:
          description: The current subscription, or after a cancellation the canceled one; `null` when there is none.
          oneOf:
            - $ref: '#/components/schemas/Subscription'
            - type: 'null'
        amadeusConnections:
          type: array
          items:
            $ref: '#/components/schemas/AmadeusConnection'
        paymentConnections:
          type: array
          items:
            $ref: '#/components/schemas/PaymentConnection'
        domains:
          type: array
          items:
            $ref: '#/components/schemas/Domain'
        recentJobs:
          type: array
          description: The last 20 tenant jobs, newest first.
          maxItems: 20
          items:
            $ref: '#/components/schemas/AdminProvisioningJob'
        recentAudit:
          type: array
          description: The last 50 audit rows of the OTA, newest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/AuditEntry'
    UpdateAdminTenantRequest:
      type: object
      description: The fields to change; at least one. `null` clears the notes or the legal name.
      additionalProperties: false
      minProperties: 1
      properties:
        notes:
          oneOf:
            - type: string
              maxLength: 4000
            - type: 'null'
        legalName:
          oneOf:
            - $ref: '#/components/schemas/LegalName'
            - type: 'null'
    AdminReason:
      type: string
      description: >-
        Why a Velexis staff member takes the action (PADR-0006 item 5), kept in the `details` of the audit row. The API
        trims the white space at either end first, and the 5–500 characters count after trimming: a reason of only
        spaces answers `400 VALIDATION_FAILED` (`minLength`), and the audit row (or the record that keeps the reason)
        holds the trimmed reason (lead decision (2j) of 2026-10-30).
      minLength: 5
      maxLength: 500
      examples:
        - Card testing from the storefront reported by Stripe on 2026-10-20.
    AdminReasonRequest:
      type: object
      additionalProperties: false
      required:
        - reason
      properties:
        reason:
          $ref: '#/components/schemas/AdminReason'
    SuspendTenantRequest:
      type: object
      additionalProperties: false
      required:
        - suspensionReason
        - reason
      properties:
        suspensionReason:
          type: string
          description: >-
            The suspension reason stored on the tenant (PADR-0014 item 1). `billing` is set only by billing sync, so it
            is not accepted here.
          enum:
            - abuse
            - request
            - admin
        reason:
          $ref: '#/components/schemas/AdminReason'
    TenantLifecycleAccepted:
      type: object
      description: The OTA after a suspend or resume, and the job that carries the OTA worker's part.
      additionalProperties: false
      required:
        - tenant
        - job
      properties:
        tenant:
          $ref: '#/components/schemas/AdminTenant'
        job:
          $ref: '#/components/schemas/AdminProvisioningJob'
    TenantMigrationVersion:
      type: string
      description: >-
        A tenant migration version: the file name of a numbered tenant migration without `.sql` (the
        `TENANT_MIGRATION_VERSION_PATTERN` of `@velexis/api-types/jobs`).
      pattern: ^[0-9]{4,14}(_[a-z0-9_]+)?$
      examples:
        - '0001_baseline'
    MigrateTenantRequest:
      type: object
      additionalProperties: false
      properties:
        targetVersion:
          $ref: '#/components/schemas/TenantMigrationVersion'
    SetConnectionStatusRequest:
      type: object
      additionalProperties: false
      required:
        - status
        - reason
      properties:
        status:
          type: string
          description: '`disabled` stops the connection; `active` re-enables a disabled one.'
          enum:
            - active
            - disabled
        reason:
          $ref: '#/components/schemas/AdminReason'
    AdminConnection:
      description: The masked connection after the change, as the portal lists it.
      oneOf:
        - $ref: '#/components/schemas/AmadeusConnection'
        - $ref: '#/components/schemas/PaymentConnection'
    ProvisioningJobKind:
      type: string
      description: >-
        The kind of a tenant job (PADR-0001 item 8): `provision` (the setup), `migrate`, `suspend`, `resume`.
      enum:
        - provision
        - migrate
        - suspend
        - resume
    AdminProvisioningJob:
      type: object
      description: A tenant job in the admin lists.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - kind
        - status
        - step
        - attempt
        - maxAttempts
        - error
        - scheduledAt
        - startedAt
        - finishedAt
      properties:
        id:
          $ref: '#/components/schemas/ProvisioningJobId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        kind:
          $ref: '#/components/schemas/ProvisioningJobKind'
        status:
          $ref: '#/components/schemas/ProvisioningJobStatus'
        step:
          type:
            - string
            - 'null'
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The current or last step, for example `dispatch` or `run_migrations`; `null` before dispatch.
        attempt:
          type: integer
          minimum: 0
          description: Attempts dispatched so far.
        maxAttempts:
          type: integer
          minimum: 1
          description: The attempt budget (5).
        error:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: The last error, a short message without secrets; `null` when there is none.
        scheduledAt:
          type: string
          format: date-time
          description: The earliest start of the next attempt (the retry backoff).
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The first dispatch; `null` before it.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the job reached `succeeded`, `failed` or `canceled`.
    AdminProvisioningJobList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminProvisioningJob'
        page:
          $ref: '#/components/schemas/Page'
    AdminProvisioningJobResult:
      type: object
      description: The job an admin action created or changed.
      additionalProperties: false
      required:
        - job
      properties:
        job:
          $ref: '#/components/schemas/AdminProvisioningJob'
    BullmqJobState:
      type:
        - string
        - 'null'
      description: >-
        The BullMQ state of the job's current attempt (`<jobId>-<attempt>` on `ota-tenant-ops`): `unknown` when BullMQ
        no longer holds it; `null` before the first dispatch.
      enum:
        - waiting
        - prioritized
        - waiting-children
        - delayed
        - active
        - completed
        - failed
        - unknown
        - null
    AdminProvisioningJobDetail:
      type: object
      description: >-
        A tenant job with its step log, input, result, lease and BullMQ state. `result` never holds a ciphertext: the
        reveal-once keys of a `provision` job are never answered.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - kind
        - status
        - step
        - attempt
        - maxAttempts
        - error
        - scheduledAt
        - startedAt
        - finishedAt
        - steps
        - payload
        - result
        - lockedUntil
        - bullmqState
      properties:
        id:
          $ref: '#/components/schemas/ProvisioningJobId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        kind:
          $ref: '#/components/schemas/ProvisioningJobKind'
        status:
          $ref: '#/components/schemas/ProvisioningJobStatus'
        step:
          type:
            - string
            - 'null'
          pattern: ^[a-z][a-z0-9_]{0,63}$
          description: The current or last step; `null` before dispatch.
        attempt:
          type: integer
          minimum: 0
          description: Attempts dispatched so far.
        maxAttempts:
          type: integer
          minimum: 1
          description: The attempt budget (5).
        error:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: The last error, a short message without secrets; `null` when there is none.
        scheduledAt:
          type: string
          format: date-time
          description: The earliest start of the next attempt (the retry backoff).
        startedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The first dispatch; `null` before it.
        finishedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the job reached `succeeded`, `failed` or `canceled`.
        steps:
          type: array
          description: The finished steps of the OTA worker and of the platform post-steps, in order.
          items:
            $ref: '#/components/schemas/ProvisioningStep'
        payload:
          type: object
          description: The job input, ids and options only (for example `targetVersion` or the suspension reason).
          additionalProperties: true
        result:
          type:
            - object
            - 'null'
          description: The job output (for example the ids of the API keys issued at setup); `null` until it ends.
          additionalProperties: true
        lockedUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: The end of the current lease of a `running` job (15 minutes per dispatch); `null` otherwise.
        bullmqState:
          $ref: '#/components/schemas/BullmqJobState'
    QueueName:
      type: string
      description: >-
        A BullMQ queue of either backend, named `<owner>-<topic>` (ADR-0009 item 4): `PLATFORM_QUEUES` and `OTA_QUEUES`
        of `@velexis/api-types/jobs`.
      minLength: 1
      maxLength: 64
      pattern: ^(platform|ota)-[a-z][a-z0-9-]*$
      examples:
        - platform-emails
    QueueCounts:
      type: object
      description: The BullMQ counts of one queue.
      additionalProperties: false
      required:
        - name
        - owner
        - waiting
        - active
        - delayed
        - failed
        - oldestWaitingSeconds
      properties:
        name:
          $ref: '#/components/schemas/QueueName'
        owner:
          type: string
          description: >-
            The backend whose worker consumes the queue. Only `platform` queues can be retried from the admin.
          enum:
            - platform
            - ota
        waiting:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        delayed:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
          description: Failed jobs kept by BullMQ (30 days).
        oldestWaitingSeconds:
          type:
            - integer
            - 'null'
          minimum: 0
          description: Seconds since the oldest waiting job was added; `null` when none waits.
    QueueList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/QueueCounts'
    FailedQueueJob:
      type: object
      description: One failed BullMQ job. Its data holds ids only; queue messages never carry secrets.
      additionalProperties: false
      required:
        - id
        - name
        - failedReason
        - attemptsMade
        - failedAt
        - data
      properties:
        id:
          type: string
          description: The BullMQ job id.
        name:
          type: string
          description: The job name, for example `email.send` or `tenant.provision`.
        failedReason:
          type:
            - string
            - 'null'
          description: The error of the last attempt as the processor reported it.
        attemptsMade:
          type: integer
          minimum: 0
        failedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the last attempt failed.
        data:
          type: object
          description: The job data (ids only).
          additionalProperties: true
    FailedQueueJobList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FailedQueueJob'
    AuditEntry:
      type: object
      description: >-
        One row of `platform_audit_log` (PADR-0006, Audit). `details` holds the before and after values and the
        reason, passed through the shared redactor: never a secret, a token or a bank number.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - actorType
        - actorAccountId
        - actorLabel
        - action
        - targetType
        - targetId
        - requestId
        - ipAddress
        - userAgent
        - details
        - createdAt
      properties:
        id:
          type: string
          pattern: ^[0-9]+$
          description: The audit row id, a decimal string (the table's identity column).
        tenantId:
          type:
            - string
            - 'null'
          pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
          description: The OTA concerned; `null` for account-level rows.
        tenantKey:
          type:
            - string
            - 'null'
          description: The OTA key at the time of the action.
        actorType:
          $ref: '#/components/schemas/AuditActorType'
        actorAccountId:
          type:
            - string
            - 'null'
          pattern: ^acc_[0-9A-HJKMNP-TV-Z]{26}$
          description: The acting account; `null` for `system` and `api_key` rows.
        actorLabel:
          type:
            - string
            - 'null'
          description: A snapshot of the actor (e-mail address, key prefix or job name).
        action:
          type: string
          pattern: ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$
          description: The dotted action, for example `tenant.suspended` or `api_key.revoked`.
        targetType:
          type:
            - string
            - 'null'
          description: The kind of object acted on, for example `tenant` or `api_key`.
        targetId:
          type:
            - string
            - 'null'
          description: The id of the object acted on.
        requestId:
          type:
            - string
            - 'null'
          description: The `X-Request-Id` of the request.
        ipAddress:
          type:
            - string
            - 'null'
          maxLength: 45
          description: The end user's IP address (PADR-0019).
        userAgent:
          type:
            - string
            - 'null'
          maxLength: 512
          description: The end user's browser.
        details:
          type: object
          description: Before and after values and the reason, redacted.
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
    AuditActorType:
      type: string
      description: >-
        Who acted: `account` (a portal user), `platform_admin` (Velexis staff in the admin), `api_key` or `system` (a
        job or a CLI command run on the VM).
      enum:
        - account
        - platform_admin
        - api_key
        - system
    AuditEntryList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEntry'
        page:
          $ref: '#/components/schemas/Page'
    PlanPrice:
      type: object
      description: >-
        A plan price in a request: a `Money` whose amount is not negative and has at most two decimals (the
        `numeric(12,2)` prices of `platform.plans`). Its currency must be the plan's currency, which the service
        checks (`400 VALIDATION_FAILED`).
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^[0-9]{1,10}(\.[0-9]{1,2})?$
          examples:
            - '149.00'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    PlanFeatures:
      type: object
      description: The feature flags the plan unlocks, by name (`plans.features`); the whole object is replaced.
      maxProperties: 50
      propertyNames:
        type: string
        pattern: ^[a-z][A-Za-z0-9]{0,63}$
      additionalProperties:
        type: boolean
    PlanPriceWarning:
      type: object
      description: >-
        One difference between a plan and a linked Stripe price (subscription-billing flow §A): the amount, the
        currency or the interval differ, or the price is inactive. Warnings never block saving.
      additionalProperties: false
      required:
        - field
        - expected
        - actual
      properties:
        field:
          type: string
          pattern: ^[a-z][A-Za-z]*(\.[a-z][A-Za-z]*)?$
          description: >-
            The linked price and the attribute that differs, for example `stripePriceIdMonth.amount` or
            `stripePriceIdYear.active`.
        expected:
          type:
            - string
            - 'null'
          description: The value the plan implies.
        actual:
          type:
            - string
            - 'null'
          description: The value Stripe answered.
    PlanPriceCheck:
      type: object
      description: The result of a comparison of a plan with its linked Stripe prices (M5); no warning when they agree.
      additionalProperties: false
      required:
        - warnings
      properties:
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/PlanPriceWarning'
    AdminPlan:
      type: object
      description: >-
        A plan as Velexis staff see it: the fields of `Plan`, plus the currency, the visibility, the active flag, the
        order, the settlement fee, the Stripe link state and the number of OTAs on it. The Stripe ids stay `null` and
        `priceWarnings` empty until `adminUpdatePlan` links prices (M5); the warnings are those of the last comparison
        with Stripe (`adminUpdatePlan` or `adminCheckPlanPrices`).
      additionalProperties: false
      required:
        - code
        - name
        - description
        - currency
        - monthlyPrice
        - annualPrice
        - trialDays
        - limits
        - features
        - checkoutAvailable
        - isPublic
        - isActive
        - sortOrder
        - settlementFeeBps
        - stripeProductId
        - stripePriceIdMonth
        - stripePriceIdYear
        - priceWarnings
        - tenantCount
        - version
        - createdAt
        - updatedAt
      properties:
        code:
          $ref: '#/components/schemas/PlanCode'
        name:
          type: string
        description:
          type:
            - string
            - 'null'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        monthlyPrice:
          $ref: '#/components/schemas/Money'
        annualPrice:
          description: The yearly price, or null when the plan has no annual option.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        trialDays:
          type: integer
          minimum: 0
          maximum: 365
          description: Free trial days on the first subscription of an OTA.
        limits:
          $ref: '#/components/schemas/PlanLimits'
        features:
          type: object
          description: Feature flags the plan unlocks, by name.
          additionalProperties:
            type: boolean
        checkoutAvailable:
          type: object
          description: Whether Stripe Checkout can start for each billing interval (the plan has a Stripe price for it).
          additionalProperties: false
          required:
            - month
            - year
          properties:
            month:
              type: boolean
            year:
              type: boolean
        isPublic:
          type: boolean
          description: Whether the plan is offered on the pricing page and in the create-OTA wizard.
        isActive:
          type: boolean
          description: False for a retired plan, kept for its existing subscriptions only.
        sortOrder:
          type: integer
          description: The order on the pricing page, lowest first.
        settlementFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: >-
            The Velexis fee in basis points on the net captured volume of `velexis`-mode payments, deducted in the
            settlements (M5).
        stripeProductId:
          type:
            - string
            - 'null'
          pattern: ^prod_[A-Za-z0-9]+$
          description: The Stripe Product of the plan; `null` until linked (M5).
        stripePriceIdMonth:
          type:
            - string
            - 'null'
          pattern: ^price_[A-Za-z0-9]+$
          description: The recurring Stripe Price of monthly billing; `null` until linked (M5).
        stripePriceIdYear:
          type:
            - string
            - 'null'
          pattern: ^price_[A-Za-z0-9]+$
          description: The recurring Stripe Price of yearly billing; `null` until linked (M5).
        priceWarnings:
          type: array
          description: The differences found by the last comparison with Stripe; empty while no price is linked.
          items:
            $ref: '#/components/schemas/PlanPriceWarning'
        tenantCount:
          type: integer
          minimum: 0
          description: The OTAs on the plan (`tenants.plan_code`), in any status.
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; send it in `If-Match` to `adminUpdatePlan`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    AdminPlanList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminPlan'
    CreatePlanRequest:
      type: object
      description: >-
        A new plan. Only `annualPrice` is optional (no yearly option without it). `code` and `currency` never change
        afterwards.
      additionalProperties: false
      required:
        - code
        - name
        - description
        - currency
        - monthlyPrice
        - limits
        - features
        - isPublic
        - trialDays
        - settlementFeeBps
        - sortOrder
      properties:
        code:
          $ref: '#/components/schemas/PlanCode'
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        monthlyPrice:
          $ref: '#/components/schemas/PlanPrice'
        annualPrice:
          $ref: '#/components/schemas/PlanPrice'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        features:
          $ref: '#/components/schemas/PlanFeatures'
        isPublic:
          type: boolean
        trialDays:
          type: integer
          minimum: 0
          maximum: 365
        settlementFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
    UpdatePlanRequest:
      type: object
      description: >-
        The fields to change; at least one. Never `code` or `currency`. `annualPrice: null` removes the yearly option
        and `isActive: false` retires the plan. From M5 the Stripe product and price ids link the plan to Stripe;
        `null` unlinks one.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 2000
            - type: 'null'
        monthlyPrice:
          $ref: '#/components/schemas/PlanPrice'
        annualPrice:
          oneOf:
            - $ref: '#/components/schemas/PlanPrice'
            - type: 'null'
        limits:
          $ref: '#/components/schemas/PlanLimits'
        features:
          $ref: '#/components/schemas/PlanFeatures'
        isPublic:
          type: boolean
        isActive:
          type: boolean
        trialDays:
          type: integer
          minimum: 0
          maximum: 365
        settlementFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
        sortOrder:
          type: integer
          minimum: 0
          maximum: 10000
        stripeProductId:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: ^prod_[A-Za-z0-9]+$
          description: The Stripe Product of the plan (M5); `null` unlinks it.
        stripePriceIdMonth:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: ^price_[A-Za-z0-9]+$
          description: >-
            The recurring Stripe Price of monthly billing (M5), linked to no other plan; `null` unlinks it, so Checkout
            cannot start for monthly billing.
        stripePriceIdYear:
          type:
            - string
            - 'null'
          maxLength: 255
          pattern: ^price_[A-Za-z0-9]+$
          description: >-
            The recurring Stripe Price of yearly billing (M5), linked to no other plan; `null` unlinks it, so Checkout
            cannot start for yearly billing.
    SubscriptionStatus:
      type: string
      description: >-
        Stripe's subscription statuses (`subscriptions.status`); manual subscriptions use `trialing`, `past_due` and
        `canceled` only.
      enum:
        - trialing
        - active
        - past_due
        - paused
        - canceled
        - incomplete
        - incomplete_expired
        - unpaid
    BillingProvider:
      type: string
      description: '`manual` (the trials before M5) or `stripe`.'
      enum:
        - stripe
        - manual
    AdminSubscription:
      type: object
      description: >-
        A subscription row as Velexis staff see it, with its OTA. The Stripe ids are references for the Stripe
        dashboard, never secrets; they are `null` on manual subscriptions.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - tenantName
        - planCode
        - planName
        - status
        - billingProvider
        - billingInterval
        - trialEndsAt
        - currentPeriodStart
        - currentPeriodEnd
        - cancelAtPeriodEnd
        - canceledAt
        - providerCustomerId
        - providerSubscriptionId
        - createdAt
        - version
      properties:
        id:
          type: string
          pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        tenantName:
          type: string
        planCode:
          $ref: '#/components/schemas/PlanCode'
        planName:
          type: string
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        billingProvider:
          $ref: '#/components/schemas/BillingProvider'
        billingInterval:
          $ref: '#/components/schemas/BillingInterval'
        trialEndsAt:
          type:
            - string
            - 'null'
          format: date-time
        currentPeriodStart:
          type:
            - string
            - 'null'
          format: date-time
        currentPeriodEnd:
          type:
            - string
            - 'null'
          format: date-time
        cancelAtPeriodEnd:
          type: boolean
        canceledAt:
          type:
            - string
            - 'null'
          format: date-time
        providerCustomerId:
          type:
            - string
            - 'null'
          pattern: ^cus_[A-Za-z0-9]+$
          description: The Stripe Customer; `null` on manual subscriptions.
        providerSubscriptionId:
          type:
            - string
            - 'null'
          pattern: ^sub_[A-Za-z0-9]+$
          description: The Stripe Subscription; `null` on manual subscriptions.
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; send it in `If-Match` to `adminUpdateManualSubscription`.
    AdminSubscriptionList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminSubscription'
        page:
          $ref: '#/components/schemas/Page'
    AdminInvoice:
      type: object
      description: >-
        A Velexis invoice of an OTA, synchronised from Stripe (M5). Amounts are `Money` in the invoice currency; the
        links point to the Stripe-hosted page and PDF.
      additionalProperties: false
      required:
        - id
        - tenantId
        - subscriptionId
        - number
        - status
        - subtotal
        - taxAmount
        - total
        - amountPaid
        - amountDue
        - periodStart
        - periodEnd
        - issuedAt
        - dueAt
        - paidAt
        - hostedInvoiceUrl
        - invoicePdfUrl
        - providerInvoiceId
        - createdAt
      properties:
        id:
          type: string
          pattern: ^inv_[0-9A-HJKMNP-TV-Z]{26}$
        tenantId:
          $ref: '#/components/schemas/TenantId'
        subscriptionId:
          type:
            - string
            - 'null'
          pattern: ^sub_[0-9A-HJKMNP-TV-Z]{26}$
        number:
          type: string
          description: The legal invoice number.
        status:
          type: string
          enum:
            - draft
            - open
            - paid
            - void
            - uncollectible
        subtotal:
          $ref: '#/components/schemas/Money'
        taxAmount:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        amountPaid:
          $ref: '#/components/schemas/Money'
        amountDue:
          $ref: '#/components/schemas/Money'
        periodStart:
          type:
            - string
            - 'null'
          format: date-time
        periodEnd:
          type:
            - string
            - 'null'
          format: date-time
        issuedAt:
          type:
            - string
            - 'null'
          format: date-time
        dueAt:
          type:
            - string
            - 'null'
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
        hostedInvoiceUrl:
          type:
            - string
            - 'null'
          format: uri
        invoicePdfUrl:
          type:
            - string
            - 'null'
          format: uri
        providerInvoiceId:
          type:
            - string
            - 'null'
          pattern: ^in_[A-Za-z0-9]+$
          description: The Stripe Invoice.
        createdAt:
          type: string
          format: date-time
    AdminInvoiceList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminInvoice'
        page:
          $ref: '#/components/schemas/Page'
    AdminStripeEvent:
      type: object
      description: >-
        One event of the Stripe webhook inbox (`stripe_events`, M5): its type, processing state and last error. The
        payload is never stored or answered; the worker re-fetches the object from Stripe.
      additionalProperties: false
      required:
        - id
        - endpoint
        - type
        - status
        - attempts
        - lastError
        - tenantId
        - receivedAt
        - processedAt
      properties:
        id:
          $ref: '#/components/schemas/StripeEventId'
        endpoint:
          type: string
          description: The receiver that got it.
          enum:
            - billing
            - connect_accounts
        type:
          type: string
          pattern: ^[a-z_]+(\.[a-z_]+)+$
          description: The Stripe event type, for example `invoice.paid`.
        status:
          type: string
          enum:
            - received
            - processing
            - processed
            - ignored
            - failed
        attempts:
          type: integer
          minimum: 0
        lastError:
          type:
            - string
            - 'null'
          maxLength: 1000
          description: The last processing error, a short message without secrets.
        tenantId:
          type:
            - string
            - 'null'
          pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
        receivedAt:
          type: string
          format: date-time
        processedAt:
          type:
            - string
            - 'null'
          format: date-time
    AdminStripeEventList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminStripeEvent'
        page:
          $ref: '#/components/schemas/Page'
    StripeEventId:
      type: string
      description: >-
        A Stripe event id: `evt_` and letters, digits or underscores (Stripe's own ids have no underscore; the synthetic
        events of the test fixtures, `evt_test_…`, do), as the CHECK of `stripe_events.id` allows.
      maxLength: 255
      pattern: ^evt_[A-Za-z0-9_]+$
      examples:
        - evt_1QyMn3Oq0Su5WxZ7Ab9Cd1Ef
    AdminSubscriptionDetail:
      type: object
      description: A subscription with its invoices and the Stripe events of its OTA; both lists are empty before M5.
      additionalProperties: false
      required:
        - subscription
        - invoices
        - events
      properties:
        subscription:
          $ref: '#/components/schemas/AdminSubscription'
        invoices:
          type: array
          description: The invoices of the subscription, newest first (at most 50).
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminInvoice'
        events:
          type: array
          description: The Stripe events of the subscription's OTA, newest first (at most 50).
          maxItems: 50
          items:
            $ref: '#/components/schemas/AdminStripeEvent'
    UpdateManualSubscriptionRequest:
      type: object
      description: >-
        At least one change (`planCode`, `trialEndsAt` or `status`) and the required reason, so a body holds at least
        two properties.
      additionalProperties: false
      minProperties: 2
      required:
        - reason
      properties:
        planCode:
          $ref: '#/components/schemas/PlanCode'
        trialEndsAt:
          type: string
          format: date-time
          description: The new end of the trial.
        status:
          type: string
          description: '`canceled` ends the manual subscription; `trialing` reopens one.'
          enum:
            - trialing
            - canceled
        reason:
          $ref: '#/components/schemas/AdminReason'
    AmadeusAccountId:
      type: string
      description: Velexis Amadeus account id (`ama_` + ULID).
      pattern: ^ama_[0-9A-HJKMNP-TV-Z]{26}$
      examples:
        - ama_01JA2Y8K3M7P1R5T9W3Z7C1F5H
    AmadeusAccountStatus:
      type: string
      description: >-
        The credential health after the last verification: `pending_verification` (new or changed credentials),
        `active`, `invalid_credentials` (Amadeus refused the token request), `disabled` (by an admin).
      enum:
        - pending_verification
        - active
        - invalid_credentials
        - disabled
    AmadeusBaseUrl:
      type: string
      description: >-
        The Amadeus API host: an `https` URL, or the loopback Amadeus stub (`http://127.0.0.1:<port>`) in development;
        the service refuses the stub in production.
      format: uri
      maxLength: 300
      pattern: ^(https://[^\s/?#]+(/[^\s?#]*)?|http://127\.0\.0\.1(:[0-9]{1,5})?)$
      examples:
        - https://test.travel.api.amadeus.com
    AmadeusClientSecret:
      type: string
      description: >-
        The OAuth2 client secret Amadeus issued to Velexis. Write-only: envelope-encrypted at once, never logged and
        never answered.
      minLength: 1
      maxLength: 512
      writeOnly: true
    AmadeusOfficeCounts:
      type: object
      description: The offices of the account's pool in each status.
      additionalProperties: false
      required:
        - available
        - assigned
        - releasing
        - retired
      properties:
        available:
          type: integer
          minimum: 0
        assigned:
          type: integer
          minimum: 0
        releasing:
          type: integer
          minimum: 0
        retired:
          type: integer
          minimum: 0
    AdminAmadeusAccount:
      type: object
      description: >-
        A Velexis Amadeus account (one per environment). Never holds the client secret or its ciphertext; `clientId`
        is not a secret.
      additionalProperties: false
      required:
        - id
        - name
        - environment
        - baseUrl
        - clientId
        - status
        - lastVerifiedAt
        - lastError
        - officeCounts
        - createdAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/AmadeusAccountId'
        name:
          type: string
          description: The label shown in the admin.
        environment:
          $ref: '#/components/schemas/Environment'
        baseUrl:
          $ref: '#/components/schemas/AmadeusBaseUrl'
        clientId:
          type: string
          description: The OAuth2 client id Amadeus issued to Velexis.
        status:
          $ref: '#/components/schemas/AmadeusAccountStatus'
        lastVerifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The last successful token request.
        lastError:
          type:
            - string
            - 'null'
          maxLength: 500
          description: The last verification error (HTTP status and Amadeus code), never a secret or a provider body.
        officeCounts:
          $ref: '#/components/schemas/AmadeusOfficeCounts'
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; send it in `If-Match` to `adminUpdateAmadeusAccount`.
    AdminAmadeusAccountList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          maxItems: 2
          items:
            $ref: '#/components/schemas/AdminAmadeusAccount'
    CreateAmadeusAccountRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - environment
        - baseUrl
        - clientId
        - clientSecret
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        environment:
          $ref: '#/components/schemas/Environment'
        baseUrl:
          $ref: '#/components/schemas/AmadeusBaseUrl'
        clientId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^\S+$
        clientSecret:
          $ref: '#/components/schemas/AmadeusClientSecret'
    UpdateAmadeusAccountRequest:
      type: object
      description: >-
        The fields to change; at least one. A new `baseUrl`, `clientId` or `clientSecret` needs a step-up; `status`
        only takes `disabled`, and a successful verification makes the account `active` again.
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        baseUrl:
          $ref: '#/components/schemas/AmadeusBaseUrl'
        clientId:
          type: string
          minLength: 1
          maxLength: 200
          pattern: ^\S+$
        clientSecret:
          $ref: '#/components/schemas/AmadeusClientSecret'
        status:
          type: string
          enum:
            - disabled
    AmadeusOfficeStatus:
      type: string
      description: >-
        An office of the pool (PADR-0012 item 1): `available`, `assigned` to an OTA, `releasing` (the OTA moved to its
        own credentials and old orders may still use it), or `retired`.
      enum:
        - available
        - assigned
        - releasing
        - retired
    TenantReference:
      type: object
      description: An OTA named in another resource.
      additionalProperties: false
      required:
        - id
        - key
      properties:
        id:
          $ref: '#/components/schemas/TenantId'
        key:
          $ref: '#/components/schemas/TenantKey'
    AdminAmadeusOffice:
      type: object
      description: One office of a Velexis Amadeus account's pool.
      additionalProperties: false
      required:
        - id
        - amadeusAccountId
        - officeId
        - environment
        - status
        - assignedTenant
        - assignedAt
        - releaseRequestedAt
        - releasedAt
        - notes
        - createdAt
        - version
      properties:
        id:
          type: string
          pattern: ^amo_[0-9A-HJKMNP-TV-Z]{26}$
          description: The pool entry id (`amo_` + ULID).
        amadeusAccountId:
          $ref: '#/components/schemas/AmadeusAccountId'
        officeId:
          $ref: '#/components/schemas/AmadeusOfficeId'
        environment:
          $ref: '#/components/schemas/Environment'
        status:
          $ref: '#/components/schemas/AmadeusOfficeStatus'
        assignedTenant:
          description: The OTA using the office while `assigned` or `releasing`; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/TenantReference'
            - type: 'null'
        assignedAt:
          type:
            - string
            - 'null'
          format: date-time
        releaseRequestedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When the OTA stopped using the office (the start of `releasing`).
        releasedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When an admin last returned the office to the pool.
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: Admin notes (commercial onboarding, ticketing agreements).
        createdAt:
          type: string
          format: date-time
          description: When the office was added to the pool.
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version; send it in `If-Match` to `adminUpdateAmadeusOffice`.
    AdminAmadeusOfficeList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAmadeusOffice'
        page:
          $ref: '#/components/schemas/Page'
    AddAmadeusOfficesRequest:
      type: object
      additionalProperties: false
      required:
        - amadeusAccountId
        - officeIds
      properties:
        amadeusAccountId:
          $ref: '#/components/schemas/AmadeusAccountId'
        officeIds:
          type: array
          description: >-
            The Amadeus office ids, 9 letters or digits each; upper-cased by the service, and repeats are skipped
            rather than refused.
          minItems: 1
          maxItems: 500
          items:
            type: string
            pattern: ^[A-Za-z0-9]{9}$
        notes:
          type: string
          minLength: 1
          maxLength: 2000
          description: Notes for every created office, for example the order reference.
    AmadeusOfficesAdded:
      type: object
      description: >-
        The offices created, and the upper-cased ids skipped because the pool already held them or they repeat an
        earlier id of the request: one entry per skipped request entry, both lists in request order.
      additionalProperties: false
      required:
        - created
        - skipped
      properties:
        created:
          type: array
          items:
            $ref: '#/components/schemas/AdminAmadeusOffice'
        skipped:
          type: array
          items:
            $ref: '#/components/schemas/AmadeusOfficeId'
    UpdateAmadeusOfficeRequest:
      type: object
      description: The new notes; `null` clears them.
      additionalProperties: false
      required:
        - notes
      properties:
        notes:
          oneOf:
            - type: string
              maxLength: 2000
            - type: 'null'
    AssignAmadeusOfficeRequest:
      type: object
      additionalProperties: false
      required:
        - tenantId
      properties:
        tenantId:
          $ref: '#/components/schemas/TenantId'
    AmadeusOfficeAssigned:
      type: object
      description: The assigned office and the OTA's masked Amadeus connection of its environment.
      additionalProperties: false
      required:
        - office
        - connection
      properties:
        office:
          $ref: '#/components/schemas/AdminAmadeusOffice'
        connection:
          $ref: '#/components/schemas/AmadeusConnection'
    ReleaseAmadeusOfficeRequest:
      type: object
      description: >-
        The confirmation that no booking with future travel remains on the office (PADR-0012 item 5), and the reason.
      additionalProperties: false
      required:
        - confirmNoOpenBookings
        - reason
      properties:
        confirmNoOpenBookings:
          type: boolean
          const: true
          description: Always `true`; the OTA confirmed that no booking with future travel remains on the office.
        reason:
          $ref: '#/components/schemas/AdminReason'
    AdminSettlementStatus:
      type: string
      description: >-
        The status of a statement (PADR-0003 item 9): `draft` (built by the generator, open to adjustments), `approved`
        (to be paid by bank transfer), `paid`, `carried_forward` (a net of zero or less, absorbed by the next draft) or
        `void` (a voided draft).
      enum:
        - draft
        - approved
        - paid
        - carried_forward
        - void
    SettlementPeriodStart:
      type: string
      format: date-time
      description: The first instant of a calendar month in UTC, which names the statement period.
      pattern: ^[0-9]{4}-(0[1-9]|1[0-2])-01T00:00:00Z$
      examples:
        - '2027-02-01T00:00:00Z'
    AdminSettlementSummary:
      type: object
      description: >-
        One monthly statement as the admin lists it (M5, PADR-0003), in any status, with its OTA. The properties it
        shares with the portal's `SettlementSummary` have the same schemas, apart from `status`, which has every value
        here.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - tenantName
        - environment
        - periodStart
        - periodEnd
        - currency
        - status
        - netAmount
        - lineCount
        - generatedAt
        - approvedAt
        - paidAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/SettlementId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        tenantName:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        periodStart:
          type: string
          format: date-time
          description: The first instant of the calendar month (UTC), inclusive.
        periodEnd:
          type: string
          format: date-time
          description: The first instant of the next month, exclusive.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AdminSettlementStatus'
        netAmount:
          $ref: '#/components/schemas/Money'
        lineCount:
          type: integer
          minimum: 0
          description: The lines of `adminListSettlementLines`.
        generatedAt:
          type: string
          format: date-time
          description: When the draft was last built.
        approvedAt:
          type:
            - string
            - 'null'
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The date of the bank transfer; `null` unless `paid`.
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-locking version; send it in `If-Match` to `adminApproveSettlement` and
            `adminMarkSettlementPaid`.
    AdminSettlementList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminSettlementSummary'
        page:
          $ref: '#/components/schemas/Page'
    AdminSettlement:
      type: object
      description: >-
        One statement with its totals (M5, PADR-0003 item 5): the properties of `AdminSettlementSummary` with the same
        schemas, plus the parts of `netAmount` and the other properties of the portal's `Settlement` (same schemas), the
        statement it was carried to, who approved and paid it, the void, and the review status of the OTA's payout
        account (`null` when the OTA has none).
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - tenantName
        - environment
        - periodStart
        - periodEnd
        - currency
        - status
        - netAmount
        - lineCount
        - generatedAt
        - approvedAt
        - paidAt
        - version
        - grossAmount
        - refundsAmount
        - disputesAmount
        - stripeFeesAmount
        - velexisFeesAmount
        - adjustmentsAmount
        - feeBps
        - payoutReference
        - notes
        - carriedToId
        - approvedByAccountId
        - paidByAccountId
        - voidedAt
        - voidReason
        - payoutAccountStatus
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/SettlementId'
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        tenantName:
          type: string
        environment:
          $ref: '#/components/schemas/Environment'
        periodStart:
          type: string
          format: date-time
          description: The first instant of the calendar month (UTC), inclusive.
        periodEnd:
          type: string
          format: date-time
          description: The first instant of the next month, exclusive.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        status:
          $ref: '#/components/schemas/AdminSettlementStatus'
        netAmount:
          $ref: '#/components/schemas/Money'
        lineCount:
          type: integer
          minimum: 0
          description: The lines of `adminListSettlementLines`.
        generatedAt:
          type: string
          format: date-time
          description: When the draft was last built.
        approvedAt:
          type:
            - string
            - 'null'
          format: date-time
        paidAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The date of the bank transfer; `null` unless `paid`.
        version:
          type: integer
          minimum: 1
          description: >-
            Optimistic-locking version; send it in `If-Match` to `adminApproveSettlement` and
            `adminMarkSettlementPaid`.
        grossAmount:
          $ref: '#/components/schemas/Money'
        refundsAmount:
          $ref: '#/components/schemas/Money'
        disputesAmount:
          $ref: '#/components/schemas/Money'
        stripeFeesAmount:
          $ref: '#/components/schemas/Money'
        velexisFeesAmount:
          $ref: '#/components/schemas/Money'
        adjustmentsAmount:
          $ref: '#/components/schemas/Money'
        feeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: The Velexis fee in basis points, copied from the plan when the statement was generated.
        payoutReference:
          type:
            - string
            - 'null'
          maxLength: 200
          description: The bank transfer's reference; `null` unless `paid`.
        notes:
          type:
            - string
            - 'null'
          maxLength: 2000
          description: Velexis's remarks on the statement.
        carriedToId:
          description: >-
            The statement that absorbed this carried-forward balance, set when that statement is approved; `null`
            otherwise.
          oneOf:
            - $ref: '#/components/schemas/SettlementId'
            - type: 'null'
        approvedByAccountId:
          description: The platform admin who approved it; `null` before.
          oneOf:
            - $ref: '#/components/schemas/AccountId'
            - type: 'null'
        paidByAccountId:
          description: The platform admin who recorded the payment; `null` before.
          oneOf:
            - $ref: '#/components/schemas/AccountId'
            - type: 'null'
        voidedAt:
          type:
            - string
            - 'null'
          format: date-time
        voidReason:
          type:
            - string
            - 'null'
          maxLength: 500
          description: The reason given to `adminVoidSettlement`; `null` unless `void`.
        payoutAccountStatus:
          description: >-
            The review status of the OTA's payout account now (`adminGetPayoutAccount`), which approving and paying a
            positive net need `verified`; `null` when the OTA has no payout account.
          oneOf:
            - $ref: '#/components/schemas/PayoutAccountStatus'
            - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SettlementLineType:
      type: string
      description: >-
        The kind of a statement line: one per Stripe balance transaction (`charge`, `refund`, `dispute`,
        `dispute_reversal`), the balance of earlier carried-forward statements (`carry_forward`), or a manual line
        (`adjustment`).
      enum:
        - charge
        - refund
        - dispute
        - dispute_reversal
        - adjustment
        - carry_forward
    AdminSettlementLine:
      type: object
      description: >-
        One line of a statement (M5, `settlement_lines`). Amounts are signed `Money` in the statement's currency. The
        Stripe references are `null` on `adjustment` and `carry_forward` lines; `velexisPaymentId` and `checkoutId` are
        the OTA's ids from the payment's Stripe metadata, by value, which the OTA admin shows.
      additionalProperties: false
      required:
        - id
        - type
        - occurredAt
        - amount
        - stripeFee
        - originalAmount
        - balanceTransactionId
        - sourceId
        - paymentIntentId
        - velexisPaymentId
        - checkoutId
        - description
        - createdByAccountId
      properties:
        id:
          type: string
          pattern: ^sln_[0-9A-HJKMNP-TV-Z]{26}$
          description: The line id (`sln_` + ULID).
        type:
          $ref: '#/components/schemas/SettlementLineType'
        occurredAt:
          type: string
          format: date-time
          description: When the balance transaction was created at Stripe, or when the line was added.
        amount:
          $ref: '#/components/schemas/Money'
        stripeFee:
          $ref: '#/components/schemas/Money'
        originalAmount:
          description: The charge's own amount when it settled in another currency; `null` otherwise.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        balanceTransactionId:
          type:
            - string
            - 'null'
          pattern: ^txn_[A-Za-z0-9]+$
          description: The Stripe balance transaction, settled on this line only.
        sourceId:
          type:
            - string
            - 'null'
          pattern: ^[a-z]+_[A-Za-z0-9]+$
          description: The Stripe object of the transaction (the charge, refund or dispute).
        paymentIntentId:
          type:
            - string
            - 'null'
          pattern: ^pi_[A-Za-z0-9]+$
        velexisPaymentId:
          type:
            - string
            - 'null'
          pattern: ^pay_[0-9A-Za-z]{16,40}$
          description: The OTA's payment (`pay_…` of the OTA booking API).
        checkoutId:
          type:
            - string
            - 'null'
          pattern: ^chk_[0-9A-Za-z]{16,40}$
          description: The OTA's checkout (`chk_…` of the OTA booking API).
        description:
          type:
            - string
            - 'null'
          maxLength: 500
          description: The line's text, shown to the OTA; never card data.
        createdByAccountId:
          description: The platform admin who added an `adjustment`; `null` on the other lines.
          oneOf:
            - $ref: '#/components/schemas/AccountId'
            - type: 'null'
    AdminSettlementLineList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminSettlementLine'
        page:
          $ref: '#/components/schemas/Page'
    GenerateSettlementsRequest:
      type: object
      description: The month to (re)build, and optionally one OTA.
      additionalProperties: false
      required:
        - periodStart
      properties:
        periodStart:
          $ref: '#/components/schemas/SettlementPeriodStart'
        tenantId:
          $ref: '#/components/schemas/TenantId'
    SettlementAdjustmentAmount:
      type: object
      description: >-
        The signed amount of a manual line, not zero, with at most two decimals (`numeric(12,2)`); positive is owed to
        the OTA. Its currency must be the statement's, which the service checks (`400 VALIDATION_FAILED`).
      additionalProperties: false
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: ^(?!-?0+(\.0+)?$)-?[0-9]{1,10}(\.[0-9]{1,2})?$
          examples:
            - '-25.00'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    AddSettlementAdjustmentRequest:
      type: object
      additionalProperties: false
      required:
        - amount
        - description
        - reason
      properties:
        amount:
          $ref: '#/components/schemas/SettlementAdjustmentAmount'
        description:
          type: string
          minLength: 1
          maxLength: 500
          description: The line's text, which the OTA sees on its statement.
        reason:
          $ref: '#/components/schemas/AdminReason'
    MarkSettlementPaidRequest:
      type: object
      additionalProperties: false
      required:
        - paidAt
        - payoutReference
      properties:
        paidAt:
          type: string
          format: date-time
          description: The date of the bank transfer; not in the future.
        payoutReference:
          type: string
          minLength: 1
          maxLength: 200
          description: The bank transfer's reference, as the bank statement shows it.
    RevealedPayoutAccount:
      description: >-
        The bank identifiers of a payout account (M5), shown to a platform admin who gave a reason and a step-up:
        an IBAN account, or a local one. Readable on purpose, unlike the write-only request fields of
        `setPayoutAccount`; answered with `no-store` only by `adminRevealPayoutAccount`.
      oneOf:
        - $ref: '#/components/schemas/RevealedIbanPayoutAccount'
        - $ref: '#/components/schemas/RevealedLocalPayoutAccount'
    RevealedIbanPayoutAccount:
      type: object
      description: >-
        An IBAN account: the IBAN as stored (spaces removed, upper case, 15–34 characters), and the BIC when the owner
        gave one.
      additionalProperties: false
      required:
        - iban
      properties:
        iban:
          type: string
          pattern: ^[A-Z]{2}[0-9]{2}[A-Z0-9]{11,30}$
        bic:
          type: string
          pattern: ^[A-Za-z]{6}[A-Za-z0-9]{2}([A-Za-z0-9]{3})?$
    RevealedLocalPayoutAccount:
      type: object
      description: A local account, with the account and routing numbers as the owner entered them.
      additionalProperties: false
      required:
        - accountNumber
        - routingNumber
      properties:
        accountNumber:
          type: string
          minLength: 4
          maxLength: 34
          pattern: ^[A-Za-z0-9][A-Za-z0-9 -]*$
        routingNumber:
          type: string
          minLength: 3
          maxLength: 20
          pattern: ^[A-Za-z0-9][A-Za-z0-9 -]*$
    ReviewPayoutAccountRequest:
      description: 'The review: `verified`, or `rejected` with a note for the owner.'
      oneOf:
        - $ref: '#/components/schemas/VerifyPayoutAccountRequest'
        - $ref: '#/components/schemas/RejectPayoutAccountRequest'
    VerifyPayoutAccountRequest:
      type: object
      additionalProperties: false
      required:
        - decision
      properties:
        decision:
          type: string
          const: verified
    RejectPayoutAccountRequest:
      type: object
      additionalProperties: false
      required:
        - decision
        - note
      properties:
        decision:
          type: string
          const: rejected
        note:
          type: string
          minLength: 1
          maxLength: 1000
          description: Why the account is rejected, shown to the owner as `reviewNote`; never a bank number.
    AdminDomain:
      type: object
      description: >-
        A storefront host of any OTA as Velexis staff see it (M5, PADR-0004): the properties it shares with the portal's
        `Domain` have the same schemas, plus its OTA, the verification time, the count of consecutive failed daily
        re-checks and the time of the last TLS probe. The DNS records to create are the portal's business.
      additionalProperties: false
      required:
        - id
        - tenantId
        - tenantKey
        - hostname
        - kind
        - purpose
        - isPrimary
        - verificationStatus
        - verifiedAt
        - verificationDeadlineAt
        - lastCheckedAt
        - lastCheckError
        - checkFailures
        - tlsStatus
        - tlsExpiresAt
        - tlsCheckedAt
        - createdAt
      properties:
        id:
          type: string
          pattern: ^dom_[0-9A-HJKMNP-TV-Z]{26}$
        tenantId:
          $ref: '#/components/schemas/TenantId'
        tenantKey:
          $ref: '#/components/schemas/TenantKey'
        hostname:
          type: string
          format: hostname
          description: The host name, lower case.
        kind:
          type: string
          description: '`subdomain` (`<key>.<STOREFRONT_BASE_DOMAIN>`, Velexis owns the zone) or `custom` (M5).'
          enum:
            - subdomain
            - custom
        purpose:
          type: string
          description: What the host serves; only `storefront` in the MVP.
          enum:
            - storefront
            - api
            - console
        isPrimary:
          type: boolean
          description: The primary host, used in links and e-mails.
        verificationStatus:
          type: string
          enum:
            - pending
            - verified
            - failed
        verifiedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: When DNS ownership was last verified.
        verificationDeadlineAt:
          type:
            - string
            - 'null'
          format: date-time
          description: End of the 72-hour verification window of a custom domain; `null` for the sub-domain.
        lastCheckedAt:
          type:
            - string
            - 'null'
          format: date-time
        lastCheckError:
          type:
            - string
            - 'null'
          maxLength: 500
          description: What the last DNS check found missing, safe to show.
        checkFailures:
          type: integer
          minimum: 0
          description: Consecutive failed daily re-checks of a verified domain; 3 set it `failed`.
        tlsStatus:
          type: string
          enum:
            - pending
            - issued
            - failed
            - expired
        tlsExpiresAt:
          type:
            - string
            - 'null'
          format: date-time
        tlsCheckedAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The last TLS probe of the host.
        createdAt:
          type: string
          format: date-time
    AdminDomainList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminDomain'
        page:
          $ref: '#/components/schemas/Page'
    AccountStatus:
      type: string
      description: >-
        The lifecycle of an account: `pending_verification` (e-mail address not verified), `active`, `locked`,
        `disabled` (by Velexis staff), `deleted` (erased).
      enum:
        - pending_verification
        - active
        - locked
        - disabled
        - deleted
    AdminAccountSummary:
      type: object
      description: One account in the admin search.
      additionalProperties: false
      required:
        - id
        - email
        - fullName
        - status
        - mfaEnabled
        - isPlatformAdmin
        - lastLoginAt
        - createdAt
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        fullName:
          type: string
        status:
          $ref: '#/components/schemas/AccountStatus'
        mfaEnabled:
          type: boolean
        isPlatformAdmin:
          type: boolean
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
    AdminAccountList:
      type: object
      additionalProperties: false
      required:
        - data
        - page
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AdminAccountSummary'
        page:
          $ref: '#/components/schemas/Page'
    AdminAccount:
      type: object
      description: >-
        An account as Velexis support sees it. Never holds the password hash, the MFA secret, recovery codes or
        tokens.
      additionalProperties: false
      required:
        - id
        - email
        - emailVerified
        - fullName
        - locale
        - timeZone
        - status
        - mfaEnabled
        - mfaEnabledAt
        - isPlatformAdmin
        - failedLoginCount
        - lockedUntil
        - lastLoginAt
        - createdAt
        - version
      properties:
        id:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        emailVerified:
          type: boolean
        fullName:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        timeZone:
          $ref: '#/components/schemas/TimeZone'
        status:
          $ref: '#/components/schemas/AccountStatus'
        mfaEnabled:
          type: boolean
        mfaEnabledAt:
          type:
            - string
            - 'null'
          format: date-time
        isPlatformAdmin:
          type: boolean
        failedLoginCount:
          type: integer
          minimum: 0
          description: Consecutive failed sign-ins; five lock the account for 15 minutes.
        lockedUntil:
          type:
            - string
            - 'null'
          format: date-time
          description: The end of the current lockout; `null` when not locked.
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        version:
          type: integer
          minimum: 1
          description: Optimistic-locking version.
    AdminAccountDetail:
      type: object
      description: An account with its memberships, its active session count and its recent audit rows.
      additionalProperties: false
      required:
        - account
        - memberships
        - activeSessions
        - recentAudit
      properties:
        account:
          $ref: '#/components/schemas/AdminAccount'
        memberships:
          type: array
          description: The active memberships, one per OTA.
          items:
            $ref: '#/components/schemas/AccountMembership'
        activeSessions:
          type: integer
          minimum: 0
          description: The refresh families of the portal and the admin that are neither revoked nor expired.
        recentAudit:
          type: array
          description: The last 50 audit rows the account acted in or that target it, newest first.
          maxItems: 50
          items:
            $ref: '#/components/schemas/AuditEntry'
    PlatformAdmin:
      type: object
      description: A platform admin.
      additionalProperties: false
      required:
        - accountId
        - email
        - fullName
        - mfaEnabled
        - lastLoginAt
      properties:
        accountId:
          $ref: '#/components/schemas/AccountId'
        email:
          $ref: '#/components/schemas/EmailAddress'
        fullName:
          type: string
        mfaEnabled:
          type: boolean
          description: Always true for an admin who can sign in (PADR-0006 item 2).
        lastLoginAt:
          type:
            - string
            - 'null'
          format: date-time
    PlatformAdminList:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PlatformAdmin'
    GrantAdminRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - reason
      properties:
        email:
          $ref: '#/components/schemas/EmailAddress'
        reason:
          $ref: '#/components/schemas/AdminReason'
    StripeEventType:
      type: string
      description: >-
        A Stripe event type, for example `invoice.paid` (lower-case words and underscores, separated by dots); the
        pattern of `AdminStripeEvent.type`, so every stored type can be answered.
      maxLength: 255
      pattern: ^[a-z_]+(\.[a-z_]+)+$
    StripeEventData:
      type: object
      description: >-
        The event's `data`: `object` is the Stripe object as it was when the event happened (the receiver keeps only its
        `object` type and its `id`; the worker re-fetches it before it acts), and `previous_attributes` the changed
        values of an `*.updated` event. Open, as Stripe extends it.
      additionalProperties: true
      required:
        - object
      properties:
        object:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              maxLength: 255
            object:
              type: string
              maxLength: 255
        previous_attributes:
          type: object
          additionalProperties: true
    StripeEvent:
      type: object
      description: >-
        A Stripe event as Stripe posts it to a webhook endpoint (an `event` object of the endpoint's API version, in
        Stripe's snake_case). Stripe adds properties without notice, so the schema is open on purpose
        (`additionalProperties: true`, the only open request body of the document) and names only what the receiver
        reads; a closed schema would refuse correctly signed events, which Stripe would retry for 3 days. The payload
        is never stored: the inbox keeps the id, the type, `livemode`, the API version, the creation time and the type
        and id of `data.object`.
      additionalProperties: true
      required:
        - id
        - object
        - type
        - livemode
        - created
        - data
      properties:
        id:
          $ref: '#/components/schemas/StripeEventId'
        object:
          type: string
          const: event
        type:
          $ref: '#/components/schemas/StripeEventType'
        livemode:
          type: boolean
          description: Must match the deployment (`APP_ENV=production` means live), else `400 VALIDATION_FAILED`.
        created:
          type: integer
          minimum: 0
          description: When Stripe created the event, in seconds since the epoch.
        api_version:
          type:
            - string
            - 'null'
          maxLength: 64
          description: The Stripe API version of the payload.
        account:
          type: string
          maxLength: 255
          pattern: ^acct_[A-Za-z0-9_]+$
          description: The connected account of a Connect event; absent on the events of the Velexis account itself.
        data:
          $ref: '#/components/schemas/StripeEventData'
    StripeConnectAccountEvent:
      type: object
      description: >-
        A Stripe Connect event of a connected account, as `StripeEvent` (open on purpose, for the same reason) with
        `account` required: the Connect endpoint receives only events of connected accounts.
      additionalProperties: true
      required:
        - id
        - object
        - account
        - type
        - livemode
        - created
        - data
      properties:
        id:
          $ref: '#/components/schemas/StripeEventId'
        object:
          type: string
          const: event
        account:
          type: string
          maxLength: 255
          pattern: ^acct_[A-Za-z0-9_]+$
          description: >-
            The connected account (`acct_…`; the synthetic test fixtures use underscores, Stripe's own ids do not); the
            worker matches it with `account_reference` of `payment_provider_connections`.
        type:
          $ref: '#/components/schemas/StripeEventType'
        livemode:
          type: boolean
          description: Must match the deployment (`APP_ENV=production` means live), else `400 VALIDATION_FAILED`.
        created:
          type: integer
          minimum: 0
          description: When Stripe created the event, in seconds since the epoch.
        api_version:
          type:
            - string
            - 'null'
          maxLength: 64
          description: The Stripe API version of the payload.
        data:
          $ref: '#/components/schemas/StripeEventData'
    StripeEventReceived:
      type: object
      description: The answer Stripe needs to stop retrying.
      additionalProperties: false
      required:
        - received
      properties:
        received:
          type: boolean
          const: true
x-error-catalogue:
  VALIDATION_FAILED:
    status: 400
    description: The request body, query or headers failed validation; see fieldErrors.
  VERIFICATION_TOKEN_INVALID:
    status: 400
    description: The e-mail verification link is unknown, already used or expired.
  PASSWORD_RESET_TOKEN_INVALID:
    status: 400
    description: The password reset link is unknown, already used or expired.
  INVITATION_INVALID:
    status: 400
    description: The invitation is unknown, already used, revoked or expired.
  CONNECT_STATE_INVALID:
    status: 400
    description: The Stripe connection request is unknown, already used or expired; start again.
  MFA_SETUP_EXPIRED:
    status: 400
    description: The pending two-factor set-up expired; start the set-up again.
  WEBHOOK_SIGNATURE_INVALID:
    status: 400
    description: The webhook signature could not be verified.
  UNAUTHENTICATED:
    status: 401
    description: No valid access token was sent for an operation that needs one.
  TOKEN_EXPIRED:
    status: 401
    description: The access token expired; refresh the session.
  INVALID_CREDENTIALS:
    status: 401
    description: E-mail address or password is wrong.
  REFRESH_TOKEN_INVALID:
    status: 401
    description: The session expired or was revoked; sign in again.
  REFRESH_TOKEN_REUSED:
    status: 401
    description: The session was ended for safety because its refresh token was used twice; sign in again.
  MFA_CHALLENGE_INVALID:
    status: 401
    description: The two-factor sign-in expired or had too many attempts; sign in again.
  MFA_CODE_INVALID:
    status: 401
    description: The authentication code or recovery code is wrong.
  REAUTH_REQUIRED:
    status: 401
    description: This action needs a fresh code from your authenticator app.
  FORBIDDEN:
    status: 403
    description: The caller is authenticated but not allowed to perform this operation on this resource.
  EMAIL_NOT_VERIFIED:
    status: 403
    description: Verify your e-mail address first.
  ACCOUNT_DISABLED:
    status: 403
    description: This account is disabled; contact Velexis support.
  MFA_REQUIRED:
    status: 403
    description: Turn on two-factor authentication first.
  INVITATION_EMAIL_MISMATCH:
    status: 403
    description: The invitation was sent to another e-mail address.
  FEATURE_DISABLED:
    status: 403
    description: The feature is not available yet, or the plan does not include it.
  NOT_FOUND:
    status: 404
    description: The resource does not exist or is not visible to the caller.
  CONFLICT:
    status: 409
    description: The request conflicts with the current state of the resource.
  IDEMPOTENCY_KEY_REUSED:
    status: 409
    description: The Idempotency-Key was already used with a different request body.
  TENANT_KEY_UNAVAILABLE:
    status: 409
    description: The OTA key is taken, reserved or was used before.
  TENANT_NOT_ACTIVE:
    status: 409
    description: The OTA is not active; it is being set up, suspended or failed.
  PROVISIONING_NOT_RETRYABLE:
    status: 409
    description: Only a failed setup can be retried.
  LAST_OWNER:
    status: 409
    description: An OTA must keep at least one active owner.
  ALREADY_MEMBER:
    status: 409
    description: The person is already a member of this OTA.
  INVITATION_PENDING:
    status: 409
    description: An invitation for this e-mail address is already pending.
  DOMAIN_TAKEN:
    status: 409
    description: The host name is used by another OTA.
  DOMAIN_NOT_VERIFIED:
    status: 409
    description: Verify the domain first.
  AMADEUS_OFFICE_UNAVAILABLE:
    status: 409
    description: The Amadeus office is not available, or no free office is left.
  STRIPE_ACCOUNT_ALREADY_CONNECTED:
    status: 409
    description: The Stripe account is already connected to another OTA.
  SETTLEMENT_STATE_INVALID:
    status: 409
    description: The statement does not allow this action in its current status.
  MFA_ALREADY_ENABLED:
    status: 409
    description: Two-factor authentication is already on.
  KEYS_ALREADY_REVEALED:
    status: 410
    description: The initial keys were already revealed, or the 24-hour window to reveal them passed.
  PRECONDITION_FAILED:
    status: 412
    description: Someone else changed this in the meantime; reload and try again.
  PASSWORD_TOO_WEAK:
    status: 422
    description: The password needs at least 10 characters and must not be a common or breached password.
  CURRENT_PASSWORD_INCORRECT:
    status: 422
    description: The current password is wrong.
  PLAN_NOT_AVAILABLE:
    status: 422
    description: The plan is not available with this billing interval.
  PLAN_LIMIT_REACHED:
    status: 422
    description: The plan's limit is reached.
  LIVE_MODE_NOT_ENABLED:
    status: 422
    description: The OTA must be live first.
  LIVE_PRECONDITIONS_UNMET:
    status: 422
    description: The OTA cannot go live yet; some requirements are missing.
  DOMAIN_INVALID:
    status: 422
    description: Enter a valid public host name that does not belong to Velexis.
  PAYOUT_ACCOUNT_REQUIRED:
    status: 422
    description: Live payments collected by Velexis need a verified payout account.
  UNPROCESSABLE:
    status: 422
    description: The request breaks a business rule.
  ACCOUNT_LOCKED:
    status: 423
    description: Too many failed sign-ins; try again in a few minutes.
  RATE_LIMITED:
    status: 429
    description: Too many requests; try again after the time in Retry-After.
  INTERNAL_ERROR:
    status: 500
    description: Unexpected error; quote the requestId to support.
  PROVIDER_ERROR:
    status: 502
    description: An external service (Stripe, Amadeus or DNS) failed; try again later.
  SERVICE_UNAVAILABLE:
    status: 503
    description: Velexis is temporarily unavailable; try again later.
