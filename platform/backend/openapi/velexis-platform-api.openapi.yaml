      schema:
        $ref: '#/components/schemas/SettlementId'
      example: stl_01JD9W3Y7A1C5E9G3J7M1Q5S9V
    AdminDomainId:
      name: domainId
      in: path
      required: true
      description: The storefront host (`id` of `adminListDomains`) of any OTA; an unknown id answers `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^dom_[0-9A-HJKMNP-TV-Z]{26}$
      example: dom_01JB3K5N9Q3S7W1Y5A9C3E7G1J
    StripeSignature:
      name: Stripe-Signature
      in: header
      required: true
      description: >-
        Stripe's signature of the raw body (`t=<timestamp>,v1=<HMAC-SHA256>`, several `v1` while a secret is rolled),
        checked with the endpoint's webhook secret and a 5-minute tolerance before anything else; missing or wrong, it
        answers `400 WEBHOOK_SIGNATURE_INVALID`.
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      example: t=1803862996,v1=5257a869e7ecebeda32affa62cdca3fa51cad7e77a0e56ff536d0ce8e108d8bd
  responses:
    ValidationFailed:
      description: 'The request body, query or headers failed validation; see fieldErrors. Possible codes: VALIDATION_FAILED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_FAILED:
              $ref: '#/components/examples/VALIDATION_FAILED'
    Unauthenticated:
      description: 'No valid portal access token was sent. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
    StepUpUnauthorized:
      description: >-
        No valid access token, or no TOTP step-up within the last 15 minutes (call stepUp, then retry). Possible codes:
        UNAUTHENTICATED, TOKEN_EXPIRED, REAUTH_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
            REAUTH_REQUIRED:
              $ref: '#/components/examples/REAUTH_REQUIRED'
    EmailNotVerified:
      description: 'The account''s e-mail address is not verified yet. Possible codes: EMAIL_NOT_VERIFIED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
    StepUpForbidden:
      description: >-
        The e-mail address is not verified, or MFA is not enabled, so no step-up is possible. Possible codes:
        EMAIL_NOT_VERIFIED, MFA_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
            MFA_REQUIRED:
              $ref: '#/components/examples/MFA_REQUIRED'
    NotFound:
      description: 'Not found, or not visible to the caller. Possible codes: NOT_FOUND.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NOT_FOUND:
              $ref: '#/components/examples/NOT_FOUND'
    PasswordTooWeak:
      description: 'The password breaks the password rules. Possible codes: PASSWORD_TOO_WEAK.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PASSWORD_TOO_WEAK:
              $ref: '#/components/examples/PASSWORD_TOO_WEAK'
    RateLimited:
      description: 'Too many requests; retry after `Retry-After` seconds. Possible codes: RATE_LIMITED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            RATE_LIMITED:
              $ref: '#/components/examples/RATE_LIMITED'
    InternalError:
      description: 'Unexpected error; quote the requestId to support. Possible codes: INTERNAL_ERROR.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            INTERNAL_ERROR:
              $ref: '#/components/examples/INTERNAL_ERROR'
    TenantRoleForbidden:
      description: >-
        The e-mail address is not verified, or the caller's role in the OTA does not allow the operation. Possible
        codes: EMAIL_NOT_VERIFIED, FORBIDDEN.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
            FORBIDDEN:
              $ref: '#/components/examples/FORBIDDEN'
    TenantRoleOrStepUpForbidden:
      description: >-
        The e-mail address is not verified, the caller's role in the OTA does not allow the operation, or the operation
        needs a step-up and MFA is not enabled. Possible codes: EMAIL_NOT_VERIFIED, FORBIDDEN, MFA_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
            FORBIDDEN:
              $ref: '#/components/examples/FORBIDDEN'
            MFA_REQUIRED:
              $ref: '#/components/examples/MFA_REQUIRED'
    TenantNotActive:
      description: >-
        The OTA is not active: it is being set up, suspended or failed (`details.status`). Possible codes:
        TENANT_NOT_ACTIVE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            TENANT_NOT_ACTIVE:
              $ref: '#/components/examples/TENANT_NOT_ACTIVE'
    ApiKeyConflict:
      description: >-
        The key is revoked (`details.reason = revoked`), or the OTA is not active, so its keys are read-only. Possible
        codes: CONFLICT, TENANT_NOT_ACTIVE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            CONFLICT:
              summary: The key is revoked
              value:
                error:
                  code: CONFLICT
                  message: The request conflicts with the current state of the resource.
                  status: 409
                  requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                  details:
                    reason: revoked
            TENANT_NOT_ACTIVE:
              $ref: '#/components/examples/TENANT_NOT_ACTIVE'
    LastOwner:
      description: 'The change would leave the OTA without an active owner. Possible codes: LAST_OWNER.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            LAST_OWNER:
              $ref: '#/components/examples/LAST_OWNER'
    InvitationNotPending:
      description: >-
        The invitation is not pending any more: it was accepted, revoked or expired (`details.reason = not_pending`).
        Possible codes: CONFLICT.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            CONFLICT:
              summary: The invitation is not pending
              value:
                error:
                  code: CONFLICT
                  message: The request conflicts with the current state of the resource.
                  status: 409
                  requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                  details:
                    reason: not_pending
    InvitationInvalid:
      description: >-
        The body failed validation, or the invitation is unknown, already used, revoked or expired. Possible codes:
        VALIDATION_FAILED, INVITATION_INVALID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_FAILED:
              $ref: '#/components/examples/VALIDATION_FAILED'
            INVITATION_INVALID:
              $ref: '#/components/examples/INVITATION_INVALID'
    PreconditionFailed:
      description: '`If-Match` is not the current version; reload and try again. Possible codes: PRECONDITION_FAILED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PRECONDITION_FAILED:
              $ref: '#/components/examples/PRECONDITION_FAILED'
    PlanLimitReached:
      description: >-
        The plan's limit is reached (`details.limit` and `details.used`). Possible codes: PLAN_LIMIT_REACHED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PLAN_LIMIT_REACHED:
              $ref: '#/components/examples/PLAN_LIMIT_REACHED'
    ServiceUnavailable:
      description: >-
        A dependency the operation needs (PostgreSQL, or Redis for the idempotency store, the BullMQ queues or the
        one-time console tokens) is unavailable; nothing was written. Retry later. Possible codes: SERVICE_UNAVAILABLE.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            SERVICE_UNAVAILABLE:
              $ref: '#/components/examples/SERVICE_UNAVAILABLE'
    ProviderError:
      description: >-
        Stripe failed or could not be reached (`details.provider = stripe`); retry later. Possible codes:
        PROVIDER_ERROR.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PROVIDER_ERROR:
              $ref: '#/components/examples/PROVIDER_ERROR'
    AdminUnauthenticated:
      description: >-
        No valid platform admin access token was sent: none, an expired one, a portal token, or the token of an account
        that is no longer an active platform admin (the guard re-reads the account on every request). Possible codes:
        UNAUTHENTICATED, TOKEN_EXPIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
    AdminStepUpUnauthorized:
      description: >-
        No valid platform admin access token, or no TOTP step-up within the last 15 minutes (call adminStepUp, then
        retry). Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED, REAUTH_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
            REAUTH_REQUIRED:
              $ref: '#/components/examples/REAUTH_REQUIRED'
    AdminSelfOrLastAdminForbidden:
      description: >-
        The action would lock Velexis out of its admin: it targets the caller's own account (`details.reason = self`)
        or the last active platform admin (`details.reason = last_admin`). Possible codes: FORBIDDEN.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            FORBIDDEN:
              summary: The last active platform admin
              value:
                error:
                  code: FORBIDDEN
                  message: The caller is authenticated but not allowed to perform this operation on this resource.
                  status: 403
                  requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                  details:
                    reason: last_admin
    SettlementStateInvalid:
      description: >-
        The statement's status does not allow the action (`details.status`): adjustments, approval and voiding need a
        `draft`, marking paid an `approved` statement. An approval also answers it for a draft whose carried-forward
        balance is out of date (`details.reason = carry_forward_changed`: generate the month again). Possible codes:
        SETTLEMENT_STATE_INVALID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            SETTLEMENT_STATE_INVALID:
              $ref: '#/components/examples/SETTLEMENT_STATE_INVALID'
    PayoutAccountRequired:
      description: >-
        A positive net is paid only to a `verified` payout account, and the OTA has none (PADR-0003 item 9). Possible
        codes: PAYOUT_ACCOUNT_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PAYOUT_ACCOUNT_REQUIRED:
              $ref: '#/components/examples/PAYOUT_ACCOUNT_REQUIRED'
    StripeEventRefused:
      description: >-
        The signature is missing or wrong, or the event failed validation (for example a `livemode` that does not match
        the deployment). Stripe retries a refused event. Possible codes: VALIDATION_FAILED, WEBHOOK_SIGNATURE_INVALID.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_FAILED:
              summary: A test-mode event reached a live deployment
              value:
                error:
                  code: VALIDATION_FAILED
                  message: The request body, query or headers failed validation; see fieldErrors.
                  status: 400
                  requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                  fieldErrors:
                    - path: /livemode
                      code: livemode_mismatch
                      message: The event's mode does not match this deployment.
            WEBHOOK_SIGNATURE_INVALID:
              $ref: '#/components/examples/WEBHOOK_SIGNATURE_INVALID'
