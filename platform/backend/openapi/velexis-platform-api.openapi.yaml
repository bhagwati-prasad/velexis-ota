    post:
      operationId: createTenant
      summary: Create an OTA
      description: >-
        Creates an OTA and starts its setup (platform/docs/flows/signup-and-create-ota.md). The account must be verified
        and active and may own at most `MAX_TENANTS_PER_ACCOUNT` OTAs that are not `failed` (`422 UNPROCESSABLE`,
        `details.reason = tenant_limit`). The key must follow the key rules (else `400`) and be neither reserved nor
        used by any tenant row (`409 TENANT_KEY_UNAVAILABLE`, also when a concurrent request took it first).


        **One transaction** inserts the tenant (`provisioning`, storefront environment `test`), the caller's `owner`
        membership, the subscription, the verified primary sub-domain `<key>.<STOREFRONT_BASE_DOMAIN>`, a queued
        `provision` job and an audit row. **Before M5** (`FEATURE_STRIPE_BILLING` off) the plan is always
        `early_access`, whatever the request says: the subscription is a manual trial (`trialing`, `trial_ends_at =
        now + plans.trial_days`), the job is dispatched to the OTA worker at once and `checkoutUrl` is `null`. **From
        M5** `planCode` must name a public, active plan with a Stripe price for `billingInterval` (`422
        PLAN_NOT_AVAILABLE`); the subscription starts `incomplete`, the job waits for Checkout, and the answer carries
        the Stripe Checkout URL. When Stripe fails, the OTA and its job stay created, `checkoutUrl` is `null` and
        `checkoutError` says why; the setup page offers to continue to payment later.


        **Idempotent** (`Idempotency-Key`, 24 hours): a retry with the same key and body replays the `202`, another
        body answers `409 IDEMPOTENCY_KEY_REUSED`, and while the idempotency store (Redis) is down the call answers `503
        SERVICE_UNAVAILABLE` before writing anything. The setup progresses in `getProvisioning`.
