  /v1/admin/stripe-events:
    get:
      operationId: adminListStripeEvents
      summary: List the Stripe webhook inbox
      description: >-
        The events of both Stripe receivers (`stripe_events`, M5): `failed` and `ignored` events first, each group
        newest first (`receivedAt`), then the others, cursor-paginated, with filters on the status, the exact event
        type and the OTA the event was resolved to. `lastError` says why an event failed or was ignored, a short
        message without secrets; the payload is never stored or answered (the worker re-fetches the object from
        Stripe).
      tags:
        - Admin billing
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - stripe_events
      parameters:
        - name: status
          in: query
          required: false
          description: Only events in this processing status.
          schema:
            type: string
            enum:
              - received
              - processing
              - processed
              - ignored
              - failed
        - name: type
          in: query
          required: false
          description: Only events of this Stripe type, matched exactly.
          schema:
            type: string
            maxLength: 255
            pattern: ^[a-z_]+(\.[a-z_]+)+$
          example: invoice.payment_failed
        - name: tenantId
          in: query
          required: false
          description: Only the events resolved to this OTA.
          schema:
            $ref: '#/components/schemas/TenantId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
