    post:
      operationId: createApiKey
      summary: Create an API key, shown once
      description: >-
        Owners and admins create a key of an `active` OTA (`409 TENANT_NOT_ACTIVE` otherwise). The key is
        `<pk|sk>_<environment>_` plus 40 base62 characters from the CSPRNG; the platform stores its prefix, `last4` and
        HMAC-SHA-256 with the server pepper, never the key itself (PADR-0005). The answer carries the full key **once**,
        with `Cache-Control: no-store`; it is never logged and never stored for a replay.


        **Rules.** A publishable key takes `allowedOrigins` (exact `https://host[:port]` origins;
        `http://localhost:<port>` and `http://127.0.0.1:<port>` only on test keys; no wildcards, paths or trailing
        slashes; at most 20) and no scopes. A secret key takes `scopes` from the OTA contract's `ConsoleApiKeyScope` and
        `StaffPermission`, checked by the service against the generated OTA types (PADR-0005 item 6): default
        `["storefront"]`; `storefront` excludes the console scopes; `console:automation` needs at least one permission,
        and permissions are allowed only with it. A broken rule answers `400 VALIDATION_FAILED` with field errors.
        Kind, environment and scopes never change later; roll the key instead. Keys that are neither revoked nor
        expired count against the plan's `apiKeys` limit (`422 PLAN_LIMIT_REACHED`). `live` keys exist only once the
        OTA is live (`422 LIVE_MODE_NOT_ENABLED`), and a **live secret key needs a TOTP step-up** within 15 minutes
        (`401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED` without MFA); test keys do not, so the operation carries no
        `x-mfa-step-up`. Writes an audit row with the prefix, kind, environment and scopes, never the key.
      tags:
        - API keys
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
