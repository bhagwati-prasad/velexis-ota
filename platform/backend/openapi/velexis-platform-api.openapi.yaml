              code: '583104'
      responses:
        '200':
          description: A new session of the same family, with `mfa_at` now.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                session:
                  $ref: '#/components/examples/AdminSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            No valid admin access token, or the code is wrong. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
