    get:
      operationId: adminDownloadSettlementLines
      summary: Download the lines of a statement as CSV
      description: >-
        Every line of one statement in any status as a CSV file (M5, PADR-0016 item 4: the CSV representation of
        `adminListSettlementLines` has its own operation): UTF-8, comma-separated, quoted as RFC 4180 says, with one
        header row and these columns: `id`, `type`, `occurredAt`, `amount` and `stripeFee` (signed decimal strings in
        the statement's currency), `originalAmount` and `originalCurrency` (the charge's own amount when it settled in
        another currency), `balanceTransactionId`, `sourceId`, `paymentIntentId`, `velexisPaymentId`, `checkoutId`,
        `description` and `createdByAccountId` (the admin who added an adjustment); an empty cell is a `null`. The
        lines are in `occurredAt` order. Amounts are written by the API without a thousands separator and kept as they
        are; a text cell that starts with `=`, `+`, `-`, `@`, a tab or a carriage return gets a leading `'` (the OWASP
        rule against CSV injection), so a spreadsheet never runs it as a formula. The file holds an OTA's payment
        records, so it is never cached.
