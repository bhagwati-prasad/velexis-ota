        - TENANT_KEY_UNAVAILABLE
        - IDEMPOTENCY_KEY_REUSED
        - PLAN_NOT_AVAILABLE
        - UNPROCESSABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
