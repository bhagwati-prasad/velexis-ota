                finishedAt: '2026-10-16T14:31:44Z'
                steps:
                  - step: create_schema
                    status: succeeded
                    startedAt: '2026-10-16T14:31:13Z'
                    finishedAt: '2026-10-16T14:31:13Z'
                  - step: run_migrations
                    status: failed
                    startedAt: '2026-10-16T14:31:13Z'
                    finishedAt: '2026-10-16T14:31:44Z'
