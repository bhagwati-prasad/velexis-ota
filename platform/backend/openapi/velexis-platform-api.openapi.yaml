  /v1/admin/amadeus-accounts/{accountId}:
    parameters:
      - $ref: '#/components/parameters/AmadeusAccountId'
    patch:
      operationId: adminUpdateAmadeusAccount
      summary: Rename, rotate or disable a Velexis Amadeus account
      description: >-
        Renames the account, changes its host or client id, rotates its client secret, or disables it (`status:
        disabled`). A change of `clientSecret`, `clientId` or `baseUrl` needs a TOTP step-up within the last 15
        minutes (PADR-0006 item 4: rotating the shared credentials). The host counts too, because the verification
        job and the OTA backend send the stored secret to it: without the step-up, a stolen admin session could point
        the account at another host and receive the secret. The service checks these cases, so the operation is not
        marked `x-mfa-step-up` and answers `401 REAUTH_REQUIRED` only then; a new name or `status: disabled` needs no
        step-up. A new host, client id or secret sets the account `pending_verification` and runs the verification
        job again; the new secret is encrypted as on creation. A successful verification makes a
        disabled account `active` again. `If-Match` carries the account's `version`; a stale version answers `412
        PRECONDITION_FAILED`. Writes an audit row without the secret and, after commit, publishes an `amadeus_account`
        invalidation, so the OTA backend drops its cached account; office assignments are unaffected (PADR-0012 item
        7).
      tags:
        - Admin Amadeus
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - NOT_FOUND
        - PRECONDITION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - amadeus_accounts
        - amadeus_offices
        - platform_audit_log
