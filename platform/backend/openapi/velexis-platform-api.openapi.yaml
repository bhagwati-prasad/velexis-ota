    patch:
      operationId: adminUpdatePlan
      summary: Edit or retire a plan
      description: >-
        Changes any field of a plan except `code` and `currency`: names, prices (in the plan's currency), limits,
        features, visibility, trial days, settlement fee and order. `isActive: false` retires the plan: it leaves the
        pricing page and the wizard, and existing subscriptions keep it. `annualPrice: null` removes the yearly
        option. `If-Match` carries the plan's `version`; a stale version answers `412 PRECONDITION_FAILED`. Writes an
        audit row with the before and after values and, after commit, publishes a `plan` invalidation (`{type:
        "plan", code}`) when `limits` or `features` change, so both backends reload the quotas.


        **Stripe prices (M5, PADR-0002, subscription-billing flow §A).** `stripeProductId`, `stripePriceIdMonth` and
        `stripePriceIdYear` link the plan to the Stripe product and recurring prices that Velexis created in Stripe
        first; `null` unlinks one, and an interval without a price cannot start Checkout (`checkoutAvailable`). When
        the request links or changes a price, or changes a price of the plan while one is linked, the API retrieves
        every linked price from Stripe before saving and answers the differences in `priceWarnings`: the amount, the
        currency or the interval of a price differs from the plan, or the price is inactive. Warnings never block the
        save. If Stripe fails or cannot be reached, nothing is saved and the answer is `502 PROVIDER_ERROR`; retry
        later. A price id can link one plan only: a price that another plan links answers `409 CONFLICT`
        (`details.reason = stripe_price_taken`).
