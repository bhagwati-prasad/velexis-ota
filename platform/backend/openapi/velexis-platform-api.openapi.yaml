  /internal/tls/ask:
    get:
      operationId: tlsAsk
      summary: Decide whether Caddy may obtain a certificate for a host
      description: >-
        Caddy's on-demand TLS `ask` endpoint (ADR-0018, PADR-0004 item 6). Answers `200` with no body when the host is
        `<key>.<STOREFRONT_BASE_DOMAIN>` of an OTA in `provisioning`, `active` or `suspended`, or a verified custom
        storefront domain of an `active` OTA whose plan has `customDomains > 0` while the `custom_domains` switch is
        on; `404` for every other host.


        **Order.** First the host syntax (lower-cased, at most 253 characters, labels of 1–63 characters of `a-z`, `0-9`
        and inner `-`, at least two labels, not an IP address): a malformed or missing host answers `404` before any
        lookup and is never cached. That is why `domain` carries no schema constraint that would turn it into a `400`.
        Then Redis `tlsask:<host>` (positive answers only, 60 seconds), then a bounded in-process cache of `404`s
        (10 000 hosts, 60 seconds), then the database. Loopback only, without `X-Forwarded-For`; Caddy blocks
        `/internal/*` on the public hosts.
      tags:
        - Internal
      security: []
      x-scope: internal
      x-internal: true
      x-error-codes:
        - NOT_FOUND
        - INTERNAL_ERROR
      x-platform-tables:
        - tenants
        - tenant_domains
        - plans
      parameters:
        - name: domain
          in: query
          required: false
          description: >-
            The host name of the TLS handshake (SNI), as Caddy sends it. Caddy always sends it; a missing or malformed
            value answers `404`.
          schema:
            type: string
          example: acme.ota.example.com
      responses:
        '200':
          description: Caddy may obtain or renew a certificate for this host.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness of the API process
      description: >-
        `200 {status: "ok"}` while the process serves requests; it checks nothing else. Reachable on the public host
        for the uptime monitor (Caddy answers `404` for every other `/health/*` path there). Writes no request log
        line. The worker serves the same answer on `127.0.0.1:3101`.
      tags:
        - Internal
      security: []
      x-scope: public
      x-internal: true
      x-error-codes: []
      x-platform-tables: []
      responses:
        '200':
          description: The process is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              example:
                status: ok
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness of the API process and its dependencies
      description: >-
        Runs `SELECT 1` on PostgreSQL and `PING` on Redis in parallel, each within 2 seconds, and answers `200` when
        both are `ok`, otherwise `503` with `unavailable` and `down` for each failed dependency. The cause is logged,
        never answered. `deploy.sh` and the on-VM checks poll it on `127.0.0.1:3100`; it is loopback only, without
        `X-Forwarded-For` (`404` otherwise). Writes no request log line. The worker serves the same report on
        `127.0.0.1:3101`.
      tags:
        - Internal
      security: []
      x-scope: internal
      x-internal: true
      x-error-codes:
        - NOT_FOUND
      x-platform-tables: []
      responses:
        '200':
          description: Every dependency answers.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: ok
                checks:
                  postgres: ok
                  redis: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: At least one dependency is down.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: unavailable
                checks:
                  postgres: ok
                  redis: down
components:
  securitySchemes:
    portalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Portal access token: an EdDSA JWT for 15 minutes with `aud` `portal`, `sub` the account id, `sid` the refresh
        family, `ev` (e-mail verified), `amr` and, after a TOTP verification, `mfa_at`. Issued by signIn, verifyMfa,
        refreshSession and stepUp; sent only by the portal server.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Platform admin access token: an EdDSA JWT for 15 minutes with `aud` `platform_admin`, issued only after the
        password and a TOTP code, from a refresh family of 12 hours at most. Sent only by the platform admin server.
        The guard re-reads `is_platform_admin` and the account status on every request.
  headers:
    X-Request-Id:
      description: Request identifier; quote it to support.
      schema:
        type: string
    ETag:
      description: The resource version as a quoted string; send it back in `If-Match`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        examples:
          - '"3"'
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    NoStore:
      description: >-
        Always `no-store`: the body carries a secret (tokens, the TOTP secret, recovery codes or a key shown once).
        Never cached, and never stored for an idempotent replay.
      schema:
        type: string
        const: no-store
    NoStoreHealth:
      description: 'Always `no-store`: health answers are never cached.'
      schema:
        type: string
        const: no-store
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key (a UUID v4) that makes the request safe to retry for 24 hours. The same key with
        another body answers `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the version being changed; a stale version answers `412 PRECONDITION_FAILED`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
      example: '"3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.nextCursor` of the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The OTA; callers without an active membership get `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
      example: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
  responses:
    ValidationFailed:
      description: 'The request body, query or headers failed validation; see fieldErrors. Possible codes: VALIDATION_FAILED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            VALIDATION_FAILED:
              $ref: '#/components/examples/VALIDATION_FAILED'
    Unauthenticated:
      description: 'No valid portal access token was sent. Possible codes: UNAUTHENTICATED, TOKEN_EXPIRED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
    StepUpUnauthorized:
      description: >-
        No valid access token, or no TOTP step-up within the last 15 minutes (call stepUp, then retry). Possible codes:
        UNAUTHENTICATED, TOKEN_EXPIRED, REAUTH_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            UNAUTHENTICATED:
              $ref: '#/components/examples/UNAUTHENTICATED'
            TOKEN_EXPIRED:
              $ref: '#/components/examples/TOKEN_EXPIRED'
            REAUTH_REQUIRED:
              $ref: '#/components/examples/REAUTH_REQUIRED'
    EmailNotVerified:
      description: 'The account''s e-mail address is not verified yet. Possible codes: EMAIL_NOT_VERIFIED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
    StepUpForbidden:
      description: >-
        The e-mail address is not verified, or MFA is not enabled, so no step-up is possible. Possible codes:
        EMAIL_NOT_VERIFIED, MFA_REQUIRED.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            EMAIL_NOT_VERIFIED:
              $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
            MFA_REQUIRED:
              $ref: '#/components/examples/MFA_REQUIRED'
    NotFound:
      description: 'Not found, or not visible to the caller. Possible codes: NOT_FOUND.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            NOT_FOUND:
              $ref: '#/components/examples/NOT_FOUND'
    PasswordTooWeak:
      description: 'The password breaks the password rules. Possible codes: PASSWORD_TOO_WEAK.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            PASSWORD_TOO_WEAK:
              $ref: '#/components/examples/PASSWORD_TOO_WEAK'
    RateLimited:
      description: 'Too many requests; retry after `Retry-After` seconds. Possible codes: RATE_LIMITED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            RATE_LIMITED:
              $ref: '#/components/examples/RATE_LIMITED'
    InternalError:
      description: 'Unexpected error; quote the requestId to support. Possible codes: INTERNAL_ERROR.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            INTERNAL_ERROR:
              $ref: '#/components/examples/INTERNAL_ERROR'
  examples:
