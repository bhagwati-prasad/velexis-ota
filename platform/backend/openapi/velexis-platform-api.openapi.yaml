  /v1/admin/audit-log.csv:
    get:
      operationId: adminExportAudit
      summary: Export the platform audit log as CSV
      description: >-
        The rows of `adminListAudit` with the same filters, as a CSV file to download: UTF-8, comma-separated, quoted
        as RFC 4180 says, with one header row and these columns: `id`, `createdAt`, `tenantId`, `tenantKey`,
        `actorType`, `actorAccountId`, `actorLabel`, `action`, `targetType`, `targetId`, `requestId`, `ipAddress`,
        `userAgent`, `details` (the redacted JSON); an empty cell is a `null`. A cell that starts with `=`, `+`, `-`,
        `@`, a tab or a carriage return gets a leading `'` (the OWASP rule against CSV injection), so a spreadsheet
        never runs it as a formula. The period is required and at most one year (`from` inclusive, `to`
        exclusive; a longer or reversed period answers `400 VALIDATION_FAILED`), and the file holds at most 100 000
        rows, newest first: narrow the filters when the limit is reached. The answer is streamed.


        The export is a sensitive read: it writes an audit row with the filters (PADR-0006, Audit item 2). The file
        holds e-mail and IP addresses, so it is never cached.
      tags:
        - Admin audit
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - platform_audit_log
      parameters:
        - $ref: '#/components/parameters/AuditTenantId'
        - $ref: '#/components/parameters/AuditActorAccountId'
        - $ref: '#/components/parameters/AuditActorType'
        - $ref: '#/components/parameters/AuditAction'
        - $ref: '#/components/parameters/AuditTargetType'
        - $ref: '#/components/parameters/AuditTargetId'
        - name: from
          in: query
          required: true
          description: The start of the period (inclusive); at most one year before `to`.
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: to
          in: query
          required: true
          description: The end of the period (exclusive).
          schema:
            type: string
            format: date-time
          example: '2026-11-01T00:00:00Z'
      responses:
        '200':
          description: The CSV file.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreExport'
            Content-Disposition:
              description: 'Always an attachment named after the period, `velexis-audit-<from date>-<to date>.csv`.'
              required: true
              schema:
                type: string
                pattern: ^attachment; filename="velexis-audit-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{4}-[0-9]{2}-[0-9]{2}\.csv"$
                examples:
                  - attachment; filename="velexis-audit-2026-10-01-2026-11-01.csv"
          content:
            text/csv:
              schema:
                type: string
                description: The CSV text, header row first.
              example: |
