  /webhooks/stripe/billing:
    post:
      operationId: receiveStripeBillingEvent
      summary: Receive a Stripe Billing event
      description: >-
        The endpoint of the Velexis Stripe account for subscription billing (M5, PADR-0002, subscription-billing flow
        §C), signed with `STRIPE_BILLING_WEBHOOK_SECRET`. Stripe sends `checkout.session.completed`,
        `customer.subscription.created`, `customer.subscription.updated`, `customer.subscription.deleted`,
        `invoice.finalized`, `invoice.paid`, `invoice.payment_failed` and `invoice.voided`; any other type is stored and
        ends `ignored`.


        **Order.** First the signature: `Stripe-Signature` is checked on the raw body (kept on `/webhooks/*` only, up
        to 1 MB) with the endpoint's secret; a missing or wrong signature, or a payload changed after signing, answers
        `400 WEBHOOK_SIGNATURE_INVALID` and is logged as a security event, never with the body. Then the event:
        `livemode` must match the deployment (`APP_ENV=production` means live), else `400 VALIDATION_FAILED` with the
        field error `livemode_mismatch` on `/livemode`. Then one insert into the `stripe_events` inbox `{id, endpoint:
        billing, type, livemode, object_type, object_id, api_version, stripe_created_at}` with `ON CONFLICT DO
        NOTHING`, so a redelivered event is stored once, and `stripe.event {eventId}` is queued on
        `platform-stripe-events` with the event id as BullMQ job id, so it is queued once; an enqueue lost after the
        commit is queued by the `stripe_events.sweep` scheduler. The answer is `200 {received: true}` within 2 seconds,
        for a new event and a duplicate alike; Stripe is never called inline, and the worker re-fetches the object
        before it acts. A database failure answers `500`, so Stripe retries for up to 3 days. The events are received
        and stored even while `FEATURE_STRIPE_BILLING` is off (PADR-0015 item 4); their processing then ends
        `ignored`.


        The body is Stripe's event object, which Stripe extends without notice, so its schema is open
        (`additionalProperties: true`) and names only what the receiver reads; the payload itself is never stored.
      tags:
        - Webhooks
      security: []
      x-scope: webhook
      x-internal: true
      x-error-codes:
        - VALIDATION_FAILED
        - WEBHOOK_SIGNATURE_INVALID
        - INTERNAL_ERROR
      x-platform-tables:
        - stripe_events
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeEvent'
            example:
              id: evt_1QyMn3Oq0Su5WxZ7Ab9Cd1Ef
              object: event
              api_version: '2025-08-27.basil'
              created: 1803862996
              livemode: false
              pending_webhooks: 1
              request:
                id: null
                idempotency_key: null
              type: invoice.paid
              data:
                object:
                  id: in_1QyMn3Oq0Su5Wx
                  object: invoice
                  customer: cus_Qx7Lm2Np9Rt4Vw
                  status: paid
      responses:
        '200':
          description: The event is stored (or was stored before) and queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeEventReceived'
              example:
                received: true
        '400':
          $ref: '#/components/responses/StripeEventRefused'
        '500':
          $ref: '#/components/responses/InternalError'
  /webhooks/stripe/connect-accounts:
    post:
      operationId: receiveStripeConnectAccountEvent
      summary: Receive a Stripe Connect account event
      description: >-
        The Connect endpoint of the Velexis Stripe platform for the state of the OTAs' connected Standard accounts (M5,
        PADR-0011, stripe-payments flow §C item 5), signed with `STRIPE_CONNECT_WEBHOOK_SECRET`. It is subscribed only
        to `account.updated` and `account.application.deauthorized`; any other type is stored and ends `ignored`. The
        payment events of connected accounts go to the OTA backend's own Connect endpoint, not here (architecture flow
        (d)).


        The same handling as `receiveStripeBillingEvent`: the signature on the raw body (`400
        WEBHOOK_SIGNATURE_INVALID`), `livemode` against the deployment (`400 VALIDATION_FAILED`, `livemode_mismatch`),
        one insert into `stripe_events` with `endpoint: connect_accounts` and the connected account (`account`, which
        every Connect event carries, so a body without it answers `400 VALIDATION_FAILED`) with `ON CONFLICT DO
        NOTHING`, `stripe.event` queued once, and `200 {received: true}` within 2 seconds; a database failure answers
        `500`. The worker then updates the `payment_provider_connections` rows of that account
        (`account_reference`): their capabilities and status for `account.updated`, `disabled` for
        `account.application.deauthorized`. Events of an account no OTA uses end `ignored`. The events are received even
        while `FEATURE_OWN_STRIPE` is off (PADR-0015 item 4).
      tags:
        - Webhooks
      security: []
      x-scope: webhook
      x-internal: true
      x-error-codes:
        - VALIDATION_FAILED
        - WEBHOOK_SIGNATURE_INVALID
        - INTERNAL_ERROR
      x-platform-tables:
        - stripe_events
        - payment_provider_connections
      parameters:
        - $ref: '#/components/parameters/StripeSignature'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StripeConnectAccountEvent'
            example:
              id: evt_1QzPq6Rs3Uw8YzB9Cd1Ef3Gh
              object: event
              account: acct_1QxAcmeTravel01
              api_version: '2025-08-27.basil'
              created: 1804383960
              livemode: false
              pending_webhooks: 1
              request:
                id: null
                idempotency_key: null
              type: account.application.deauthorized
              data:
                object:
                  id: ca_QxVelexisPlatform01
                  object: application
                  name: Velexis
      responses:
        '200':
          description: The event is stored (or was stored before) and queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StripeEventReceived'
              example:
                received: true
        '400':
          $ref: '#/components/responses/StripeEventRefused'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/tls/ask:
    get:
      operationId: tlsAsk
      summary: Decide whether Caddy may obtain a certificate for a host
      description: >-
        Caddy's on-demand TLS `ask` endpoint (ADR-0018, PADR-0004 item 6). Answers `200` with no body when the host is
        `<key>.<STOREFRONT_BASE_DOMAIN>` of an OTA in `provisioning`, `active` or `suspended`, or a verified custom
        storefront domain of an `active` OTA whose plan has `customDomains > 0` while the `custom_domains` switch is
        on; `404` for every other host.


        **Order.** First the host syntax (lower-cased, at most 253 characters, labels of 1–63 characters of `a-z`, `0-9`
        and inner `-`, at least two labels, not an IP address): a malformed or missing host answers `404` before any
        lookup and is never cached. That is why `domain` carries no schema constraint that would turn it into a `400`.
        Then Redis `tlsask:<host>` (positive answers only, 60 seconds), then a bounded in-process cache of `404`s
        (10 000 hosts, 60 seconds), then the database. Loopback only, without `X-Forwarded-For`; Caddy blocks
        `/internal/*` on the public hosts.
      tags:
        - Internal
      security: []
      x-scope: internal
      x-internal: true
      x-error-codes:
        - NOT_FOUND
        - INTERNAL_ERROR
      x-platform-tables:
        - tenants
        - tenant_domains
        - plans
      parameters:
        - name: domain
          in: query
          required: false
          description: >-
            The host name of the TLS handshake (SNI), as Caddy sends it. Caddy always sends it; a missing or malformed
            value answers `404`.
          schema:
            description: >-
              No type on purpose: a value that is not one host name, such as a repeated `domain` (which arrives as a
              list), is refused with `404` by the handler, never with `400` by the request validation.
          example: acme.ota.example.com
      responses:
        '200':
          description: Caddy may obtain or renew a certificate for this host.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /health/live:
    get:
      operationId: healthLive
      summary: Liveness of the API process
      description: >-
        `200 {status: "ok"}` while the process serves requests; it checks nothing else. Reachable on the public host
        for the uptime monitor (Caddy answers `404` for every other `/health/*` path there). Writes no request log
        line. The worker serves the same answer on `127.0.0.1:3101`.
      tags:
        - Internal
      security: []
      x-scope: public
      x-internal: true
      x-error-codes: []
      x-platform-tables: []
      responses:
        '200':
          description: The process is up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthLive'
              example:
                status: ok
  /health/ready:
    get:
      operationId: healthReady
      summary: Readiness of the API process and its dependencies
      description: >-
        Runs `SELECT 1` on PostgreSQL and `PING` on Redis in parallel, each within 2 seconds, and answers `200` when
        both are `ok`, otherwise `503` with `unavailable` and `down` for each failed dependency. The cause is logged,
        never answered. `deploy.sh` and the on-VM checks poll it on `127.0.0.1:3100`; it is loopback only, without
        `X-Forwarded-For` (`404` otherwise). Writes no request log line. The worker serves the same report on
        `127.0.0.1:3101`.
      tags:
        - Internal
      security: []
      x-scope: internal
      x-internal: true
      x-error-codes:
        - NOT_FOUND
      x-platform-tables: []
      responses:
        '200':
          description: Every dependency answers.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: ok
                checks:
                  postgres: ok
                  redis: ok
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: At least one dependency is down.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStoreHealth'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReady'
              example:
                status: unavailable
                checks:
                  postgres: ok
                  redis: down
components:
  securitySchemes:
    portalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Portal access token: an EdDSA JWT for 15 minutes with `aud` `portal`, `sub` the account id, `sid` the refresh
        family, `ev` (e-mail verified), `amr` and, after a TOTP verification, `mfa_at`. Issued by signIn, verifyMfa,
        refreshSession and stepUp; sent only by the portal server.
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Platform admin access token: an EdDSA JWT for 15 minutes with `aud` `platform_admin`, issued only after the
        password and a TOTP code, from a refresh family of 12 hours at most. Sent only by the platform admin server.
        The guard re-reads `is_platform_admin` and the account status on every request; the token of an account that
        is no longer an active platform admin answers `401 UNAUTHENTICATED`, as a portal token does. Issued by
        adminVerifyMfa, adminRefresh and adminStepUp.
  headers:
    X-Request-Id:
      description: Request identifier; quote it to support.
      schema:
        type: string
    ETag:
      description: The resource version as a quoted string; send it back in `If-Match`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
        examples:
          - '"3"'
    Retry-After:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 1
    NoStore:
      description: >-
        Always `no-store`: the body carries a secret (tokens, the TOTP secret, recovery codes, a key shown once or
        revealed bank details). Never cached, and never stored for an idempotent replay.
      schema:
        type: string
        const: no-store
    NoStoreHealth:
      description: 'Always `no-store`: health answers are never cached.'
      schema:
        type: string
        const: no-store
    NoStoreExport:
      description: >-
        Always `no-store`: the export holds personal data (e-mail and IP addresses) and is never cached by the admin
        server, a proxy or the browser.
      schema:
        type: string
        const: no-store
    NoStoreStatement:
      description: >-
        Always `no-store`: the file holds the OTA's payment records and is never cached by the portal server, a proxy
        or the browser.
      schema:
        type: string
        const: no-store
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Client-generated unique key (a UUID v4) that makes the request safe to retry for 24 hours. The same key with
        another body answers `409 IDEMPOTENCY_KEY_REUSED`.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The `ETag` of the version being changed; a stale version answers `412 PRECONDITION_FAILED`.
      schema:
        type: string
        pattern: ^"[0-9]+"$
      example: '"3"'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `page.nextCursor` of the previous page.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    TenantId:
      name: tenantId
      in: path
      required: true
      description: The OTA; callers without an active membership get `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^ten_[0-9A-HJKMNP-TV-Z]{26}$
      example: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
    MemberId:
      name: memberId
      in: path
      required: true
      description: The membership (`id` of `listMembers`, the staff id `stf_…`).
      schema:
        type: string
        pattern: ^stf_[0-9A-HJKMNP-TV-Z]{26}$
      example: stf_01JB3K7P2R6T0W4Y8A2C6E0G4J
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: The invitation (`id` of `listInvitations`).
      schema:
        type: string
        pattern: ^ivt_[0-9A-HJKMNP-TV-Z]{26}$
      example: ivt_01JA2ZF4H8K2M6P0R4T8W2Y6A0
    ApiKeyId:
      name: keyId
      in: path
      required: true
      description: The API key (`id` of `listApiKeys`, never the key or its prefix).
      schema:
        type: string
        pattern: ^key_[0-9A-HJKMNP-TV-Z]{26}$
      example: key_01JB3KA2C6E0G4J8M2P6S0V4X8
    ConnectionEnvironment:
      name: environment
      in: path
      required: true
      description: >-
        The environment of the connection (`environment` of `listAmadeusConnections` or `listPaymentConnections`): `test`,
        or `live` once the OTA has a live connection. An environment without a connection answers `404 NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/Environment'
      example: test
    CredentialsEnvironment:
      name: environment
      in: path
      required: true
      description: >-
        The environment whose connection the submitted credentials are for: `test` or `live`. The connection need not
        exist yet: a successful verification creates it.
      schema:
        $ref: '#/components/schemas/Environment'
      example: test
    DomainId:
      name: domainId
      in: path
      required: true
      description: The domain (`id` of `listDomains`); a domain of another OTA answers `404 NOT_FOUND`.
      schema:
        type: string
        pattern: ^dom_[0-9A-HJKMNP-TV-Z]{26}$
      example: dom_01JB3K5N9Q3S7W1Y5A9C3E7G1J
    CredentialSubmissionId:
      name: submissionId
      in: path
      required: true
      description: >-
        The credential submission (`submission.id` of `submitAmadeusCredentials` or `submitStripeApiKeys`, or
        `pendingSubmission.id` of a connection); a submission of another OTA answers `404 NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/CredentialSubmissionId'
      example: crs_01JD4Q2S6V0X4Z8B2D6F0H4K8N
    SettlementId:
      name: settlementId
      in: path
      required: true
      description: >-
        The statement (`id` of `listSettlements`); a draft, a voided draft or a statement of another OTA answers `404
        NOT_FOUND`.
      schema:
        $ref: '#/components/schemas/SettlementId'
      example: stl_01JC7T1V5X9Z3B7D1F5H9K3N7Q
    AdminTenantId:
      name: tenantId
      in: path
      required: true
      description: The OTA (`id` of `adminListTenants`); an unknown id answers `404 NOT_FOUND`.
