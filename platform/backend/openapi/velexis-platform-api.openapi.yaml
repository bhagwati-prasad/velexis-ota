                $ref: '#/components/schemas/AdminProvisioningJobDetail'
              example:
                id: job_01JB3K9R4T8W2Y6A0C4E8G2J6M
                tenantId: ten_01JB3K4M8P2R6T0W4Y8A2C6E0G
                tenantKey: nordic
                kind: provision
                status: failed
                step: run_migrations
                attempt: 5
