      summary: Get the signed-in account
      description: >-
        The account, its active memberships with the OTA's key, name, status and the member's role, and the milestone
        switches of PADR-0015 in `features`. The portal and the admin hide what a switch turns off; the backend stays
        the only source of the switches. Works before the e-mail address is verified.
