  /v1/me/mfa/setup:
    post:
      operationId: startMfaSetup
      summary: Start the TOTP set-up
      description: >-
        Creates a pending TOTP secret (SHA-1, 6 digits, 30 seconds) that lives envelope-encrypted in Redis for 10
        minutes and replaces any earlier pending one. The portal shows the secret and the `otpauth://` URI as a QR
        code; `enableMfa` confirms it with a code. Answers `409 MFA_ALREADY_ENABLED` while MFA is on.
      tags:
