    get:
      operationId: listTenants
      summary: List my OTAs
      description: >-
        The OTAs in which the account has an active membership, in any status (`provisioning`, `active`, `suspended`,
        `failed`), oldest first, with the caller's role, the plan and the storefront URL of the primary host. The list
        is short (one entry per membership), so it is not paginated. Works before the e-mail address is verified, so
        the portal can show an empty dashboard.
      tags:
        - Tenants
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - tenants
        - tenant_domains
      responses:
        '200':
          description: The caller's OTAs.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantList'
              example:
                data:
                  - id: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
                    key: acme
                    name: Acme Travel
                    status: active
                    role: owner
                    planCode: early_access
                    storefrontUrl: https://acme.ota.example.com/
                    storefrontEnvironment: test
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTenant
      summary: Create an OTA
      description: >-
        Creates an OTA and starts its setup (platform/docs/flows/signup-and-create-ota.md). The account must be verified
        and active and may own at most `MAX_TENANTS_PER_ACCOUNT` OTAs that are not `failed` (`422 UNPROCESSABLE`,
        `details.reason = tenant_limit`). The key must follow the key rules (else `400`) and be neither reserved nor
        used by any tenant row (`409 TENANT_KEY_UNAVAILABLE`, also when a concurrent request took it first).


        **One transaction** inserts the tenant (`provisioning`, storefront environment `test`), the caller's `owner`
        membership, the subscription, the verified primary sub-domain `<key>.<STOREFRONT_BASE_DOMAIN>`, a queued
        `provision` job and an audit row. **Before M5** (`FEATURE_STRIPE_BILLING` off) the plan is always
        `early_access`, whatever the request says: the subscription is a manual trial (`trialing`, `trial_ends_at =
        now + plans.trial_days`), the job is dispatched to the OTA worker at once and `checkoutUrl` is `null`. **From
        M5** `planCode` must name a public, active plan with a Stripe price for `billingInterval` (`422
        PLAN_NOT_AVAILABLE`); the subscription starts `incomplete`, the job waits for Checkout, and the answer carries
        the Stripe Checkout URL. When Stripe fails, the OTA and its job stay created, `checkoutUrl` is `null` and
        `checkoutError` says why; the setup page offers to continue to payment later.


        **Idempotent** (`Idempotency-Key`, 24 hours): a retry with the same key and body replays the `202`, another
        body answers `409 IDEMPOTENCY_KEY_REUSED`, and while the idempotency store (Redis) is down the call answers `503
        SERVICE_UNAVAILABLE` before writing anything. A request with the same key that arrives while the first one
        still runs waits up to 10 seconds and replays its answer, or answers `503 SERVICE_UNAVAILABLE` (try again
        shortly). The setup progresses in `getProvisioning`.
      tags:
        - Tenants
      security:
        - portalBearer: []
      x-scope: portal
      x-idempotent: true
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - TENANT_KEY_UNAVAILABLE
        - IDEMPOTENCY_KEY_REUSED
        - PLAN_NOT_AVAILABLE
        - UNPROCESSABLE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-platform-tables:
        - accounts
        - plans
        - tenants
        - tenant_memberships
        - subscriptions
        - tenant_domains
        - provisioning_jobs
        - billing_customers
        - billing_customer_attempts
        - platform_audit_log
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
            example:
              key: acme
              name: Acme Travel
              countryCode: 'NO'
              defaultCurrency: EUR
              timeZone: Europe/Oslo
      responses:
        '202':
          description: >-
            Accepted. The OTA exists in `provisioning`; its setup job runs (before M5) or waits for Checkout (M5).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantCreated'
              examples:
                manualTrial:
                  summary: Before M5, a manual trial on early_access; setup starts at once
                  value:
                    tenant:
                      id: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
                      key: acme
                      name: Acme Travel
                      legalName: null
                      status: provisioning
                      suspensionReason: null
                      billingNotice: null
                      planCode: early_access
                      defaultCurrency: EUR
                      countryCode: 'NO'
                      timeZone: Europe/Oslo
                      supportEmail: null
                      storefrontEnvironment: test
                      liveEnabledAt: null
                      primaryHost: acme.ota.example.com
                      schemaVersion: null
                      createdAt: '2026-10-14T08:20:11Z'
                      activatedAt: null
                      version: 1
                      myRole: owner
                    provisioningJob:
                      id: job_01JA2ZC3D7F1H5K9M3P7R1T5V9
                      status: running
                    checkoutUrl: null
                checkout:
                  summary: From M5, a paid plan; the setup waits for the Stripe Checkout
                  value:
                    tenant:
                      id: ten_01JB3K4M8P2R6T0W4Y8A2C6E0G
                      key: nordic
                      name: Nordic Fares
                      legalName: null
                      status: provisioning
                      suspensionReason: null
                      billingNotice: null
                      planCode: starter
                      defaultCurrency: EUR
                      countryCode: SE
                      timeZone: Europe/Stockholm
                      supportEmail: null
                      storefrontEnvironment: test
                      liveEnabledAt: null
                      primaryHost: nordic.ota.example.com
                      schemaVersion: null
                      createdAt: '2027-03-02T10:15:00Z'
                      activatedAt: null
                      version: 1
                      myRole: owner
                    provisioningJob:
                      id: job_01JB3K4N9Q3S7V1X5Z9B3D7F1H
                      status: queued
                    checkoutUrl: https://checkout.stripe.com/c/pay/cs_test_a1B2c3D4e5F6g7H8i9J0k1L2m3N4
                checkoutFailed:
                  summary: From M5, Stripe failed; the OTA exists and the payment can start later
                  value:
                    tenant:
                      id: ten_01JB3K4M8P2R6T0W4Y8A2C6E0G
                      key: nordic
                      name: Nordic Fares
                      legalName: null
                      status: provisioning
                      suspensionReason: null
                      billingNotice: null
                      planCode: starter
                      defaultCurrency: EUR
                      countryCode: SE
                      timeZone: Europe/Stockholm
                      supportEmail: null
                      storefrontEnvironment: test
                      liveEnabledAt: null
                      primaryHost: nordic.ota.example.com
                      schemaVersion: null
                      createdAt: '2027-03-02T10:15:00Z'
                      activatedAt: null
                      version: 1
                      myRole: owner
                    provisioningJob:
                      id: job_01JB3K4N9Q3S7V1X5Z9B3D7F1H
                      status: queued
                    checkoutUrl: null
                    checkoutError:
                      code: PROVIDER_ERROR
                      message: The payment page could not be opened; continue to payment from the setup page.
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/EmailNotVerified'
        '409':
          description: >-
