  /v1/admin/tenants/{tenantId}/suspend:
    parameters:
      - $ref: '#/components/parameters/AdminTenantId'
    post:
      operationId: adminSuspendTenant
      summary: Suspend an OTA
      description: >-
        Suspends an `active` OTA (PADR-0014) for `abuse`, `request` or `admin`, with a written `reason` of 5–500
        characters that the audit row keeps; `billing` suspensions are set only by billing sync. One transaction sets
        the status `suspended`, `suspended_at`, `suspension_reason` and a new version, inserts a `suspend` job and
        writes the audit row. After commit it publishes a `tenant` invalidation, so the storefront and the OTA API
        answer `TENANT_SUSPENDED` within 60 seconds, dispatches `tenant.suspend` to the OTA worker and e-mails the
        owners. Any other status answers `409 CONFLICT` (`details.reason = not_active`). Data is never deleted.
      tags:
        - Admin tenants
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-reason-required: true
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenants
        - tenant_domains
        - tenant_memberships
        - accounts
        - provisioning_jobs
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTenantRequest'
            example:
              suspensionReason: abuse
              reason: Card testing from the storefront reported by Stripe on 2026-10-20.
      responses:
        '202':
          description: >-
            Accepted. The OTA is suspended at once; the `suspend` job carries the OTA worker's housekeeping.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleAccepted'
              examples:
                suspended:
                  $ref: '#/components/examples/TenantSuspended'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Only an active OTA can be suspended (`details.reason = not_active`). Possible codes: CONFLICT.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  summary: The OTA is not active
                  value:
                    error:
                      code: CONFLICT
                      message: The request conflicts with the current state of the resource.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: not_active
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/tenants/{tenantId}/resume:
    parameters:
      - $ref: '#/components/parameters/AdminTenantId'
    post:
      operationId: adminResumeTenant
      summary: Resume a suspended OTA
      description: >-
        Resumes a `suspended` OTA (PADR-0014 item 4), with a written `reason` of 5–500 characters that the audit row
        keeps. A `billing` suspension resumes here only while the current subscription is `trialing` or `active`
        (billing sync also resumes it on its own when the payment arrives). One transaction sets the status `active`,
        clears the suspension fields, inserts a `resume` job and writes the audit row; after commit a `tenant`
        invalidation, the `tenant.resume` dispatch and an e-mail to the owners. `409 CONFLICT` when the OTA is not
        suspended (`details.reason = not_suspended`), or is suspended for billing without a `trialing` or `active`
        subscription (`details.reason = subscription_not_active`).
      tags:
        - Admin tenants
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-reason-required: true
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenants
        - tenant_domains
        - tenant_memberships
        - accounts
        - subscriptions
        - provisioning_jobs
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminReasonRequest'
            example:
              reason: The OTA removed the test scripts; Stripe confirmed no further reports.
      responses:
        '202':
          description: >-
            Accepted. The OTA is active again at once; the `resume` job re-enables the OTA worker's schedulers.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleAccepted'
              examples:
                resumed:
                  $ref: '#/components/examples/TenantResumed'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The OTA is not suspended, or a billing suspension has no `trialing` or `active` subscription to resume
            with (`details.reason`). Possible codes: CONFLICT.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  summary: A billing suspension without a valid subscription
                  value:
                    error:
                      code: CONFLICT
                      message: The request conflicts with the current state of the resource.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: subscription_not_active
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
