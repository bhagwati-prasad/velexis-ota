        connection of its OTA (for example after the connection was disabled for abuse, PADR-0012 item 8); one that
        does answers `409 CONFLICT` (`details.reason = connection_active`). An `available` or `retired` office answers
        `409 CONFLICT` (`details.reason = not_assigned`). Writes an audit row and, after commit, publishes the
        `amadeus_account` invalidation.
