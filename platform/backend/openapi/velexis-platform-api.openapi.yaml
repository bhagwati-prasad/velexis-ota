        (PADR-0006, Audit item 2), the trimmed reason as `AdminReason` says. The answer is `no-store`, never cached nor
        kept for a replay; the identifiers are never logged. An unknown OTA, or an OTA without a payout account,
        answers `404 NOT_FOUND`.
