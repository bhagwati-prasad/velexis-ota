        One job with its step log (the steps of the OTA worker and the platform post-steps), its input `payload` (ids
        and options only), its `result` (never a ciphertext: the reveal-once test keys of a `provision` job are never
        answered), its lease (`lockedUntil`) and the BullMQ state of its current attempt, the job
        `<jobId>-<attempt>` on `ota-tenant-ops`. `bullmqState` is `null` before the first dispatch and `unknown` when
        BullMQ no longer holds that job.
      tags:
        - Admin provisioning jobs
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - provisioning_jobs
        - tenants
      responses:
        '200':
          description: The job.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
