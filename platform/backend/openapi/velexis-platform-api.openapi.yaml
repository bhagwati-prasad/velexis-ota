  /v1/tenants/{tenantId}/console-token:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: createConsoleToken
      summary: Issue a one-time token that signs the member in to the OTA admin
      description: >-
        Any active member of the OTA (every role) gets a one-time portal token for the OTA admin's single sign-on
        (PADR-0007). The portal's "Open console" route handler calls it and posts the token to `consoleSsoUrl` in a
        form body, never in a URL; the OTA backend redeems it once with `GETDEL` and starts a staff session bound to
        this OTA.


        **Preconditions.** A verified, active account (the `portal` scope) with an active membership of the OTA; the
        OTA must be `active`, otherwise `409 TENANT_NOT_ACTIVE` with `details.status` (`provisioning`, `suspended` or
        `failed`) and, for a suspended OTA, `details.suspensionReason`, so the portal can explain why and link to the
        billing page. When the OTA is live (`storefrontEnvironment` `live`), an account without MFA gets `403
        MFA_REQUIRED` and is sent to the MFA set-up (PADR-0008). This is the MFA policy of live OTAs, not a step-up: a
        recent TOTP code is not needed. Rate limited to 30 per account per minute (`429 RATE_LIMITED`).


        **The token** is `ptk_` and 43 base62 characters from the CSPRNG (256 bits). Only its SHA-256 is used, as the
        Redis key `ptk:<sha256 hex>`, set with `EX 60 NX` to the JSON `{v: 1, accountId, tenantId, membershipId, role,
        mfa, issuedAt, requestId}`; no platform table holds it. The answer carries it once with `Cache-Control:
        no-store`: it is never logged, never written to the audit row or the database, and never stored for a replay.
        Writes the audit row `console.token_issued` (target the membership, without the token). `503
        SERVICE_UNAVAILABLE` while Redis is unreachable, because the token lives only there: no token is issued and no
        audit row is written (platform/docs/flows/team-and-ota-admin-sso.md, failure handling).
      tags:
        - Team
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - MFA_REQUIRED
        - NOT_FOUND
        - TENANT_NOT_ACTIVE
        - RATE_LIMITED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
      x-platform-tables:
        - accounts
        - tenant_memberships
        - tenants
        - platform_audit_log
      responses:
        '201':
          description: >-
            The one-time token, valid for 60 seconds, and the OTA admin's sign-on URL to post it to as the form field
            `portalToken`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsoleToken'
              example:
                portalToken: ptk_HStG6kFQHy3n6XUc7GtdqJXOQ2LzGqpOXtxJQGAqYTx
                expiresAt: '2026-11-02T09:15:42Z'
                consoleSsoUrl: https://admin.ota.example.com/sso
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: >-
            The e-mail address is not verified, or the OTA is live and the account has no MFA (set it up first).
            Possible codes: EMAIL_NOT_VERIFIED, MFA_REQUIRED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                EMAIL_NOT_VERIFIED:
                  $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
                MFA_REQUIRED:
                  summary: The OTA is live and the account has no MFA
                  value:
                    error:
                      code: MFA_REQUIRED
                      message: Turn on two-factor authentication first.
                      status: 403
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The OTA is not active (`details.status`; `details.suspensionReason` when it is suspended), so its console
            cannot be opened. Possible codes: TENANT_NOT_ACTIVE.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                TENANT_NOT_ACTIVE:
                  summary: The OTA is suspended for billing
                  value:
                    error:
                      code: TENANT_NOT_ACTIVE
                      message: The OTA is not active; it is being set up, suspended or failed.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        status: suspended
                        suspensionReason: billing
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
