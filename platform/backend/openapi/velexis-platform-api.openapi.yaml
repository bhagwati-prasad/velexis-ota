    post:
      operationId: adminRetryQueueJob
      summary: Retry a failed job of a platform queue
      description: >-
        Moves one failed job of a **platform** queue back to waiting, so the platform worker runs it again with a new
        attempt budget. OTA queues (`ota-*`, `ota-tenant-ops` included) are view-only here (`403 FORBIDDEN`,
        `details.reason = ota_queue`): the OTA admin or the developer retries them. An unknown queue, or no failed job
        with this id in it, answers `404 NOT_FOUND`; `503 SERVICE_UNAVAILABLE` while Redis is unreachable. Writes an
