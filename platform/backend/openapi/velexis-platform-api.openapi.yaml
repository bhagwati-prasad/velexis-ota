                EMAIL_NOT_VERIFIED:
                  $ref: '#/components/examples/EMAIL_NOT_VERIFIED'
                FORBIDDEN:
                  $ref: '#/components/examples/FORBIDDEN'
                FEATURE_DISABLED:
                  $ref: '#/components/examples/FeatureDisabledStripeBilling'
        '404':
