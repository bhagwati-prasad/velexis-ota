        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpCodeRequest'
            example:
              code: '492039'
      responses:
        '200':
          description: MFA is enabled; the ten recovery codes are shown once.
          headers:
