        - FORBIDDEN
        - MFA_REQUIRED
        - NOT_FOUND
        - TENANT_NOT_ACTIVE
        - PLAN_LIMIT_REACHED
        - LIVE_MODE_NOT_ENABLED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - tenants
        - plans
        - api_keys
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              secret:
                summary: A secret key for a storefront deployment
                value:
                  name: Storefront production
                  kind: secret
                  environment: test
                  scopes:
                    - storefront
              publishable:
                summary: A publishable key for a browser frontend
                value:
                  name: Website
                  kind: publishable
                  environment: test
                  allowedOrigins:
                    - https://www.acme-travel.example.com
      responses:
        '201':
          description: The key's settings and the full key, shown once.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
              example:
                apiKey:
                  id: key_01JB3KA2C6E0G4J8M2P6S0V4X8
                  name: Storefront production
                  kind: secret
                  environment: test
                  prefix: sk_test_Qw34Er
                  last4: Df90
                  allowedOrigins: []
                  scopes:
                    - storefront
                  createdAt: '2026-10-15T09:30:00Z'
                  createdBy:
                    accountId: acc_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                    fullName: Anna Berg
                  lastUsedAt: null
                  expiresAt: null
                  revokedAt: null
                key: sk_test_Qw34Er56Ty78Ui90Op12As34Df56Gh78Jk12Df90
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/StepUpUnauthorized'
        '403':
          $ref: '#/components/responses/TenantRoleOrStepUpForbidden'
        '404':
