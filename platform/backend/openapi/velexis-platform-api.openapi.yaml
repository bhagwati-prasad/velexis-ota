      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - VALIDATION_FAILED
        - MFA_SETUP_EXPIRED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - MFA_CODE_INVALID
