  /v1/admin/auth/sign-in:
    post:
      operationId: adminSignIn
      summary: Sign in to the platform admin with e-mail and password
      description: >-
        The password step of the admin sign-in (PADR-0006 item 2). Checks the lock-out, then the password, then that
        the account is an active, verified platform admin. A wrong e-mail address, a wrong password and an account
        that is not an active platform admin all give the same `401 INVALID_CREDENTIALS` in the same time. A platform
        admin without MFA gets `403 MFA_REQUIRED`, only after a correct password, and turns MFA on in the portal first.
        Five consecutive failures lock the account for 15 minutes (`423 ACCOUNT_LOCKED` with `Retry-After`), as on
        the portal. 10 sign-ins per end-user IP per minute.


        The answer is always an MFA challenge: a TOTP or recovery code is required on **every** admin sign-in, and
        `adminVerifyMfa` completes it within 5 minutes. A challenge of the portal's `signIn` is never accepted by
        `adminVerifyMfa`, nor this one by the portal's `verifyMfa`.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - MFA_REQUIRED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: lena.holm@velexis.example.com
              password: Harbour-Lantern-2026
      responses:
        '200':
          description: The password is right; complete the sign-in with adminVerifyMfa.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMfaChallenge'
              example:
                mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                expiresIn: 300
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            Wrong e-mail address or password, or the account is not an active platform admin (the same answer for
            all). Possible codes: INVALID_CREDENTIALS.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  $ref: '#/components/examples/INVALID_CREDENTIALS'
        '403':
          description: >-
            The password is right, but the platform admin has no MFA; turn it on in the portal first. Possible codes:
            MFA_REQUIRED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_REQUIRED:
                  $ref: '#/components/examples/MFA_REQUIRED'
        '423':
          description: 'Too many failed sign-ins; wait for `Retry-After` seconds. Possible codes: ACCOUNT_LOCKED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_LOCKED:
                  $ref: '#/components/examples/ACCOUNT_LOCKED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/mfa/verify:
    post:
      operationId: adminVerifyMfa
      summary: Complete an admin sign-in with a TOTP or recovery code
      description: >-
        Completes the challenge of `adminSignIn` with a TOTP code (6 digits, ±1 time step, each code accepted once) or
        with one unused recovery code, which is then used up. A challenge allows 5 attempts and lives 5 minutes; after
        that, for an unknown token, or for a challenge of the portal's `signIn`, the answer is `401
        MFA_CHALLENGE_INVALID` and the admin signs in again. 10 attempts per account per 10 minutes.


        Success creates a refresh family with `audience = 'platform_admin'`, a 12-hour absolute lifetime and
        `mfa_verified_at` set, so the access token carries `mfa_at`; each refresh token expires after 2 idle hours.
        Writes an audit row. The admin server moves the tokens into its own httpOnly cookies at once.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_sessions
        - account_recovery_codes
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
            examples:
              totp:
                summary: With a code of the authenticator app
                value:
                  mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                  code: '583104'
              recoveryCode:
                summary: With a recovery code
                value:
                  mfaChallengeToken: Ma3kT8wQ1zR6xL4nB9hY2dF7sG5jA0eU3iO8mK1cP4v
                  recoveryCode: W4KD-9PMX-2TQR-H7ZB
      responses:
        '200':
          description: Signed in to the platform admin.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
              examples:
                session:
                  $ref: '#/components/examples/AdminSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The challenge is unknown, expired, used up or not an admin challenge, or the code is wrong. Possible codes:
            MFA_CHALLENGE_INVALID, MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_CHALLENGE_INVALID:
                  $ref: '#/components/examples/MFA_CHALLENGE_INVALID'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/admin/auth/refresh:
    post:
      operationId: adminRefresh
      summary: Rotate the admin refresh token
      description: >-
        Exchanges an admin refresh token for a new access token and a new refresh token of the same family; the
        presented token is used up. Presenting a token that was already rotated revokes the whole family (`401
        REFRESH_TOKEN_REUSED`). An unknown, revoked or idle-expired token, a family past its 12-hour absolute lifetime,
        and any portal refresh token answer `401 REFRESH_TOKEN_INVALID`: only `platform_admin` families refresh here,
        and admin families never refresh through the portal's `refreshSession`. The new access token copies `mfa_at`
        from the family.
      tags:
        - Admin auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
