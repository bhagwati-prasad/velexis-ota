  /v1/tenants/{tenantId}/payment-connections/{environment}/use-velexis:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/ConnectionEnvironment'
    post:
      operationId: useVelexisPayments
      summary: Return a payment connection to the Velexis Stripe account
      description: >-
        Owners return the payment connection of an environment to the Velexis Stripe account (`velexis` mode, settled
        monthly; M5, PADR-0011 item 6), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or `403
        MFA_REQUIRED` without MFA). It is not behind a switch, so an OTA can always come back. For a
        `connect_standard` connection the API first calls `stripe.oauth.deauthorize`; a failure there is logged and
        does not block, so the operation never waits for Stripe. Then, in one transaction, it clears the account
        reference, the publishable key and the secrets, sets `velexis` mode and `active`, and writes an audit row with
        the old and the new mode; a `connection` invalidation follows the commit. The `live` connection needs a
        `verified` payout account first, because Velexis then collects the money and settles it (`422
        PAYOUT_ACCOUNT_REQUIRED`). A connection in `velexis` mode already answers `200` unchanged.


        Switching never moves existing payments: the OTA backend keeps capturing and refunding each payment on the
        account recorded with it, and only new payments use Velexis. `{environment}` without a connection answers
        `404 NOT_FOUND`; the OTA must be `active` (`409 TENANT_NOT_ACTIVE`, PADR-0014 item 5).
      tags:
        - Connections
      security:
        - portalBearer: []
      x-scope: portal
      x-mfa-step-up: true
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - MFA_REQUIRED
        - NOT_FOUND
