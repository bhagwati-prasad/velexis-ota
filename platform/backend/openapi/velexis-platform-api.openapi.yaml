  /v1/admin/plans/{planCode}/check-prices:
    parameters:
      - $ref: '#/components/parameters/AdminPlanCode'
    post:
      operationId: adminCheckPlanPrices
      summary: Compare a plan with its Stripe prices
      description: >-
        Runs the price comparison of `adminUpdatePlan` again (M5, subscription-billing flow §A), for example after a
        price was changed or archived in the Stripe dashboard: retrieves every Stripe price linked to the plan and
        answers one warning per difference, `{field, expected, actual}`, where `field` names the linked price and the
        attribute (`amount`, `currency`, `interval` or `active`), `expected` the value the plan implies and `actual` the
        value Stripe answered. A plan without a linked price answers no warning and calls nothing. The warnings become
        the plan's `priceWarnings`, and an audit row records the check with them, as `adminVerifyAmadeusAccount` does
        for its request. If Stripe fails or cannot be reached, the answer is `502 PROVIDER_ERROR` and the stored
        warnings stay as they were.
      tags:
        - Admin billing
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
        - PROVIDER_ERROR
      x-platform-tables:
        - plans
        - platform_audit_log
      responses:
        '200':
          description: The differences between the plan and its Stripe prices; empty when they agree.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanPriceCheck'
              examples:
                mismatch:
                  summary: The monthly price is in another currency and the yearly one is archived
                  value:
                    warnings:
                      - field: stripePriceIdMonth.currency
                        expected: EUR
                        actual: USD
                      - field: stripePriceIdYear.active
                        expected: 'true'
                        actual: 'false'
                agree:
                  summary: The prices agree with the plan
                  value:
                    warnings: []
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/ProviderError'
