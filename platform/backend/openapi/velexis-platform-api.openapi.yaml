  /v1/tenants/{tenantId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateMember
      summary: Change a member's role
      description: >-
        Owners and admins change roles with the role matrix of platform/docs/scope.md §1.2: admins may set `agent`,
        `finance` or `viewer` on members who are neither owners nor admins; only owners grant or remove `owner` and
        `admin` (`403 FORBIDDEN` otherwise). **Granting `owner` needs a TOTP step-up** within 15 minutes (`401
        REAUTH_REQUIRED`, or `403 MFA_REQUIRED` without MFA); the other changes do not, so the operation carries no
        `x-mfa-step-up`. The last active owner cannot be demoted (`409 LAST_OWNER`). `If-Match` carries the member's
        `version`; a stale one answers `412 PRECONDITION_FAILED`. Writes an audit row and, after commit, publishes a
        `membership` invalidation, so the OTA admin applies the new role within seconds.
      tags:
        - Team
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - MFA_REQUIRED
        - NOT_FOUND
        - LAST_OWNER
        - PRECONDITION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - accounts
        - platform_audit_log
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
            example:
              role: finance
      responses:
        '200':
          description: The member with the new role, and its new version in `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
              example:
                id: stf_01JB3K7P2R6T0W4Y8A2C6E0G4J
                accountId: acc_01JB3K6M0P4R8T2W6Y0A4C8E2G
                fullName: Jonas Dahl
                email: jonas.dahl@example.com
                role: finance
                status: active
                mfaEnabled: false
                createdAt: '2026-10-15T11:02:45Z'
                version: 2
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/StepUpUnauthorized'
        '403':
          $ref: '#/components/responses/TenantRoleOrStepUpForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeMember
      summary: Remove a member, or leave the OTA
      description: >-
        Owners and admins remove members within the role matrix (only owners remove owners and admins), and any member
        may remove themself to leave the OTA; other callers get `403 FORBIDDEN`. The membership becomes `removed` and
        the row stays, because its `stf_` id is referenced by value in the OTA's staff actions. The last active owner
        can neither be removed nor leave (`409 LAST_OWNER`). Writes an audit row and, after commit, publishes a
        `membership` invalidation, so the member's OTA admin sessions end within seconds.
      tags:
        - Team
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - NOT_FOUND
        - LAST_OWNER
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - platform_audit_log
      responses:
        '204':
          description: The member is removed (or the caller left the OTA).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantRoleForbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/LastOwner'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
