  /v1/admin/tenants/{tenantId}/suspend:
    parameters:
      - $ref: '#/components/parameters/AdminTenantId'
    post:
      operationId: adminSuspendTenant
      summary: Suspend an OTA
      description: >-
        Suspends an `active` OTA (PADR-0014) for `abuse`, `request` or `admin`, with a written `reason` of 5–500
        characters after trimming that the audit row keeps; `billing` suspensions are set only by billing sync. One
        transaction sets the status `suspended`, `suspended_at`, `suspension_reason` and a new version, inserts a
        `suspend` job and writes the audit row. After commit it publishes a `tenant` invalidation, so the storefront
        and the OTA API answer `TENANT_SUSPENDED` within 60 seconds, dispatches `tenant.suspend` to the OTA worker and
        e-mails the owners. Any other status answers `409 CONFLICT` (`details.reason = not_active`). Data is never
        deleted.
      tags:
        - Admin tenants
      security:
        - adminBearer: []
      x-scope: platform_admin
      x-reason-required: true
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenants
        - tenant_domains
        - tenant_memberships
        - accounts
        - provisioning_jobs
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendTenantRequest'
            example:
              suspensionReason: abuse
              reason: Card testing from the storefront reported by Stripe on 2026-10-20.
      responses:
        '202':
          description: >-
            Accepted. The OTA is suspended at once; the `suspend` job carries the OTA worker's housekeeping.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantLifecycleAccepted'
              examples:
                suspended:
                  $ref: '#/components/examples/TenantSuspended'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/AdminUnauthenticated'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Only an active OTA can be suspended (`details.reason = not_active`). Possible codes: CONFLICT.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                CONFLICT:
                  summary: The OTA is not active
                  value:
                    error:
                      code: CONFLICT
                      message: The request conflicts with the current state of the resource.
                      status: 409
                      requestId: req_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                      details:
                        reason: not_active
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
