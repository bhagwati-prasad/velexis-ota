  /v1/tenants/{tenantId}/go-live:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      operationId: goLive
      summary: Switch the OTA's storefront to live
      description: >-
        Owners only (M5), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED`
        without MFA) and `FEATURE_LIVE_SWITCH` on (`403 FEATURE_DISABLED`, `details.feature = live_switch`). The body
        only confirms the switch (`{confirm: true}`). The OTA must be `active` (`409 TENANT_NOT_ACTIVE` with
        `details.status`).


        **Preconditions** (platform/docs/scope.md PF-14). The service checks every one and answers `422
        LIVE_PRECONDITIONS_UNMET` with all the missing ones in `details.missing`, so the portal can show a checklist:
        `amadeus_live` (an `active` live Amadeus connection), `payments_live` (a live payment mode that can charge: the
        Velexis Stripe account, a connected account whose charges are enabled, or verified live API keys),
        `payout_account` (a `verified` payout account, when the payments stay in `velexis` mode), `plan_live_mode`
        (the plan's `limits.liveMode`), `subscription` (a Stripe subscription that is `trialing` or `active`) and
        `mfa` (the account still has MFA on, read again inside the transaction).


        **Effect**, in one transaction: `storefront_environment = live`, `live_enabled_at`,
        `live_enabled_by_account_id` and `version + 1`; when the test payment connection is in `velexis` mode the live
        one is created in that mode, and a `connect_standard` test connection is copied to live; the audit row
        `tenant.went_live`. After commit it publishes `tenant` and `connection` invalidations, so the hosted storefront
        serves live within 60 seconds. An OTA that is live already answers `200` with the tenant unchanged. Live API
        keys can be created from then on (`createApiKey`).
      tags:
        - Tenants
      security:
        - portalBearer: []
      x-scope: portal
      x-mfa-step-up: true
      x-feature: live_switch
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - MFA_REQUIRED
        - FEATURE_DISABLED
        - NOT_FOUND
        - TENANT_NOT_ACTIVE
        - LIVE_PRECONDITIONS_UNMET
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - accounts
        - tenants
        - plans
        - subscriptions
        - supplier_connections
        - payment_provider_connections
        - tenant_payout_accounts
        - tenant_domains
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoLiveRequest'
            example:
              confirm: true
      responses:
        '200':
          description: The OTA, now live, with its new version in `ETag`.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
              example:
                id: ten_01JA2Z7Q4M9R2T6V0X3Z8B1D5F
                key: acme
                name: Acme Travel
                legalName: Acme Travel AS
                status: active
                suspensionReason: null
                billingNotice: null
                planCode: growth
                defaultCurrency: EUR
                countryCode: 'NO'
                timeZone: Europe/Oslo
                supportEmail: support@acme-travel.example.com
                storefrontEnvironment: live
                liveEnabledAt: '2027-02-01T09:30:00Z'
                primaryHost: travel.acme-travel.example.com
                schemaVersion: '0002_mvp_deltas'
                createdAt: '2026-10-14T08:20:11Z'
                activatedAt: '2026-10-14T08:20:16Z'
                version: 7
                myRole: owner
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/StepUpUnauthorized'
        '403':
          description: >-
            The e-mail address is not verified, the caller is not an owner, MFA is not enabled, or the live switch is
            off or not in the plan. Possible codes: EMAIL_NOT_VERIFIED, FORBIDDEN, MFA_REQUIRED, FEATURE_DISABLED.
