        platform admin approved it. Drafts and voided drafts are never shown. An `approved` statement waits for the
        bank transfer, a `paid` one carries the transfer date, and a `carried_forward` one had a net of zero or less,
        which the next statement absorbs. The list is short (one or two statements a month), so it is not paginated; it
        is empty for an OTA that never took payments in `velexis` mode.
      tags:
        - Settlements
      security:
        - portalBearer: []
      x-scope: portal
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
