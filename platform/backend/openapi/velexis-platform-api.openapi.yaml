  /v1/tenants/{tenantId}/amadeus-connections/{environment}/credentials:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/CredentialsEnvironment'
    put:
      operationId: submitAmadeusCredentials
      summary: Submit the OTA's own Amadeus credentials for verification
      description: >-
        Owners and admins switch the Amadeus connection of an environment to the OTA's own credentials (M5, ADR-0012,
        PADR-0010), with a TOTP step-up within the last 15 minutes (`401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED`
        without MFA) and `FEATURE_OWN_AMADEUS` on (`403 FEATURE_DISABLED`). Nothing changes on the connection yet: the
        credentials wait in a credential submission, the client secret envelope-encrypted, and a platform worker job
        verifies them with an OAuth token request to the Amadeus host of the environment. Success switches the
        connection in one transaction (`credentialSource: tenant`, the secret re-encrypted for the connection, the
        offices of the body, `active`), moves the Velexis office of that environment to `releasing`, and e-mails the
        submitter; a rejection (`AMADEUS_CREDENTIALS_INVALID`) or an unreachable Amadeus (`PROVIDER_UNAVAILABLE`,
        after retries) leaves the working connection untouched. The portal follows the submission with
        `getCredentialSubmission`; `listAmadeusConnections` shows it as `pendingSubmission`.


        **Rules.** Office ids are 9 upper-case letters and digits, each at most once; `defaultOfficeId` and, when sent,
        `queuingOfficeId` and `ownerOfficeId` must be among `officeIds` (`400 VALIDATION_FAILED` with a field error);
        the two optional offices default to `defaultOfficeId`. An open submission of the same environment is
        superseded and its secret erased. The environment needs no connection yet: an OTA may bring its own live
        credentials before it asks for a Velexis live office, and the connection is then created on success. The OTA
        must be `active` (`409 TENANT_NOT_ACTIVE`, PADR-0014 item 5).


        **The secret.** `clientSecret` is write-only: it is never logged (the logger redacts it), never answered and
        never put in a queue message, and it is erased from the submission when the submission ends. The operation is
        not idempotent, so no body is stored for a replay. Writes the audit row `amadeus.credentials_submitted` without
        the secret, then enqueues `credentials.verify` with the submission id only.
      tags:
        - Connections
      security:
        - portalBearer: []
      x-scope: portal
      x-mfa-step-up: true
      x-feature: own_amadeus
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - REAUTH_REQUIRED
        - EMAIL_NOT_VERIFIED
        - FORBIDDEN
        - MFA_REQUIRED
        - FEATURE_DISABLED
        - NOT_FOUND
        - TENANT_NOT_ACTIVE
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - tenant_memberships
        - tenants
        - supplier_connections
        - credential_submissions
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAmadeusCredentialsRequest'
            example:
              clientId: acme-amadeus-client
              clientSecret: example-client-secret-not-real
              officeIds:
                - OSLN12345
                - OSLN12346
              defaultOfficeId: OSLN12345
              queuingOfficeId: OSLN12345
              ownerOfficeId: OSLN12346
      responses:
        '202':
          description: Accepted. The submission waits for its verification.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialSubmissionAccepted'
              example:
