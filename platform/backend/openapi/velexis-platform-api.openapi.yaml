    post:
      operationId: adminRevealPayoutAccount
      summary: Reveal an OTA's bank details to pay a settlement
      description: >-
        Decrypts and answers the full bank identifiers of the OTA's payout account (M5, PADR-0003 item 10), so that
        Velexis can pay an approved statement by bank transfer: the IBAN and the BIC (when one was given) of an `iban`
        account, or the account and routing numbers of a `local` one. It needs a TOTP step-up within the last 15
        minutes (`401 REAUTH_REQUIRED`, PADR-0006 item 4) and a written `reason` of 5–500 characters after trimming.
