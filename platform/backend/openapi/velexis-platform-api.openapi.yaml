  /v1/admin/provisioning-jobs/{jobId}/retry:
    parameters:
      - $ref: '#/components/parameters/ProvisioningJobId'
    post:
      operationId: adminRetryProvisioningJob
      summary: Retry a failed tenant job
      description: >-
        Inserts a **new** job of the same kind and payload for a `failed` job and dispatches it; the failed row stays
        as history (PADR-0001 item 7). Retrying a failed `provision` job also sets the OTA from `failed` back to
        `provisioning`; when its schema already exists, the OTA run is a no-op and only the platform post-steps run
        again. `409 PROVISIONING_NOT_RETRYABLE` when the job is not `failed`, when a job of the same kind is already
        queued or running for the OTA, or for a `provision` job of an OTA that is not `failed`. Writes an audit row.
      tags:
        - Admin provisioning jobs
