        `@velexis/api-types/jobs`, `owner: platform`), then the OTA queues (`OTA_QUEUES`, `owner: ota`), among them
        `ota-tenant-ops`, which the platform produces and the OTA worker consumes. `oldestWaitingSeconds` is the age of
        the oldest waiting job, `null` when none waits. Reads Redis only (prefix `vx`); `503 SERVICE_UNAVAILABLE`
