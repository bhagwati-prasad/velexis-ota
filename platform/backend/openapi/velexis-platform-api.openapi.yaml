      summary: Check whether an OTA key is available
      description: >-
        The live key check of the create-OTA wizard, called while the person types. The key is checked against the key
        rules (`^[a-z][a-z0-9]{2,29}$`, also a DNS label), the reserved list of the sign-up flow (`platform`, `admin`,
        `api`, `www`, `test`, …) and every tenant row in any status, because a deleted or failed OTA keeps its key.
        `available: false` comes with `reason`: `invalid`, `reserved` or `taken`. `storefrontHost` is the host the key
        gets, `<key>.<STOREFRONT_BASE_DOMAIN>`. Reads only; `createTenant` checks the key again, because the key can be
        taken between the check and the submit. 30 checks per account per minute.
