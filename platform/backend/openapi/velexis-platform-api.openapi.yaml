                  $ref: '#/components/examples/IDEMPOTENCY_KEY_REUSED'
        '422':
          description: >-
            The plan cannot be chosen with this billing interval, or the account owns as many OTAs as allowed. Possible
            codes: PLAN_NOT_AVAILABLE, UNPROCESSABLE.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
