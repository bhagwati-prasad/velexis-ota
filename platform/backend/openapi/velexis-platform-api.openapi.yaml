openapi: 3.1.0
info:
  title: Velexis Platform API
  version: 1.0.0
  summary: >-
    Control-plane API of Velexis behind the portal and the platform admin: accounts, OTAs, team, API keys, plans and
    billing, plus Caddy's TLS gate and the Stripe webhook receivers.
  description: >-
    The platform backend (`@velexis/platform-backend`, `127.0.0.1:3100`) owns the `platform` schema: portal accounts,
    OTAs (tenants), memberships, API keys, domains, connections, plans and subscriptions. The **portal** and the
    **platform admin** call it from their Next.js servers with `Authorization: Bearer`; no browser calls it and there is
    no CORS configuration (PADR-0009 item 3). Stripe calls the webhook receivers and Caddy the internal TLS gate. The
    source of every operation is the platform API inventory (`platform/docs/api-inventory.md`,
    `api-inventory-resources.md`, `api-inventory-admin.md`); the document grows in milestone slices, each written
    before the implementation tasks of its milestone (PADR-0016).


    **Who may call (`x-scope`).** `public`: no token, rate limited. `portal_unverified`: a portal access token; the
    e-mail address need not be verified (the account, MFA set-up, sessions and sign-out, PADR-0008 item 2).
    `portal`: a portal access token of a verified, active account, otherwise `403 EMAIL_NOT_VERIFIED`.
    `platform_admin`: a platform admin access token (`/v1/admin/…`). `internal`: loopback only and without
    `X-Forwarded-For`, no token; any other caller gets `404`. `webhook`: a Stripe signature on the raw body. Portal and
    admin tokens carry different audiences (`portal`, `platform_admin`) and are never accepted on the other surface.
    Tenant resources live under `/v1/tenants/{tenantId}/…` and answer `404 NOT_FOUND` to non-members.


    **Conventions** (the same as the OTA booking API). JSON in camelCase; ids are prefixed ULIDs (`acc_`, `ten_`,
    `stf_`, `ivt_`, `key_`, `dom_`, …); money is `{amount: decimal string, currency}`, never a number; times are ISO
    8601 in UTC with `Z`. Lists use cursor pagination: `?limit=50&cursor=…` answers `{data, page: {nextCursor, limit}}`
    (default 50, maximum 200). Versioned resources answer `ETag: "<version>"`; their PATCH requires `If-Match`, and a
    stale version answers `412 PRECONDITION_FAILED`. Operations marked `x-idempotent` require an `Idempotency-Key`
    and replay the stored response for 24 hours. Responses that carry a secret (tokens, the TOTP secret, recovery
    codes, keys shown once) document `Cache-Control: no-store` and are never stored for replay. Every response
    carries `X-Request-Id`. Errors use the envelope `{error: {code, message, status, requestId, details?,
    fieldErrors?}}` with a code of `x-error-catalogue`; messages are safe to show and never echo a submitted value.


    **End-user IP.** The portal and admin servers send the person's IP and user agent on every call in
    `X-Velexis-End-User-IP` and `X-Velexis-End-User-Agent`, authenticated by the shared key `X-Velexis-Bff-Key`. The
    API honours them only from loopback without `X-Forwarded-For`; rate limits, sessions and audit rows use that IP
    (PADR-0019). The request context handles these headers for every operation, so they are not repeated as
    operation parameters.


    **Extensions.** `x-scope` (above, on every operation); `x-internal: true` (outside the portal and admin surface:
    internal endpoints, health checks and webhook receivers); `x-idempotent: true` (`Idempotency-Key` required);
    `x-mfa-step-up: true` (a TOTP step-up within 15 minutes, else `401 REAUTH_REQUIRED`, or `403 MFA_REQUIRED` without
    MFA); `x-feature: <switch>` (a milestone switch of PADR-0015, `403 FEATURE_DISABLED` when off);
    `x-reason-required: true` (admin actions with a required `reason`, 5–500 characters, kept in the audit row);
    `x-error-codes` (the catalogue codes an operation answers); `x-platform-tables` (the `platform` tables it reads or
    writes); `x-error-catalogue` (root: every error code with its HTTP status and default message).
  contact:
    name: Velexis platform team
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://api.platform.example.com
    description: >-
      Production, through Caddy. The portal and admin servers call it as `PLATFORM_API_URL`
      (`http://127.0.0.1:3100` on the VM and locally).
tags:
  - name: Auth
    description: >-
      Portal identity (`AuthModule`): sign-up with e-mail verification, sign-in with optional TOTP MFA, rotating
      refresh tokens, sign-out of one or every session, password reset and the MFA step-up of sensitive actions. The
      tokens appear only in these responses; the portal server moves them into httpOnly cookies at once.
  - name: Account
    description: >-
      The signed-in account (`AccountsModule`, `/v1/me`): profile, memberships and milestone switches, password
      change, TOTP set-up and recovery codes, and the account's sessions.
  - name: Plans
    description: The public plan catalogue (`BillingModule`) shown on the pricing page and in the create-OTA wizard.
  - name: Internal
    description: >-
      Operations outside the portal and admin surface (`x-internal: true`): Caddy's on-demand TLS gate and the health
      checks. `/internal/*` and `/health/ready` answer only loopback callers without `X-Forwarded-For`.
paths:
  /v1/auth/sign-up:
    post:
      operationId: signUp
      summary: Create a portal account
      description: >-
        Creates an account in `pending_verification` and e-mails a verification link that works once within 24 hours.
        The answer is the same `202` whether or not the address is registered: an existing address gets an "account
        exists" e-mail with sign-in and reset links instead, so the response reveals nothing (PADR-0008 item 1).


        **Rules.** The e-mail address is trimmed and compared lower-cased. The password needs at least 10 characters
        and must not be in the breached-password list (`422 PASSWORD_TOO_WEAK`); it is stored as an Argon2id hash.
        `acceptTerms` must be `true`, and `termsVersion` names the terms the person accepted (kept with the time of
        acceptance). 5 sign-ups per end-user IP per hour.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - PASSWORD_TOO_WEAK
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_tokens
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
            example:
              email: anna.berg@example.com
              password: Northern-Lights-2026
              fullName: Anna Berg
              acceptTerms: true
              termsVersion: '2026-10-01'
      responses:
        '202':
          description: Accepted. A verification e-mail (new address) or an "account exists" e-mail is queued.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpAccepted'
              example:
                status: verification_sent
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '422':
          $ref: '#/components/responses/PasswordTooWeak'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify the e-mail address
      description: >-
        Consumes a verification token from the e-mail link. An unused, unexpired token sets `email_verified_at`,
        makes the account `active` and is used up; a used, unknown or expired token answers `400
        VERIFICATION_TOKEN_INVALID`. The portal calls it from a server-side page that redirects to a clean URL with
        `Referrer-Policy: no-referrer`, so the token never stays in the address bar (PADR-0008 item 4).
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - VERIFICATION_TOKEN_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_tokens
        - accounts
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
            example:
              token: Vf3kQ9mZ2xT7bN4cR8wL1pY6hD5sJ0aE2gU9iO3qK7v
      responses:
        '200':
          description: The address is verified and the account is active.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailVerified'
              example:
                accountId: acc_01JA2Z9W5K7Q3M8N4P6R2T0V1X
                email: anna.berg@example.com
                emailVerified: true
        '400':
          description: >-
            The body failed validation, or the token is unknown, already used or expired. Possible codes:
            VALIDATION_FAILED, VERIFICATION_TOKEN_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
                VERIFICATION_TOKEN_INVALID:
                  $ref: '#/components/examples/VERIFICATION_TOKEN_INVALID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/resend-verification:
    post:
      operationId: resendVerification
      summary: Send a new verification e-mail
      description: >-
        Always answers `202` with no body, so the answer reveals nothing about the address. For an unverified account
        it e-mails a new link (24 hours, single use). Earlier links that have not expired keep working, because people
        often click the first e-mail (PADR-0008 item 3). 3 e-mails per address and 10 calls per end-user IP per hour.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_tokens
        - email_outbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
            example:
              email: anna.berg@example.com
      responses:
        '202':
          description: Accepted; a new link is e-mailed when the address belongs to an unverified account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/sign-in:
    post:
      operationId: signIn
      summary: Sign in to the portal with e-mail and password
      description: >-
        Checks the lock-out, then the password, then the account status. A wrong e-mail address and a wrong password
        give the same `401 INVALID_CREDENTIALS` in the same time. Five consecutive failures lock the account for 15
        minutes (`423 ACCOUNT_LOCKED` with `Retry-After`). A disabled account answers `403 ACCOUNT_DISABLED`, and only
        after a correct password. 10 sign-ins per end-user IP per minute.


        **Without MFA** the answer is a `PortalSession`: a new refresh family (`audience = portal`, 30 days absolute,
        refresh token idle expiry 7 days) and a 15-minute access token. **With MFA** the answer is an `MfaChallenge`
        whose token completes the sign-in through `verifyMfa` within 5 minutes. An account whose e-mail address is not
        verified may sign in; its token reaches only the `portal_unverified` operations.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - ACCOUNT_DISABLED
        - ACCOUNT_LOCKED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_sessions
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
            example:
              email: anna.berg@example.com
              password: Northern-Lights-2026
      responses:
        '200':
          description: Signed in (`PortalSession`), or a second factor is needed (`MfaChallenge`).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignInResult'
              examples:
                session:
                  $ref: '#/components/examples/PortalSession'
                mfaChallenge:
                  summary: MFA is enabled; complete the sign-in with verifyMfa
                  value:
                    mfaRequired: true
                    mfaChallengeToken: Mc8vR2kP5wQ9zT3xL7nB4hY1dF6sG0jA8eU2iO5mK3c
                    expiresIn: 300
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: 'Wrong e-mail address or password (the same answer for both). Possible codes: INVALID_CREDENTIALS.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                INVALID_CREDENTIALS:
                  $ref: '#/components/examples/INVALID_CREDENTIALS'
        '403':
          description: 'The password is correct but Velexis disabled the account. Possible codes: ACCOUNT_DISABLED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_DISABLED:
                  $ref: '#/components/examples/ACCOUNT_DISABLED'
        '423':
          description: 'Too many failed sign-ins; wait for `Retry-After` seconds. Possible codes: ACCOUNT_LOCKED.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Retry-After:
              $ref: '#/components/headers/Retry-After'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ACCOUNT_LOCKED:
                  $ref: '#/components/examples/ACCOUNT_LOCKED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/mfa/verify:
    post:
      operationId: verifyMfa
      summary: Complete an MFA sign-in challenge
      description: >-
        Completes the challenge of `signIn` with a TOTP code (6 digits, ±1 time step, each code accepted once) or with
        one unused recovery code, which is then used up. A challenge allows 5 attempts and lives 5 minutes; after that,
        or for an unknown token, the answer is `401 MFA_CHALLENGE_INVALID` and the person signs in again. 10 attempts
        per account per 10 minutes. Success creates the refresh family with `mfa_verified_at` set, so the access token
        carries `mfa_at`.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - MFA_CHALLENGE_INVALID
        - MFA_CODE_INVALID
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
        - account_recovery_codes
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyMfaRequest'
            examples:
              totp:
                summary: With a code of the authenticator app
                value:
                  mfaChallengeToken: Mc8vR2kP5wQ9zT3xL7nB4hY1dF6sG0jA8eU2iO5mK3c
                  code: '492039'
              recoveryCode:
                summary: With a recovery code
                value:
                  mfaChallengeToken: Mc8vR2kP5wQ9zT3xL7nB4hY1dF6sG0jA8eU2iO5mK3c
                  recoveryCode: 7KQ4-M2XP-9TRW-H5ZD
      responses:
        '200':
          description: Signed in.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  $ref: '#/components/examples/PortalSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The challenge is unknown, expired or used up, or the code is wrong. Possible codes: MFA_CHALLENGE_INVALID,
            MFA_CODE_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                MFA_CHALLENGE_INVALID:
                  $ref: '#/components/examples/MFA_CHALLENGE_INVALID'
                MFA_CODE_INVALID:
                  $ref: '#/components/examples/MFA_CODE_INVALID'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token
      description: >-
        Exchanges a refresh token for a new access token and a new refresh token of the same family; the presented
        token is used up. Presenting a token that was already rotated revokes the whole family (`401
        REFRESH_TOKEN_REUSED`). An unknown, revoked or expired token, or a family past its absolute lifetime, answers
        `401 REFRESH_TOKEN_INVALID`. Only portal families are accepted here; admin families refresh through the admin
        surface. The new access token copies `mfa_at` from the family.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - REFRESH_TOKEN_INVALID
        - REFRESH_TOKEN_REUSED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshSessionRequest'
            example:
              refreshToken: Rf5nW8qL2xK7vT4cB9mZ1pH6yD3sJ0aG8eU5iO2rQ4w
      responses:
        '200':
          description: New tokens of the same family.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
            Cache-Control:
              $ref: '#/components/headers/NoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalSession'
              examples:
                session:
                  $ref: '#/components/examples/PortalSession'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          description: >-
            The refresh token cannot be used; sign in again. Possible codes: REFRESH_TOKEN_INVALID,
            REFRESH_TOKEN_REUSED.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                REFRESH_TOKEN_INVALID:
                  $ref: '#/components/examples/REFRESH_TOKEN_INVALID'
                REFRESH_TOKEN_REUSED:
                  $ref: '#/components/examples/REFRESH_TOKEN_REUSED'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/sign-out:
    post:
      operationId: signOut
      summary: Sign out of the current session
      description: >-
        Revokes the refresh family of the given refresh token. A token that is unknown, already revoked or of another
        account changes nothing, and the answer is still `204`. The access token stays valid until it expires (15
        minutes at most); the portal server deletes its cookies at once.
      tags:
        - Auth
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignOutRequest'
            example:
              refreshToken: Rf5nW8qL2xK7vT4cB9mZ1pH6yD3sJ0aG8eU5iO2rQ4w
      responses:
        '204':
          description: Signed out.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/sign-out-everywhere:
    post:
      operationId: signOutEverywhere
      summary: Sign out of every session
      description: >-
        Revokes every refresh family of the account, portal and platform admin alike, and writes the Redis cut-off
        `staffdeny:acct:<accountId>` (30 days) that makes the OTA backend revoke the account's OTA admin staff sessions
        too. Publishes an `account` invalidation and writes an audit row.
      tags:
        - Auth
      security:
        - portalBearer: []
      x-scope: portal_unverified
      x-error-codes:
        - UNAUTHENTICATED
        - TOKEN_EXPIRED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_sessions
        - platform_audit_log
      responses:
        '204':
          description: Every session of the account is revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: E-mail a password reset link
      description: >-
        Always answers `202` with no body. For an active account it creates a reset token (1 hour, single use) and
        e-mails the link; for any other address nothing happens. 3 e-mails per address and 10 calls per end-user IP
        per hour.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - accounts
        - account_tokens
        - email_outbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
            example:
              email: anna.berg@example.com
      responses:
        '202':
          description: Accepted; a reset link is e-mailed when the address belongs to an active account.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: >-
        Checks the reset token (unused, unexpired), applies the password rules, stores the new Argon2id hash and uses
        the token up. Every session of the account is revoked, `staffdeny:acct:<accountId>` is written, the account is
        e-mailed, an `account` invalidation is published and an audit row is written.
      tags:
        - Auth
      security: []
      x-scope: public
      x-error-codes:
        - VALIDATION_FAILED
        - PASSWORD_RESET_TOKEN_INVALID
        - PASSWORD_TOO_WEAK
        - RATE_LIMITED
        - INTERNAL_ERROR
      x-platform-tables:
        - account_tokens
        - accounts
        - account_sessions
        - email_outbox
        - platform_audit_log
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
            example:
              token: Pr2xL9qW5mT8vK3cN7bZ4hY1dF6sJ0aG2eU8iO5rQ1k
              newPassword: Silver-Fjord-Morning-7
      responses:
        '204':
          description: The password is changed and every session is revoked.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
        '400':
          description: >-
            The body failed validation, or the reset token is unknown, already used or expired. Possible codes:
            VALIDATION_FAILED, PASSWORD_RESET_TOKEN_INVALID.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                VALIDATION_FAILED:
                  $ref: '#/components/examples/VALIDATION_FAILED'
