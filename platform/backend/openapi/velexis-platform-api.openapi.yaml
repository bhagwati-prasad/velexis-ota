    patch:
      operationId: updateAmadeusConnection
      summary: Change the office defaults, ticketing defaults and monitored queues of an Amadeus connection
      description: >-
        Owners and admins change the settings the OTA backend applies to Amadeus calls in one environment: the default
        office (used when the caller names none), the default `queuingOfficeId` and `ownerOfficeId` of new flight
        orders, the ticketing defaults of new flight orders, and the queues polled into the queue snapshots. Each field
        is optional; a field that is sent replaces the stored value (`ticketingDefaults` as a whole object, `{}` to
        clear it, and `monitoredQueues` as a whole list). The connection's offices themselves (`officeIds`), its
        credentials and its status are not changed here.


        **Rules.** Every office id of the body must be one of the connection's `officeIds`: the three office defaults
        and, because the OTA backend acts only for the OTA's own offices on the shared Velexis account (ADR-0012,
        office isolation), the `officeId` of each `ticketingDefaults.automatedProcess` entry and of each monitored
        queue. Another office answers `400 VALIDATION_FAILED` with a field error on that field. The shapes of
        `ticketingDefaults` and `monitoredQueues` are those of `listAmadeusConnections`. `{environment}` without a
        connection answers `404 NOT_FOUND`. A tenant that is not `active` answers `409 TENANT_NOT_ACTIVE`, because a
        suspended OTA's connections are read-only (PADR-0014 item 5). `If-Match` carries the connection's `version`; a
        stale one answers `412 PRECONDITION_FAILED`.


        Updates the row with `version + 1`, writes the audit row `amadeus.settings_updated` and, after commit,
        publishes a `connection` invalidation, so the OTA backend reloads the connection within seconds.
