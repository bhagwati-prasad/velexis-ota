# =====================================================================================================
# deploy/egress/allowed-hosts.conf — every outbound connection of the Velexis VM (task X-041; PCI DSS 11.5.1.1,
# ADR-0027 row 11.5). Every other connection the VM starts is refused and logged with the prefix VELEXIS-EGRESS-DENY.
#
# provision-vm.sh --steps egress (also run by harden) installs it as /etc/velexis/egress/allowed-hosts.conf; the
# root-owned velexis-egress (deploy/scripts/egress.sh) loads it into the nftables table inet velexis_egress at boot and
# every 2 minutes (velexis-egress-refresh.timer), resolving each host through the VM's own resolvers. To add a host:
# docs/mvp/runbooks/outbound-allow-list.md §2 (a pull request with the reason, then the step egress; never an edit on
# the VM). check-vm.sh --only firewall checks the table against the installed copy of this file.
#
# One connection per line:  <host> <port> <proto> <used-by> <reason>
#   host     a lower-case DNS name, an IPv4 address, an IPv6 address (compressed, lower case), or a host the VM's own
#            configuration names, read at every refresh (decisions.md §4: hosts that are the VM's own stay out of the
#            repository):
#              @system-resolvers      the upstream DNS servers of systemd-resolved (/run/systemd/resolve/resolv.conf)
#              @chrony-sources        the NTP servers chrony uses now (chronyc -n -c sources)
#              env:<file>:<VARIABLE>  the host of the URL that VARIABLE holds in /etc/velexis/<file>
#              rclone:<file>          the endpoint of the rclone remote that RCLONE_REMOTE and RCLONE_CONFIG of
#                                     /etc/velexis/<file> name, as <endpoint> and as <bucket>.<endpoint>
#   port     1 to 65535 (a URL's own port must be the line's: the SMTP URLs of the env templates use 465)
#   proto    tcp or udp
#   used-by  the env variable or unit that makes the connection (comma-separated, no blanks)
#   reason   free text, to the end of the line
#
# Always allowed besides these lines (the fixed rules of the table): loopback, which the health check uses for its TLS
# and payment page checks (127.0.0.1:443 with the host as SNI, deploy/scripts/healthcheck.sh), Caddy for its
# on-demand TLS ask and the apps for PostgreSQL, Redis and each other; replies to connections the VM accepted (SSH,
# HTTP, HTTPS) and other established or related traffic; DHCP lease renewals (udp 68 to 67, 546 to 547); IPv6
# neighbour discovery.
#
# Not on the list, and why:
#   GitHub  the Deploy workflow connects to the VM over SSH (rsync, then sudo velexis-deploy); the VM itself fetches
#           nothing from GitHub: no script or unit of deploy/ names github.com (check-vm.test.sh checks it), releases
#           arrive built, and the Caddy build of X-039 comes inside the release.
#   npm     releases are built in GitHub Actions; the step node of provision-vm.sh runs corepack (registry.npmjs.org)
#           before harden applies this list. A new PNPM_VERSION later needs an emergency opening (runbook §4).
#   Sentry  SENTRY_DSN has no client in the code yet; when one is added, its ingest host joins this list.
#
# host                              port proto used-by                   reason
@system-resolvers                   53   udp   systemd-resolved          DNS of every process: the stub resolver 127.0.0.53 forwards to the VM's resolvers
@system-resolvers                   53   tcp   systemd-resolved          DNS answers too long for UDP
1.1.1.1                             53   udp   DNS_RESOLVERS             custom domain verification of the platform worker (PADR-0004 item 3), the default of platform-backend.env: change these four lines with it (check-vm.sh compares them)
1.1.1.1                             53   tcp   DNS_RESOLVERS             the same, answers too long for UDP
8.8.8.8                             53   udp   DNS_RESOLVERS             the second default resolver of custom domain verification
8.8.8.8                             53   tcp   DNS_RESOLVERS             the same, answers too long for UDP
ntp.ubuntu.com                      123  udp   chrony                    time (deployment-single-vm.md §2): Ubuntu's NTP servers, the first pool of /etc/chrony/chrony.conf
@chrony-sources                     123  udp   chrony                    the servers chrony picked from its pools (ntp.ubuntu.com, the ubuntu.pool.ntp.org pools) or got from DHCP
169.254.169.254                     80   tcp   cloud-init                the cloud provider's metadata service, which cloud-init reads at every boot
api.stripe.com                      443  tcp   STRIPE_SECRET_KEY*        Stripe's API through the stripe SDK: payments and refunds of the OTA backend (M3), billing, Connect accounts and own keys of the platform (M5)
connect.stripe.com                  443  tcp   STRIPE_CONNECT_CLIENT_ID  Stripe Connect OAuth of the platform: the code exchange and deauthorisation of an OTA's account (M5)
test.travel.api.amadeus.com         443  tcp   AMADEUS_BASE_URL_TEST     Amadeus test (the official host when the variable is empty): token and flight APIs of the OTA backend, credential checks of the platform worker
travel.api.amadeus.com              443  tcp   AMADEUS_BASE_URL_LIVE     Amadeus production (the official host when the variable is empty), the same
env:platform-backend.env:SMTP_URL   465  tcp   SMTP_URL                  the mail relay of the platform's e-mails (ADR-0017, PADR-0013)
env:ota-backend.env:SMTP_URL        465  tcp   SMTP_URL                  the mail relay of the OTA worker's e-mails (OADR-0013)
env:alert.env:ALERT_SMTP_URL        465  tcp   ALERT_SMTP_URL            the mail relay of velexis-alert: failed units, the health check, the backups
rclone:backup.env                   443  tcp   RCLONE_REMOTE             the off-site backup bucket of velexis-backup and velexis-restore (deployment-single-vm.md §10)
acme-v02.api.letsencrypt.org        443  tcp   caddy                     Let's Encrypt's ACME directory: the certificates of the named hosts and on-demand TLS (ACME_EMAIL)
acme.zerossl.com                    443  tcp   caddy                     ZeroSSL's ACME directory, Caddy's fallback issuer
api.zerossl.com                     443  tcp   caddy                     ZeroSSL's EAB credentials for the ACME_EMAIL account, which that fallback asks for first
zerossl.ocsp.sectigo.com            80   tcp   caddy                     OCSP stapling of a certificate from ZeroSSL
archive.ubuntu.com                  80   tcp   unattended-upgrades       Ubuntu's archive (apt-get update and upgrade, the step packages); a cloud image's own mirror is added the same way
security.ubuntu.com                 80   tcp   unattended-upgrades       Ubuntu's security updates, installed daily
deb.nodesource.com                  443  tcp   unattended-upgrades       Node.js 22: the repository, and its key fetched by the step packages of provision-vm.sh
apt.postgresql.org                  443  tcp   unattended-upgrades       PostgreSQL 16 (PGDG repository)
www.postgresql.org                  443  tcp   provision-vm.sh           the PGDG signing key, fetched by the step packages
packages.redis.io                   443  tcp   unattended-upgrades       Redis 7.4: the repository and its key
dl.cloudsmith.io                    443  tcp   unattended-upgrades       Caddy 2.8 (the package that carries the unit, user and folders): the repository and its key
