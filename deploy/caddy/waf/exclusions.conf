# =====================================================================================================
# exclusions.conf — exceptions of the Velexis web application firewall to the OWASP Core Rule Set (task X-039;
# docs/mvp/deployment-single-vm.md §6). Installed root-owned as /etc/caddy/waf/exclusions.conf, and loaded by every
# coraza_waf of the Caddyfile last, after the Core Rule Set (see coraza.conf for the order): it can name only the rules
# of paranoia level 1 that the Caddyfile keeps.
#
# Rules for this file:
#   - Every exclusion names the rule id(s) it changes, the paths or arguments it applies to, and its reason: the
#     legitimate request that the rule matched (from the WAF log of the detection week, deployment-single-vm.md §6),
#     never an argument value. Exclude as narrowly as possible: one rule, one argument, one path, in that order of
#     preference (ctl:ruleRemoveTargetById before ctl:ruleRemoveById before SecRuleRemoveById).
#   - Our own rule ids are 10000 to 10999 (the CRS leaves 1 to 99,999 to local rules); keep them unique.
#   - Runtime exclusions (ctl:...) are phase 1 rules. Loaded last, they run after the Core Rule Set's own phase 1 rules
#     (the protocol checks, 920...) and before its phase 2 rules and its blocking decision (949110), so they can change
#     only those; a phase 1 rule is excluded at configuration time (SecRuleUpdateTargetById, SecRuleRemoveById).
#   - After a change: bash deploy/caddy/test/caddy-smoke.sh, then a deploy (velexis-deploy validates and reloads Caddy).
# =====================================================================================================

# ---- Paths in detection mode on the blocking hosts --------------------------------------------------------------------

# Stripe's webhook events on api.ota.example.com (the OTA API's /webhooks/stripe/velexis/{environment},
# /webhooks/stripe/connect/{environment} and /webhooks/stripe/c/{connectionId}): every rule keeps matching and logging,
# but none blocks. Reason: the OTA API accepts an event only with Stripe's signature over its exact body, and a refused
# event stalls a payment or a refund until Stripe's retries give up; the event carries text that customers typed
# (billing names, addresses), which the Core Rule Set can mistake for an attack. Findings on these paths stay in the
# WAF log for the daily review.
SecRule REQUEST_FILENAME "@beginsWith /webhooks/stripe/" \
    "id:10001,phase:1,pass,t:none,nolog,ctl:ruleEngine=DetectionOnly"

