# =====================================================================================================
# coraza.conf — the engine settings of the Velexis web application firewall (task X-039; ADR-0027 row 6.4.2;
# docs/mvp/deployment-single-vm.md §6). Installed root-owned as /etc/caddy/waf/coraza.conf by velexis-deploy (from the
# release's root-owned snapshot) and by provision-vm.sh (step caddyconf).
#
# Every coraza_waf of the Caddyfile (snippet `waf`) loads, in this order:
#   1. this file                 engine, body handling, logging, the Core Rule Set settings below
#   2. SecRuleEngine <mode>      DetectionOnly, or {$VELEXIS_WAF_ENGINE:On} on the blocking paths
#   3. @crs-setup.conf.example   the OWASP Core Rule Set v4 setup that coraza-coreruleset embeds (anomaly scoring)
#   4. @owasp_crs/REQUEST-*.conf and RESPONSE-980-CORRELATION.conf
#                                the Core Rule Set v4 request rules and its per-request summary (responses are not
#                                inspected, below, so the RESPONSE-950 to 959 rules are not loaded)
#   5. logdata.conf              what a matched rule writes to the log: its id and message and the variable's name,
#                                never a value of the request
#   6. SecRuleRemoveByTag paranoia-level/2, /3, /4
#                                paranoia level 1: the rules of the higher levels go (level 1 skips them anyway)
#   7. exclusions.conf           exclusions by rule id, each with its reason
# It replaces @coraza.conf-recommended of coraza-coreruleset, on which it is based. The differences are marked "Velexis:".
# =====================================================================================================

# Detection only unless the Caddyfile says otherwise after this file (step 2 above).
SecRuleEngine DetectionOnly

# ---- Request bodies ----------------------------------------------------------------------------------
SecRequestBodyAccess On

# XML and JSON bodies are parsed into arguments, so the rules see their fields (ARGS:json.<path>).
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

# Velexis: how much of a body the WAF reads. The WAF runs before Caddy's request_body limits, so every import of the
# Caddyfile's (waf) snippet sets its own limit after this file, just above the request_body limit of its requests
# (256 KiB on the storefront, 1200 KiB on api.ota.example.com, 1 MiB on the platform API, 5 MiB on the portal and the
# platform admin, 10 MiB on the OTA admin); this value only applies to a WAF without one. ProcessPartial: the WAF reads
# up to the limit and stops; rule 200006 below then refuses the request with 413 in blocking mode (Coraza's Reject
# would refuse it in detection mode too), and in detection mode Caddy's own limit refuses it.
SecRequestBodyLimit 10485760
SecRequestBodyLimitAction ProcessPartial
# Velexis: bodies up to 256 KiB stay in memory. On the storefront the WAF reads no more than that (its body limit), so
# it never buffers a storefront body in a temporary file, and the airline-card details (a JSON body) never reach the
# disk (OADR-0004: card data only in memory). Longer bodies of the other hosts (the admin sites' uploads) are buffered
# in the caddy service's private /tmp while they are inspected; and on every host Coraza writes each file part of a
# multipart body to a temporary file there. It removes both when the request ends.
SecRequestBodyInMemoryLimit 262144

# Velexis: a body longer than the WAF's limit (above) was read only in part: refused with 413 in blocking mode, before
# the parse errors of the cut body below; in detection mode logged once, and the Core Rule Set skips the part it read.
SecRule INBOUND_DATA_ERROR "@eq 1" \
    "id:200006,phase:2,t:none,log,deny,status:413,msg:'Request body above the limit of this host or path.',severity:2,ctl:ruleRemoveByTag=OWASP_CRS,ctl:ruleRemoveById=200002-200004"
# A body that cannot be parsed, or a multipart body that fails strict validation, is refused (in blocking mode).
# Velexis: the messages name the problem but never quote the body (no %{reqbody_error_msg}, no multipart details).
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation.'"
SecRule MULTIPART_UNMATCHED_BOUNDARY "@eq 1" \
    "id:200004,phase:2,t:none,log,deny,msg:'Multipart parser detected a possible unmatched boundary.'"
SecRule TX:/^COR_/ "!@streq 0" \
    "id:200005,phase:2,t:none,deny,msg:'Coraza internal error flagged.'"
# ---- What one request may cost ------------------------------------------------------------------------------------
# The Core Rule Set costs about 7 ms of CPU per KiB of arguments (measured with this build: a 100 KB JSON field takes
# 0.6 to 0.8 s, a 1 MB one 6 s), so an unbounded request would let anyone burn seconds of CPU on the VM with one call.
# These two rules run before the Core Rule Set. In blocking mode they refuse the request; in detection mode they log
# it once and take the Core Rule Set out of that request (ctl:ruleRemoveByTag=OWASP_CRS), so it is not inspected.
# Velexis: Coraza reads the first 1000 arguments only (SecArgumentsLimit). A request with 1,000 arguments or more is
# refused, so that a payload cannot hide behind a thousand harmless arguments (ModSecurity's recommended rule 200007).
# Its 400 has the same answer as a body that cannot be parsed (200002, 200003): the Caddyfile's (waf_refusal_json)
# cannot tell the rules apart, so its message names both (lead decision (20j) of 2026-11-13).
SecArgumentsLimit 1000
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Failed to fully parse request body due to large argument count.',severity:2,ctl:ruleRemoveByTag=OWASP_CRS"
# Velexis: arguments (query, form and JSON fields, names and values together) above 128 KiB, ModSecurity's default of
# SecRequestBodyNoFilesLimit, which Coraza does not enforce itself. Files of a multipart body (the asset uploads) are
# not arguments and do not count. The longest fields the APIs take are a notification template's bodyHtml (100,000
# characters) and bodyText (50,000) and a content page's markdown (50,000; more bytes in non-Latin scripts): the OTA
# admin sends those to the OTA API on the loopback, without the WAF, but a console automation by API key that sends
# them to api.ota.example.com gets 413 above 128 KiB (deployment-single-vm.md §6).
SecRule ARGS_COMBINED_SIZE "@gt 131072" \
    "id:200008,phase:2,t:none,log,deny,status:413,msg:'Request arguments above 128 KiB are not inspected.',severity:2,ctl:ruleRemoveByTag=OWASP_CRS"
# Request headers (the request line included) are limited by Caddy's max_header_size (32KiB, Caddyfile).

# ---- Responses -------------------------------------------------------------------------------------------------
# Velexis: responses are not inspected (the CRS's RESPONSE-95x leakage rules stay idle). Buffering every answer would
# break streaming and add latency to every page and API call; no answer of the apps carries card data (ADR-0011).
SecResponseBodyAccess Off

# ---- Logging -------------------------------------------------------------------------------------------------------
# Velexis: Coraza's audit log stays off. It would hold the request headers (cookies, API keys, bearer tokens) and the
# bodies, and under systemd it cannot write to journald. The WAF log is the matched-rule log instead: coraza-caddy
# writes one line per matched rule through Caddy's logger `http.handlers.waf` to stderr, which journald keeps
# (`journalctl -u caddy`; X-038 ships it). logdata.conf limits each line to the rule's id and message and the name of
# the variable that matched.
SecAuditEngine Off

# ---- OWASP Core Rule Set settings (crs-setup.conf ids) --------------------------------------------------------------
# Paranoia level 1 and the CRS's default inbound anomaly threshold (5: one critical match blocks in blocking mode).
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,setvar:tx.blocking_paranoia_level=1"
SecAction \
    "id:900110,phase:1,pass,t:none,nolog,setvar:tx.inbound_anomaly_score_threshold=5,setvar:tx.outbound_anomaly_score_threshold=4"
# Velexis: the methods the APIs use (the CRS default is GET HEAD POST OPTIONS; the OTA API also takes PUT, PATCH and
# DELETE, and CORS preflights are OPTIONS).
SecAction \
    "id:900200,phase:1,pass,t:none,nolog,setvar:'tx.allowed_methods=GET HEAD POST PUT PATCH DELETE OPTIONS'"
# Velexis: the CRS default list plus text/plain, the body type of the Next.js server actions of the portal and the admin
# sites (the APIs accept application/json and multipart/form-data only, both in the default list).
SecAction \
    "id:900220,phase:1,pass,t:none,nolog,setvar:'tx.allowed_request_content_type=|application/x-www-form-urlencoded| |multipart/form-data| |multipart/related| |text/xml| |application/xml| |application/soap+xml| |application/json| |application/cloudevents+json| |application/cloudevents-batch+json| |text/plain|'"
