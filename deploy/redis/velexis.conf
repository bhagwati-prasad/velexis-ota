# =====================================================================================================
# Redis 7.4 settings for Velexis (BullMQ queues, caches, one-time tokens, rate limits).
# Installed by provision-vm.sh as /etc/redis/velexis.conf and included at the END of /etc/redis/redis.conf
# (`include /etc/redis/velexis.conf`), so these values win. provision-vm.sh replaces @@REDIS_PASSWORD@@.
# Design: docs/mvp/adr/0009-background-jobs-bullmq.md, deployment-single-vm.md §5.
# =====================================================================================================

# Loopback only, password required.
bind 127.0.0.1 -::1
protected-mode yes
port 6379
requirepass @@REDIS_PASSWORD@@

# Memory: 512 MB budget (architecture.md §3). BullMQ requires noeviction: a full Redis refuses writes
# instead of silently dropping jobs. Therefore every cache key MUST have a TTL (ADR-0009).
maxmemory 512mb
maxmemory-policy noeviction

# Durability: AOF, fsync every second (at most ~1 s of queue state lost on a crash). PostgreSQL stays the
# record for everything durable; the provisioning reconciler re-enqueues lost jobs.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
aof-use-rdb-preamble yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
# No periodic RDB snapshots: the AOF is the persistence; backup.sh copies the AOF directory.
save ""

# Dangerous commands are disabled for everyone (operators use redis-cli as root on the VM).
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command SHUTDOWN VELEXIS_SHUTDOWN_DISABLED_USE_SYSTEMCTL

# Connections and latency.
timeout 0
tcp-keepalive 60
maxclients 1000
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256

# Logs go to the systemd journal through stdout.
logfile ""
loglevel notice
