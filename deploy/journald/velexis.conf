# journald limits for the Velexis VM (ADR-0016). Installed as /etc/systemd/journald.conf.d/velexis.conf.
# All apps, Caddy and Redis log to the journal; 4 GB / 30 days keeps a month of JSON logs on a 160 GB disk.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=4G
SystemKeepFree=10G
SystemMaxFileSize=256M
MaxRetentionSec=30day
RateLimitIntervalSec=30s
RateLimitBurst=20000
ForwardToSyslog=no
