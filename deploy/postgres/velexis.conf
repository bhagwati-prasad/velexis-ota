# =====================================================================================================
# PostgreSQL 16 tuning for the Velexis single VM (4 vCPU, 8 GB RAM, SSD).
# Installed by provision-vm.sh as /etc/postgresql/16/main/conf.d/velexis.conf (Debian's postgresql.conf
# includes conf.d). Memory budget: docs/mvp/architecture.md §3. Rationale: deployment-single-vm.md §5.
# Re-size with the VM: shared_buffers ~ 20 % of RAM, effective_cache_size ~ 50 %.
# =====================================================================================================

# ---- Connections -----------------------------------------------------------------------------------
listen_addresses = 'localhost'          # never public; only the apps on this VM connect
port = 5432
max_connections = 100                   # pools: platform API 10 + worker 5, OTA API 20 + worker 10, migrator 4, ops
password_encryption = scram-sha-256
ssl = off                               # loopback only; enable when the database moves off the VM

# ---- Memory ----------------------------------------------------------------------------------------------
shared_buffers = 1536MB
effective_cache_size = 4GB
work_mem = 16MB                         # per sort/hash node; keep low, many connections
maintenance_work_mem = 256MB
huge_pages = try

# ---- Many schemas (one per OTA, ~320 relations each) ---------------------------------------------------
# pg_dump of the whole database and the tenant fan-out lock many tables in one transaction.
# Lock table size = max_locks_per_transaction * max_connections; 256 * 100 = 25,600 locks.
max_locks_per_transaction = 256

# ---- WAL and checkpoints -----------------------------------------------------------------------------
wal_level = replica                     # keeps pgBackRest/WAL archiving possible later without a restart
wal_compression = zstd
max_wal_size = 4GB
min_wal_size = 512MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
synchronous_commit = on                 # bookings and payments are never acknowledged before they are durable

# ---- Planner (SSD) -------------------------------------------------------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# ---- Parallelism (4 vCPU shared with seven Node processes) ---------------------------------------------
max_worker_processes = 4
max_parallel_workers = 2
max_parallel_workers_per_gather = 1
max_parallel_maintenance_workers = 2

# ---- Autovacuum -------------------------------------------------------------------------------------
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.05

# ---- Timeouts (apps also set statement_timeout per transaction in tenantTx) ----------------------------
idle_in_transaction_session_timeout = 5min   # app roles override with 60s (bootstrap.sql)
lock_timeout = 0                             # migrator role sets 5s

# ---- Logging. Debian's pg_ctlcluster writes stderr to /var/log/postgresql/postgresql-16-main.log, which the
# postgresql-common package rotates. Statements are never logged with their parameters. -----------------------
logging_collector = off
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 500ms
log_lock_waits = on
log_temp_files = 10MB
log_checkpoints = on
log_autovacuum_min_duration = 1s
log_connections = off
log_disconnections = off
log_statement = 'ddl'                        # ALTER ROLE ... PASSWORD is DDL too: set passwords only in a session with
                                             # log_statement=none and pg_stat_statements.track_utility=off
                                             # (provision-vm.sh does; deployment-single-vm.md §5 and §7)
log_min_error_statement = error
log_parameter_max_length = 0                 # never print bound values (they may hold personal data)
log_parameter_max_length_on_error = 0

# ---- Extensions and statistics --------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 5000
pg_stat_statements.track = top
track_io_timing = on

# ---- Locale ----------------------------------------------------------------------------------------
timezone = 'UTC'
log_timezone = 'UTC'
