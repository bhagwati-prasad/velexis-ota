# Drop-in for the caddy.service shipped by the Caddy apt package.
# Installed as /etc/systemd/system/caddy.service.d/velexis.conf by provision-vm.sh and deploy.sh.
# It gives Caddy the base domains, the ACME e-mail and the storefront edge secret used in the Caddyfile
# ({$PLATFORM_BASE_DOMAIN}, {$STOREFRONT_BASE_DOMAIN}, {$ACME_EMAIL}, {env.VELEXIS_EDGE_SECRET}).
[Unit]
OnFailure=velexis-alert@%n.service

[Service]
EnvironmentFile=/etc/velexis/caddy.env
LimitCORE=0
