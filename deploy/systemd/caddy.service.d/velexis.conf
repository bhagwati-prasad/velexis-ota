# Drop-in for the caddy.service shipped by the Caddy apt package.
# Installed as /etc/systemd/system/caddy.service.d/velexis.conf by provision-vm.sh and deploy.sh.
# It gives Caddy the base domains, the ACME e-mail and the storefront edge secret used in the Caddyfile
# ({$PLATFORM_BASE_DOMAIN}, {$STOREFRONT_BASE_DOMAIN}, {$ACME_EMAIL}, {env.VELEXIS_EDGE_SECRET}).
[Unit]
OnFailure=velexis-alert@%n.service

[Service]
EnvironmentFile=/etc/velexis/caddy.env
# The package starts Caddy with `caddy run --environ`, which prints Caddy's whole environment, the edge secret of
# caddy.env among it, to the journal at every start. The empty ExecStart= drops the package's command, and the next line
# starts Caddy the same way without --environ (lead decision (20q) of 2026-11-13; deployment-single-vm.md §12). It takes
# effect at Caddy's next start: deploy.sh and provision-vm.sh restart Caddy when it changed (caddy-smoke.sh step 1b).
ExecStart=
ExecStart=/usr/bin/caddy run --config /etc/caddy/Caddyfile
LimitCORE=0
# Admin API socket directory (Caddyfile: admin unix//run/caddy/admin.sock). Mode 0700 owned by caddy, so no other
# user, in particular no Velexis app user, can reach the socket. ExecReload (caddy reload) runs as caddy too.
RuntimeDirectory=caddy
RuntimeDirectoryMode=0700
